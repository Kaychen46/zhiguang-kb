                </div>
                <h1 class="text-2xl font-bold text-zinc-900">跨領域知識關聯圖譜</h1>
                <p class="text-xs sm:text-sm text-zinc-500 mt-0.5">點擊任意圓點聚焦它的跨領域脈絡，支援拖曳平移與滾輪縮放（目前視圖：${visibleNodes.length} 個節點、${visibleEdges.length} 條連結）。</p>
              </div>
              <div class="flex items-center gap-2">
                <input id="graphSearchInput" type="search" value="${esc(state.graphQuery)}" placeholder="搜尋並定位節點..."
                  class="w-48 sm:w-56 px-3.5 py-1.5 text-xs sm:text-sm bg-zinc-50 border border-zinc-200 rounded-full focus:outline-none focus:bg-white focus:border-[#FF7A00]">
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-1.5">
              <button type="button" data-gmode="cross" class="graph-mode-btn px-3.5 py-1.5 rounded-full text-xs font-semibold border transition ${state.graphMode === 'cross' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-700 border-zinc-200 hover:border-zinc-400'}">跨領域橋樑（${crossEdges.length} 條）</button>
              ${state.groups.map(g => `
                <button type="button" data-gmode="${esc(g.id)}" class="graph-mode-btn px-3 py-1.5 rounded-full text-xs font-semibold border transition ${state.graphMode === g.id ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-700 border-zinc-200 hover:border-zinc-400'}">${esc(g.name)}</button>
              `).join('')}
              <button type="button" data-gmode="all" class="graph-mode-btn px-3 py-1.5 rounded-full text-xs font-semibold border transition ${state.graphMode === 'all' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-700 border-zinc-200 hover:border-zinc-400'}">全站 352 節點</button>
            </div>
          </section>

          <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 items-start">
            <!-- Interactive Graph Canvas -->
            <div class="xl:col-span-8 glass-card rounded-3xl p-3 relative overflow-hidden">
              <div class="absolute top-5 left-5 z-10 flex items-center gap-3 bg-white/90 backdrop-blur-xs px-3 py-1.5 rounded-full border border-zinc-200 text-[11px] text-zinc-600">
                <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-[#FF7A00] inline-block"></span>跨領域連結</span>
                <span class="flex items-center gap-1"><span class="w-3 h-0.5 bg-zinc-300 inline-block"></span>同領域連結</span>
              </div>
              <div class="absolute top-5 right-5 z-10 flex items-center gap-1.5">
                <button id="btnGraphZoomIn" type="button" class="w-8 h-8 rounded-full bg-white/90 border border-zinc-200 hover:border-[#FF7A00] text-zinc-700 font-bold text-sm flex items-center justify-center shadow-xs">+</button>
                <button id="btnGraphZoomOut" type="button" class="w-8 h-8 rounded-full bg-white/90 border border-zinc-200 hover:border-[#FF7A00] text-zinc-700 font-bold text-sm flex items-center justify-center shadow-xs">−</button>
                <button id="btnGraphReset" type="button" class="px-2.5 h-8 rounded-full bg-white/90 border border-zinc-200 hover:border-[#FF7A00] text-zinc-700 text-xs font-semibold flex items-center justify-center shadow-xs">重置</button>
              </div>
              <canvas id="knowledgeGraphCanvas" class="w-full h-[540px] rounded-2xl bg-white cursor-grab active:cursor-grabbing block"></canvas>
              <div id="graphHoverTooltip" class="pointer-events-none hidden absolute z-20 px-3 py-1.5 rounded-xl bg-zinc-900/95 text-white text-xs shadow-lg max-w-[240px]"></div>
            </div>

            <!-- Node Inspector Side Panel -->
            <div class="xl:col-span-4 glass-card rounded-3xl p-5" id="graphInspector">
              ${selCard ? `
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-full text-white" style="background-color:${esc(selCat?.accent || '#FF7A00')}">${esc(selCat ? selCat.name : '')}</span>
                  <button id="btnGraphFavSel" type="button" class="p-1.5 rounded-full hover:bg-amber-50 transition" title="切換收藏">
                    <i data-lucide="star" class="w-4 h-4 ${selCard.isFavorite ? 'fill-amber-400 text-amber-500' : 'text-zinc-400'}"></i>
                  </button>
                </div>
                <h2 class="text-lg font-bold text-zinc-900 leading-snug mb-2">${esc(selCard.title)}</h2>
                <p class="text-xs sm:text-sm text-zinc-600 leading-relaxed mb-4">${esc(selCard.oneLiner)}</p>
                <button id="btnGraphOpenSel" type="button" class="w-full btn-pill-orange py-2 px-4 text-sm font-semibold flex items-center justify-center gap-1.5 mb-5">
                  <i data-lucide="book-open" class="w-4 h-4"></i> 開啟此知識卡閱讀
                </button>

                <div class="pt-4 border-t border-zinc-200/80">
                  <div class="text-xs font-bold text-zinc-500 mb-2.5">直接關聯節點（${selNeighbors.length}）</div>
                  <div class="flex flex-col gap-2 max-h-[260px] overflow-y-auto pr-1">
                    ${selNeighbors.length === 0 ? '<div class="text-xs text-zinc-400">目前視圖無直接相連節點</div>' : selNeighbors.map(nb => {
                      const nCat = catMap.get(nb.card.categoryId);
                      return `
                        <button type="button" data-focus-node="${esc(nb.card.id)}" class="graph-focus-btn text-left p-2.5 rounded-2xl bg-white border border-zinc-200/80 hover:border-[#FF7A00] transition">
                          <div class="flex items-center justify-between gap-1.5 mb-0.5">
                            <span class="text-[11px] font-semibold" style="color:${esc(nCat?.accent || '#52525B')}">${esc(nCat ? nCat.name : '')}</span>
                            ${nb.isCross ? '<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-orange-50 text-[#C2410C] font-semibold">跨領域</span>' : ''}
                          </div>
                          <div class="text-xs sm:text-sm font-bold text-zinc-900 truncate">${esc(nb.card.title)}</div>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              ` : '<div class="text-sm text-zinc-500 py-8 text-center">點擊左側圖譜中的任一節點，即可查看跨領域連結細節。</div>'}
            </div>
          </div>
        `;

        // Bind toolbar controls
        container.querySelectorAll('.graph-mode-btn').forEach(b => {
          b.addEventListener('click', () => {
            state.graphMode = b.getAttribute('data-gmode');
            renderAll();
          });
        });
        document.getElementById('graphSearchInput')?.addEventListener('input', (e) => {
          state.graphQuery = e.target.value;
          const q = state.graphQuery.trim().toLowerCase();
          if (q) {
            const found = visibleNodes.find(n => n.title.toLowerCase().includes(q));
            if (found) { state.graphSelectedId = found.id; renderGraphView(container); refreshIcons(); const inp = document.getElementById('graphSearchInput'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
          }
        });
        document.getElementById('btnGraphOpenSel')?.addEventListener('click', () => { if (selCard) openCardById(selCard.id); });
        document.getElementById('btnGraphFavSel')?.addEventListener('click', () => {
          if (selCard) { selCard.isFavorite = !selCard.isFavorite; saveData(); renderAll(); }
        });
        container.querySelectorAll('.graph-focus-btn').forEach(b => {
          b.addEventListener('click', () => {
            state.graphSelectedId = b.getAttribute('data-focus-node');
            renderGraphView(container);
            refreshIcons();
          });
        });

        // Draw & wire interactive Canvas
        const canvas = document.getElementById('knowledgeGraphCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const W = Math.max(320, rect.width || 720);
        const H = 540;
        canvas.width = W * dpr;
        canvas.height = H * dpr;

        // Deterministic clustered circular layout by Category (ordered by Group)
        const orderedCats = [];
        state.groups.forEach(g => {
          state.categories.filter(c => c.groupId === g.id).forEach(c => orderedCats.push(c));
        });
        const activeCats = orderedCats.filter(c => visibleNodes.some(n => n.categoryId === c.id));
        const pos = {};
        const cx = W / 2;
        const cy = H / 2;
        const outerR = Math.min(W, H) * 0.37;

        activeCats.forEach((cat, cIdx) => {
          const catNodes = visibleNodes.filter(n => n.categoryId === cat.id);
          const angle = (cIdx / Math.max(1, activeCats.length)) * Math.PI * 2 - Math.PI / 2;
          const clusterCx = cx + Math.cos(angle) * outerR;
          const clusterCy = cy + Math.sin(angle) * outerR;
          const subR = activeCats.length <= 6 ? Math.min(68, 22 + catNodes.length * 2.8) : Math.min(44, 14 + catNodes.length * 1.8);
          catNodes.forEach((node, nIdx) => {
            if (catNodes.length === 1) {
              pos[node.id] = { x: clusterCx, y: clusterCy };
            } else {
              const a2 = angle + (nIdx / catNodes.length) * Math.PI * 2;
              const ringScale = (nIdx % 2 === 0) ? 1 : 0.62;
              pos[node.id] = {
                x: clusterCx + Math.cos(a2) * subR * ringScale,
                y: clusterCy + Math.sin(a2) * subR * ringScale
              };
            }
          });
        });

        // Compute degree for node radius
        const degree = {};
        visibleEdges.forEach(e => {
          degree[e.source] = (degree[e.source] || 0) + 1;
          degree[e.target] = (degree[e.target] || 0) + 1;
        });

        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let hoveredId = null;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let movedDuringDrag = false;

        function screenToWorld(sx, sy) {
          return { x: (sx - cx - panX) / zoom + cx, y: (sy - cy - panY) / zoom + cy };
        }

        function drawGraph() {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);
          ctx.save();
          ctx.translate(cx + panX, cy + panY);
          ctx.scale(zoom, zoom);
          ctx.translate(-cx, -cy);

          const focusId = hoveredId || state.graphSelectedId;
          const neighborSet = new Set();
          if (focusId) {
            neighborSet.add(focusId);
            visibleEdges.forEach(e => {
              if (e.source === focusId) neighborSet.add(e.target);
              if (e.target === focusId) neighborSet.add(e.source);
            });
          }

          // Draw category cluster labels on outer ring
          ctx.font = '600 11px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          activeCats.forEach((cat, cIdx) => {
            const angle = (cIdx / Math.max(1, activeCats.length)) * Math.PI * 2 - Math.PI / 2;
            const lx = cx + Math.cos(angle) * (outerR + 54);
            const ly = cy + Math.sin(angle) * (outerR + 54);
            ctx.fillStyle = '#52525B';
            ctx.fillText(cat.name.slice(0, 6), lx, ly);
          });

          // Draw edges (curved chords toward center for elegance)
          visibleEdges.forEach(e => {
            const p1 = pos[e.source];
            const p2 = pos[e.target];
            if (!p1 || !p2) return;
            const isHighlighted = focusId && (e.source === focusId || e.target === focusId);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            if (e.isCrossDomain) {
              const midX = (p1.x + p2.x) * 0.5 * 0.65 + cx * 0.35;
              const midY = (p1.y + p2.y) * 0.5 * 0.65 + cy * 0.35;
              ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
            } else {
              ctx.lineTo(p2.x, p2.y);
            }
            if (isHighlighted) {
              ctx.strokeStyle = e.isCrossDomain ? 'rgba(255, 122, 0, 0.92)' : 'rgba(59, 130, 246, 0.78)';
              ctx.lineWidth = e.isCrossDomain ? 2.2 / zoom : 1.6 / zoom;
            } else {
              ctx.strokeStyle = e.isCrossDomain
                ? (focusId ? 'rgba(255, 122, 0, 0.08)' : 'rgba(255, 122, 0, 0.25)')
                : (focusId ? 'rgba(148, 163, 184, 0.07)' : 'rgba(148, 163, 184, 0.22)');
              ctx.lineWidth = 1 / zoom;
            }
            ctx.stroke();
          });

          // Draw nodes
          visibleNodes.forEach(node => {
            const p = pos[node.id];
            if (!p) return;
            const cat = catMap.get(node.categoryId);
            const r = Math.min(10, 4.2 + Math.sqrt(degree[node.id] || 1) * 1.4);
            const isSel = node.id === state.graphSelectedId;
            const isHov = node.id === hoveredId;
            const isNear = !focusId || neighborSet.has(node.id);

            ctx.beginPath();
            ctx.arc(p.x, p.y, isSel || isHov ? r + 2.5 : r, 0, Math.PI * 2);
            ctx.fillStyle = cat?.accent || '#FF7A00';
            ctx.globalAlpha = isNear ? 1 : 0.2;
            ctx.fill();

            if (isSel || isHov) {
              ctx.lineWidth = 2.5 / zoom;
              ctx.strokeStyle = '#18181B';
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          });

          // Draw label for focused node
          if (focusId && pos[focusId] && cardMap.has(focusId)) {
            const fp = pos[focusId];
            const fTitle = cardMap.get(focusId).title;
            const shortT = fTitle.length > 18 ? fTitle.slice(0, 18) + '…' : fTitle;
            ctx.font = `700 ${Math.max(10, 12 / zoom)}px "Noto Sans TC", sans-serif`;
            const tw = ctx.measureText(shortT).width;
            ctx.fillStyle = 'rgba(24, 24, 27, 0.9)';
            ctx.fillRect(fp.x - tw / 2 - 6, fp.y - 24, tw + 12, 18);
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.fillText(shortT, fp.x, fp.y - 11);
          }

          ctx.restore();
        }

        function findNodeAt(sx, sy) {
          const w = screenToWorld(sx, sy);
          let best = null;
          let bestDist = 14 / zoom;
          for (const node of visibleNodes) {
            const p = pos[node.id];
            if (!p) continue;
            const d = Math.hypot(p.x - w.x, p.y - w.y);
            if (d < bestDist) { bestDist = d; best = node; }
          }
          return best;
        }

        const tooltip = document.getElementById('graphHoverTooltip');
        canvas.addEventListener('mousedown', (e) => {
          isDragging = true;
          movedDuringDrag = false;
          dragStartX = e.clientX - panX;
          dragStartY = e.clientY - panY;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mousemove', (e) => {
          const r = canvas.getBoundingClientRect();
          const sx = e.clientX - r.left;
          const sy = e.clientY - r.top;
          if (isDragging) {
            panX = e.clientX - dragStartX;
            panY = e.clientY - dragStartY;
            movedDuringDrag = true;
            drawGraph();
            return;
          }
          const hit = findNodeAt(sx, sy);
          const newHov = hit ? hit.id : null;
          if (newHov !== hoveredId) {
            hoveredId = newHov;
            canvas.style.cursor = hit ? 'pointer' : 'grab';
            drawGraph();
          }
          if (tooltip) {
            if (hit) {
              const hc = catMap.get(hit.categoryId);
              tooltip.innerHTML = `<div class="text-[10px] text-orange-300">${esc(hc ? hc.name : '')}</div><div class="font-semibold">${esc(hit.title)}</div>`;
              tooltip.style.left = Math.min(W - 220, sx + 14) + 'px';
              tooltip.style.top = Math.max(12, sy - 12) + 'px';
              tooltip.classList.remove('hidden');
            } else {
              tooltip.classList.add('hidden');
            }
          }
        });
        canvas.addEventListener('mouseleave', () => {
          hoveredId = null;
          if (tooltip) tooltip.classList.add('hidden');
          drawGraph();
        });
        canvas.addEventListener('click', (e) => {
          if (movedDuringDrag) return;
          const r = canvas.getBoundingClientRect();
          const hit = findNodeAt(e.clientX - r.left, e.clientY - r.top);
          if (hit) {
            state.graphSelectedId = hit.id;
            renderGraphView(container);
            refreshIcons();
          }
        });
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.12 : 0.89;
          zoom = Math.max(0.55, Math.min(2.8, zoom * factor));
          drawGraph();
        }, { passive: false });

        document.getElementById('btnGraphZoomIn')?.addEventListener('click', () => { zoom = Math.min(2.8, zoom * 1.2); drawGraph(); });
        document.getElementById('btnGraphZoomOut')?.addEventListener('click', () => { zoom = Math.max(0.55, zoom / 1.2); drawGraph(); });
        document.getElementById('btnGraphReset')?.addEventListener('click', () => { zoom = 1; panX = 0; panY = 0; drawGraph(); });

        drawGraph();
      }

      function renderAll() {
        renderSidebar();
        renderMain();
        refreshIcons();
      }

      function bindGlobalEvents() {
        document.getElementById('btnBrandHome')?.addEventListener('click', () => {
          state.viewMode = 'home';
          state.selectedCategoryId = 'all';
          state.selectedCardId = null;
          state.isEditingCard = false;
          state.activeTag = null;
          state.searchQuery = '';
          const gs = document.getElementById('globalSearch');
          const ms = document.getElementById('mobileSearch');
          if (gs) gs.value = '';
          if (ms) ms.value = '';
          renderAll();
        });
        document.getElementById('btnViewAll')?.addEventListener('click', () => {
          state.viewMode = 'home';
          state.selectedCategoryId = 'all';
          state.selectedCardId = null;
          state.isEditingCard = false;
          state.activeTag = null;
          closeMobileSidebar();
          renderAll();
        });
        document.getElementById('btnViewDashboard')?.addEventListener('click', () => {
          state.viewMode = 'dashboard';
          state.selectedCardId = null;
          state.isEditingCard = false;
          state.activeTag = null;
          state.searchQuery = '';
          closeMobileSidebar();
          renderAll();
        });
        document.getElementById('btnViewReview')?.addEventListener('click', () => {
          state.viewMode = 'review';
          state.selectedCardId = null;
          state.isEditingCard = false;
          state.activeTag = null;
          state.searchQuery = '';
          state.reviewReveal = false;
          closeMobileSidebar();
          renderAll();
        });
        document.getElementById('btnViewGraph')?.addEventListener('click', () => {
          state.viewMode = 'graph';
          state.selectedCardId = null;
          state.isEditingCard = false;
          state.activeTag = null;
          state.searchQuery = '';
          closeMobileSidebar();
          renderAll();
        });
        document.getElementById('btnClearTag')?.addEventListener('click', () => { state.activeTag = null; renderAll(); });
        document.getElementById('btnManageTopics')?.addEventListener('click', () => { closeMobileSidebar(); openTopicManagerModal(); });
        document.getElementById('btnNewCard')?.addEventListener('click', () => {
          closeMobileSidebar();
          const targetCat = state.selectedCategoryId !== 'all' ? state.selectedCategoryId : state.categories[0]?.id;
          createAndEditNewCard(targetCat, null, '');
        });
        document.getElementById('btnOpenGenerator')?.addEventListener('click', () => openGeneratorModal());
        document.getElementById('btnOpenUpload')?.addEventListener('click', openUploadModal);
        document.getElementById('btnOpenDriveSync')?.addEventListener('click', openDriveSyncModal);
        document.getElementById('btnOpenBackup')?.addEventListener('click', openBackupModal);
        document.getElementById('btnFontCycle')?.addEventListener('click', () => {
          state.fontScaleIndex = (state.fontScaleIndex + 1) % FONT_SCALES.length;
          applyFontScale();
          savePrefs();
          showToast('閱讀字級已切換為「' + FONT_SCALES[state.fontScaleIndex].label + '」');
        });

        function handleSearch(val) {
          state.searchQuery = val;
          state.selectedCardId = null;
          state.isEditingCard = false;
          renderMain();
          refreshIcons();
        }
        document.getElementById('globalSearch')?.addEventListener('input', (e) => {
          const ms = document.getElementById('mobileSearch');
          if (ms) ms.value = e.target.value;
          handleSearch(e.target.value);
        });
        document.getElementById('mobileSearch')?.addEventListener('input', (e) => {
          const gs = document.getElementById('globalSearch');
          if (gs) gs.value = e.target.value;
          handleSearch(e.target.value);
        });

        document.getElementById('btnMobileMenu')?.addEventListener('click', () => {
          document.getElementById('sidebar')?.classList.remove('-translate-x-full');
          document.getElementById('mobileBackdrop')?.classList.remove('hidden');
        });
        document.getElementById('btnCloseSidebar')?.addEventListener('click', closeMobileSidebar);
        document.getElementById('mobileBackdrop')?.addEventListener('click', closeMobileSidebar);
        document.getElementById('btnCloseModal')?.addEventListener('click', closeModal);
        document.getElementById('modalOverlay')?.addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { closeModal(); return; }
          if (!state.selectedCardId || state.isEditingCard) return;
          const tag = (document.activeElement?.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
          if (e.key === '1' || e.key === '2' || e.key === '3') {
            state.activeLevel = 'lv' + e.key;
            savePrefs();
            const card = getCard(state.selectedCardId);
            if (card) { renderCardDetail(document.getElementById('mainContent'), card); refreshIcons(); }
          }
        });
      }

      loadState();
      bindGlobalEvents();
      updateSyncStatusPill();
      renderAll();
    })();
  </script>
</body>
</html>
