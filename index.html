        {"id": "econ-s3-4", "categoryId": "cat-econ", "stageId": "s3", "subtopic": "政策判讀", "title": "最低工資、補貼與關稅的二階經濟連鎖效應", "oneLiner": "經濟政策幾乎沒有純粹的免費午餐，任何調薪、補貼與關稅都會同時造福一群人，並在看不見的角落引發連鎖反應。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "看懂新聞爭吵不休的三大政策，用「二階效應」一眼看透正反兩面：\n\n• **調高基本工資**：好處是基層勞工收入增加、消費力上升；二階效應是餐飲與小型服務業成本上升，可能部分反映在便當漲價、縮減工讀時數或加速引進點餐機自動化。\n• **政府發補貼（如租屋／買車補貼）**：短期減輕民眾負擔，但若市場供給量沒增加，補貼常會悄悄推升房租或車價。\n• **對外國課高關稅**：短期保護本國工廠，但進口零組件與生活用品變貴，最後往往由本國消費者與下游企業承擔，並可能引來他國報復關稅。", "lv2": "成為清醒公民與投資人的政策判讀三問：\n\n1. **誰是「看得見的受益者」？誰是「看不見的買單者」？**（巴斯夏《看得見的與看不見的》）。\n2. **錢從哪裡來？供給有沒有跟著變多？**（只灑錢刺激需求卻不增加供給，幾乎必然推升物價）。\n3. **受影響的企業與個人會如何「改變行為」來適應這條新規定？**", "lv3": "現代實證勞動經濟學（如 David Card & Alan Krueger 經典速食店自然實驗，獲 2021 諾貝爾獎）顯示，在具買方壟斷力（Monopsony）的勞動市場中，適度調升最低工資未必大幅減少就業，效果高度取決於調幅與當地工資中位數之比值（Kaitz Index）。政策評估須以實證數據取代單純教條預判。"}, "myNotes": "看任何補助與關稅新聞先問兩句：「供給有變多嗎？看不見的代價誰在付？」", "relatedIds": ["cross-s2-2", "econ-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "econ-s4-1", "categoryId": "cat-econ", "stageId": "s4", "subtopic": "總經儀表板", "title": "GDP、通膨（CPI）與失業率（菲利浦曲線）的三角關係", "oneLiner": "讀懂經濟新聞最常出現的三個大數字：GDP 看全國賺多少、CPI 看物價漲多兇、失業率看工作好不好找。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "把一個國家的經濟想像成一個人的健康體檢，只要先看懂三個數字：\n\n1. **GDP（國內生產毛額）**：全國一年總共創造出多少商品與服務價值（體重／產出成長力）。\n2. **CPI（消費者物價指數）**：你日常買菜、房租、吃飯這籃生活費今年比去年貴了幾 %（體溫計——2% 左右最健康，飆到 6% 就是發高燒通膨！）。\n3. **失業率**：想找工作卻找不到的人佔多少 %。\n\n短期內物價跟失業率常像蹺蹺板（**菲利浦曲線**）：大家都有工作薪水漲 → 消費超旺 → 物價跟著漲；央行升息降溫壓物價 → 企業縮編 → 失業率微升。", "lv2": "投資與生活判讀總經數據的三個重點：\n\n1. 財經新聞最看 **核心 CPI（Core CPI）**（扣掉波動極大的能源與食物），才能看清物價是不是真的頑固上漲。\n2. 警覺最難解的「**停滯性通膨（Stagflation）**」：經濟沒成長（失業升）但物價卻狂漲（如能源危機），央行升息降息兩難。\n3. 股市常「提前 3–6 個月」反應總經預期，不要看到 GDP 衰退新聞才恐慌殺在低點。", "lv3": "GDP 支出法恆等式：GDP = C（民間消費）+ I（企業投資）+ G（政府支出）+ (X − M)（淨出口）。長期而言菲利浦曲線垂直於自然失業率（NAIRU），一旦民眾形成高通膨預期，僅靠寬鬆貨幣將無法永久壓低失業率，只會引發工資—物價螺旋（Wage-Price Spiral）。"}, "myNotes": "CPI 是體溫計（2% 最舒服），核心 CPI 扣掉油價菜價才看得出真實通膨趨勢！", "relatedIds": ["fin-s1-3", "econ-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "econ-s4-2", "categoryId": "cat-econ", "stageId": "s4", "subtopic": "貨幣銀行", "title": "貨幣供給、銀行信用創造與通縮螺旋風險", "oneLiner": "市面上流通的錢大部分不是央行印鈔機印的，而是銀行透過放貸創造出來的；比起溫和通膨，央行更害怕「大家都不花錢」的通縮螺旋。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "很多人以為「東西變便宜（通貨緊縮）」不是超棒嗎？其實經濟學家最怕的惡夢就是 **通縮螺旋**！\n\n想像如果明年手機跟房子會比今年便宜 10%，你會怎麼做？你一定想「那我明年再買！」全社會大家都延後消費 → 商店賣不出去只好降價求生 → 企業沒賺錢開始裁員減薪 → 大家更沒錢花、更不敢買 → 經濟整個凍成冰塊（像日本失落三十年）！\n\n另外，你把 100 萬存進銀行，銀行留 10 萬準備金、把 90 萬借給別人買房，那 90 萬又存回銀行再借出去……這叫 **信用創造（貨幣乘數）**，現代社會九成以上的錢都是這樣透過銀行放貸變出來的！", "lv2": "看懂貨幣寬鬆與緊縮對資產的影響：\n\n1. **貨幣供給（M2）長期擴張**：現金購買力長期幾乎必然溫和縮水，這就是為什麼長期不能只抱現金，必須持有能產生現金流的資產（股票／房產／高價值技能）。\n2. 經濟衰退時若大家都拚命還債不借錢（資產負債表衰退），銀行信用創造熄火，光降息效果有限，往往得靠政府財政支出接棒。", "lv3": "貨幣數量學說交換方程式 MV = PY（貨幣供給 M × 貨幣流通速度 V = 物價水準 P × 實質產出 Y）。在流動性陷阱（Liquidity Trap）與去槓桿通縮期，即使央行大幅擴大基礎貨幣 M，若貨幣流通速度 V 暴跌（儲蓄暴增、借貸凍結），仍會面臨嚴峻通縮壓力與實質債務負擔加重（Irving Fisher 債務通縮理論）。"}, "myNotes": "溫和 2% 通膨是經濟潤滑劑，通縮螺旋才是會凍死整個社會的冰河期！", "relatedIds": ["econ-s4-1", "fin-compound"], "updatedAt": "2026-11-24"},
        {"id": "econ-s4-3", "categoryId": "cat-econ", "stageId": "s4", "subtopic": "國際金融", "title": "匯率波動、貿易順差與購買力平價（PPP）直覺", "oneLiner": "匯率就是「兩種貨幣的交換價格」：短期看哪國利息高、資金往哪跑，長期則靠「大麥克漢堡在兩國賣多少錢（購買力）」拉回平衡。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "去日本玩時日幣變便宜（台幣升值、日幣貶值），你換一樣的台幣可以吃更多拉麵超開心；但台灣做外銷賣東西去日本的廠商卻會叫苦，因為換回台幣變少了！\n\n什麼決定匯率？\n• **短期看利差與資金流**：美國升息利息變超甜，全球資金搶著換美元存美債，美元就強勢升值！\n• **長期看購買力平價（大麥克指數）**：如果一個大麥克在美國賣 5 美元、在台灣賣 75 台幣，那合理匯率大概就在 1:15～1:30 附近反映真實物價落差。", "lv2": "個人理財與旅遊面對匯率的實用原則：\n\n1. **旅遊換匯**：不必猜最低點，看到相對甜價分 2–3 批換就好。\n2. **海外投資匯率風險**：買美股 ETF（美元計價）長期看的是「美國企業獲利成長」，短期台幣升貶 5%–10% 只是正常波動，不必過度恐慌；反而同時持有台幣資產＋美元資產本身就是極佳的貨幣分散！", "lv3": "國際金融「不可能的三位一體（Mundell-Fleming Trilemma）」指出一國無法同時擁有「固定匯率、資本自由流動與獨立貨幣政策」，至多三選二。短期匯率由利率平價（Interest Rate Parity）與利差套利交易（Carry Trade）主導，長期則受實質購買力平價（PPP）與經常帳結構牽引。"}, "myNotes": "同時持有台幣現金流 + 美元全球資產，自然就做好跨幣別風險分散！", "relatedIds": ["fin-s3-3", "econ-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "econ-s4-4", "categoryId": "cat-econ", "stageId": "s4", "subtopic": "行為經濟", "title": "行為經濟學與助推（Nudge）：用預設選項改善決策", "oneLiner": "人不靠威脅強迫也能變好——只要把「對自己長期有利的選項」設成阻力最小的預設值，懶惰本性反而會推著你做出好決定。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "歐洲兩個相鄰國家，文化幾乎一模一樣，但器官捐贈同意率一國只有 12%、另一國高達 **99%**！為什麼？\n\n秘密只在一張表格的「預設勾選」：\n• 12% 那國是「想捐贈請打勾（預設不捐）」。\n• 99% 那國是「不想捐贈請打勾（預設同意）」——大家怕麻煩，多數人就直接沿用預設值！\n\n這種「不禁止你的選擇自由，但透過聰明設計環境輕輕推你往好方向走」的方法，就叫 **助推（Nudge）**！", "lv2": "幫自己設計四個「人生好習慣助推開關」：\n\n1. **理財預設值**：設定領薪日隔天自動轉帳扣款買指數 ETF（預設存錢，想花錢才要手動取消）。\n2. **健康預設值**：把水果跟水壺放書桌伸手可得處，把洋芋片鎖進要搬椅子才拿得到的高櫃。\n3. **學習預設值**：把本知識庫設成瀏覽器開機分頁，打開電腦第一眼就看到今天要學的單元。\n4. 警惕商業「暗黑模式（Sludge）」：刻意把取消訂閱按鈕藏在五層選單裡的惡意設計。", "lv3": "Richard Thaler（2017 諾貝爾經濟學獎）與 Cass Sunstein《推力》（Nudge）提出「自由家長制（Libertarian Paternalism）」與選擇架構師（Choice Architecture）概念，善用現狀偏誤（Status Quo Bias）與預設效應在不限制自主權下大幅提升社會與個人長期福祉。"}, "myNotes": "把好習慣設成「預設值（自動扣款、首頁分頁）」，讓大腦的懶惰反而替你工作！", "relatedIds": ["psy-habit", "econ-incentive"], "updatedAt": "2026-11-24"},
        {"id": "data-s1-1", "categoryId": "cat-data", "stageId": "s1", "subtopic": "集中趨勢", "title": "平均數、中位數與眾數：為何平均薪資總是騙人", "oneLiner": "只要一位億萬富翁走進坐著九位上班族的咖啡廳，全場平均身家立刻破億——遇到極端偏態資料時，看「中位數」才貼近真實。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "每次政府公布「台灣平均年薪 70 萬」，網路上一片哀嚎「我又拉低平均了！」為什麼？\n\n因為 **平均數（Mean）** 超級怕極端大數字拉高！如果有 9 個人年薪 50 萬、1 位科技業大老闆年薪 5,000 萬，平均年薪瞬間變成 545 萬，但現場 90% 的人根本連零頭都不到！\n\n這時候要看 **中位數（Median）**——把全部人從低排到高，站在正中間第 50% 那個人的數字，完全不受億萬富翁干擾！而 **眾數（Mode）** 則是出現最多次的數字（鞋店進貨看最多人穿的尺碼最準）。", "lv2": "日常看數據與做報表的選用守則：\n\n1. **薪資、房價、財富、網頁載入時間、社群貼文瀏覽數**（全都是右偏極端長尾資料）→ 必看 **中位數（P50）與 P90／P95**，別只看平均數！\n2. 當「平均數遠大於中位數」時，代表存在少數極端高值（財富集中或少數爆款撐場）。\n3. 商業簡報同時秀出「中位數 + 平均數」，一眼顯出專業度並避開誤導決策。", "lv3": "在右偏分佈（Right-Skewed Distribution）中恆有 Mode < Median < Mean。中位數具備 50% 崩潰點（Breakdown Point），為穩健統計量（Robust Statistic）；算術平均數崩潰點為 0%，單一異常值即可使其任意偏離真實中心。"}, "myNotes": "看薪資、房價、網頁速度與流量，一律先問「中位數是多少？」", "relatedIds": ["data-s1-2", "data-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "data-s1-2", "categoryId": "cat-data", "stageId": "s1", "subtopic": "分佈型態", "title": "變異數、標準差與常態分佈 vs 冪次法則", "oneLiner": "身高體重集中在中間（常態分佈），但爆款流量、財富與股災卻是極端贏家通吃（冪次法則）——用錯分佈模型會嚴重低估極端事件。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "光知道平均分 75 分不夠，還要看大家分數散不散（**標準差**）：A 班大家都考 73–77 分（標準差超小、極穩定），B 班一半 100 分一半 50 分（標準差超大、兩極分化）！\n\n更關鍵的是分清世界的兩種地圖：\n• **常態分佈（鐘形曲線，平均斯坦）**：像人類身高——絕大多數人都在 155–185 公分之間，世界上不可能突然冒出一個身高 50 公尺的巨人。\n• **冪次法則（長尾／贏家通吃，極端斯坦）**：像財富、YouTube 點擊數、股市單日暴跌——第一名可能比後面一萬名加起來還大！", "lv2": "看懂兩種分佈在投資與事業上的實戰意義：\n\n1. **不要拿常態分佈去估計極端斯坦的風險**：2008 金融海嘯按照常態分佈算「宇宙誕生以來都不該發生一次」，卻在我們有生之年一再發生，因為金融市場具「肥尾效應（Fat Tails）」。\n2. 在冪次法則領域（創作、創投、科技產品）：成敗取決於少數幾支超級爆款，所以策略應該是「低成本高頻試錯，一旦抓到爆款全力放大」。", "lv3": "常態分佈遵循 68-95-99.7 經驗法則（±1σ/2σ/3σ），由獨立同分佈隨機變數加總依中央極限定理收斂而成；冪次法則（Power Law, P(x) ∝ x^(−α)）則源於優先連接（Preferential Attachment）與正回饋放大，當 α ≤ 3 時變異數發散無窮大，傳統標準差指標將失去預測意義。"}, "myNotes": "身高是常態分佈，流量財富與股災是肥尾冪次法則——別拿鐘形曲線去算黑天鵝！", "relatedIds": ["data-s1-1", "cross-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "data-s1-3", "categoryId": "cat-data", "stageId": "s1", "subtopic": "數字防騙", "title": "百分比陷阱：基數效應、相對成長 vs 絕對成長", "oneLiner": "「業績暴衝 200%」可能只是從賣 1 個變賣 3 個，「罹癌風險增加 50%」可能只是從千分之二變千分之三——永遠要回頭追問「原始基數是多少」。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "新聞跟廣告最愛玩的兩個百分比障眼法：\n\n1. **小基數魔術**：新開的店上個月只賣出 1 杯咖啡，這個月賣出 3 杯，廣告敢大寫「業績狂飆 200%！」沒騙人，但意義不大。\n2. **相對風險 vs 絕對風險**：新聞標題嚇死人：「每天吃 XX 讓某罕見疾病風險暴增 100%！」點進去細看原研究：原來沒吃的人得病率是 0.01%（萬分之 1），每天吃的人變成 0.02%（萬分之 2）——相對變兩倍，但絕對風險只多了萬分之 1！\n3. **百分比 vs 百分點**：利率從 2% 漲到 3%，是增加「1 個百分點」，但相對漲幅其實是「50%」！", "lv2": "看報表與新聞的三秒防騙檢核：\n\n1. 看到任何「成長／暴增 X%」，立刻追問「**原本的絕對基數（分子分母）是多少？**」。\n2. 做商業簡報時，永遠同時並列「絕對變化量 + 相對百分比」（例如「新增 120 位付費用戶，+15%」），既透明又有說服力。\n3. 小心不對稱漲跌幅：先漲 20% 再跌 20%，不是回到原點，而是變成 `1.2 × 0.8 = 0.96`（淨虧 4%）！", "lv3": "風險溝通研究（Gigerenzer《數字盲》）指出，以「相對風險增減（Relative Risk Reduction, RRR）」呈現醫療或財經數據極易誘發過度恐慌或過度樂觀；改採「絕對風險差（ARR）」與「需治療人數（NNT = 1 / ARR）」能讓決策者準確校準真實影響量級。"}, "myNotes": "看到任何驚人百分比，腦中自動跳出這句話：「原本的分母基數是多少？」", "relatedIds": ["data-s1-1", "data-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "data-s1-4", "categoryId": "cat-data", "stageId": "s1", "subtopic": "統計悖論", "title": "辛普森悖論：分開看都贏，合起來卻輸的數據反轉", "oneLiner": "名醫專門接手最難的重症病人，所以整體死亡率看起來比只看小感冒的診所高——沒切分組別直接看總表，結論可能完全顛倒！", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "1973 年加州大學柏克萊分校曾被控告性別歧視，因為總錄取率男生 44%、女生只有 35%！\n\n但統計學家把各個科系「拆開來看」竟然大傻眼：幾乎每一個科系的女生錄取率都**高於或等於**男生！怎麼會分開看女生都贏、合起來卻輸了？\n\n真相是因為那年女生大多報考「錄取率超低、競爭最激烈的熱門文科系」，而男生大多報考「錄取率高達 60% 的理工系」！把難度完全不同的群組硬混在一起算總平均，就會出現這種令人下巴掉下來的 **辛普森悖論**！", "lv2": "數據分析避開辛普森悖論的實戰動作：\n\n1. **永遠往下鑽一層（Drill Down / 分層分析）**：看到公司整體轉換率下降，別急著罵行銷部——先按「新客 vs 舊客」、「手機 vs 桌機」、「不同通路」切開看，常會發現只是某個低轉換免費流量暴增拉低了總平均，各通路本身其實都在進步！\n2. 比較兩個方案成效時，確認兩組的「樣本結構與難度比例」是否一致。", "lv3": "辛普森悖論（Edward Simpson, 1951）由潛在混淆變數（Confounding Variable）與各分層樣本權重極度不均共同導致。Judea Pearl 因果推論框架指出，單靠統計數字無法決定該看「總表」還是「分層表」，必須依因果圖（DAG）判斷該變數究竟是「混淆因子（須控制分層）」還是「中介／對撞因子（不可錯誤控制）」。"}, "myNotes": "總表數字變怪先別下結論，按核心維度（新舊客、裝置、難度）切開一層常會看到完全相反的真相！", "relatedIds": ["data-s3-1", "data-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "data-s2-1", "categoryId": "cat-data", "stageId": "s2", "subtopic": "取樣品質", "title": "抽樣偏差與倖存者偏差：看不見的樣本最關鍵", "oneLiner": "如果樣本一開始就挑偏了，就算你收集一百萬筆資料、用最頂尖 AI 分析，算出來的也只是精準的垃圾。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "1936 年美國一家超有名雜誌發出 1,000 萬份問卷預測總統大選，回收 240 萬份超大樣本，信心滿滿宣布蘭登大勝羅斯福——結果大選開票羅斯福狂勝！另一家只隨機抽訪 5 萬人的蓋洛普卻神準命中！\n\n為什麼 240 萬份大樣本慘敗給 5 萬人？因為那家雜誌的名單全來自「電話簿與汽車俱樂部」，在經濟大蕭條年代只有有錢人才裝得起電話買得起車，樣本徹底偏掉！\n\n記住：**樣本「有沒有代表性（隨機）」，比「樣本多不多」重要一百倍！**", "lv2": "日常識別三種最常見的抽樣陷阱：\n\n1. **自願填答偏差（Self-Selection Bias）**：網路餐廳評論不是 5 星就是 1 星，因為覺得普通的人根本懶得上網寫評論。\n2. **倖存者偏差**：市面上暢銷書只寫比爾蓋茲休學創業成功，不會有人幫一萬個休學失敗的人出書。\n3. **問卷發放偏差**：在健身房門口問「你平常有運動習慣嗎？」，得出 95% 國人愛運動的荒謬結論。", "lv3": "統計推論的有效性建立於「機率抽樣（Probability Sampling，如簡單隨機、分層隨機抽樣）」確保母體每個個體具已知非零中選機率。非機率便利抽樣（Convenience Sampling）帶來的系統性偏差（Bias）無法靠單純擴大樣本數 n 消除（大數法則僅縮減隨機方差 Variance，不消除偏差）。"}, "myNotes": "樣本挑偏了，收一百萬筆也只是把錯誤放大一百萬倍——先問「這群樣本是怎麼來的？」", "relatedIds": ["psy-s2-2", "data-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "data-s2-2", "categoryId": "cat-data", "stageId": "s2", "subtopic": "貝氏直覺", "title": "條件機率與基礎率謬誤（Base Rate Fallacy）", "oneLiner": "準確率 99% 的罕見疾病快篩驗出陽性，你真正得病的機率可能竟然不到 10%——因為忘了乘上「這病本來有多罕見（基礎率）」。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "算一題超震撼的題目：假設某罕見疾病每 1,000 人只有 **1 人**會得（基礎率 0.1%），有一款準確率高達 **99%** 的快篩，你去驗竟然呈現陽性，你真的得病的機率有多高？\n\n別直覺猜 99%，拿 1,000 個人直接數一次：\n• 真正生病的 **1 個人** → 驗出陽性（1 個真陽性）。\n• 健康的 **999 個人** → 因為有 1% 誤判率，大約有 **10 個人**會被誤判成陽性（10 個偽陽性）！\n\n所以驗出陽性的 11 個人裡，真正生病的只有 **1 / 11 ≈ 9%**！這就是為何初篩陽性不用立刻崩潰，醫生一定會安排第二次複檢的原因！", "lv2": "日常決策避免「忽略基礎率」的三招：\n\n1. **用自然頻率（1,000 人裡面有幾人）取代抽象百分比**：大腦一換成具體人數就立刻算得清清楚楚。\n2. **商業與投資先看行業基礎勝率**：想開咖啡店前先查「新開咖啡店撐過三年的基礎存活率」，再依自身優勢往上或往下微調。\n3. **AI 詐騙／異常偵測警訊**：當真實詐騙佔比極低時，就算模型準確率 99%，警報裡仍會混雜大量誤報，必須設計人工複核層。", "lv3": "基礎率謬誤（Bar-Hillel, 1980）源於混淆「P(陽性 | 有病)（敏感度 Sensitivity）」與「P(有病 | 陽性)（陽性預測值 PPV）」。依貝氏定理，當先驗基礎率 P(有病) 極低時，即使特異度（Specificity）極高，偽陽性絕對數仍遠超真陽性，必須透過序列檢驗提高後驗機率。"}, "myNotes": "遇到機率困惑時，把百分比全部換成「1,000 個人裡有幾個」，瞬間破解 99% 機率陷阱！", "relatedIds": ["cross-bayes", "data-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "data-s2-3", "categoryId": "cat-data", "stageId": "s2", "subtopic": "假設檢定", "title": "假設檢定直覺：p 值、顯著性與兩類決策錯誤", "oneLiner": "把假設檢定想成法庭「無罪推定」：p 值很小代表「如果真的沒效，這麼扯的巧合幾乎不可能發生」，但不代表效果一定很大。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "統計學的 **假設檢定** 其實就跟法官審案一模一樣：\n\n1. **虛無假設（H₀）＝ 無罪推定**：先假設「這顆新藥根本沒效（新廣告跟舊廣告沒差）」。\n2. **p 值（巧合機率）**：計算「假如這藥真的沒效，靠純運氣剛好測出這麼好結果的機率有多低？」如果 p < 0.05（不到 5% 巧合機率），我們就說「達統計顯著」，推翻無罪推定、宣布有效！\n3. **兩種犯錯**：\n   • 第一型錯誤（冤枉好人／偽陽性）：藥其實沒效卻誤判有效。\n   • 第二型錯誤（縱放壞人／偽陰性）：藥其實有效卻因為樣本太少沒檢驗出來。", "lv2": "讀研究報告與做商業實驗必避的兩大 p 值誤區：\n\n1. **「統計顯著」不等於「商業上重要」**：當樣本數大到一百萬人時，新按鈕只讓點擊率從 5.00% 變成 5.01%，p 值也會超小達顯著，但花大錢改版根本不划算！永遠要同時看 **效果量（Effect Size）**。\n2. **警覺 p-hacking（數據撈捕）**：如果同時測 20 個毫無關聯的東西（例如吃 20 種顏色軟糖會不會長高），光靠純隨機機率平均就會有 1 種剛好 p < 0.05！", "lv3": "p 值嚴格定義為 P(Data as extreme or more | H₀ is true)，絕非 P(H₀ is true | Data)。美國統計學會（ASA, 2016）正式呼籲不應單憑 p < 0.05 做二元截斷判斷，應結合信賴區間、效果量（Cohen's d）與多重檢定校正（如 Bonferroni / FDR）綜合評估。"}, "myNotes": "p < 0.05 只說「不太像巧合」，不代表「效果大到值得花錢做」——永遠要補看效果量！", "relatedIds": ["mkt-s3-4", "data-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "data-s2-4", "categoryId": "cat-data", "stageId": "s2", "subtopic": "樣本與誤差", "title": "信賴區間與樣本數大小：別把隨機雜訊當趨勢", "oneLiner": "單一數字只是一張模糊照片的中心點，加上「± 誤差範圍（信賴區間）」才看得出兩者是真的有差，還是都在隨機晃動範圍內。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "選舉民調常報「A 候選人 46%、B 候選人 44%，抽樣誤差 ±3%」，主播卻興奮大喊「A 領先 B 啦！」\n\n其實懂統計的人一看就笑出來：46% ± 3% 代表 A 真實支持度可能在 **43% 到 49%** 之間，B 可能在 **41% 到 47%** 之間——兩條範圍根本大幅重疊，這叫「誤差範圍內打成平手」！\n\n而且小樣本特別容易出現極端巧合（丟硬幣 4 次全正面機率高達 6%，但丟 100 次幾乎不可能全正面），看到「今天業績比昨天掉 20%」先看樣本量，別對每天的隨機雜訊過度反應！", "lv2": "商業報表與日常判讀的實務技巧：\n\n1. **縮小誤差要花平方倍樣本**：想把抽樣誤差砍半，樣本數必須變 **4 倍**（因為標準誤跟 √n 成反比），所以民調抽 1,068 份（誤差約 ±3%）已是極高 CP 值，不必盲目花大錢抽一萬份。\n2. **看趨勢拉長週期**：改看「7 日移動平均線」取代單日劇烈跳動，立刻過濾掉雜訊看見真實趨勢。", "lv3": "95% 信賴區間（Confidence Interval）意指若重複抽樣建構區間 100 次，約有 95 個區間會涵蓋真實母體參數 μ。標準誤 SE = σ / √n 體現樣本數收斂邊際遞減規律；小樣本極端波動亦對應 Tversky & Kahneman 揭示之「小數法則謬誤（Law of Small Numbers）」。"}, "myNotes": "誤差範圍重疊就是平手！看日常數據多用「7 日移動平均」，別被單日雜訊嚇到亂改策略。", "relatedIds": ["data-s2-1", "data-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "data-s3-1", "categoryId": "cat-data", "stageId": "s3", "subtopic": "因果辨識", "title": "相關係數、混淆變數與虛假相關拆解", "oneLiner": "夏天冰淇淋賣得越好，海邊溺水人數就越多——不是冰淇淋害人溺水，而是背後藏著「氣溫升高」這隻看不見的第三隻手（混淆變數）。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "新聞超愛報：「研究發現，常喝紅酒的人平均比較長壽！」大家立刻衝去買紅酒。\n\n先等等！有沒有可能是「平常有閒錢喝紅酒的人，本身收入較高、住的地方醫療較好、作息較健康」，所以才比較長壽？這個躲在後面同時影響兩件事的隱藏因素，就叫 **混淆變數（Confounder）**！\n\n「相關（一起變大變小）」只代表兩件事同步出現，可能是 A 導致 B、可能是 B 導致 A（倒果為因），更常是背後有第三個變數 C 同時推著 A 跟 B 走！", "lv2": "拆解任何「研究說 A 跟 B 有關」的三個追問：\n\n1. **有沒有反向因果？**（例如「有錢人比較愛看書」還是「愛看書讓人變有錢」？可能雙向互推）。\n2. **背後有沒有共同的第三變數（年齡、收入、季節、學歷）？**\n3. **有沒有合理的機制鏈條？** 就算美國尼可拉斯凱吉演電影的數量跟泳池溺水數歷史高度相關（r = 0.67），沒有合理因果機制就只是「虛假相關（Spurious Correlation）」。", "lv3": "皮爾森相關係數 r ∈ [−1, 1] 僅捕捉兩變數間的「線性共變程度」（對 U 型等非線性強關聯 r 可能為 0，見安斯庫姆四重奏 Anscombe's Quartet）。從相關邁向因果須排除混淆路徑（Backdoor Paths），透過隨機實驗或結構因果模型（SCM）驗證。"}, "myNotes": "看到任何「A 跟 B 高度相關」，立刻找有沒有躲在背後的第三隻手 C（如收入、氣溫、年齡）！", "relatedIds": ["data-s1-4", "data-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "data-s3-2", "categoryId": "cat-data", "stageId": "s3", "subtopic": "迴歸直覺", "title": "線性迴歸與多變量分析直覺：拆出淨邊際影響", "oneLiner": "當好幾個因素同時影響結果（地段、屋齡、坪數一起決定房價），多元迴歸能幫你「固定其他條件不變」，單獨算出每多 1 坪到底值多少錢。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "你想知道「買房子到底多 1 坪會貴多少錢、離捷運近 100 公尺會貴多少錢？」如果只看單一變數，常常會被干擾（市中心房子通常又貴又小）。\n\n**多元線性迴歸** 就像幫你畫出一條最貼合所有資料點的趨勢線，並寫出一個加權公式：\n`房價 = 基準價 + 60萬 × 坪數 − 15萬 × 屋齡 + 200萬 × 捷運宅`\n\n它超強的地方在於「控制其他條件不變」：在同樣坪數、同樣屋齡下，光看「是不是捷運宅」就能拆出它獨立貢獻了 200 萬！", "lv2": "判讀迴歸結果報表必看的三個數字：\n\n1. **係數正負號與大小**：代表該因素每增加 1 單位，結果平均變動多少。\n2. **R²（解釋力，0%–100%）**：這組變數總共能解釋多少比例的變化（社會科學 30%–50% 就很不錯，物理實驗常 > 95%）。\n3. **兩大避坑**：不要拿過去範圍內的直線去「過度外推」極端未來；若兩個自變數高度重疊（多重共線性，如同時放「身高」與「腿長」），係數估計會亂跳。", "lv3": "普通最小平方法（OLS）藉由最小化殘差平方和 Σ(y_i − ŷ_i)² 求解無偏最佳線性估計量（BLUE，須滿足高斯—馬可夫假設：線性、無完全共線性、誤差項同質變異與零條件期望）。針對二元分類結果（如會不會流失）則改採羅吉斯迴歸（Logistic Regression）輸出對數勝算比（Log-Odds）。"}, "myNotes": "多元迴歸的精髓是「控制其他變數不變（Ceteris Paribus）」，拆出單一因素的乾淨淨影響！", "relatedIds": ["data-s3-1", "data-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "data-s3-3", "categoryId": "cat-data", "stageId": "s3", "subtopic": "因果實驗", "title": "隨機對照實驗（RCT）與 A/B 測試黃金標準", "oneLiner": "想 100% 確定是「這個做法」帶來改變而非運氣或背景差異，最強解法就是靠「丟硬幣隨機分組」把所有看不見的干擾自動拉平。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "想知道一堂「高效讀書法課程」到底有沒有用，如果你讓「自己舉手報名的人」去上課，再拿他們的成績跟「沒報名的人」比，結果一定不準——因為會主動報名的人本來就比較認真（自選擇偏差）！\n\n醫學界跟科技業的終極黃金標準叫 **隨機對照實驗（RCT）**：把所有想參加的人靠「丟硬幣」隨機分一半，A 組上新課（實驗組）、B 組照舊（對照組）。因為是隨機分的，兩組的原本成績、家境、智商平均起來通通一模一樣！最後只要兩組結果差很多，就能拍板確定真的是這堂課有效！", "lv2": "設計與判讀隨機實驗的三個關鍵點：\n\n1. **雙盲設計（醫學／感官盲測）**：受試者跟評分者都不知道誰拿到真品、誰拿到安慰劑，徹底消除「期待心理（安慰劑效應）」。\n2. **留意溢出效應（Spillover）**：在社群或雙邊平台做隨機實驗時，實驗組跟對照組若會互相影響（搶同一批司機），單純隨機切分會失真，改採地區切分。\n3. 商業迭代中，能做低成本小規模 A/B 實驗就不要在會議室空猜。", "lv3": "依 Rubin 潛在結果框架（Potential Outcomes Framework），個體因果效應 τ_i = Y_i(1) − Y_i(0) 永不可同時觀測（因果推論基本難題）。隨機分配使處理指派獨立於潛在結果，確保兩組樣本平均差值即為平均處理效應（ATE）的無偏估計。"}, "myNotes": "丟硬幣隨機分組的神奇威力：連你「根本沒想到」的隱藏干擾因素，都能一次幫你平均拉平！", "relatedIds": ["mkt-s3-4", "data-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "data-s3-4", "categoryId": "cat-data", "stageId": "s3", "subtopic": "準實驗方法", "title": "準實驗方法入門：雙重差分（DID）與斷點迴歸", "oneLiner": "現實世界很多大事（像政策上路、新法規實施）沒辦法丟硬幣隨機分組，經濟與資料科學家就用「前後比較再減掉對照組變化（DID）」巧妙挖出因果！", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "假設台北市今年實施一項新的減塑政策，想知道它到底省下多少塑膠袋，但你不能拿全台灣丟硬幣分組，怎麼辦？\n\n用 **雙重差分（DID）** 超像聰明對比法：\n1. 先看台北市政策「實施前 vs 實施後」少了 30% 塑膠袋。\n2. 但搞不好今年全國剛好流行環保杯！所以同時看條件相似、還沒實施的新竹市「同期間前後」也自然少了 10%。\n3. 兩邊一減（30% − 10% = **20%**），就把大環境趨勢扣掉，乾淨抓出這項政策的真實淨效果！\n\n另一招 **斷點迴歸（RDD）** 則是專比「剛好卡在門檻兩邊的人」（例如獎學金門檻 80 分，比較考 80.1 分有拿錢跟 79.9 分沒拿錢的同學，他們實力幾乎一模一樣！）。", "lv2": "看懂政策評估與商業自然實驗報告的檢核點：\n\n1. **DID 的核心前提（平行趨勢假設）**：在政策上路「之前」，實驗城市跟對照城市的走勢必須原本幾乎平行，否則不能直接相減。\n2. **商業實務應用**：只在南部門市推出新促銷活動，拿北部未推活動的同型門市當對照組跑 DID，就能精準算出活動淨增營收！", "lv3": "雙重差分（Difference-in-Differences）、斷點迴歸（Regression Discontinuity Design）與工具變數（Instrumental Variables）構成現代實證計量「可信度革命（Credibility Revolution, Card / Angrist / Imbens 獲 2021 諾貝爾經濟學獎）」，讓研究者在無法執行 RCT 的宏觀法規、教育與公衛資料中逼近嚴謹因果識別。"}, "myNotes": "研究法規或地區性活動成效時，DID（雙重差分）是最直覺又強大的去趨勢因果利器！", "relatedIds": ["data-s3-3", "econ-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "data-s4-1", "categoryId": "cat-data", "stageId": "s4", "subtopic": "指標體系", "title": "好指標定義：北極星指標、虛榮指標與護欄指標", "oneLiner": "總註冊人數永遠只會往上漲，看了很爽卻對決策零幫助（虛榮指標）；真正該盯的是「核心價值交付次數（北極星）」配「不准踩破的底線（護欄）」。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "老闆開會時最愛看「累計註冊人數突破 100 萬！」但其實這數字只要公司沒倒就永遠不會下降，哪怕裡面有 99 萬個殭屍帳號——這叫 **虛榮指標（Vanity Metric）**，只用來發新聞稿自爽。\n\n專業團隊盯的是兩組真指標：\n1. **北極星指標（North Star）**：衡量用戶「真正享受到核心價值」的次數（例如 Airbnb 看「完成訂房夜數」、Spotify 看「每週聆聽時數」、本知識庫看「每週讀完並寫下心得的卡片數」）。\n2. **護欄指標（Guardrail）**：像開車防撞護欄，確保你衝北極星時不會把客訴率、退貨率或網頁速度搞爆！", "lv2": "設計好指標的四個黃金標準（好比率勝過總數）：\n\n1. **用比率／活躍數取代累計總數**：看「30 天內活躍留存率」而非「歷史累計下載數」。\n2. **具備可行動性**：這數字今天掉了 5%，團隊立刻知道該去查哪個環節並採取行動。\n3. **領先指標 vs 落後指標**：營收是落後指標（月底才知道），試用啟動率與客戶拜訪數是領先指標（提前兩週就能預警）。", "lv3": "指標樹（Metric Tree / KPI Driver Tree）將頂層北極星指標透過數學恆等式層層拆解為各團隊可控的一線輸入指標（Input Metrics），並以護欄指標構成多目標最佳化約束集，防止局部優化損害系統整體健康。"}, "myNotes": "累計總數幾乎都是虛榮指標；盯緊「核心價值北極星 + 品質護欄」雙軌才不會走偏！", "relatedIds": ["data-s4-2", "biz-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "data-s4-2", "categoryId": "cat-data", "stageId": "s4", "subtopic": "指標陷阱", "title": "古德哈特定律：當指標成為目標就不再是好指標", "oneLiner": "一旦你把某個數字當成發獎金的唯一標準，大家就會瞬間停止解決真問題，改為絞盡腦汁去把那個數字「刷到好看」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "想像一家客服中心想提升服務品質，規定「每通電話處理時間越短，獎金越高」——結果客服為了壓低通話秒數，客人還沒問完就直接掛電話，或叫客人重打三次！數字變得超級漂亮，客戶卻氣到全部退訂。\n\n英國經濟學家古德哈特留下一句神預言：「**當一個衡量指標變成了考核目標，它就不再是一個好指標了。**」因為人性一定會找最短路徑去「滿足數字」而不是「滿足初衷」！", "lv2": "防範古德哈特定律的三個管理與自我修練解法：\n\n1. **永遠用「互為制衡的一對指標」**：例如客服同時看「處理速度」＋「一次解決率／滿意度」，文章同時看「點擊率」＋「完讀率」。\n2. **定期更換或隱藏次要監控指標**，搭配不定期質化抽查（真的隨機抽聽 5 通客服錄音或讀 5 則真實評論）。\n3. **個人學習防刷分**：別只追求「今年讀完 100 本書」的數字虛榮，改追求「有哪 3 本書真的改變了我的行動」。", "lv3": "古德哈特定律（Charles Goodhart, 1975）與社會科學中的坎貝爾定律（Campbell's Law）以及 AI 安全領域的「獎勵駭客（Reward Hacking / Specification Gaming）」本質完全同構：任何有限代理指標皆無法完整封裝複雜真實價值函數，過度最佳化必然導致系統與真實目標脫鉤。"}, "myNotes": "讀書別刷「讀完幾本」，要看「內化改變了什麼行動」——個人成長也要防古德哈特定律！", "relatedIds": ["econ-incentive", "data-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "data-s4-3", "categoryId": "cat-data", "stageId": "s4", "subtopic": "留存分析", "title": "同期群分析（Cohort）與留存曲線判讀", "oneLiner": "不要把一月進來跟十月進來的客人全部混成一鍋看——按「加入時間」切開追蹤（同期群），才能看清產品到底有沒有真的留住人。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "一家 App 公司每個月活躍人數看起來都維持在 10,000 人，老闆以為公司超穩。結果分析師按「加入月份」切開一看差點暈倒：\n• 1 月註冊的人，到了 3 月只剩 2% 還在用！\n• 活躍人數沒掉，只是因為行銷部每個月狂燒錢買 9,500 個新客進來補洞！\n\n把「同一時期加入（或具相同特徵）的一群人」單獨拉出來，追蹤他們第 1 週、第 2 週、第 3 個月還留著幾 %，就叫 **同期群分析（Cohort Analysis）**，它是照妖鏡，一眼照出產品到底有沒有真黏性！", "lv2": "看懂留存曲線（Retention Curve）的三種命運：\n\n1. **一路掉到 0%**：產品沒有解決持續痛點，再怎麼買廣告都會流血倒閉。\n2. **先掉下來，但在某個比例「走平（Flattening）」**（例如 25% 穩定留存）：恭喜！找到了一群離不開你的核心鐵粉，現在才值得擴大推廣。\n3. **微笑曲線（掉下來後又往上彎）**：極罕見的頂級產品（如社交或內容網路），流失老用戶因為朋友召回或新功能主動回鍋！", "lv3": "Cohort Matrix 橫軸追蹤相對生命週期（Day 1 / Day 7 / Day 30 / Month N）、縱軸對比不同世代（Acquisition Cohorts），能將「季節性／新客灌水雜訊」與「產品迭代對真實留存的改善」徹底分離，是 SaaS 與消費型產品估值（NDR 淨美元留存率）的核心底層工具。"}, "myNotes": "總活躍人數穩定可能是燒錢補洞的假象，畫一張同期群留存曲線立刻現出原形！", "relatedIds": ["mkt-funnel", "data-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "data-s4-4", "categoryId": "cat-data", "stageId": "s4", "subtopic": "數據溝通", "title": "數據說故事：從報表洞察到管理層行動建議", "oneLiner": "丟出十張密密麻麻的表格只會讓聽眾放空；好數據報告永遠只講「發生了什麼、為什麼發生、建議現在改哪一件事」。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "新手報告數據像在唸字典：「這張表是 Q3 各地區營收，北部 120 萬、中部 80 萬、南部 60 萬，下一頁是會員數……」（台下全部開始滑手機）。\n\n高手用數據說故事的三步驟：\n1. **圖表標題直接寫「結論」**：不要寫「Q3 營收圖」，寫「南部高階品項缺貨導致 Q3 營收少賺 15%」！\n2. **灰化配角、只幫主角上色**：十根長條圖裡九根用淺灰色，只有出問題那根用亮橘色，視線一秒鎖定！\n3. **最後必接具體行動**：「建議下週優先調撥 30% 庫存至南部，預估可挽回 40 萬業績。」", "lv2": "讓數據簡報說服力翻倍的四個視覺與邏輯技巧：\n\n1. **選對圖表**：比大小用水平長條圖、看時間趨勢用折線圖、看兩變數關聯用散點圖；超過 4 個類別就別用圓餅圖。\n2. **嚴守 Y 軸從 0 開始（長條圖）**：截斷 Y 軸會把 1% 微小差異放大成看起來差十倍的視覺詐騙。\n3. **刪除圖表垃圾（Chartjunk）**：拿掉 3D 立體特效、雜亂格線與重複圖例，直接把數字標在資料點旁。\n4. 遵循 **What（現象）→ So What（原因與影響）→ Now What（行動方案）** 敘事鏈。", "lv3": "整合 Edward Tufte《視覺資訊呈現》之「高資料墨水比（Data-Ink Ratio）」原則與 Cole Nussbaumer Knaflic《用數據說故事》的前注意屬性（Preattentive Attributes：色彩對比、大小、位置引導視覺階層），將分析結果轉化為降低決策者認知負荷的行動催化劑。"}, "myNotes": "圖表標題直接寫結論 + 九灰一橘聚焦主角 + 結尾給 What / So What / Now What！", "relatedIds": ["it-s4-3", "speak-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "phil-s1-1", "categoryId": "cat-phil", "stageId": "s1", "subtopic": "基礎邏輯", "title": "命題邏輯基礎：充分條件、必要條件與逆否命題", "oneLiner": "搞懂「下雨地板會濕」不等於「地板濕了一定有下雨」，就能一秒拆穿網路上 70% 的瞎掰推論。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "記住這句超好懂的例子：「**如果下雨（A），地板就會濕（B）**」：\n\n• **充分條件**：只要 A 發生，B 就保證發生（下雨足以讓地板濕）。\n• **必要條件**：沒有 B，就絕不可能有 A（地板沒濕，就絕對沒下雨——這叫 **逆否命題**，跟原句 100% 等價！）。\n• **最常見錯誤（倒推）**：看到「地板濕了（B）」，就斷言「一定下雨了（A）」——錯！可能是鄰居在洗車或灑水！", "lv2": "職場與閱讀必用的邏輯除錯三招：\n\n1. 商業成功學陷阱：「頂尖企業家都每天五點起床（若成功則早起）」≠「只要五點起床就會變頂尖企業家（把必要或相關誤當充分條件）」。\n2. 善用逆否命題檢驗承諾：若某人宣稱「好產品一定留存率高」，那看到「留存率極低」就能直接推論「目前產品還不夠好」。\n3. 寫程式 `if/else` 條件判斷與合約條款審閱，全部建立在精確的充分／必要條件上。", "lv3": "命題邏輯（Propositional Logic）中，實質蘊涵 P → Q 與其逆否命題 ¬Q → ¬P 邏輯等價，但與逆命題（Q → P）及否命題（¬P → ¬Q）皆不等價。混淆 P → Q 與 Q → P 稱為「肯定後件謬誤（Affirming the Consequent）」，為日常論證最高頻之形式謬誤。"}, "myNotes": "原句「若 A 則 B」只跟「若非 B 則非 A」等價，千萬別把「地板濕了」直接當成「下雨了」！", "relatedIds": ["phil-s1-2", "phil-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "phil-s1-2", "categoryId": "cat-phil", "stageId": "s1", "subtopic": "推理方法", "title": "演繹推理、歸納推理與溯因推理的適用邊界", "oneLiner": "演繹保證 100% 正確但沒產出新知識，歸納能總結經驗但怕黑天鵝，溯因則是福爾摩斯「找最合理解釋」的破案絕技。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "人類大腦推理只有三條路：\n\n1. **演繹法（大原則 → 具體結論）**：「所有人都會死，蘇格拉底是人，所以蘇格拉底會死。」只要前提沒錯，結論 100% 絕對正確！\n2. **歸納法（一堆例子 → 總結規律）**：看了 1,000 隻天鵝都是白的，就歸納「天鵝都是白的」——超實用，但只要在澳洲出現 1 隻黑天鵝就被推翻！\n3. **溯因法（看到線索 → 猜最合理的兇手）**：回家發現餅乾空了、狗狗嘴邊有碎屑，立刻推斷「八成是狗狗偷吃的！」——醫生看病、工程師修 Bug、偵探破案靠的幾乎全是溯因法！", "lv2": "日常解題如何搭配三種推理：\n\n1. 先用 **溯因法** 針對異常現象快速提出 2–3 個最可能的假設。\n2. 再用 **演繹法** 推導：「如果假設 A 是真的，那我應該會觀察到什麼證據？」\n3. 最後靠實際測試與 **歸納法** 收集足夠樣本驗證，並保留隨新證據修正的彈性。", "lv3": "演繹（Deduction）具保真性（Truth-Preserving）；歸納（Induction）面臨休謨歸納問題（Problem of Induction）；溯因（Abduction，Charles Sanders Peirce 提出）即「最佳解釋推論（Inference to the Best Explanation, IBE）」，為科學假說生成與貝氏推論之核心起點。"}, "myNotes": "修 Bug 與看病靠溯因（猜最合理原因）+ 演繹（設計驗證測試），超清晰！", "relatedIds": ["phil-s1-1", "phil-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "phil-s1-3", "categoryId": "cat-phil", "stageId": "s1", "subtopic": "概念澄清", "title": "定義澄清與概念切分：消除雞同鴨講的第一步", "oneLiner": "會議室裡 80% 吵了兩小時沒結論的爭執，不是立場對立，而是兩個人嘴裡說著同一個詞，腦子裡想的卻是兩件完全不同的事。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "老闆說「這個網站要做得『有質感』一點」，設計師心裡想的是「極簡黑白大留白」，行銷心裡想的是「奢華金光閃閃」，結果做完三方大傻眼！\n\n蘇格拉底兩千年前就教過最厲害的破局問句：**「你說的『＿＿＿』，具體定義是什麼？能不能舉一個符合跟一個不符合的例子？」**\n\n只要花 2 分鐘先對齊關鍵字定義（例如「高品質＝載入小於 2 秒且手機版不跑版」），就能省下後面兩週白工！", "lv2": "職場與日常消除雞同鴨講的三招：\n\n1. **警覺抽象大詞（Weasel Words）**：聽到「優化、賦能、質感、合理、很快」，立刻追問具體可驗證的標準或數字。\n2. **操作型定義（Operational Definition）**：把模糊形容詞翻譯成「怎麼量、誰來驗收」。\n3. **概念切分**：對方說「AI 很危險」，先切分「我們現在討論的是『著作權爭議』、『職場取代』還是『科幻毀滅』？」切乾淨立刻能理性對話。", "lv3": "分析哲學強調語言澄清為解決偽問題（Pseudo-Problems）的前提；邏輯學標準定義採「屬加種差定義法（Genus-Differentia Definition）」，並嚴防在論證過程中悄然變換名詞內涵的「歧義謬誤（Equivocation）」。"}, "myNotes": "聽到「質感、很快、優化」這類抽象詞，立刻花 30 秒追問具體操作型定義！", "relatedIds": ["phil-s1-4", "phil-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "phil-s1-4", "categoryId": "cat-phil", "stageId": "s1", "subtopic": "資訊辨識", "title": "事實陳述、價值判斷與意見的嚴格區分", "oneLiner": "「今天氣溫 32 度」是事實，「今天熱得要命」是個人感受，「政府應該補貼冷氣費」是價值主張——分清三者才不會被新聞與情緒牽著走。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "讀這三句話，感覺一下差別：\n1. **事實（Fact）**：「這家店牛肉麵一碗賣 250 元。」（可客觀查證真假，沒有爭辯空間）\n2. **個人意見／感受（Opinion）**：「我覺得 250 元好貴喔！」（因人而異，沒有絕對對錯）\n3. **價值判斷（Value Judgment）**：「餐廳不應該把庶民小吃賣這麼貴！」（背後藏著你的道德或公平標準）\n\n網路上最愛把「意見」跟「價值判斷」包裝成「事實」來講，讓你以為反對他就是反對真相！", "lv2": "閱讀新聞與處理爭執的「三色分離法」：\n\n1. **先對齊事實**：雙方先確認客觀數據與時間線是否一致；事實若錯，後面全白談。\n2. **承認價值差異**：很多公共議題吵不完，不是誰笨，而是 A 把「效率」排第一、B 把「公平」排第一——看見彼此的價值排序就能減少惡意互罵。\n3. 寫報告時把「客觀數據」與「我的推論建議」清楚分段標示，專業度倍增。", "lv3": "哲學家大衛・休謨提出著名的「實然與應然問題（Is-Ought Problem / Hume's Guillotine）」：無法單從描述世界「是什麼（Is，事實命題）」的純事實前提，邏輯推導出人類「應該怎麼做（Ought，規範命題）」，中間必然隱含了一條未明說的價值前提。"}, "myNotes": "討論卡住時先分三層：我們是在吵「事實真假」，還是彼此「價值順位不同」？", "relatedIds": ["phil-s1-3", "strat-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "phil-s2-1", "categoryId": "cat-phil", "stageId": "s2", "subtopic": "邏輯謬誤", "title": "高頻情緒與人身謬誤：稻草人、訴諸權威與人身攻擊", "oneLiner": "當對方講不贏你的論點時，最常使出三招轉移戰場：扭曲你的話來打（稻草人）、拿大人物壓你（訴諸權威）、直接罵你這個人（人身攻擊）。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "打開社群留言區，這三種邏輯犯規每天都在上演：\n\n• **稻草人謬誤**：你說「我們應該多給行人一點過馬路時間」，對方回罵「所以你是想禁止所有汽車上路、害大家沒辦法上班囉？！」——把你原本合理的話故意扭曲成超荒謬的假稻草人再狂打！\n• **人身攻擊（訴諸人身）**：不回應你的論點對不對，直接罵「你才工作兩年懂什麼？」「你長這樣講話能信嗎？」。\n• **訴諸權威**：拿某位跟這領域完全無關的名人說「連 XX 影帝都推薦這款保健品，絕對有效！」。", "lv2": "遇到這三種犯規時，一句話優雅拉回戰場：\n\n1. 破稻草人：「等等，我剛剛主張的是 X，不是你說的 Y；我們先針對 X 討論好嗎？」\n2. 破人身攻擊：「關於我的資歷我們可以另聊，但我們先看剛剛那份數據哪裡有錯？」\n3. 破訴諸權威：區分「該領域具備實證依據的專家共識」vs「跨領域名人背書或單一權威個人意見」。", "lv3": "非形式邏輯將此三類歸為「不相關謬誤（Fallacies of Relevance）」：稻草人（Straw Man）、人身攻擊（Ad Hominem，含「你也一樣 Tu Quoque」反嗆）與不當訴諸權威（Appeal to False Authority），共通特徵是試圖用情緒喚起或身分標籤取代實質證據。"}, "myNotes": "被立稻草人時別跟著辯解假靶子，直接冷靜說：「我主張的是 X，不是你剛說的 Y」！", "relatedIds": ["phil-s4-2", "speak-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "phil-s2-2", "categoryId": "cat-phil", "stageId": "s2", "subtopic": "因果陷阱", "title": "因果推理陷阱：相關不等於因果、滑坡與倒果為因", "oneLiner": "兩件事前後發生不代表前者害了後者（假因果），而把一個小步驟無限誇張成世界末日則是「滑坡謬誤」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "三種最容易讓人腦補過頭的因果陷阱：\n\n1. **前後即因果（Post Hoc）**：「昨天穿紅衣服剛好股票大漲，所以我以後每天都要穿紅衣服！」（時間有先後不代表有因果）。\n2. **滑坡謬誤**：你說「今天讓員工提早半小時下班」，對方喊「今天早走半小時，明天就會翹班一天，下個月公司就會倒閉、大家流落街頭！」——中間跳過五步沒證據的恐嚇推演。\n3. **倒果為因**：看到「消防車出動越多的火災現場，房屋燒毀越嚴重」，就下結論「是消防車害房子燒更慘的！」（其實是因為火燒太大才叫來更多消防車！）。", "lv2": "檢驗任何因果宣稱的三個快篩問題：\n\n1. 中間的「具體傳導機制」在哪一步？（滑坡謬誤只要追問「從第 2 步到第 3 步為什麼一定會發生？」立刻破功）。\n2. 因果箭頭反過來畫是不是更合理？\n3. 有沒有第三個隱藏因素同時推著兩邊走？", "lv3": "包含假因果謬誤（Post hoc ergo propter hoc / Cum hoc ergo propter hoc）、滑坡謬誤（Slippery Slope）與反向因果（Reverse Causality）。嚴謹因果主張須同時滿足時間先後性、共變性、合理機制與排除替代混淆解釋（Bradford Hill 準則）。"}, "myNotes": "破滑坡謬誤只要冷靜問一句：「從你說的第 2 步到第 3 步，證據在哪裡？」", "relatedIds": ["data-s3-1", "phil-s1-1"], "updatedAt": "2026-11-24"},
        {"id": "phil-s2-3", "categoryId": "cat-phil", "stageId": "s2", "subtopic": "框架陷阱", "title": "非黑即白（假兩難）、偷換概念與循環論證", "oneLiner": "當有人逼你「要嘛完全贊成我，要嘛就是我的敵人（假兩難）」，記住：世界上永遠存在第三、第四個更好的選項！", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "這三個邏輯陷阱專門用來「鎖死你的思考空間」：\n\n• **非黑即白（假兩難）**：「你不支持這個高風險方案，就是想看著團隊等死！」——其實還有「先做小規模低風險測試」的第三條路！\n• **偷換概念**：一開始討論「要不要加班趕工（這週特例）」，講到一半被偷換成「你對公司有沒有責任感（品格問題）」。\n• **循環論證（用結論證明結論）**：「因為這本書寫的每一句都是絕對真理，所以裡面說這本書是真理這句話也絕對是真的！」（原地繞圈零證據）。", "lv2": "日常跳出框架綁架的三招：\n\n1. **永遠強迫自己找出「第 3 個選項」**：只要看到「不是 A 就是 B」的二選一題目，立刻停下來問「有沒有結合兩者優點的 C？」\n2. **抓出被偷換的名詞**：把最初討論的原始詞語重複一次拉回焦點。\n3. 遇到循環論證時要求「給出一個獨立於結論之外的外部證據」。", "lv3": "對應假二分法（False Dilemma / Bifurcation）、歧義偷換（Equivocation / Motte-and-Bailey 退守城樓戰術：平時宣稱極端主張，被質疑時退回人畜無害的常識主張）與乞題謬誤（Begging the Question / Petitio Principii）。"}, "myNotes": "看到「不是 A 就是 B」的假兩難，立刻去創造更好的選項 C！", "relatedIds": ["phil-s1-3", "phil-s2-1"], "updatedAt": "2026-11-24"},
        {"id": "phil-s2-4", "categoryId": "cat-phil", "stageId": "s2", "subtopic": "科學哲學", "title": "可證偽性（Popper）與科學方法的檢驗標準", "oneLiner": "真正的科學理論敢於「把脖子伸出來讓你驗證它有沒有錯」；那種「發生什麼事都能自圓其說」的理論，聽起來無敵其實毫無資訊量。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "科學哲學家卡爾・波普爾給了一把區分「真科學」與「空話」的超級雷射尺——**可證偽性（Falsifiability）**！\n\n比比看這兩句話：\n• 句子 A（可證偽）：「明天下午三點台北市會下雨。」——這句話有具體預測，明天三點出大太陽你就立刻證明它錯了！\n• 句子 B（不可證偽）：「你最近運氣不好是因為有隱形外星人干擾；你找不到外星人是因為它們會完全隱形而且任何儀器都測不到！」——這種**永遠無法設計實驗證明它錯**的說法，就叫做不可證偽的空話！\n\n愛因斯坦當年提出相對論時，直接大方寫下「如果日蝕觀測星光沒有偏折 1.75 角秒，我的理論就徹底錯了！」——敢被檢驗，才是科學最強大的地方。", "lv2": "用可證偽性幫自己的想法與投資假設體檢：\n\n1. 買進一檔股票或啟動一個專案前，先寫下「**什麼證據出現時，我就承認我原本看錯了？**」如果寫不出來，代表你陷入了盲目信仰而非理性判斷！\n2. 辨識偽科學與話術：凡是「成功就歸功我的方法、失敗就怪你心不夠誠」的說法，立刻判定為不可證偽。", "lv3": "Karl Popper《科學發現的邏輯》（1934）指出歸納無法「最終證實」全稱命題，但單一反例即可「證偽」之，故科學進步的本質是「大膽猜想 → 嚴格反駁（Conjectures and Refutations）」。Thomas Kuhn 後於《科學革命的結構》補充「典範轉移（Paradigm Shift）」視角，解釋現實科學社群如何隨異常累積推翻舊典範。"}, "myNotes": "任何重大判斷前先寫好「如果出現什麼證據，我就承認自己想錯了？」——這就是可證偽性防呆！", "relatedIds": ["cross-bayes", "meta-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "phil-s3-1", "categoryId": "cat-phil", "stageId": "s3", "subtopic": "人生哲學", "title": "斯多葛哲學（Stoicism）：控制二分法與情緒主權", "oneLiner": "人生痛苦的總來源，就是拼命想控制「你控制不了的事（天氣、別人怎麼看你、過去）」，卻忽略了唯一 100% 歸你管的「你的選擇與反應」。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "兩千年前的羅馬皇帝馬可・奧理略每天處理戰爭、瘟疫跟背叛，卻靠 **斯多葛哲學** 保持內心穩如泰山。它的核心只要一張兩欄表格——**控制二分法**：\n\n• **我能 100% 控制的事**：我的準備努力、我的態度、我的選擇、我怎麼解讀這件事。\n• **我無法控制的事**：別人喜不喜歡我、明天下不下雨、股市明天漲跌、已經發生的過去。\n\n把 100% 力氣壓在左邊，對右邊學會微笑放手——這不是消極認命，而是把能量用在刀口上的頂級心理防彈衣！", "lv2": "現代人最實用的三個斯多葛日常練習：\n\n1. **負面視覺化（Premeditatio Malorum）**：出發前花 1 分鐘想一下「今天最糟可能遇到塞車或客戶取消」，提前演練冷靜應對，真的發生時你連眉頭都不會皺一下。\n2. **愛命運（Amor Fati）**：不只忍受意外，而是把阻礙變成養分（「這場延誤剛好讓我多出半小時把簡報修得更順！」）。\n3. **向死而生（Memento Mori）**：提醒自己時間有限，瞬間看透無謂的瑣事與面子之爭根本不值得生氣。", "lv3": "斯多葛學派（芝諾、愛比克泰德、塞內卡、馬可・奧理略）直接啟發了現代心理治療黃金標準——認知行為療法（CBT）與理性情緒行為療法（REBT, Albert Ellis）：「困擾人們的並非事物本身，而是人們對事物的看法。」"}, "myNotes": "斯多葛控制二分法 + 心理學課題分離，是現代人最強的雙層抗焦慮防彈衣！", "relatedIds": ["psy-s4-3", "psy-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "phil-s3-2", "categoryId": "cat-phil", "stageId": "s3", "subtopic": "倫理決策", "title": "功利主義 vs 義務論：經典倫理兩難的決策透視", "oneLiner": "犧牲 1 個人救 5 個人對不對？功利主義看「整體結果最大化」，義務論守「絕不把人當工具的底線原則」——兩者拉扯正是現實難題的本質。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "經典「電車難題」：一輛失控電車直衝軌道上的 5 個人，你手邊有個拉桿可以把車轉向另一條只有 1 個人的軌道，你拉不拉？\n\n兩大倫理學派立刻開打：\n• **功利主義（看結果算總帳）**：救 5 條命犧牲 1 條命，淨賺 4 條命，拉！（但極端化會出事：難道可以抓 1 個健康路人拆器官救 5 個病人嗎？不行！）\n• **義務論（康德，守絕對原則）**：人永遠是目的、絕不能當成工具犧牲！不能因為結果好看就做本質上錯的事。\n\n現實中我們天天在兩邊權衡：商業決策看效率（偏功利），但公司紅線與做人底線（不欺騙、不洩漏個資）則是絕對不可踩的義務論！", "lv2": "把兩大倫理視角用在工作與領導決策：\n\n1. **先畫「義務論紅線」**：列出無論賺多少錢都絕不碰的底線（違法、欺騙客戶、傷害安全）。\n2. **在紅線之內用「功利主義」算效益**：評估不同方案誰能替最多人創造最大長期價值。\n3. 遇到社會重大爭議（如防疫管制、AI 版權）時，用這兩把眼鏡瞬間看懂正反雙方真正吵的點在哪。", "lv3": "邊沁（Jeremy Bentham）與彌爾（John Stuart Mill）奠定功利主義（Utilitarianism，區分行為功利主義與規則功利主義）；康德（Immanuel Kant）提出定言令式（Categorical Imperative：只依你能同時願意它成為普遍法則的準則行動，並永遠把人性視為目的本身）。現代應用倫理常再納入亞里斯多德「德行倫理學（Virtue Ethics）」構成三足鼎立。"}, "myNotes": "先用義務論守住不可碰的底線紅線，紅線之內再用功利主義最大化長期價值！", "relatedIds": ["phil-s4-1", "phil-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "phil-s3-3", "categoryId": "cat-phil", "stageId": "s3", "subtopic": "意義建構", "title": "存在主義與意義建構：自由選擇與承擔責任", "oneLiner": "人生不是出廠就寫死說明書的掃地機器人；正因為沒有標準答案，你透過每一次行動與承擔，親手把自己的意義活出來。", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "一把剪刀在被造出來之前，設計師就已經決定好它的用途是「剪東西」（本質先於存在）。\n\n但存在主義大師沙特說：人類完全相反——**「存在先於本質」**！你先來到這個世界上，並沒有誰替你寫好人生標準劇本。你今天選擇學什麼、對誰溫柔、堅持什麼原則，這一連串的選擇才一點一點雕刻出「你是誰」！\n\n聽起來既自由又有點嚇人（因為再也不能把責任全推給爸媽、命運或社會），但也因此，**不管過去拿了什麼牌，你永遠握有改寫下一章的筆！**", "lv2": "把存在主義轉化為抗迷惘的日常行動：\n\n1. **別等「找到人生意義」才動手**：意義不是藏在某座山洞裡等你挖出來，而是在你投入解決某個真問題、幫助某群人的過程中「長出來的」。\n2. **戒掉「自欺（Bad Faith）」**：別再說「我沒辦法、大環境逼我的」——承認「不改變也是我此刻的選擇」，主導權立刻回到手上。\n3. 讀維克多・弗蘭克《活出意義來》三條意義之路：創造作品、體驗愛與美、面對無法改變困境時的態度。", "lv3": "由齊克果、尼采、沙特（Jean-Paul Sartre）、西蒙・波娃與卡繆（Albert Camus《薛西弗斯神話》面對荒謬的反抗）發展而成，影響存在心理治療（Irvin Yalom 探討死亡、自由、孤獨與無意義四大終極關懷），強調本真性（Authenticity）與對自由選擇的完全當責。"}, "myNotes": "意義不是「找到」的，而是透過一次次投入與選擇親手「活出來」的！", "relatedIds": ["phil-s3-1", "phil-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "phil-s3-4", "categoryId": "cat-phil", "stageId": "s3", "subtopic": "知識本質", "title": "認識論入門：經驗主義、理性主義與懷疑論對話", "oneLiner": "我們怎麼確定「自己知道的東西是真的」？理性派靠邏輯推導、經驗派靠實測觀察、懷疑派提醒你永遠留一分謙卑。", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "想像三個人在討論「怎麼知道一顆蘋果甜不甜？」：\n\n• **經驗主義（洛克、休謨）**：「咬一口吃吃看就知道了！所有真實知識都來自感官觀察與實驗。」\n• **理性主義（笛卡兒）**：「感官會騙人（像海市蜃樓或剛刷完牙喝柳橙汁變超苦）！只有數學跟嚴密邏輯推理（我思故我在）才絕對可靠！」\n• **康德大整合**：兩邊缺一不可——沒有經驗資料，純邏輯只是空轉；沒有大腦的邏輯框架，滿地資料只是亂碼！", "lv2": "把認識論變成現代人的高階查證習慣：\n\n1. **實證與邏輯雙重驗證**：商業或投資點子既要「邏輯說得通（理性）」，更要「丟進市場拿真實數據驗證（經驗）」。\n2. **健康的懷疑精神（而非憤世嫉俗）**：把知識當成「目前證據下最可靠的版本（Version 1.0）」，遇到更有力反證時樂意升級到 Version 2.0。", "lv3": "認識論（Epistemology）古典定義知識為「被證成的真信念（Justified True Belief, JTB）」（後遭 Gettier 反例挑戰）。現代科學方法即理性主義（數學模型推導）與經驗主義（受控實驗觀測）的迭代結合，並以貝氏認識論（Bayesian Epistemology）將信念表徵為連續機率分佈而非二元真假。"}, "myNotes": "邏輯推演（理性）+ 市場數據實測（經驗）+ 隨時更新的謙卑（懷疑），三者缺一不可！", "relatedIds": ["phil-s2-4", "cross-bayes"], "updatedAt": "2026-11-24"},
        {"id": "phil-s4-1", "categoryId": "cat-phil", "stageId": "s4", "subtopic": "思想實驗", "title": "思想實驗法：無知之幕（Rawls）與公平正義推演", "oneLiner": "想設計一套真正公平的制度？想像你拉上一層「無知之幕」，在完全不知道自己會抽到老闆還是基層員工的狀態下制定規則！", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "兩個小朋友分一塊蛋糕，怎麼分才最公平？最神的方法就是「**A 切蛋糕、B 先選！**」——因為 A 不知道最後哪一塊會留給自己，所以他一定會拚命切得超級均勻！\n\n哈佛哲學家羅爾斯把這招放大到整個社會，叫做 **無知之幕（Veil of Ignorance）**：假設投胎前你完全不知道自己會出生在富豪家還是貧困家庭、健康還是身障、聰明還是普通，請你現在來設計社會規則與公司制度——你一定會設計出一套「就算我抽到最差那張牌，也依然保有尊嚴與翻身機會」的公平制度！", "lv2": "把「無知之幕」用在團隊分潤、合約與家務分工：\n\n1. **合夥條款防翻臉**：草擬股東協議或分潤規則時，問「如果明天我跟對方角色互換，我還覺得這條款公平嗎？」\n2. **會議與輪班規則**：設計大家都願意長期遵守的制度，遠比事後拿權力壓人省力得多。", "lv3": "John Rawls《正義論》（1971）於原初狀態（Original Position）與無知之幕下導出兩大正義原則：一、平等的基本自由權；二、差異原則（Difference Principle，社會與經濟不平等僅在對「最弱勢群體最有利」且機會均等時方具正當性），成為當代政治哲學與演算法公平性（AI Fairness）的核心基準。"}, "myNotes": "「你切蛋糕、我先選」就是最精妙的無知之幕公平機制！", "relatedIds": ["phil-s3-2", "biz-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "phil-s4-2", "categoryId": "cat-phil", "stageId": "s4", "subtopic": "高階思辨", "title": "鋼人論證（Steelmanning）與雙邊視角校準", "oneLiner": "稻草人是把對手的話扭曲成最蠢的版本來打；鋼人論證則是先幫對手把論點補強到無懈可擊，再去檢驗自己的立場撐不撐得住。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "網路上吵架大家最愛抓對手語病、把對方講成白痴來贏得口水戰（稻草人），但這樣贏了其實你半點都沒變聰明！\n\n高手練的是反過來的 **鋼人論證（Steelmanning）**：在你反對一個觀點之前，先試著替對方寫出「他這個立場最強大、最有道理的版本」，甚至講到對方點頭說「沒錯，你講得比我還清楚！」\n\n如果連對手最強的鋼鐵版本你都能理性拆解，你的看法就真的站得住腳；如果拆不動，恭喜你立刻升級了自己的認知！", "lv2": "練習鋼人論證與思想圖靈測試的三步驟：\n\n1. **重要決策反方寫作**：花 10 分鐘站在反對者立場，認真寫出「為什麼不該買這檔股票／不該做這個專案」最強的三個理由。\n2. **查理・蒙格鐵律**：「如果我無法比反對我的人更清楚地闡述他的觀點，我就沒資格擁有自己的立場。」\n3. 討論分歧時先覆述對方最強論點，對方防衛心會瞬間歸零，對話品質直接跳級。", "lv3": "鋼人論證根植於分析哲學的「寬容原則（Principle of Charity, Donald Davidson / Daniel Dennett）」與穆勒《論自由》的認識論防禦：唯有在與最強反方觀點的碰撞中，真理才不會退化為僵化教條。"}, "myNotes": "能把反對派最強論點講得比對方還清楚，才是真正獨立思考的證明！", "relatedIds": ["phil-s2-1", "psy-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "phil-s4-3", "categoryId": "cat-phil", "stageId": "s4", "subtopic": "科技倫理", "title": "AI 時代的哲學拷問：意識、中文房間與科技倫理", "oneLiner": "當 AI 寫詩寫程式都比人快，它真的「懂」自己在說什麼嗎？看懂中文房間實驗與演算法責任歸屬，才能在 AI 時代站穩人類定位。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "哲學家約翰・瑟爾設計了一個超有名的 **中文房間思想實驗**：\n把一個完全不懂中文的英國人關在房間裡，給他一本超厚的《中文問答對照規則書》。外面塞一張中文紙條進來，他照規則書查出對應符號抄在紙上塞出去，外面的人驚呼「這房間裡的人中文超溜！」——但房間裡那個人其實根本不懂任何一個字的意思！\n\n這正是今天大語言模型最核心的哲學爭論：AI 精通語法與統計規律（模擬得超像），但它真的擁有主觀體驗、同理心與承擔責任的能力嗎？", "lv2": "AI 時代每個人都該思考的三條倫理與職涯界線：\n\n1. **責任歸屬不可外包**：AI 幫你寫合約、做診斷或寫程式出包時，最終承擔法律與信任後果的永遠是「按下確認的人類」。\n2. **警惕演算法偏見**：如果訓練資料裡原本就有歷史歧視，AI 只會以十倍速度自動化放大偏見。\n3. **人類不可取代的核心價值**：定義「什麼值得做（價值判斷）」、承擔後果的勇氣、以及真實人與人的情感連結。", "lv3": "John Searle（1980）中文房間論證區分「弱 AI（工具模擬）」與「強 AI（具意向性 Intentionality 與感質 Qualia）」，直接挑戰艾倫・圖靈（1950）的行為主義圖靈測試。當代 AI 倫理核心聚焦於對齊問題（Alignment）、可解釋性（XAI）、演算法問責與著作權歸屬。"}, "myNotes": "AI 可以算機率與產初稿，但「定義什麼值得做」與「承擔最終責任」永遠屬於人類！", "relatedIds": ["it-s3-4", "phil-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "phil-s4-4", "categoryId": "cat-phil", "stageId": "s4", "subtopic": "個人原則", "title": "建立個人原則憲法：從零散感悟到一致性價值系統", "oneLiner": "橋水基金創辦人達利歐把人生踩過的坑寫成清楚原則；建立你自己的「個人原則清單」，遇到誘惑與難題時就不會每次都重新動搖。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "為什麼很多大道理聽過一百遍，遇到事情還是會犯同樣的錯？因為那些感悟只是飄在空中的零散句子，沒變成你的「作業系統規則」！\n\n試著把你最重視的 5 到 10 條人生原則白紙黑字寫下來（例如：「1. 絕不跟人品有疑慮的人合作；2. 重大決定一律睡一覺再答覆；3. 每天保留 1 小時給自己學習輸出」）。\n\n寫下來有個超神奇的效果：**以後遇到誘惑或猶豫時，不用耗腦力掙扎，直接查自己的原則憲法就一秒決定！**", "lv2": "撰寫與迭代個人原則憲法的四個步驟：\n\n1. **從痛苦與後悔提煉（痛苦 + 反思 ＝ 進步）**：每次踩大坑後，別只怪自己倒楣，寫成一條「下次遇到同類情境的具體規則」。\n2. **按四大面向分類**：學習思考原則、財務投資原則、合作人際原則、健康精力原則。\n3. **具體可執行**：把「要當好人」改成「答應的事做不到提前 24 小時說，絕不搞消失」。\n4. 每年年底翻出來檢視增刪，讓憲法隨你一起升級。", "lv3": "Ray Dalio《原則》（Principles）將決策制度化為可編碼的演算法思維（Decision Rules），呼應亞里斯多德「實踐智慧（Phronesis）」與行為經濟學「事前承諾機制」，大幅降低高壓情境下的決策疲勞與價值飄移（Value Drift）。"}, "myNotes": "把踩過的坑提煉成清楚的「個人原則」，存入這個知識庫，未來遇到同類難題一秒不猶豫！", "relatedIds": ["fin-s4-4", "phil-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "hist-s1-1", "categoryId": "cat-hist", "stageId": "s1", "subtopic": "文明起點", "title": "農業革命、文字與國家制度的誕生邏輯", "oneLiner": "人類從打獵採集定居種田後有了多餘糧食，為了記帳分糧發明了文字，為了保護糧倉建起軍隊與法律——現代文明就此誕生。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "你可能以為最早的文字是古人用來寫浪漫情詩的，其實完全相反——考古挖出最早的楔形文字泥板，幾乎全都是 **「收稅跟記帳清單」**（例如「張三繳了 30 袋大麥」）！\n\n一條清晰的因果鏈把人類文明串起來：\n1. **農業革命**（約一萬年前）：定居種田讓糧食變多、人口暴增。\n2. **分工出現**：不需要每個人都去種田，出現了工匠、祭司、士兵與官員。\n3. **文字、貨幣與法律**：人一多超過熟人小村落上限（150 人），靠腦袋記不住誰欠誰，必須靠「共同相信的虛構故事（貨幣、國家、法律）」才能讓幾百萬陌生人一起合作蓋大工程！", "lv2": "讀懂文明底層邏輯對看現代世界的啟發：\n\n1. **資訊紀錄與信任工具永遠是文明升級關鍵**：從泥板記帳 → 複式簿記 → 網際網路 → AI 知識系統，每次資訊成本暴降都會改寫權力版圖。\n2. **組織擴大規模必靠制度與共同敘事**：小團隊靠人情默契，超過 150 人必靠文字規則與共享價值觀。", "lv3": "整合 Jared Diamond《槍炮、病菌與鋼鐵》（地理軸線與可馴化動植物決定農耕起跑差）與 Yuval Noah Harari《人類大歷史》（認知革命催生「主體間現實 Intersubjective Reality」實現超大規模陌生人協作）。"}, "myNotes": "最早的文字竟然是記帳收稅！制度、貨幣與法律本質上是讓百萬陌生人協作的作業系統。", "relatedIds": ["hist-s1-4", "soc-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "hist-s1-2", "categoryId": "cat-hist", "stageId": "s1", "subtopic": "全球貿易", "title": "大航海時代、重商主義與早期全球貿易網", "oneLiner": "15 世紀歐洲人為了繞過奧斯曼帝國買香料，意外開出跨洋航線、發明了「股份有限公司」分散航海風險，把地球連成第一張全球市場。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "今天我們天天看到的「股票市場」跟「跨國公司」，其實是 400 年前荷蘭人為了去亞洲買胡椒香料逼出來的！\n\n當時出海去一趟亞洲雖然賺翻，但海難、海盜超多，一艘船沉了船東就破產。聰明的荷蘭人成立了 **東印度公司（VOC）**：把風險切成幾千份小股票賣給全國民眾，大家各出一點錢一起分攤風險、船安全回來一起分紅，順便建了世界第一間阿姆斯特丹證券交易所！\n\n同時美洲白銀流向中國換絲綢瓷器，馬鈴薯與玉米傳遍全球引爆人口翻倍（哥倫布大交換），世界從此不再孤立。", "lv2": "從大航海時代看懂現代商業與金融制度：\n\n1. **金融創新的本質是「跨時空分散風險」**：沒有股份有限責任制與航海保險，就沒有大規模遠洋探索與現代科技創業。\n2. **看清「重商主義（以為貿易是零和搶黃金）」vs「現代貿易觀（比較利益共創財富）」**的根本差異。", "lv3": "大航海時代（15–17 世紀）催生了哥倫布大交換（Columbian Exchange）、現代公司法人制度、主權債券與中央銀行雛形（荷蘭銀行／英格蘭銀行），標誌著世界權力中心從歐亞內陸絲路（陸權）歷史性地轉移至大西洋海權體系。"}, "myNotes": "股票與有限公司是為了「分攤遠洋航海沉船風險」發明的——金融工具本質永遠是風險配置！", "relatedIds": ["hist-s2-1", "fin-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "hist-s1-3", "categoryId": "cat-hist", "stageId": "s1", "subtopic": "科技革命", "title": "三次工業革命與能源／通訊技術的典範轉移", "oneLiner": "每次改寫人類命運的大躍進，都是「新能源 × 新通訊 × 新交通」三箭齊發；今天 AI 浪潮正重演著當年電力剛進工廠的歷史劇本。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "歷史上有三次徹底翻轉生活的大洗牌：\n\n1. **第一次（18 世紀末）**：蒸汽機 + 煤炭 + 鐵路 → 機器取代手工，英國成為日不落帝國。\n2. **第二次（19 世紀末）**：電力 + 石油內燃機 + 電報電話 → 流水線大工廠誕生，美國與德國超車崛起。\n3. **第三次（20 世紀末）**：半導體電腦 + 網際網路 → 資訊傳遞零成本，軟體吃掉世界。\n\n超有趣的歷史細節：當年工廠剛換上電動馬達時，整整 30 年生產力都沒變高！直到大家發現「不能只把蒸汽機換成馬達，要把整座工廠的動線與管理方式全部重設計」，生產力才瞬間井噴——今天的 **AI 導入** 正處在同樣的轉折點！", "lv2": "用科技革命歷史規律看懂當下 AI 浪潮：\n\n1. **先賣鏟子、再改流程**：每次技術革命初期最賺錢的是基礎設施（鐵路鋼鐵、電力網、算力晶片），中後期最大贏家則是「徹底重寫商業流程的應用者」。\n2. **技術永遠伴隨泡沫與洗牌（卡洛塔・佩雷斯模型）**：早期狂熱投資蓋好基礎建設 → 泡沫修正 → 真正普及進入黃金部署期。", "lv3": "經濟史學家 Carlota Perez《技術革命與金融資本》歸納五次長波（康德拉季耶夫週期），皆遵循「導入期（狂熱金融泡沫）→ 轉折點（危機重整）→ 部署期（黃金普及）」；Paul David 的「電力生產力悖論」則解釋了通用目的技術（GPT, General Purpose Technology）從發明到顯現總體經濟效益的時間延遲。"}, "myNotes": "電力進工廠要重設整個動線才爆發——AI 也不是拿舊流程貼上 AI，而是重寫整套工作流！", "relatedIds": ["hist-s4-3", "it-ai-workflow"], "updatedAt": "2026-11-24"},
        {"id": "hist-s1-4", "categoryId": "cat-hist", "stageId": "s1", "subtopic": "制度經濟", "title": "國家興衰的制度密碼：廣納型 vs 榨取型制度", "oneLiner": "為什麼隔一條街的南北韓、美墨邊境同名小鎮，氣候人種全一樣，貧富卻差十倍？答案不在地理或文化，而在「保護財產與鼓勵創新的制度」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "打開夜晚的衛星地圖看朝鮮半島：南韓燈火通明，北韓一片漆黑——兩邊原本是同一個民族、同一塊土地、同樣歷史，為什麼短短幾十年差這麼多？\n\n2024 年諾貝爾經濟學獎得主給了最震撼的答案，把制度分成兩種：\n• **廣納型制度**：保護每個普通人的私有財產與專利、法律平等、開放競爭——大家知道「我努力研發賺的錢真的歸我」，創新與財富就源源不絕！\n• **榨取型制度**：權力與資源壟斷在極少數菁英手上，隨時可以沒收民間財產或打壓新技術（怕動搖統治）——大家努力沒好處，整個社會就陷入長期貧窮或停滯。", "lv2": "把「廣納 vs 榨取」視角延伸到看國家、看公司甚至看投資市場：\n\n1. **投資選市場**：優先投資法治透明、保護少數股東權益、資訊公開的資本市場。\n2. **看公司治理**：好公司建立「廣納型文化」（誰有好點子都能升遷分紅）；爛公司陷入「榨取型文化」（功勞歸老闆、黑鍋歸基層），人才立刻流光。", "lv3": "Daron Acemoglu、Simon Johnson 與 James Robinson《國家為什麼會失敗》（獲 2024 諾貝爾經濟學獎）透過歷史自然實驗證明：廣納型政治與經濟制度的正向回饋是長期可持續繁榮的根本驅動力；榨取型體制雖可能靠國家動員創造短期高成長，但因排斥「創造性破壞（Creative Destruction）」而必然面臨成長天花板。"}, "myNotes": "不只國家，一家公司是「廣納分享」還是「榨取壟斷」，也直接決定它留不留得住人才！", "relatedIds": ["econ-incentive", "hist-s1-1"], "updatedAt": "2026-11-24"},
        {"id": "hist-s2-1", "categoryId": "cat-hist", "stageId": "s2", "subtopic": "地緣基礎", "title": "地理決定論基礎：海權、陸權與關鍵咽喉航道", "oneLiner": "山脈、海洋與運河幾千年都不會搬家——攤開世界地圖看懂哪幾條海峽扼住了全球石油與貨櫃命脈，國際新聞瞬間立體起來。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "海運成本大約只有陸運的十分之一，所以全世界 **80% 以上**的貨物與石油都在海上跑！\n\n攤開地圖，你會發現全球貿易竟然被幾條超窄的水道（**咽喉點 Chokepoints**）卡住脖子：\n• **荷姆茲海峽**：全球約五分之一石油每天從這裡經過。\n• **蘇伊士運河／紅海**：歐亞最快捷徑，一艘大船卡住或遇襲，全球運價立刻飆漲。\n• **麻六甲海峽**：東亞（中日韓台）進口能源與出口商品的生命線。\n• **巴拿馬運河**：連接太平洋與大西洋的關鍵捷徑。\n• **台灣海峽與第一島鏈**：位於西太平洋海權核心樞紐，這正是為何全球大國高度緊盯此區域！", "lv2": "看國際新聞時搭配地圖的三個習慣：\n\n1. 每次看到中東、紅海、烏克蘭或南海衝突新聞，花 30 秒打開地圖看它離哪條咽喉航道或能源管線最近，立刻就能預判對運價、油價與供應鏈的衝擊。\n2. 理解大國為何永遠渴望「不凍港」與「安全緩衝區」——地理限制了每個國家最深層的安全焦慮。", "lv3": "古典地緣政治兩大基石：馬漢（Alfred Thayer Mahan）《海權論》強調控制海洋通道與關鍵基地即掌握全球商業霸權（英美路線）；麥金德（Halford Mackinder）《心臟地帶論》則視歐亞大陸核心為陸權樞紐；斯皮克曼（Nicholas Spykman）進一步提出「邊緣地帶論（Rimland）」指出沿海弧形地帶才是海陸強權博弈的真正主戰場。"}, "myNotes": "看國際新聞一定要順手開地圖！海運佔全球八成貿易，幾條咽喉海峽就是全球經濟的動脈。", "relatedIds": ["hist-s2-2", "hist-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "hist-s2-2", "categoryId": "cat-hist", "stageId": "s2", "subtopic": "資源博弈", "title": "能源、糧食與關鍵礦產的資源博弈邏輯", "oneLiner": "沒有石油開不動車、沒有稀土與鋰造不出晶片和電動車、沒有糧食穩不住政權——看懂大國缺什麼資源，就看懂他們為何出兵或結盟。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "現代國家就算科技再發達，依然離不開三樣最硬的物理底牌：\n\n1. **能源**：從煤炭、石油天然氣到如今 AI 資料中心狂吃的「穩定電力」。\n2. **糧食與化肥**：全球小麥、玉米高度集中在少數糧倉（美、烏、俄、巴西），戰事一起就會引爆開發中國家糧價動盪。\n3. **關鍵礦產**：手機、電動車電池、風力發電機跟飛彈全離不開鋰、鈷、銅與稀土——誰掌握提煉加工鏈，誰就握有卡脖子的籌碼！", "lv2": "用資源視角看懂總經與產業新聞：\n\n1. 區分「開採產地」與「提煉加工壟斷」：很多關鍵礦產全球都有礦，但因為環保與成本門檻，提煉加工高度集中在單一國家，形成供應鏈單點脆弱性。\n2. 能源轉型（綠能 + 核能 + 儲能）不只是環保口號，對缺乏石油天然氣的國家（歐洲、日韓台）而言更是「國家能源安全戰略」。", "lv3": "資源地緣政治呈現從「化石能源集中型（OPEC 石油美元體系）」轉向「關鍵礦產加工集中型（Critical Minerals）」的典範轉移；同時須留意「資源詛咒（Resource Curse / 荷蘭病）」：過度依賴單一原物料出口的國家，往往因匯率升值擠壓製造業且滋生榨取型政治而錯失現代化。"}, "myNotes": "綠能與電網投資背後不只是環保，更是大國擺脫能源卡脖子的國家安全算盤！", "relatedIds": ["hist-s2-1", "hist-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "hist-s2-3", "categoryId": "cat-hist", "stageId": "s2", "subtopic": "國關理論", "title": "現實主義 vs 自由主義：國際關係兩大分析眼鏡", "oneLiner": "為什麼國家之間一下簽自由貿易協定當好朋友，一下又翻臉互相制裁？戴上現實主義（看權力安全）與自由主義（看經貿互賴）兩副眼鏡一秒看懂。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "國際社會沒有一個能抓大國去坐牢的「世界警察」，所以看國際新聞要常備兩副眼鏡：\n\n• **現實主義眼鏡（偏冷酷務實）**：「沒有永遠的朋友，只有永遠的利益！」國家第一目標永遠是「活下去與安全」，別人軍力變強就算沒打算打你，你也得先防著（安全困境），實力才是唯一靠山。\n• **自由主義眼鏡（偏合作共贏）**：透過 WTO、跨國貿易、供應鏈深度綁定與國際組織，讓「合作賺大錢」遠比「開戰雙輸」划算，就能維持長期和平繁榮！\n\n冷戰後 30 年世界偏自由主義；近年科技戰與地緣升溫，則是現實主義強勢回歸！", "lv2": "避免看國際新聞被情緒帶偏的實務心法：\n\n1. **聽外交辭令要看「背後行動與預算」**：口頭譴責與讚美常是外交禮儀，真正反映國家意圖的是國防預算、晶片禁令與貿易關稅。\n2. **兩副眼鏡並用**：經貿順風時用自由主義找全球商機，地緣緊繃時用現實主義評估供應鏈斷鏈與避險配置。", "lv3": "國際關係三大主流典範：現實主義（Hans Morgenthau / Kenneth Waltz 結構現實主義 / John Mearsheimer 進攻性現實主義，強調無政府狀態下的權力平衡）、自由制度主義（Robert Keohane / Joseph Nye 複合互賴與軟實力）與建構主義（Alexander Wendt，強調身分認同與規範建構國家利益）。"}, "myNotes": "和平時期看自由主義（做生意互利），衝突升溫看現實主義（看權力、安全與籌碼）！", "relatedIds": ["hist-s2-4", "hist-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "hist-s2-4", "categoryId": "cat-hist", "stageId": "s2", "subtopic": "大國週期", "title": "修昔底德陷阱與霸權更迭的歷史週期", "oneLiner": "當一個新興強權快速崛起、威脅到既有老大的地位時，雙方就算原本不想開戰，也極易因猜忌與誤判滑向劇烈摩擦。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "兩千多年前古希臘史學家修昔底德寫下一句千古名言：「雅典的崛起，以及這在斯巴達引發的恐懼，讓戰爭變得不可避免。」\n\n哈佛教授艾利森翻遍過去 500 年歷史，找出 16 次「老二快速追上老大」的局面（像 19 世紀末德國追上英國、20 世紀美國追上英國）：其中 **12 次爆發了戰爭，4 次和平渡過**（例如美英和平交接、美蘇冷戰沒有打成熱戰）！\n\n這告訴我們：大國摩擦是結構性的常態，但戰爭並非宿命——關鍵在於雙方有沒有建立「危機溝通熱線」與管控紅線的智慧。", "lv2": "看懂大國競爭週期對個人與企業的現實啟示：\n\n1. **別賭極端單邊結果**：在大國長期博弈期，科技標準、金融結算與供應鏈容易出現「平行體系」，企業與個人資產都需要具備「跨區域分散與彈性」。\n2. 同時借鏡達利歐《大債危機／原則：應對變化中的世界秩序》觀察大國興衰八指標：教育、創新、競爭力、貿易、產出、軍事、金融中心地位與儲備貨幣。", "lv3": "Graham Allison《注定一戰？》（Destined for War, 2017）系統整理修昔底德陷阱案例；Paul Kennedy《大國的興衰》則揭示「帝國過度擴張（Imperial Overstretch）」機制——當守成霸權的全球軍事承諾超越其國內經濟與財政承載力時，霸權週期便步入轉折。"}, "myNotes": "16 次裡有 4 次和平渡過——結構摩擦是常態，但危機管控與多元避險永遠是清醒選擇。", "relatedIds": ["hist-s2-3", "hist-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "hist-s3-1", "categoryId": "cat-hist", "stageId": "s3", "subtopic": "貨幣史", "title": "布列敦森林體系與美元霸權的形成與演變", "oneLiner": "二戰後全世界把貨幣錨定在美元、美元錨定在黃金；1971 年黃金脫鉤後，美元改靠「美軍安全、石油結算與全球最大美債市場」繼續穩坐世界貨幣王座。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "為什麼全世界的石油、黃金、晶片買賣都用「美元」計價？故事要從 1944 年二戰快結束說起：\n\n當時歐洲打成廢墟、美國握有全球三分之二黃金，各國在「布列敦森林」開會約定：**各國貨幣盯住美元，35 美元隨時能跟美國換 1 盎司黃金！**\n\n後來美國打越戰印太多鈔票，法國開軍艦跑去換黃金，1971 年尼克森總統乾脆宣布「美元不再換黃金了！」從那天起，全世界正式進入「純信用法幣時代」，美元改靠美國經濟實力、科技創新、美債流動性與石油結算繼續當全球硬通貨。", "lv2": "懂美元體系對投資與財經閱讀的實戰幫助：\n\n1. **看懂「美元潮汐」**：美國升息時全球美元回流美國，新興市場常面臨匯率貶值與資金外流壓力；美國降息時資金又流出尋找高報酬市場。\n2. **理解「法幣長期貶值」的歷史背景**：1971 年脫離金本位後，各國央行印鈔不再受黃金儲量硬限制，這也是為什麼長期現金會慢慢縮水、必須持有優質生產性資產。", "lv3": "特里芬兩難（Triffin Dilemma, 1960）精準預言了布列敦森林體系的內在矛盾：作為全球儲備貨幣，美國必須持續透過貿易逆差向世界輸出美元流動性，但長期逆差又必然侵蝕外界對美元兌換黃金的信心。後布列敦森林時代形成「美元循環（貿易逆差輸出美元 → 順差國買回美債回流美國資本市場）」。"}, "myNotes": "1971 年美元跟黃金脫鉤是現代金融史分水嶺——懂了這個就徹底明白為何不能長期只抱現金！", "relatedIds": ["econ-s4-2", "econ-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "hist-s3-2", "categoryId": "cat-hist", "stageId": "s3", "subtopic": "全球化", "title": "冷戰格局、全球化紅利與跨國供應鏈分工", "oneLiner": "1991 年冷戰結束到 2018 年的黃金三十年，全世界拆掉關稅高牆、把設計放歐美、晶片放台灣、組裝放中國，創造出史上最低廉的商品與極低通膨。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "打開你手上的智慧手機，裡面簡直是一場「聯合國大合唱」：美國設計系統與品牌、荷蘭造曝光機、日本提供精密材料、台灣代工最先進晶片、中國與東南亞組裝出貨！\n\n冷戰結束加上中國 2001 年加入 WTO，幾十億廉價勞動力湧入全球市場，帶來兩大紅利：\n1. 商品變得超級便宜，歐美享受了二十多年超低通膨與低利率。\n2. 跨國企業利潤飆升。\n\n但隱藏副作用是：歐美本土製造業外移導致藍領失業與貧富差距擴大，埋下了後來「反全球化與民粹興起」的火種。", "lv2": "看懂全球化分工與反噬的時代脈絡：\n\n1. **效率（Just-in-Time）的代價是脆弱**：為了壓到最低成本，零庫存單一來源供應鏈一遇到疫情或地緣摩擦就全線停擺。\n2. **個人職涯的全球化鏡像**：在網路與遠距時代，數位技能的競爭與機會都是全球性的，能善用雙語與 AI 工具的人就能吃到跨國紅利。", "lv3": "經濟學家 Dani Rodrik 提出「全球化政治三難（Political Trilemma of the World Economy）」：深度經濟全球化、國家主權與民主政治三者無法同時極大化。超級全球化雖大幅拉低全球國與國間的貧富差距（大象曲線），卻顯著擴大已開發國家內部的階級撕裂。"}, "myNotes": "超級全球化帶來 30 年便宜商品，但也埋下本土製造空洞與供應鏈脆弱的伏筆。", "relatedIds": ["hist-s4-1", "econ-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "hist-s3-3", "categoryId": "cat-hist", "stageId": "s3", "subtopic": "經濟史教訓", "title": "日本失落三十年與資產負債表衰退教訓", "oneLiner": "1990 年代日本房市與股市泡沫同時炸裂後，即使央行把利率砍到 0%，企業跟家庭忙著還債根本不敢借錢消費，陷入長達三十年的低迷。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "1989 年的日本有多狂？當時光是一個「東京皇居」的地價就號稱能買下整個美國加州，日經指數飆破 38,900 點，所有人借滿錢買房買股覺得永遠不會跌！\n\n結果日本央行急踩煞車連續升息，泡沫瞬間引爆：房子跌掉七成，但欠銀行的房貸一毛都沒少！接下來的事超級反直覺——就算銀行後來把利息降到 **0% 甚至負利率**，背滿債的公司跟家庭只想拼命存錢還債，沒人敢借錢擴張或花錢！這就叫做 **資產負債表衰退**，日本足足花了 34 年股市才重新站回當年高點！", "lv2": "給每個投資人與購屋者的三大血淚教訓：\n\n1. **千萬別在高點開極限槓桿買單一市場**：當年滿倉借錢買日股的人，等了 34 年才解套。\n2. **全球分散的重要性**：同一時期如果配置全球指數，美股與全球資產早已翻了好幾倍。\n3. **觀察經濟體是否步入資產負債表衰退的訊號**：房價長期下修 + 民間寧可提前還房貸也不願消費投資 + 降息刺激效果鈍化。", "lv3": "野村總研首席經濟學家辜朝明（Richard Koo）提出「資產負債表衰退（Balance Sheet Recession）」理論：當資產價格暴跌導致大量私部門陷入技術性資不抵債時，企業目標由「利潤極大化」轉為「負債極小化」，貨幣政策徹底失靈，唯有政府果斷承接成為「最後借款人」實施持續財政支出，方能防止經濟螺旋收縮。"}, "myNotes": "日股花了 34 年才重回 1989 高點——這就是為什麼資產配置絕不能重壓單一國家！", "relatedIds": ["fin-s3-3", "econ-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "hist-s3-4", "categoryId": "cat-hist", "stageId": "s3", "subtopic": "產業奇蹟", "title": "東亞四小龍與台灣半導體產業的崛起路徑", "oneLiner": "1987 年張忠謀顛覆全球「晶片公司都要自己蓋工廠」的舊假設，開創「純晶圓代工」商業模式，把台灣推上全球科技核心樞紐。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "以前全世界做晶片的巨頭（像 Intel）都是「自己設計晶片 + 自己蓋工廠製造（一條龍）」，誰都覺得這天經地義。但蓋一座晶圓廠貴到嚇人，導致一堆超有創意的小設計公司根本沒錢入行！\n\n1987 年張忠謀創辦台積電，用第一性原理打破規則：**「我們絕不自己設計產品跟客戶競爭，只專心幫全世界所有客戶把晶片做到最精準、最便宜！」**\n\n這個「純晶圓代工（Foundry）」模式引爆了輝達（NVIDIA）、高通、超微等無廠設計巨頭崛起，也讓台灣憑藉頂尖工程師紀律、產業群聚與工研院早期技術移轉，築起了難以撼動的護城河！", "lv2": "台灣與東亞經濟奇蹟背後的四個關鍵成功要素：\n\n1. **出口導向 + 技術升級**：從代工成衣玩具 → 筆電主機板 → 搶佔全球最尖端半導體製造。\n2. **商業模式創新（不與客戶競爭）**：靠「極致信任 + 專業分工」贏得全行業訂單，匯聚出對手無法匹敵的資本支出與良率學習曲線。\n3. **隱憂與未來課題**：產業高度集中於單一硬體製造（荷蘭病風險）、電力水資源瓶頸與人口少子化挑戰。", "lv3": "東亞發展型國家模式（Developmental State, Chalmers Johnson）結合高儲蓄率、重視理工基礎教育、務實產業政策（如 1970s RCA 技術移轉與新竹科學園區聚落效應）與垂直專業分工（Fabless + Foundry + OSAT），重塑了全球半導體微笑曲線，將先進製程製造推升為整條價值鏈毛利最高的關鍵瓶頸。"}, "myNotes": "台積電的成功不只是工程強，更是「絕不與客戶競爭」的頂級商業模式創新！", "relatedIds": ["biz-s1-4", "hist-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "hist-s4-1", "categoryId": "cat-hist", "stageId": "s4", "subtopic": "供應鏈重組", "title": "逆全球化、友岸外包與科技冷戰下的供應鏈重組", "oneLiner": "過去三十年企業選廠只問「哪裡最便宜（Just-in-Time）」；未來二十年企業必須多問一句「打仗或斷鏈時安不安全（Just-in-Case）」。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "想像你以前只跟巷口最便宜的那一家菜攤買菜，結果有一天那條巷子淹大水封路，你家立刻斷糧！\n\n經歷貿易戰、疫情斷鏈跟地緣衝突後，全球大企業全都醒了，開始從「極致省錢」轉向「安全備援」：\n• **China+1（分散佈局）**：不再把所有雞蛋放單一國家，往墨西哥、印度、越南、東南亞與美歐本土多蓋備用工廠。\n• **友岸外包（Friend-shoring）**：把晶片、電池、醫藥等關鍵供應鏈移回政治盟友國家。\n\n代價是什麼？多蓋備用廠成本變高，這也是為什麼未來十年的平均通膨可能比過去二十年略高！", "lv2": "看懂供應鏈重組帶來的趨勢與機會：\n\n1. **受惠區域與產業**：墨西哥（近岸北美）、印度／東南亞基礎建設、自動化機器人（補足高薪地區缺工）、資安與能源設備。\n2. **投資與職涯視角**：留意單一市場營收佔比過高的風險，具備「多區域彈性與跨國合規能力」的企業將享有更高估值溢價。", "lv3": "從新自由主義「比較利益極大化」轉向「經濟安全化（Securitization of Trade）」，美國採「小院高牆（Small Yard, High Fence）」精準出口管制策略鎖定先進半導體、AI 算力與量子運算，推動全球貿易由單一中心化網絡演變為多極區域化區塊（Regionalization）。"}, "myNotes": "從 Just-in-Time（最低成本）轉向 Just-in-Case（安全韌性），這是未來十年最重要的總經底色！", "relatedIds": ["hist-s3-2", "hist-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "hist-s4-2", "categoryId": "cat-hist", "stageId": "s4", "subtopic": "慢變數明牌", "title": "全球人口老化、少子化與長期通膨／財政壓力", "oneLiner": "明天股市漲跌沒人知道，但「20 年後有幾個人滿 65 歲」今天就能精準算出來——人口結構是未來三十年最確定、最難逆轉的超級明牌。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "預測未來超難，但只有一件事幾乎 100% 準確：**人口結構**！因為 20 年後要進職場或退休的人，今天早就已經出生了！\n\n東亞（台灣、日、韓、中）與歐洲正同時面對「出生率跌破歷史新低 + 壽命越來越長」：\n1. **年輕勞動力變少** → 餐飲、照護、水電維修等缺工成為常態，服務業薪資與物價長期難跌。\n2. **退休人口暴增** → 健保與政府退休金壓力越來越大，個人提早建立「自備退休投資組合」變得絕對必要！\n3. **銀髮與自動化大爆發** → 醫療長照、健康長壽與 AI／機器人替補人力成為最確定的長期需求。", "lv2": "把人口明牌直接轉化成個人策略：\n\n1. **退休金靠自己**：把政府勞保退休金當「加菜金」，核心養老金靠長期全球指數投資自建。\n2. **房市看人口流向**：少子化下房地產不再「隨便買都漲」，高度兩極化向「有工作機會與醫療機能的核心都會區」集中。\n3. **職涯靠攏高齡需求或 AI 自動化槓桿**，避開高度依賴年輕學生基數的萎縮行業。", "lv3": "總和生育率（TFR）低於世代更替水準 2.1 將觸發人口負成長與扶養比（Dependency Ratio）急劇惡化。經濟學家 Charles Goodhart《人口大逆轉》（The Great Demographic Reversal）論證：過去三十年廉價勞動力紅利終結，將推動全球結構性實質利率與服務業通膨中樞上移，唯有 AI 與自動化大幅提升全要素生產力（TFP）方能對沖。"}, "myNotes": "人口結構是唯一能提前 20 年看穿的明牌——自備退休金、關注健康長壽與 AI 自動化！", "relatedIds": ["fin-s1-2", "hist-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "hist-s4-3", "categoryId": "cat-hist", "stageId": "s4", "subtopic": "科技地緣", "title": "AI 算力地緣政治與能源基礎設施新競賽", "oneLiner": "20 世紀的大國命脈是石油與核武，21 世紀的新命脈是「先進晶片算力 × 穩定龐大電力 × 高品質數據」三位一體。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "你每次問 AI 一個問題，背後都不是魔法，而是超大機房裡幾萬顆昂貴晶片在全速發燙運轉！\n\n現在全球大國搶 AI 領先地位，其實正在打一場三層競賽：\n1. **頂尖晶片與設備**：誰能造出 2 奈米晶片與極紫外光（EUV）曝光機？\n2. **吃電怪獸與電網**：一座大型 AI 資料中心耗電量堪比一整座中型城市！科技巨頭甚至開始簽約重啟核電廠跟蓋專屬再生能源電網。\n3. **主權 AI（Sovereign AI）**：各國開始擔心若全部依賴外國 AI，本國語言文化、機密資料與產業競爭力都會受制於人。", "lv2": "從 AI 地緣競賽看懂產業鏈投資與趨勢：\n\n1. **「算力的盡頭是電力」**：除了關注模型本身，散熱液冷、變壓器電網升級、核能／綠能儲能成為高度確定的基建瓶頸。\n2. **開源模型 vs 閉源模型之爭**：開源模型讓中小企業與各國能低成本本地部署，打破少數巨頭完全壟斷，也讓個人開發者擁有前所未有的槓桿。", "lv3": "AI 基礎設施呈現極高資本密集度與「規模定律（Scaling Laws）」門檻，形成由荷蘭光刻設備（ASML）、台灣先進製程製造（TSMC）、美國晶片設計與雲端超大規模營運商（Hyperscalers）交織而成的高度互賴且極度敏感的戰略三角。"}, "myNotes": "AI 競賽不只是寫軟體，往下挖兩層就是「先進晶片 + 電力電網 + 散熱基建」的硬實力戰！", "relatedIds": ["hist-s3-4", "hist-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "hist-s4-4", "categoryId": "cat-hist", "stageId": "s4", "subtopic": "史學方法", "title": "歷史類比的正確用法：借鏡規律而非機械照抄", "oneLiner": "馬克吐溫說「歷史不會重演，但常常押韻」——借歷史看清人性與結構規律超有用，但直接拿 1929 年圖表硬套明天就太天真了。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "新聞財經名嘴超愛拿一張「1929 年大蕭條走勢圖」疊在今年的股市圖上喊：「你看長得一模一樣，下個月要崩盤啦！」\n\n小心！歷史就像押韻的詩，**韻腳（人性的貪婪恐懼、泡沫五幕劇、大國猜忌）會重複，但歌詞（時代背景、科技、央行工具）每次都不一樣**！當年沒有聯準會快速救市工具，今天也沒有當年的金本位死結。\n\n正確讀歷史的方式是拿它當「劇本資料庫」，幫你拉大想像力、提前思考「萬一出現類似壓力，現在有哪些變數跟當年不同？」。", "lv2": "正確使用歷史類比的四步檢核法（Neustadt & May《時間中的思考》）：\n\n1. 先列出「現在跟歷史案例 **相似** 的 3 個結構點」。\n2. 再強制列出「現在跟歷史案例 **完全不同** 的 3 個關鍵點」（這步最能防盲目照抄！）。\n3. 避免「只挑一個剛好符合你立場的歷史例子」（櫻桃採摘偏誤），至少找 2–3 個不同結局的案例對照。", "lv3": "哈佛甘迺迪學院 Ernest May 與 Richard Neustadt《Thinking in Time》提出「相似／相異清單法（Likenesses & Differences）」作為高階決策者運用歷史類比的標準作業程序，警示決策者避開因「近期鮮明歷史記憶（如二戰慕尼黑綏靖類比）」導致的認知窄化。"}, "myNotes": "套任何歷史案例前，一定要同時列出「3 個相似處」與「3 個時代完全不同處」！", "relatedIds": ["cross-s1-4", "fin-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "soc-s1-1", "categoryId": "cat-soc", "stageId": "s1", "subtopic": "結構視角", "title": "社會學的想像力：把個人焦慮放回時代結構中解讀", "oneLiner": "如果全城只有一個人失業，那是個人問題；如果一百萬人同時失業，那就是時代結構問題——看清這一點，你會少掉一半無謂的自我責怪。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "年輕人買不起房、常加班焦慮，很多人第一反應是拼命責怪自己：「是不是我不夠努力、太廢了？」\n\n社會學大師米爾斯教你開啟 **社會學的想像力**：把鏡頭拉遠，同時看見「個人傳記（你的選擇）」跟「大歷史結構（房價所得比、產業外移、少子化、演算法時代）」的交會點！\n\n這不是叫你躺平怪社會，而是幫你**客觀卸下不必要的羞恥感**，看清楚大環境的風往哪裡吹，然後更冷靜地調整自己的站位與策略！", "lv2": "運用社會學想像力解讀個人困境的兩步法：\n\n1. **拆解雙歸因**：把一個焦慮（例如「薪水停滯」）拆成「大環境結構因素（本產業毛利萎縮）」與「個人可控因素（跨界技能與換賽道）」。\n2. **不陷入兩種極端**：不把結構問題全怪到自己頭上（過度自責內耗），也不把一切全推給社會而放棄個人行動（習得性無助）。", "lv3": "C. Wright Mills《社會學的想像》（1959）核心命題為連結「個人環境中的私人困擾（Personal Troubles）」與「社會結構中的公共議題（Public Issues）」，揭示個體命運始終鑲嵌於歷史時期與制度安排之交錯座標中。"}, "myNotes": "看清個人困境背後的時代結構，不是為了躺平，而是為了不再盲目自責、精準換站位！", "relatedIds": ["phil-s3-1", "soc-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "soc-s1-2", "categoryId": "cat-soc", "stageId": "s1", "subtopic": "社會互動", "title": "社會規範、角色扮演與前台／後台理論（高夫曼）", "oneLiner": "人生如戲不是貶義詞：你在客戶面前專業體面（前台），回家癱在沙發上做自己（後台），懂這套切換機制就不會把別人的公關面具當真。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "去高級餐廳看服務生：走出廚房推開門那一秒，立刻掛上燦爛微笑輕聲細語（**前台**）；一轉身回到廚房門後，馬上鬆口氣吐槽「3 號桌客人超難搞！」（**後台**）！\n\n社會學家高夫曼說，其實我們每個人每天都在演戲——社群媒體（IG / LinkedIn）更是超級精修過的「前台舞台」！\n\n懂這個理論後你有兩大收穫：\n1. **不再拿「別人的精修前台」跟「自己的凌亂後台」比**，社群焦慮瞬間減半！\n2. 職場上懂得專業切換角色，同時保留專屬的「後台充電空間」讓自己卸妝喘口氣。", "lv2": "高夫曼戲劇論在職場與生活的實務應用：\n\n1. **善用印象管理（Impression Management）**：重要簡報與面試時，服裝、準時度、簡報排版與開場語氣都是舞台道具，幫你快速建立專業信任。\n2. **留給彼此台階下（保全面子）**：公開場合盡量不當眾戳破別人的前台演出，私下後台再委婉溝通最有效。\n3. 每天保留不演戲的「純後台獨處時間」，避免情緒勞動過載。", "lv3": "Erving Goffman《日常生活中的自我呈現》（1959）提出擬劇論（Dramaturgy），將社會互動解析為前台（Front Stage）、後台（Back Stage）、劇班協作（Team Performance）與面子工夫（Face-work）；Arlie Hochschild 進一步延伸出「情緒勞動（Emotional Labor）」概念，解釋高互動服務與職場角色的深層耗竭來源。"}, "myNotes": "永遠別拿「別人的精修社群前台」跟「自己疲憊的私下後台」比較！", "relatedIds": ["soc-s4-2", "speak-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "soc-s1-3", "categoryId": "cat-soc", "stageId": "s1", "subtopic": "資本與階層", "title": "社會資本、文化資本與階層複製機制（布迪厄）", "oneLiner": "決定一個人人生機會的不是只有銀行存款（經濟資本），還包括你認識誰（社會資本）與你的眼界談吐品味（文化資本）。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "法國社會學大師布迪厄指出，社會上其實流通著 **三種看不見卻能互相兌換的貨幣**：\n\n1. **經濟資本**：現金、房產、股票（最直白）。\n2. **社會資本**：你的人脈網、信任背書、遇到難題打一通電話能幫你牽線的貴人。\n3. **文化資本**：你的閱讀廣度、說話邏輯、美感品味、外語能力、名校文憑與懂不懂某個圈子的潛規則。\n\n最關鍵的是這三種資本可以互相轉換：沒有富爸爸的普通人，透過**系統化自學（累積文化資本）＋ 分享專業作品結交同好（累積社會資本）**，就能一步步把知識轉化成真正的經濟資本！", "lv2": "普通人靠「資本轉換」實現向上躍遷的三個槓桿：\n\n1. **投資高複利文化資本**：跨領域閱讀、表達力、審美與數位 AI 工具——這是最公平、任何人都搶不走的起跳板。\n2. **用文化資本換社會資本**：透過高品質作品、深度整理與樂於助人，自然吸引比你高一階的優質人脈。\n3. 覺察並突破「慣習（Habitus）」：刻意接觸不同圈層的好書與活動，打破原生環境給你的想像力天花板。", "lv3": "Pierre Bourdieu《區辨》（Distinction, 1979）將文化資本細分為身體化（氣質談吐與慣習 Habitus）、客觀化（藏書作品）與制度化（學歷證照）三型態，闡明精英階層如何透過看似中立的教育與品味標準完成跨世代「社會再製（Social Reproduction）」。"}, "myNotes": "建立這座跨領域知識庫，就是在系統化累積最高槓桿的「文化資本」！", "relatedIds": ["soc-s2-1", "mkt-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "soc-s1-4", "categoryId": "cat-soc", "stageId": "s1", "subtopic": "標籤效應", "title": "標籤理論與自我實現預言：社會期待如何塑造人", "oneLiner": "老師只要被告知「這幾個普通學生是測出來的資優生」，一年後他們成績竟然真的狂飆——別人貼的標籤會默默改寫你的命運。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "心理與社會學界有個震撼實驗（**比馬龍效應**）：研究員隨便從名單裡抽了 20% 普通小學生，騙老師說「他們是剛測出來潛力爆發的天才」！一年後重測智商，這群隨機抽出的小孩進步幅度竟然遠超全校！\n\n為什麼？因為老師相信他們是天才，不自覺給了更多耐心、鼓勵與眼神肯定，小孩也開始相信自己很行！\n\n反過來就是可怕的 **標籤效應**：如果一個人一直被貼上「笨手笨腳」「內向不擅長溝通」的負面標籤，周遭的眼神跟自己的內心就會推著他越活越像那個標籤！", "lv2": "掌握標籤力量的雙向實務用法：\n\n1. **拒絕吞下別人的負面標籤**：聽到「你太年輕／文組不懂技術／女生不適合投資」時，在心裡立刻把這張標籤撕掉，不讓它變成自我設限。\n2. **主動替自己貼「正向身分標籤」**：與其說「我在試著學寫作」，改成「我是一位持續輸出的知識整理者」——行為會自動向身分認同靠攏。\n3. **帶人與教小孩善用比馬龍效應**：先給予具體信任與高期待，人們常常會長成你相信的樣子。", "lv3": "融合 Howard Becker 標籤理論（Labeling Theory，區分初級偏常與被貼標內化後的次級偏常）、Robert Merton「自我實現預言（Self-Fulfilling Prophecy）」與 Rosenthal & Jacobson（1968）課堂比馬龍效應（Pygmalion Effect）實證。"}, "myNotes": "撕掉別人亂貼的負面標籤，主動幫自己和身邊夥伴貼上具體的正向成長標籤！", "relatedIds": ["psy-s3-4", "meta-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "soc-s2-1", "categoryId": "cat-soc", "stageId": "s2", "subtopic": "人脈網絡", "title": "弱連結的優勢：為何關鍵機會常來自泛泛之交", "oneLiner": "每天一起吃飯的死黨知道的情報幾乎跟你一模一樣；真正能幫你介紹神級工作或跨界機會的，往往是半年才聊一次的「弱連結」。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "社會學家格蘭諾維特調查了數百位找到高薪好工作的專業人士，原本以為都是靠「超麻吉的好朋友或家人（強連結）」介紹的，結果數據驚呆所有人——**超過 80% 的關鍵工作機會，竟然都是靠「不常聯絡的點頭之交（弱連結）」牽線的！**\n\n原因超簡單：跟你天天混在一起的死黨，圈子高度重疊，他聽說的消息你也早就聽說了；反而是「不同行業、偶爾聯絡的前同事、讀書會同學、網友」，他們連著完全不同的資訊世界，能幫你帶來全新破口！", "lv2": "低耗能經營高品質「弱連結」的三個輕鬆動作：\n\n1. **定期公開分享你的近況與作品**：在社群或個人網站偶爾發一下你最近在研究什麼，讓 200 個弱連結知道「找這個領域可以想到你」。\n2. **無功利的小關心**：看到一篇剛好適合某位前同事的文章，順手轉貼附一句「看到這篇想到你之前提過的事，分享給你！」。\n3. **深淺搭配**：3–5 位強連結給你情緒支撐，50–100 位多元領域弱連結幫你打開世界資訊窗口。", "lv3": "Mark Granovetter（1973《弱連結的力量》，社會學被引用最高經典之一）及 2022 年 LinkedIn 兩千萬用戶大型實證研究（Rajkumar et al., Science）皆證實：適度弱連結（Moderately Weak Ties）因具備高「橋接性（Bridging）」與非冗餘資訊流，在職涯流動與創新擴散中發揮遠勝強連結的關鍵作用。"}, "myNotes": "強連結給溫暖支持，弱連結給跨圈層新機會——順手分享好文章就是最低成本的弱連結保養！", "relatedIds": ["soc-s2-2", "soc-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "soc-s2-2", "categoryId": "cat-soc", "stageId": "s2", "subtopic": "跨界紅利", "title": "結構洞（Structural Holes）與跨界橋樑紅利", "oneLiner": "兩個各自很專業、卻彼此聽不懂對方語言的圈子中間有一道裂縫（結構洞）；站在裂縫中間當「翻譯橋樑」的人，擁有最高不可替代性。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "公司裡工程師講的滿口程式術語，業務跟老闆聽得霧煞煞；老闆講的商業痛點，工程師又覺得天馬行空。這兩個圈子中間那道沒有連通的斷層，社會學叫做 **結構洞（Structural Hole）**！\n\n如果團隊裡有一個人「既懂技術邏輯、又懂商業語言與人話表達」，站在中間幫兩邊翻譯對齊——他不用是全公司寫程式最強或跑業務最強的人，卻瞬間成為全公司最搶手、最升官發財的關鍵樞紐！", "lv2": "主動卡位「結構洞」賺取跨界紅利的三步驟：\n\n1. **找到你所在的兩塊孤島**：例如「傳統領域 × AI 自動化」「硬核專業 × 高中生白話教學」「數據分析 × 視覺美感」。\n2. **當資訊套利者與轉譯者**：把 A 領域已經超成熟的解法，搬到還沒聽過的 B 領域落地（跨界降維打擊！）。\n3. 避免「只待在純同溫層小圈子」，刻意在兩個不同社群之間當橋樑。", "lv3": "芝加哥大學社會學家 Ronald Burt《結構洞》（1992）運用社會網絡分析證明：佔據結構洞的橋接者（Broker）同時享有「資訊優勢（更早取得非重複情報）」與「控制優勢（在多方需求間促成整合創新）」，其薪資成長、升遷速度與提出獲獎創意之機率皆顯著高於深陷密閉網格者。"}, "myNotes": "你正在做的「把 21 個專業領域翻譯成高中生都能懂的白話」，正是最稀缺的結構洞橋樑位置！", "relatedIds": ["soc-s2-1", "cross-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "soc-s2-3", "categoryId": "cat-soc", "stageId": "s2", "subtopic": "信任規模", "title": "鄧巴數、信任半徑與熟人／陌生人社會差異", "oneLiner": "人腦演化出來最多只能穩定記得並維繫約 150 位熟人（鄧巴數）；超過這個人數，就必須靠「制度、品牌與契約」取代人情信任。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "不管你臉書或 LINE 好友名單加了 3,000 人，人類學家鄧巴發現，人腦容量決定了我們這輩子同時能穩定維持真實社交關係的上限大約就是 **150 人（鄧巴數）**，其中最親密的核心圈大約只有 **5 人**、好朋友約 **15 人**！\n\n這解釋了為什麼很多新創公司 30 人時超像一家人、完全不用寫規章；一旦擴張超過 150 人突然開始混亂、內耗、彼此叫不出名字——因為超過鄧巴數，靠「刷臉講人情（熟人社會）」已經撐不住了，必須轉成「靠透明制度與白紙黑字（陌生人契約社會）」！", "lv2": "把鄧巴數用在人際精簡與組織管理：\n\n1. **把 80% 情感能量留給內圈 5–15 人**：不必為了社群上幾百個點頭之交的眼光焦慮到睡不著。\n2. **組織拆小隊**：像 Gore-Tex 公司刻意規定每間工廠人數絕不超過 150 人，滿了就蓋新廠，保持高度信任與靈活。\n3. 區分「熟人談交情」與「公事簽清楚合約」，先小人後君子反而最保交情。", "lv3": "牛津人類學家 Robin Dunbar（1992）由靈長類大腦新皮層體積與群體規模迴歸推導出人類社交上限 ~150（並呈現 5 / 15 / 50 / 150 的 3 倍同心圓分層）。法蘭西斯・福山《信任》則進一步區分「低信任家族本位社會」與「高信任陌生人契約社會」，指出信任半徑大小直接決定大型現代企業的形成成本。"}, "myNotes": "核心真朋友約 5–15 人，穩定社交上限約 150 人——把真心留給內圈，公事靠清楚規則！", "relatedIds": ["hist-s1-1", "soc-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "soc-s2-4", "categoryId": "cat-soc", "stageId": "s2", "subtopic": "集體行動", "title": "集體行動困境與搭便車效應（Free Rider Problem）", "oneLiner": "為什麼「每個人出 100 元就能讓大家各賺 1,000 元」的好事最後卻常流產？因為每個人都偷偷想著「等別人出錢，我免費搭便車就好」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "大學分組報告最經典的惡夢：4 個人一組同拿一個分數，不管小張有沒有做事，只要另外 3 個人熬夜做完，小張照樣拿 90 分——這就叫 **搭便車效應（Free Rider）**！\n\n更反直覺的是：**團體人數越多，搭便車越嚴重**（10 個人一起拔河，每個人平均出的力氣遠小於 2 個人拔河，心理學叫「社會懈怠」）。這也是為什麼大社區管委會永遠沒人想當主委，但少數利益高度集中的小團體卻超團結！", "lv2": "破解分組擺爛與社群冷清的三個實用機制：\n\n1. **把貢獻「個人化且公開可見」**：每項工作明確標出單一負責人與進度條（消除藏身人群的空間）。\n2. **縮小群組規模**：核心專案小組控制在 3–7 人（亞馬遜「兩個披薩團隊原則」），人人覺得自己不可或缺。\n3. **提供「選擇性專屬誘因」**：只給實際出錢出力的人額外好處或榮譽徽章（例如開源貢獻者榜單、會員限定回饋）。", "lv3": "經濟學家 Mancur Olson《集體行動的邏輯》（1965）顛覆了「有共同利益就會自然團結」的傳統假設，證明理性個體在大型群體中傾向搭便車；唯有透過「小團體內部監督」或「選擇性激勵（Selective Incentives，額外私益獎勵或強制規範）」方能克服集體行動困境。"}, "myNotes": "破解搭便車三招：縮小團隊規模（3–7 人）+ 公開個人負責進度 + 給貢獻者專屬回饋！", "relatedIds": ["econ-s3-2", "biz-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "soc-s3-1", "categoryId": "cat-soc", "stageId": "s3", "subtopic": "組織結構", "title": "科層制（Bureaucracy）的效率紅利與僵化病症", "oneLiner": "大公司跟政府滿天飛的表格與簽核流程，原本是為了「公平、可複製、不靠個人情緒辦事」發明的，但久了卻容易變成只顧蓋章不顧結果的僵化巨獸。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "去大銀行或公家機關辦事要填五張表、蓋三個章，大家常氣得罵「官僚僵化」！\n\n其實社會學大師馬克斯・韋伯當年超級讚美 **科層制（官僚制度）**：在它發明之前，辦事全看主管今天心情好不好、你跟他是不是親戚！科層制用「清楚分工、白紙黑字 SOP、對事不對人、照專業升遷」讓十萬人的超大組織第一次能穩定運轉。\n\n問題出在「目標置換」：時間一久，大家忘了規則原本是為了服務客戶，變成**「只要我照流程蓋完章不出錯，客戶死活不關我的事」**！", "lv2": "在大型科層組織中生存與推動變革的技巧：\n\n1. **尊重流程底線，別硬撞牆**：先了解「這關簽核的人到底怕背什麼鍋？」幫他把風險文件補齊，過關速度立刻快三倍。\n2. **替自己建立「定期刪規則日」**：每當一個組織新增一條規定，問問有沒有兩條過時規定可以廢掉。\n3. 創新專案要設「特區小隊」，暫時豁免繁瑣大流程先跑通驗證。", "lv3": "Max Weber 提出理想型科層制（Rational-Legal Bureaucracy）六大特徵：專業分工、層級節制、成文法規、非人格化、檔案書面化與專業任用。Robert Merton 後指出「目標置換（Goal Displacement）」與「訓練出來的無能（Trained Incapacity）」為其內生病理。"}, "myNotes": "大組織卡關時別只罵官僚，先問「這關簽核的人最怕扛什麼責？」幫他消掉風險立刻放行！", "relatedIds": ["soc-s3-2", "soc-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "soc-s3-2", "categoryId": "cat-soc", "stageId": "s3", "subtopic": "權力地圖", "title": "正式權力 vs 非正式權力：組織圖外的影響力中心", "oneLiner": "掛在牆上的組織架構圖只畫了一半的真相；真正在推動事情的，往往還包括「掌握關鍵情報、懂核心系統、大家私下都信服」的非正式影響力中心。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "剛進一間公司看「組織架構圖」，以為聽職稱最大的主管就搞定一切。過三個月才驚覺：\n• 某位資深工程師雖然沒掛主管職，但全公司只有他改得動核心資料庫，連副總都要客氣請教他（**專家權**）。\n• 某位處長秘書職等不高，但掌握老闆行程與所有跨部門最新風向（**資訊樞紐權**）。\n• 某位前輩熱心公道，只要他點頭支持，大家就願意跟著上（**魅力與信任權**）。\n\n看懂這張「看不見的非正式權力圖」，你推案子才不會到處撞鐵板！", "lv2": "進新環境或推跨部門專案的實務策略：\n\n1. **畫一張「利害關係人與非正式影響力地圖」**：除了找正式主管簽核，開大會前先私下跟 2 位有影響力的資深夥伴請教預熱（Pre-wire），會議通過率暴增。\n2. **不靠頭銜也能累積個人權力**：讓自己成為「解決某類關鍵難題的專家」或「連接不同部門的資訊樞紐」，就算沒職稱大家一樣尊重你的意見。", "lv3": "社會心理學家 French & Raven 提出權力五大基礎：法定權、獎賞權、強制權（以上屬職位賦予的正式權力）以及專家權（Expert Power）與參照權（Referent Power，個人魅力信任），後補入資訊權（Informational Power）。組織網絡分析（ONA）證實非正式中心節點對組織變革成敗具決定性影響。"}, "myNotes": "推大事前先做「會前預熱（Pre-wire）」：找非正式影響力關鍵人先聊一遍，開會瞬間變順風局！", "relatedIds": ["soc-s3-1", "soc-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "soc-s3-3", "categoryId": "cat-soc", "stageId": "s3", "subtopic": "組織病症", "title": "彼得原理與帕金森定律：組織膨脹與平庸化規律", "oneLiner": "超級業務被升去當不擅長管人的主管（彼得原理），加上「給一週就一定會拖滿一週做完（帕金森定律）」，這兩條定律解釋了為何大公司常變鈍。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "兩條超幽默卻準到讓人背脊發涼的職場鐵律：\n\n1. **彼得原理**：一個寫程式超強的工程師表現滿分，公司獎勵他的方式竟然是「升他當管理 20 人的主管」——但他根本不喜歡管人也不懂帶團隊，表現立刻變普通，從此卡在這個位置動彈不得！結果組織裡越來越多位子都被「升到剛好不勝任」的人佔滿！\n2. **帕金森定律**：「工作會自動膨脹，直到填滿所有可用的時間。」本來兩小時就能寫完的報告，如果期限給兩週，你就會東摸西改、多開三場無意義會議，剛好拖到兩週最後一小時才交出來！", "lv2": "破解這兩大職場魔咒的實戰對策：\n\n1. **破彼得原理（雙軌職涯思維）**：好公司設「專業技術軌（IC）」與「管理軌」平行升遷；對個人而言，升職前先問自己「我真的喜歡並擅長下一個位子要做的事嗎？」\n2. **破帕金森定律（人為縮短截止日）**：給自己設定比真實截止日更緊湊的時間盒（Time-boxing），把兩小時就能做完的事鎖在 90 分鐘內完成，效率瞬間起飛！", "lv3": "Laurence J. Peter（1969）提出彼得原理（2018 年明尼蘇達大學對 214 家企業 5.3 萬名銷售人員實證研究證實：頂尖個人業務員被拔擢為經理後，其團隊績效平均反降 7.5%）。Cyril Northcote Parkinson（1955）則揭示官僚機構因「下屬倍增法則」與「互相製造工作」導致行政人員與預算無視實際產出而持續膨脹。"}, "myNotes": "破帕金森定律最爽的方法：主動給自己壓縮時間盒（Time-box），不讓小事偷走一整天！", "relatedIds": ["soc-s3-1", "psy-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "soc-s3-4", "categoryId": "cat-soc", "stageId": "s3", "subtopic": "職場政治", "title": "辦公室政治的理性解讀：利益對齊與功勞保護", "oneLiner": "「政治」不是勾心鬥角，而是「在資源有限的團體裡，如何協商利益、爭取支持並讓自己的努力被正確看見」。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "很多認真工作的老實人一聽到「職場政治」就厭惡地說「我才不搞這套，我只要默默把事做好就好！」\n\n但殘酷的現實是：**只要有兩個以上的人一起分有限的升遷名額跟預算，「政治」就自動存在**！如果不懂怎麼讓老闆跟跨部門知道你解決了什麼大難題，你的功勞就很容易被只會做漂亮投影片的人端走。\n\n健康的職場政治不是害人，而是三件光明正大的事：**看清各方核心目標、用對方聽得懂的語言呈現成果、建立互相成就的盟友網**！", "lv2": "正派玩好職場互動的四個日常動作：\n\n1. **讓好成果「自然可見」**：定期用簡短週報或階段成果簡報分享「我們解決了什麼問題、省下多少時間／賺了多少價值」，不炫耀但讓關鍵人看得見。\n2. **幫老闆解決他最頭痛的事**：弄清楚你直屬主管今年最在意哪兩項指標，把你的專案連結到他的目標上。\n3. **公開場合大方分享功勞給隊友**：你幫別人加分，別人下次就會替你說話。\n4. 避開拉幫結派講八卦，對所有派系保持專業友善中立。", "lv3": "史丹佛商學院教授 Jeffrey Pfeffer《權力》（Power）指出，純粹的績效主義（Meritocracy）在大型組織中往往只是神話；「組織政治技能（Political Skill，含社會敏銳度、人際影響力、網絡建構能力與真誠展現）」與客觀專業能力結合，方能確保個人貢獻獲得公平資源回報。"}, "myNotes": "默默埋頭苦幹不夠，用「我們解決了什麼問題、省下多少成本」定期讓成果可見，才不會被搶功！", "relatedIds": ["strat-s4-1", "soc-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "soc-s4-1", "categoryId": "cat-soc", "stageId": "s4", "subtopic": "輿論機制", "title": "沉默螺旋、回音室與演算法驅動的群體極化", "oneLiner": "滑手機覺得「全世界都跟我一樣討厭某件事」？其實只是演算法把憤怒的聲音放大十倍，而理性中間派全都懶得吵架選擇沉默了（沉默螺旋）。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "打開網路新聞或社群留言區，常常覺得這社會瘋了、大家都在互相仇恨對罵！但走到現實街上跟鄰居同事聊天，大家其實都很溫和理性——為什麼差這麼多？\n\n三個機制聯手製造了這個幻覺：\n1. **演算法愛極端**：平和客觀的文章沒人吵架、停留時間短；讓人氣炸的極端標題留言破千，演算法就瘋狂推給你！\n2. **回音室**：你按過幾個讚後，系統只推跟你同立場的內容，讓你誤以為全天下都同意你。\n3. **沉默螺旋**：中立溫和的人怕講一句公道話被兩邊出征，乾脆閉嘴不留言，於是網路上看起來只剩極端聲音！", "lv2": "在演算法時代保持大腦清醒的四個防護習慣：\n\n1. **永遠記得「網路留言區 ≠ 真實社會比例」**：1% 最激動的鍵盤俠往往製造了 80% 的噪音。\n2. 主動追蹤 2–3 位跟你立場不同、但論述理性有深度的優質創作者，刻意戳破回音室。\n3. 戒掉在憤怒貼文底下看留言吵架的習慣（你的憤怒正是平台最賺錢的免費流量）。", "lv3": "德國傳播學者 Elisabeth Noelle-Neumann（1974）提出沉默螺旋理論（Spiral of Silence）：個體出於害怕社會孤立，察覺自身意見似屬少數時傾向沉默，進一步強化優勢意見的表象壓倒性。結合 Cass Sunstein「群體極化（Group Polarization）」與社群平台的互動極大化目標函數，構成當代數位公共領域撕裂的結構根源。"}, "myNotes": "網路上 1% 最激動的人製造了 80% 噪音——別讓留言區綁架你對真實世界的判斷！", "relatedIds": ["strat-s4-2", "algo-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "soc-s4-2", "categoryId": "cat-soc", "stageId": "s4", "subtopic": "消費文化", "title": "消費社會與符號價值：我們買的其實是身分認同", "oneLiner": "一個 500 元帆布包跟一個 10 萬元精品包都能裝手機錢包，多出來的 99,500 元買的不是布料，而是別人一眼認出的「身分符號」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "你買一杯 180 元名牌咖啡坐進網美店、買最新款限量球鞋，真的只是為了解渴跟保護腳底嗎？\n\n法國社會學家布希亞一針見血說：現代人消費的不只是商品的「使用價值（好不好用）」，而是商品背後的 **符號價值（它向世界宣告『我是什麼品味、屬於哪個圈子的人』）**！\n\n看懂這點超有用：\n• **做行銷時**：知道好品牌賣的是「讓顧客成為更理想版本的自己」。\n• **當消費者時**：刷卡前問自己一句「如果這東西不能拍照打卡、完全沒人知道我買了它，我還願意花這個錢嗎？」瞬間省下超多冤枉錢！", "lv2": "跳脫符號消費陷阱、拿回財務自由度的實務心法：\n\n1. **「無人島測試」**：買高單價非必需品前問「如果全世界只有我一個人看得到它，我還想買嗎？」答「要」才是真心喜歡，答「不要」只是在為別人的眼光買單。\n2. 警惕「狄德羅效應（配套升級陷阱）」：買了一件超貴新大衣，結果覺得原本的鞋子、包包、沙發全配不上它，一路連環大失血！", "lv3": "Jean Baudrillard《消費社會》（1970）區分使用價值、交換價值與符號價值（Sign Value），呼應 Thorstein Veblen（1899）提出的「炫耀性消費（Conspicuous Consumption）」與韋伯倫財（價格越貴需求越高的反常現象）。廣告工業的核心即在於持續將情感歸屬、成功與自由嫁接至可購買的物質符號上。"}, "myNotes": "刷卡前做「無人島測試」：如果不能發限動、沒人知道我買了，我還想要嗎？", "relatedIds": ["soc-s1-2", "mkt-stp"], "updatedAt": "2026-11-24"},
        {"id": "soc-s4-3", "categoryId": "cat-soc", "stageId": "s4", "subtopic": "現代倦怠", "title": "內卷化、績效社會與現代人的倦怠來源", "oneLiner": "以前是工廠老闆拿鞭子逼你工作；現代則是你自己心裡住著一個永不滿足的「績效老闆」，連休假滑手機都在焦慮自己沒進步。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "兩件事道盡了現代人為什麼明明生活比古人富裕，卻累到快燒乾：\n\n1. **內卷（Involution）**：想像在電影院看電影，第一排有人為了看得更清楚突然「站起來」，後面的人被迫通通跟著站起來！最後每個人看螢幕的角度跟原本坐著一模一樣，但全場站兩小時累到腳抽筋——**大家都付出雙倍努力，總餅卻沒變大，只是在原地互相消耗**！\n2. **績效社會的自我剝削**：哲學家韓炳哲說，現代人最累的不是別人逼你，而是你把「我必須更自律、更高效、更成功」內化成心裡的鞭子，自己 24 小時抽打自己，最後引發深層倦怠！", "lv2": "跳出無效內卷與現代倦怠的三條出路：\n\n1. **用「差異化換賽道」破內卷**：別跟十萬人在同一條擁擠考道比誰熬夜久，跨界組合你的獨特優勢（結構洞）開新電影院坐著看！\n2. **允許「無目的的純粹留白」**：散步、發呆、純粹享受一頓飯，不必把每一分鐘都算成 KPI 或變現產出。\n3. 區分「充實的累（做熱愛且有累積的事）」與「掏空的累（原地內耗比較）」。", "lv3": "內卷化源於人類學家 Clifford Geertz（1963《農業內卷化》），描述系統達邊際天花板後僅剩內部過度精細化而無實質突破；韓裔德國哲學家韓炳哲《倦怠社會》（The Burnout Society）則剖析當代從傅柯「規訓社會（你不准）」轉向「績效社會（你可以且必須最大化自己）」，導致抑鬱與過勞成為時代精神病理。"}, "myNotes": "電影院大家都站起來一樣看不到更好畫面——破內卷唯一解是「差異化換賽道」，不是站得比別人久！", "relatedIds": ["soc-s1-1", "soc-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "soc-s4-4", "categoryId": "cat-soc", "stageId": "s4", "subtopic": "清醒實踐", "title": "成為清醒的局內人：在制度規則中保有自主與彈性", "oneLiner": "讀完社會學不是要憤世嫉俗躲進深山，而是看懂所有遊戲規則後，既能熟練運用規則拿到好結果，心裡又清楚知道「分數不等於我的全部價值」。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第五階段擴充課綱", "levels": {"lv1": "看透社會與職場潛規則後，人通常會走上三條路：\n\n• **天真局外人**：完全不懂規則，一直用真心硬撞高牆撞得頭破血流。\n• **冷血功利者**：徹底被規則吞噬，為了搶頭銜跟錢不擇手段，最後內心空虛。\n• **清醒的局內人（最高段位）**：把社會規則當成一場桌遊——進場時認真懂規則、講策略、拿資源、幫團隊贏；下場後隨時能抽離出來笑一笑，知道「遊戲積分只是工具，真實生活、健康、好奇心與所愛之人才是目的」！", "lv2": "成為「清醒局內人」的四個日常修練：\n\n1. **建立多維評價支點**：別把全部自我價值只綁在「公司職稱」或「存款數字」單一指標上，同時擁有興趣作品、健康體能與真誠友誼。\n2. **把規則當工具、不當信仰**：善用履歷、證照與頭銜敲開門，但私下永遠以「解決真問題」衡量自己。\n3. **保留「隨時能說不」的底氣**：緊急預備金 + 可帶走的硬實力，是你保有自主權最實在的靠山。", "lv3": "呼應社會學「結構與能動性（Structure vs. Agency，Anthony Giddens 結構化理論）」的辯證統合：人雖受限於既定社會結構，但透過反思性監控（Reflexive Monitoring）與策略性行動，個體不僅能在結構縫隙中創造自主空間，更能逐步改寫局部制度文化。"}, "myNotes": "懂規則、用規則拿結果，同時不被單一評價標準綁架——這就是「清醒局內人」的最高境界！", "relatedIds": ["soc-s4-3", "phil-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "comm-s1-1", "categoryId": "cat-comm", "stageId": "s1", "subtopic": "結構表達", "title": "金字塔原理與結論先行（BLUF）", "oneLiner": "不要把職場報告寫成懸疑偵探小說留到最後才揭曉答案——第一句就講結論，下面分組列 3 個論據，對方 10 秒就秒懂。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "看這兩種請假／提案訊息：\n• 懸疑小說版：「主管早安，我上週跟客戶開會，後來系統更新了，而且我昨天檢查排程發現下週二要出差，所以想問這週五能不能先發版？」（主管看到一半已經煩躁！）\n• **結論先行（金字塔版）**：「主管早安，**建議這週五先發版（結論）**，原因有三點：1. 客戶已確認需求；2. 系統測試已通過；3. 避開下週二出差撞期。」\n\n人類大腦天生愛「先看到塔尖結論，再決定要不要往下看細節」，這招能讓你所有信件與簡報瞬間變高階！", "lv2": "金字塔原理四大鐵律：\n\n1. **結論先行**：每封信第一段、每頁簡報標題直接寫出核心主張。\n2. **以上統下**：上層結論必須精準概括下層所有分點。\n3. **歸類分組**：相關論點聚在一起，每層最多 **3–5 個分點**（超過 7 個大腦會當機）。\n4. **邏輯遞進**：分點按時間順序、結構順序或重要程度排序。", "lv3": "由麥肯錫首位女性顧問 Barbara Minto（1970s）系統化提出，與美軍通訊原則 BLUF（Bottom Line Up Front）高度一致，根植於認知心理學的「由上而下基模處理（Top-Down Schema Processing）」，大幅壓低讀者工作記憶負擔。"}, "myNotes": "所有報告與 Email 第一句先給結論，再列 3 個平行論據，絕不寫成偵探小說！", "relatedIds": ["comm-s1-2", "speak-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "comm-s1-2", "categoryId": "cat-comm", "stageId": "s1", "subtopic": "邏輯拆解", "title": "MECE 原則（相互獨立、完全窮盡）拆解複雜議題", "oneLiner": "把問題切乾淨的最高標準：每一塊之間「不重疊（獨立）」，全部合起來「沒漏掉（窮盡）」，保證思考無死角。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "如果你把全班同學分成「男生、女生、戴眼鏡的人」，這分類就亂掉了——因為戴眼鏡的男生被重複算了兩次！\n\n如果改成「戴眼鏡男生、沒戴眼鏡男生、戴眼鏡女生、沒戴眼鏡女生」，既沒重複也沒漏掉任何一個人，這就是 **MECE（Mutually Exclusive, Collectively Exhaustive）**！\n\n商業拆解也是這樣：想提高商店獲利，直接套數學公式 `利潤 = 客流量 × 轉換率 × 客單價 − 成本`，四塊互相獨立又涵蓋全部可能，一眼就能對症下藥！", "lv2": "五種立刻套用的現成 MECE 切法：\n\n1. **二分法**：內部 vs 外部、可控 vs 不可控、線上 vs 線下。\n2. **流程時間法**：事前準備 → 事中執行 → 事後追蹤。\n3. **公式拆解法**：營收 = 用戶數 × 付費率 × 客單價。\n4. **矩陣法（2×2）**：重要／緊急、高頻／低頻 × 高痛／低痛。\n5. **要素法**：人、事、時、地、物或 4P／3C。", "lv3": "MECE 為麥肯錫問題解決法（Problem Solving）與議題樹（Issue Tree / Logic Tree）的結構公理，確保後續分工查證零重複工（Eliminating Redundancy）且不遺漏關鍵假設（Preventing Blind Spots）。"}, "myNotes": "拆複雜問題不知道怎麼切時，優先用「二分法」「流程時間」或「數學公式」保證 MECE！", "relatedIds": ["comm-s1-1", "comm-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s1-3", "categoryId": "cat-comm", "stageId": "s1", "subtopic": "故事開場", "title": "SCQA 故事開場框架：情境、衝突、疑問、答案", "oneLiner": "寫提案或文章開頭老是乾巴巴？照「共同背景（S）→ 突發痛點（C）→ 關鍵提問（Q）→ 你的解方（A）」四句走，30 秒牢牢勾住讀者。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "直接看一個用 SCQA 寫出來的超順開場：\n• **S（情境）**：你最近想系統化學習跨領域知識，存了一堆書跟網頁。\n• **C（衝突）**：但筆記越存越亂，看專業書又太艱深、看懶人包又太淺。\n• **Q（疑問）**：有沒有辦法做一個專屬知識庫，既保有專業深度又能一秒切白話？\n• **A（答案）**：這就是我們打造「三層難度原子知識卡」架構的原因！\n\n只要有「衝突（C）」，大腦就會瞬間產生好奇心，乖乖往下讀你的答案！", "lv2": "依不同對象變換 SCQA 順序的進階玩法：\n\n1. **標準式（S-C-Q-A）**：適合寫知識文章、教學指南，娓娓道來超流暢。\n2. **開門見山式（A-S-C）**：適合對忙碌高層提案——先拋答案（A），再補背景與痛點。\n3. **突出憂慮式（C-S-A）**：適合危機警示或銷售頁——第一句直接點爆痛點衝突抓眼球！", "lv3": "同屬 Barbara Minto 金字塔序言寫作結構，利用「建立共同認知基準（S）→ 製造認知張力（C）」喚起讀者問題意識，使後續主張（A）從「強迫推銷」轉化為「解決懸念的自然答案」。"}, "myNotes": "好開場一定藏著一個「衝突（C）」——沒有衝突就沒有讓人往下讀的張力！", "relatedIds": ["comm-s1-1", "mkt-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s1-4", "categoryId": "cat-comm", "stageId": "s1", "subtopic": "白話轉譯", "title": "受眾意識與降維轉譯：把專業術語翻成高中生白話", "oneLiner": "堆滿行話不是專業，而是還沒消化透徹的遮羞布；真正的高手能把複雜理論翻譯成連高中生都點頭拍案的生活故事。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "心理學有個「知識的詛咒」：一旦你學會了某個專業，你就很難想像「完全不懂的人」聽起來有多霧煞煞。\n\n把專業翻譯成白話的三把魔法鑰匙：\n1. **用熟悉比喻陌生**：講 API 用「餐廳服務生」，講記憶體用「書桌 vs 書櫃」。\n2. **具體數字與畫面取代抽象詞**：別說「大幅提升效能」，說「原本要等 30 秒，現在眨眼不到 1 秒就好」。\n3. **先給大局畫面，再補專有名詞**：先講懂原理，最後才括號補上英文術語，讀者完全不會被嚇跑！", "lv2": "寫作與簡報降維轉譯的四步檢核：\n\n1. 下筆前先寫下「讀這篇的人現在最在意什麼？他已經知道什麼？不知道什麼？」。\n2. 圈出文章裡所有「非本行看不懂的縮寫與名詞」，每個都配一個 10 字內白話解釋或生活比喻。\n3. 多用「動詞與短句」，砍掉空洞商業流行語（如「賦能、抓手、閉環、生態系」）。", "lv3": "「知識的詛咒（Curse of Knowledge, Camerer et al., 1989）」為跨領域溝通最大阻力。Chip & Dan Heath《黏性》（Made to Stick）歸納出高穿透力表達 SUCCESs 六原則：簡潔、意外、具體、可信、情緒、故事，其中「具體感（Concrete）」是消除抽象歧義的最高槓桿。"}, "myNotes": "先講生活畫面再補專有名詞，徹底破除「知識的詛咒」！", "relatedIds": ["cross-s4-2", "comm-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s2-1", "categoryId": "cat-comm", "stageId": "s2", "subtopic": "商務寫作", "title": "職場書信、提案摘要與會議紀錄的黃金寫法", "oneLiner": "好商務文件不是要人從頭細讀，而是讓人 5 秒掃過主旨與粗體重點，就清楚知道「要我決定什麼、何時前回覆」。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "收到一封主旨只寫「關於昨天的事」、內文一整陀 500 字不分段的 Email，是不是瞬間想關掉？\n\n職場文字高手的標準格式超清爽：\n• **主旨直接寫行動與期限**：`[需核准] Q4 行銷預算方案（請於 11/28 前回覆）`。\n• **第一段一句話講目的**。\n• **中間最多 3–4 個條列重點**（關鍵字加粗）。\n• **最後明確寫「下一步行動（Action Item）」**：誰、做什麼、幾號前完成。", "lv2": "高品質會議紀錄（非逐字稿！）的必備四區塊：\n\n1. **核心決議（Decisions）**：今天拍板定案了哪幾件事（最重要放最上面！）。\n2. **行動清單（Action Items）**：表格列出「任務內容｜唯一負責人｜截止日期」。\n3. **待解開放議題（Open Questions）**：還沒定案、留待下次確認的事。\n4. 會議結束後 **24 小時內** 寄出，趁大家記憶最鮮明時鎖定共識。", "lv3": "高階商務寫作遵循「可掃讀性（Scannability）」與「最小認知摩擦」原則：將非同步書面溝通（如 Amazon 6-Page Narrative Memo / 1-Page Executive Summary）轉化為清晰的決策留痕與責任邊界紀錄。"}, "myNotes": "會議紀錄絕不是逐字稿！只留三大塊：核心決議、行動清單（誰/做啥/何時）、待解議題。", "relatedIds": ["comm-s1-1", "biz-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "comm-s2-2", "categoryId": "cat-comm", "stageId": "s2", "subtopic": "長文架構", "title": "長文與知識型文章架構：鉤子、節奏與視覺掃讀設計", "oneLiner": "現代人在螢幕上是「F 型掃讀」而非逐字精讀——善用吸睛小標題、每段不超過 4 行、搭配表格與金句，長文也能讓人一口氣讀完。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "打開手機看到一整片密密麻麻完全不換行的文字牆，手指 1 秒就直接滑走了！\n\n寫出讓人滑到底的好長文，記住「呼吸感四件套」：\n1. **開頭 3 句鉤子**：點痛點、拋反常識或講一個瞬間畫面。\n2. **結論式小標題**：讀者光掃過 4 個小標題就能看懂整篇精華。\n3. **短段落節奏**：手機閱讀每段控制在 3–4 行，長短句交錯像音樂節奏。\n4. **視覺休息站**：每隔 300–500 字插入一張小對照表、條列清單或重點引述。", "lv2": "知識型文章的標準骨架模板：\n\n1. **標題**：明確受眾 + 具體收穫／反差。\n2. **破題（100 字）**：用 SCQA 建立為什麼這件事現在很重要。\n3. **主體（3–4 個模組）**：每個模組照「核心觀點 → 生活案例／數據 → 可執行步驟」展開。\n4. **收尾**：一句濃縮記憶點 + 1 個讀者明天就能試的小行動。", "lv3": "尼爾森諾曼集團（Nielsen Norman Group）眼動追蹤研究證實，網路讀者呈現「F 型」與「層糕型（Layer-Cake）」掃讀軌跡：高達 79% 讀者先掃描標題與首句再決定是否精讀，故結構化層級（Information Scent）直接決定文章完讀率。"}, "myNotes": "手機時代寫長文：每段 3–4 行、結論型小標題、每 400 字給一個視覺休息站！", "relatedIds": ["mkt-s4-2", "comm-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s2-3", "categoryId": "cat-comm", "stageId": "s2", "subtopic": "修稿減法", "title": "改稿比初稿重要：刪除冗詞、強化動詞與節奏修剪", "oneLiner": "好文章不是寫出來的，是「改出來」的——寫完初稿先放一小時，接著狠心刪掉 20% 廢話，文章力道立刻翻倍。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "海明威說過一句超狠的名言：「任何東西的初稿都是垃圾。」高手寫作都把「寫（創作模式）」跟「改（編輯模式）」徹底分開！\n\n改稿時最有感的四刀減法：\n1. **砍掉虛胖填充詞**：「進行一個討論的動作」→ 直接改成「討論」；「非常極度地重要」→ 改成「關鍵」。\n2. **主動語態取代被動語態**：「這項計畫被我們完成了」→「我們完成了這項計畫」。\n3. **具體動詞取代抽象形容詞**。\n4. **大聲唸出來**：凡是唸到卡舌頭、一口氣喘不過來的超長句，直接一刀切成兩句！", "lv2": "四分鐘快速改稿檢查清單：\n\n1. **刪掉第一段暖身廢話**：很多作者第一段只是在幫自己熱身，直接刪掉從第二段開場反而超有張力！\n2. 搜尋並檢查文章裡出現太多次的「的、了、其實、基本上、某種程度上」。\n3. 檢查每段開頭第一句是不是本段重點。\n4. 試著把整篇文章字數硬砍掉 15% 但不丟失任何核心資訊，密度瞬間拉滿。", "lv3": "William Zinsser《非虛構寫作指南》（On Writing Well）與 Strunk & White《風格的要素》（Omit needless words）皆強調「簡潔（Clarity & Economy）」為專業寫作最高美德：每一個沒有承載新資訊或情感功能的字詞都在稀釋整體說服力。"}, "myNotes": "寫初稿時盡量不回頭改，改稿時「大聲唸出來 + 狠砍 15% 冗詞」最有感！", "relatedIds": ["comm-s1-4", "comm-s2-2"], "updatedAt": "2026-11-24"},
