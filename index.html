        {"id": "prod-s1-1", "categoryId": "cat-product", "stageId": "s1", "subtopic": "需求訪談", "title": "使用者訪談技巧（The Mom Test）：避開客套假好評", "oneLiner": "連你媽媽都會為了不傷你心而說「這點子超棒」，真正有效的訪談只問過去事實、絕不推銷點子。", "tags": ["#實作工具", "#決策框架"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "想像你烤了一個有點焦的蛋糕問媽媽「好不好吃？」，媽媽怕你難過一定會說「很好吃啊，很有創意！」。做產品訪談也一樣：只要你開口問「如果我做一個這樣的 App，你會不會用？」，大家基於禮貌幾乎都會點頭，結果你花半年寫出來卻沒半個人下載。\n\n《The Mom Test》教你三條鐵律：\n1. 聊對方的生活，不要聊你的點子。\n2. 問「過去真的發生過的事」，別問「未來會不會買」。\n3. 少說多聽，從對方的抱怨與已經花過的錢找真相。", "lv2": "下次做需求訪談時，把以下五個「高含金量問題」印出來照著問：\n\n1. 「你上一次遇到這個麻煩是什麼時候？當時發生了什麼？」（確認頻率與真實場景）\n2. 「你現在都怎麼硬撐過去？花了多少時間或錢？」（如果他連免費替代方案都懶得找，代表這痛點根本不痛）\n3. 「這件事最讓你崩潰的是哪一個環節？」（挖出核心瓶頸）\n4. 「除了這個，還有什麼更急的問題佔掉你的預算？」（確認優先級）\n5. 「如果我下週做出一個超陽春版本，你願意先付訂金或介紹同事試用嗎？」（用承諾取代口頭稱讚）", "lv3": "Rob Fitzpatrick 提出的《The Mom Test》本質上是對抗社會期許偏誤（Social Desirability Bias）與假設性偏誤（Hypothetical Bias）的質性研究方法論。在行為經濟學中，受訪者對未來行為的自我預測（Stated Preference）與真實付出成本的顯示偏好（Revealed Preference）高度背離。\n\n專業產品探索必須將訪談訊號分級：\n• 雜訊（Noise）：稱讚（「好酷」）、假設性承諾（「上線一定買」）、模糊意見。\n• 有效訊號（Signal）：具體過往行為證據、已發生的時間／金錢支出，以及「推進式承諾（Advancement）」——包含時間承諾（約下次深訪）、聲譽承諾（引薦主管）或金錢承諾（預購／LOI）。"}, "myNotes": "別問「你覺得這個功能好不好」，要問「你上禮拜遇到這件事時怎麼解決的？」", "relatedIds": ["prod-s1-2", "prod-mvp"], "updatedAt": "2026-11-24"},
        {"id": "prod-s1-2", "categoryId": "cat-product", "stageId": "s1", "subtopic": "需求架構", "title": "待辦任務（JTBD）與痛點頻率／強度矩陣", "oneLiner": "顧客買的從來不是電鑽，而是牆上那個洞；用頻率與痛感強度鎖定最值得先解的任務。", "tags": ["#底層模型", "#決策框架"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "早上趕上班的人買了一杯奶昔，你以為他是為了「好喝」嗎？哈佛教授研究發現，很多人其實是「僱用」這杯奶昔來幫自己打發 40 分鐘無聊的塞車通勤，而且用吸管喝不會弄髒衣服，還能撐到中午不餓！這時候奶昔真正的競爭對手不是另一家飲料店，而是香蕉、貝果和甜甜圈。\n\n這就是「待辦任務（Jobs to be Done, JTBD）」：不要只盯著顧客的年齡性別，要問「他買這個東西，是想幫自己完成什麼生活任務？」", "lv2": "實務上把模糊痛點轉成精準產品切入點的兩步驟：\n\n1. 套用 JTBD 句型寫清楚情境：「當我處於【某情境】時，我想要【某種進展】，好讓我能夠【達成某種結果】。」（例：當我臨時要跟老闆報告時，我想在 3 分鐘內把雜亂筆記轉成有邏輯的圖表，好讓我看起來專業不慌張。）\n2. 放進「頻率 × 強度」四象限篩選：\n   • 高頻＋劇痛（必做金礦）：立刻搶攻核心痛點。\n   • 低頻＋劇痛（如買房、急診、報稅）：客單價要拉高，靠信任與專業取勝。\n   • 高頻＋微痛：適合做成免費工具或附屬功能，單獨收費極難。\n   • 低頻＋微痛（偽需求墓地）：直接放棄，千萬別投入開發。", "lv3": "Clayton Christensen 與 Anthony Ulwick 發展的 JTBD 與結果導向創新（Outcome-Driven Innovation, ODI）框架，將用戶需求拆解為功能性（Functional）、情感性（Emotional）與社會性（Social）三個維度。\n\n在 ODI 量化評估中，機會分數公式為：\nOpportunity Score = Importance + max(Importance − Satisfaction, 0)\n其中重要性（Importance）與滿意度（Satisfaction）均以 0–10 分量表衡量。得分 > 12 代表嚴重未被滿足的「服務不足市場（Underserved Market）」，適合破壞式創新切入；若滿意度已遠高於重要性（Overserved），則適合透過低價簡化版進行低端破壞。"}, "myNotes": "先分清楚這是「止痛藥（剛需）」還是「維他命（可有可無）」，高頻＋劇痛才是首選切入點。", "relatedIds": ["prod-s1-1", "prod-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "prod-s1-3", "categoryId": "cat-product", "stageId": "s1", "subtopic": "市場定位", "title": "競品拆解與市場空白點定位法", "oneLiner": "看懂對手沒說出口的商業假設，從一星負評與未被服務的邊緣族群裡挖出藍海切口。", "tags": ["#底層模型", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "想開一家飲料店，不要傻傻去抄五十嵐的整張菜單——大品牌已經把那條路佔滿了。聰明的做法是去翻對手在 Google 地圖上的「二星到三星評論」：有人抱怨「等太久」、有人嫌「無糖茶太澀」、有人說「晚上九點就關門買不到」。\n\n這些大家習以為常的小抱怨，就是「市場空白點」。競品分析的目的不是為了「把對手的功能全部抄一遍」，而是找出對手因為包袱太重而「不想做、不敢做、或做不到」的那一塊空地。", "lv2": "一套 2 小時就能跑完的實戰競品拆解清單：\n\n1. 分清三層競品：直接競品（賣一樣的東西）、間接競品（解同一個 JTBD，例如 Excel 是所有 SaaS 的最大間接競品）、替代方案（乾脆不做或人工土法煉鋼）。\n2. 爬 100 則 2–3 星評論：一星常是情緒發洩，2–3 星才是認真用過卻卡關的真實痛點。\n3. 畫出「價值曲線（策略草圖）」：列出 5–6 個產業指標（價格、上手速度、客製彈性、AI 自動化、整合度），標出巨頭在哪裡過度堆料，而你決定在哪兩個維度「刻意極簡」或「拉到極致」。", "lv3": "競品策略拆解的核心理論來自 Michael Porter 的競爭優勢與 W. Chan Kim 的《藍海策略（Blue Ocean Strategy）》ERRC 四步動作框架（Eliminate 消除、Reduce 減少、Raise 提升、Create 創造）。\n\n高階產品經理會特別檢視巨頭的「商業模式反定位（Counter-Positioning，Hamilton Helmer《7 Powers》）」：當新創採用一種對用戶更有利的新模式（如單檔免安裝本機優先、或按量計費取代按席位收費），現有巨頭若跟進就會嚴重蠶食自身既有營收（Cannibalization），這才是能讓小團隊安全長大的結構性空白點。"}, "myNotes": "Excel 與「人工複製貼上」往往是數位產品最真實的頭號競品，贏過它比贏過同行更重要。", "relatedIds": ["prod-s1-2", "prod-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "prod-s1-4", "categoryId": "cat-product", "stageId": "s1", "subtopic": "需求規格", "title": "把模糊想法濃縮成一頁產品需求文件（PRD）", "oneLiner": "好的 PRD 不是寫給自己看的許願清單，而是讓工程、設計與未來的自己對齊「為什麼做、不做什麼」的作戰地圖。", "tags": ["#實作工具", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "很多人在腦中覺得「我要做一個超酷的讀書筆記網站」，結果一打開程式編輯器就開始糾結按鈕顏色、登入系統、社群留言板，寫了三個禮拜連最核心的筆記功能都還沒跑起來。\n\n一頁 PRD（產品需求文件）就像蓋房子前的「一頁施工說明書」：強迫你在動手寫第一行程式前，用白話講清楚「給誰用、解決什麼痛點、第一版只做哪三件事、以及哪些酷炫點子先忍住不做」。寫不進一頁紙的想法，通常代表你自己還沒想清楚。", "lv2": "直接套用的「一頁精實 PRD 模板」（六個區塊，全部控制在 A4 一頁內）：\n\n1. 背景與痛點（Why）：用 3 句話交代誰在什麼情境下卡關。\n2. 核心目標與成功指標（Success Metric）：上線後看哪 1–2 個數字算成功（例如：7 日留存率、每週完成匯出次數）。\n3. 目標用戶與核心旅程（User Flow）：畫出 3–5 步最短操作路徑。\n4. 本期範圍（In-Scope）：只列 P0 必做核心功能與驗收標準（Acceptance Criteria）。\n5. 明確不做清單（Non-Goals / Out-of-Scope）：這是最重要的一欄！把帳號系統、多語系、花俏特效先寫進「本期不做」，防止範圍蔓延。\n6. 風險與未知假設（Open Questions）：列出待驗證的技術或市場地雷。", "lv3": "現代敏捷與精實產品團隊（如 Amazon 的 PR/FAQ、Basecamp 的 Shape Up Pitch、Intercom 的 Intermission 1-Pager）早已揚棄過去瀑布式開發動輒百頁的規格書。PRD 的核心治理功能在於降低「跨職能認知落差」與控制「範疇蔓延（Scope Creep）」。\n\n撰寫驗收標準時建議採用 BDD（Behavior-Driven Development）的 Given-When-Then 語法，確保需求可測試且無歧義；同時以「問題空間（Problem Space）」與「解法空間（Solution Space）」分離原則，讓文件聚焦在用戶價值與邊界條件，保留工程實作的彈性空間。"}, "myNotes": "一份好的 PRD，最有價值的區塊往往是「本期明確不做清單（Non-Goals）」。", "relatedIds": ["prod-s1-3", "prod-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "prod-s2-1", "categoryId": "cat-product", "stageId": "s2", "subtopic": "系統創新", "title": "TRIZ 創新發明原理：解決工程與產品矛盾的 40 法則", "oneLiner": "真正的突破不是妥協折衷，而是把「又想馬兒好、又想馬兒不吃草」的矛盾直接拆解掉。", "tags": ["#底層模型", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "以前做行李箱有個兩難：箱子要「堅固耐摔」就得加厚，一加厚就會「太重搬不動」。一般人會選擇折衷——做一個「中等重、中等耐摔」的平庸產品。但 TRIZ 發明原理說：別妥協！用「局部品質」或「曲面化」原理，把外殼做成波浪凹凸結構（像瓦楞紙箱一樣），就能同時「又輕又硬」！\n\n前蘇聯專利審查員阿奇舒勒研究了幾十萬份專利後發現：人類 95% 的偉大發明，背後重複使用的其實只有 40 條核心套路。遇到死胡同時，不用等天外飛來的靈感，直接翻這套創新字典就找得到出口。", "lv2": "日常做產品與解題最萬用的 6 條 TRIZ 高頻法則：\n\n1. 分割（Segmentation）：大檔案難維護？拆成模組或可獨立開關的卡片。\n2. 預先作用（Preliminary Action）：結帳太慢？在用戶猶豫時先在背景預載資料（或像便利商店先切好水果）。\n3. 空間／時間分離：想「功能豐富」又想「介面極簡」？用「空間分離」（進階設定收進摺疊抽屜）或「時間分離」（新手只看 3 個按鈕，用熟後才解鎖進階面板）。\n4. 變害為利（Blessing in Disguise）：把系統限制變成特色（例：Snapchat 把訊息閱後即焚的限制變成隱私賣點）。\n5. 動態化（Dynamization）：固定模板不好用？讓欄位與難度層級可隨時動態切換。\n6. 自我服務（Self-Service）：讓系統用自身產出的副產品維護自己（例：自動化測試、用戶協作標註）。", "lv3": "TRIZ（Teoriya Resheniya Izobretatelskikh Zadach，發明問題解決理論）由 Genrich Altshuller 創立，其核心哲學是「創新是有規律可循的工程學」。TRIZ 將問題抽象為兩類矛盾：\n\n• 技術矛盾（Technical Contradiction）：改善參數 A 導致參數 B 惡化，可透過「39×39 矛盾矩陣」查找歷史專利最常奏效的 40 條發明原理。\n• 物理矛盾（Physical Contradiction）：同一子系統必須同時具備相反屬性（如「既要熱又要冷」），須透過四大分離原則求解——空間分離、時間分離、條件分離、整體與部分分離。\n此外，TRIZ 的「理想最終結果（IFR, Ideal Final Result）」逼迫設計者先問：如果這個功能在「不增加任何成本與元件」的情況下自己完成，會是什麼樣子？"}, "myNotes": "遇到「兩難取捨」時別急著折衷，先問：能不能用時間分離或空間分離，兩個我都要？", "relatedIds": ["prod-s2-2", "prod-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "prod-s2-2", "categoryId": "cat-product", "stageId": "s2", "subtopic": "創意發想", "title": "SCAMPER 奔馳法：替換、合併與重組現有產品", "oneLiner": "90% 的商業爆品都不是從零發明的，而是拿現有產品做七種微手術重組出來的。", "tags": ["#實作工具", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "想不到新點子？別對著白紙發呆，拿一個你每天都在用的東西，用「SCAMPER」七個動作輪流改造它：\n\n• S 替換（Substitute）：把紙本名片換成 NFC 感應卡。\n• C 合併（Combine）：把手機＋相機＋MP3 合併成 iPhone。\n• A 調整（Adapt）：把日本迴轉壽司的輸送帶搬來做迴轉火鍋。\n• M 修改／放大縮小（Modify）：把大罐保養品做成旅遊小包裝。\n• P 挪作他用（Put to another use）：把原本做遊戲顯示卡的 GPU 拿來訓練 AI。\n• E 消除（Eliminate）：把實體按鍵全部消掉，只留全螢幕。\n• R 反轉／重排（Reverse）：本來是「先吃飯後付錢」，改成「先點餐付錢再取餐」。\n\n每個字母只要逼自己想 2 個點子，10 分鐘就能蹦出 14 個具體新方案！", "lv2": "把 SCAMPER 變成你自己的「15 分鐘創意發想工作表」：\n\n1. 先鎖定一個具體對象（例如：你的個人知識庫、某項日常工作流程、或某個現有 SaaS 工具）。\n2. 開計時器，每個字母限時 2 分鐘，嚴禁自我審查（「這太蠢了」先吞回去，全部寫下來）。\n3. 特別深挖「E（消除）」與「C（合併）」——這兩招在軟體與數位產品上最容易做出差異化（例如：消除註冊登入流程＋合併本機儲存與 AI 生成）。\n4. 跑完七個字母後，挑出最讓自己眼睛一亮的 3 個點子進入收斂矩陣評估。", "lv3": "SCAMPER 由 Bob Eberle 基於廣告大師 Alex Osborn（腦力激盪法創始人）的檢核表整理而成，在認知心理學上屬於「結構化發散思維（Structured Divergent Thinking）」與「概念組合（Conceptual Combination）」工具。\n\n人類大腦在完全無約束下容易陷入「功能固著（Functional Fixedness）」與路徑依賴，反而想不出東西；SCAMPER 透過七個強制算子（Operators）刻意施加「認知約束」，強迫大腦跳出原有表徵空間，在既定產品元素上進行系統性的拓撲變換。"}, "myNotes": "做軟體工具時，SCAMPER 裡最容易出奇蹟的通常是 E（消除繁瑣步驟）和 R（反轉既有順序）。", "relatedIds": ["prod-s2-1", "prod-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "prod-s2-3", "categoryId": "cat-product", "stageId": "s2", "subtopic": "破框思考", "title": "跨界借鑑與反向假設創意工作坊", "oneLiner": "在自己行業裡找答案只會越長越像對手；把別的行業的成熟解法搬過來，或把默認前提反過來想，才能真正破框。", "tags": ["#底層模型", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "醫院急診室以前常因為交接班漏掉資訊出錯，他們跑去問其他醫院怎麼改，結果大家都差不多。後來他們改去觀摩「F1 賽車維修站」怎麼在 2 秒內零失誤換完四顆輪胎，把那套明確分工與標準喊話流程搬回手術室，交接失誤率瞬間大降！\n\n另一個破框大絕招叫「反向假設」：先把大家覺得理所當然的事全部寫出來，然後故意唱反調。例如「餐廳一定要有菜單、要有服務生、要等廚師煮」→ 反過來想：「沒有菜單（無菜單料理）、沒有服務生（自助點餐機）、讓客人自己煮（火鍋燒肉）」，每一條反話竟然都是大生意！", "lv2": "一個人或小組都能在 30 分鐘內執行的「雙軌破框練習」：\n\n【軌一：反向假設（Assumption Reversal）】\n1. 列出這個領域 5 條「大家都覺得理所當然的規則」（例：知識庫一定要註冊帳號、一定要連雲端資料庫、每篇文章只能有一種寫法）。\n2. 把每一條硬改成完全相反的句子。\n3. 追問：「如果這個相反的設定真的成立，在什麼情境下反而會變成超強優勢？」\n\n【軌二：跨界類比（Cross-Industry Analogy）】\n1. 把你的問題抽象成動詞（例：不是「做一個記帳 App」，而是「如何讓枯燥的每日紀錄變上癮？」）。\n2. 去找把這個動詞做到極致的異業高手（遊戲抽卡機制、健身手環圓環、Duolingo 連勝火焰），拆解它的核心機制移植回來。", "lv3": "跨界借鑑在創新研究中稱為「遠距類比遷移（Far-Field Analogical Transfer）」。研究顯示，當解題者只參考同產業案例（近距類比）時，會產生強烈的「設計固著（Design Fixation）」；反之，將問題抽象化為底層結構關係後，從不同領域（如生物仿生學、航空檢核表、遊戲設計）提取結構同構（Structural Isomorphism）的解法，最容易產出高新穎度與高可行性兼具的突破創新。\n\n反向假設則對應哲學與第一性原理（First Principles）中的前提解構，能有效揭露產業長期累積卻早已過時的「隱性假設（Implicit Constraints）」。"}, "myNotes": "寫下產業的 5 條「理所當然」，逐條唱反調，常常直接蹦出最有特色的差異化定位。", "relatedIds": ["prod-s2-1", "prod-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "prod-s2-4", "categoryId": "cat-product", "stageId": "s2", "subtopic": "收斂決策", "title": "創意收斂矩陣：影響力 vs 實作難度快速排優", "oneLiner": "點子不值錢，把有限的時間精準押在「高影響力、低難度」的速勝項目上才值錢。", "tags": ["#決策框架", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "腦力激盪完白板上貼了 30 張便利貼，每個點子看起來都好棒，結果不知道先做哪一個，最後全部沒做。這時候只要在紙上畫一個大十字：\n\n• 橫軸是「做起來多費力」（左邊簡單、右邊超難）。\n• 縱軸是「做完多有感」（上面超有效、下面沒什麼差）。\n\n把點子通通放進去，答案立刻一清二楚：\n1. 左上角（簡單又超有感）＝「速勝金蛋」，明天立刻動手！\n2. 右上角（超難但超有感）＝「大專案」，切小塊慢慢規劃。\n3. 左下角（簡單但沒差）＝「填縫小事」，有空再說。\n4. 右下角（又難又沒用）＝「時間黑洞」，立刻撕掉丟垃圾桶！", "lv2": "避免收斂矩陣流於「憑感覺亂畫」的四個實戰防呆規則：\n\n1. 採用「相對排序」而非絕對打分：不要每個點子都覺得 8 分，強迫把所有點子排成一列，只允許前 25% 放進高影響區。\n2. 把「實作難度」包含隱性成本：不只算寫程式時間，還要算維護成本、學習曲線與溝通成本。\n3. 設下「一次只打一顆右上角大魔王」上限：每個階段排 2–3 個左上角速勝＋最多 1 個右上角大專案，其餘全部進凍結區（Parking Lot）。\n4. 加上「可逆性」檢核：如果某個點子做錯了能 10 分鐘撤回，就大膽先試，別在會議裡爭論兩小時。", "lv3": "影響力－努力矩陣（Impact-Effort Matrix，又稱 PICK Chart）是精實六標準差與設計思考「雙鑽石模型（Double Diamond）」中，從發散（Diverge）轉入收斂（Converge）的關鍵決策閘門。\n\n在資訊不完全的早期階段，此矩陣常面臨兩大認知偏誤：樂觀偏誤（低估實作難度，即 Planning Fallacy）與主觀影響力膨脹。進階做法是引入「不確定性／信心度（Confidence）」作為第三維度（氣泡大小），若某個高影響力點子信心度極低，第一步不是直接開發，而是排一個低成本驗證實驗先把風險壓下來。"}, "myNotes": "發散時要天馬行空，收斂時要冷酷無情——果斷砍掉「又難又沒感」的時間黑洞。", "relatedIds": ["prod-s2-2", "prod-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "prod-s3-1", "categoryId": "cat-product", "stageId": "s3", "subtopic": "快速原型", "title": "低保真線框圖與無程式碼（No-Code）快速原型", "oneLiner": "在花兩週寫程式碼之前，先用 15 分鐘紙筆草圖或 No-Code 工具把畫面拼出來讓人點點看。", "tags": ["#實作工具", "#底層模型"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "建築師蓋大樓前不會直接叫水泥車來灌漿，而是先用紙板黏一個小模型。做軟體或數位服務也一樣，很多人一有靈感就立刻開資料庫、刻精美配色，結果做完才發現整個操作動線超卡。\n\n「低保真線框圖（Low-Fi Wireframe）」就是拿一張白紙和粗頭麥克筆，畫出方框代表按鈕、橫線代表文字，10 分鐘畫完 3 個畫面拿給朋友看：「你猜這裡點下去會發生什麼？」因為看起來很草稿，大家反而敢講真話，而且改錯只要花 30 秒重畫一張紙！", "lv2": "從草圖到可互動原型的三階段漸進打法：\n\n1. 紙筆／白板草圖（15 分鐘）：用粗筆畫（逼自己別糾結字體與像素），只驗證「資訊架構與核心動線」。\n2. 可點擊線框（1–2 小時）：用 Figma、Excalidraw 或單檔靜態 HTML 做出能點擊切換的假畫面，找 3–5 位目標用戶做「放聲思考測試（Think-Aloud Testing）」——你全程閉嘴，只看他們在哪裡皺眉或點錯。\n3. No-Code 功能原型（1–3 天）：用 Notion、Airtable、Make/n8n、Google Forms 或 AI 生成單頁前端，先讓真實資料跑起來，確認真的有人每天用，再決定要不要投資寫正式後端。", "lv3": "原型設計的核心原則是「最低保真度原則（Minimum Viable Fidelity）」：原型的精細程度應剛好足以回答當前想驗證的假設，多一分精細都是浪費，甚至會誘發「沉沒成本謬誤（Sunk Cost Fallacy）」讓創作者不願修改。\n\nJakob Nielsen 的可用性研究指出，針對單一使用者族群，只要測試 5 位代表性用戶就能發現約 85% 的主要介面可用性問題。因此多輪、小批量（每次 5 人、快速修改再測）的迭代效率遠勝過一次投入大量資源做出高保真成品後才做大規模測試。"}, "myNotes": "拿草圖給別人看時，對方會挑剔你的「流程邏輯」；拿精雕細琢的畫面給別人看時，對方只會跟你討論「按鈕顏色好不好看」。", "relatedIds": ["prod-s1-4", "prod-mvp"], "updatedAt": "2026-11-24"},
        {"id": "prod-s3-3", "categoryId": "cat-product", "stageId": "s3", "subtopic": "低成本驗證", "title": "假門測試、預購驗證與人工模擬（Wizard of Oz MVP）", "oneLiner": "連一行核心演算法都還沒寫之前，就能先驗證市場到底願不願意為這個價值買單。", "tags": ["#實作工具", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "你想開一家「AI 自動幫你配穿搭」的網站，難道要先花一年訓練 AI 模型嗎？錯！最聰明的做法是先做一個漂亮網頁，讓客人上傳照片並下單，然後你在螢幕後面「自己人工幫他挑衣服再寄出」——客人以為背後是超強 AI，其實是你在幕後操盤！這就叫「綠野仙蹤（Wizard of Oz）MVP」。\n\n另外還有兩招零開發成本神技：\n• 假門測試（Fake Door）：在網頁上先放一顆「匯出 PDF 報告」按鈕，點下去跳出「此功能即將推出，留下 Email 搶先體驗」，看看到底有多少人真的會去點。\n• 預購驗證：像募資平台一樣，先放影片與產品介紹，看大家願不願意掏出信用卡預購。", "lv2": "四種經典零程式碼 MVP 驗證套路與適用場景：\n\n1. 登陸頁＋假門測試（Landing Page / Fake Door）：適合測試「賣點標題與功能吸引力」。記錄點擊率（CTR）與留名單轉換率。\n2. 綠野仙蹤法（Wizard of Oz）：前端看似全自動，後端全靠你人工處理（如早期的 Zappos 賣鞋先去實體店買再寄出）。適合測試「最終交付成果是否真的解決痛點」。\n3. 禮賓服務法（Concierge MVP）：不假裝自動，直接坦白由你一對一幫前 5 位客戶手動服務，換取極深的流程洞察。\n4. 預購／付費試點（Pre-order）：對 B2B 或高單價產品最有效，有實際付款行為才算真正驗證需求。", "lv3": "Alberto Savoia 在《The Right It》中提出「原型（Prototype）」與「假想型（Pretotype）」的區別：Prototype 驗證的是「我們能做出來嗎？（技術可行性）」，而 Pretotype（假門、預購、綠野仙蹤）驗證的是「如果我們做出來，市場真的會買單嗎？（市場渴望度）」。\n\n執行假門測試時須注意品牌信任風險：不可誤導消費或收取未交付款項，點擊後應誠實告知功能開發中、提供補償或搶先通知，並計算「自有數據（YODA, Your Own Data）」的明確過關門檻（例如：至少 15% 訪客點擊且 5% 留下聯絡方式才啟動開發）。"}, "myNotes": "先做「不能規模化的手工藝」驗證有人願意買單，再把驗證成功的流程寫成自動化程式。", "relatedIds": ["prod-mvp", "prod-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "prod-s3-4", "categoryId": "cat-product", "stageId": "s3", "subtopic": "市場契合度", "title": "產品市場契合度（PMF）的量化與質化判讀訊號", "oneLiner": "沒有 PMF 之前別急著花錢買流量——那就像往破洞的水桶裡拚命倒水。", "tags": ["#底層模型", "#決策框架"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "怎麼知道你的產品真的打中市場了，而不是只有你在自嗨？想像兩種畫面：\n\n• 還沒找到 PMF：你每天拚命推銷，別人用過一次就忘了，只要你一停下廣告，流量立刻歸零，像推一塊巨石上山。\n• 找到 PMF：突然間東西被市場「拉著走」——就算網站偶爾有點小 Bug、介面還不夠漂亮，用戶還是每天回來用，還會主動推薦給朋友，甚至系統當機 10 分鐘就有人焦急寫信來問「什麼時候修好！」。\n\n沒找到 PMF 前，唯一重要的事就是修正產品；找到之後，才是砸錢加速的時候。", "lv2": "判讀是否達到 PMF 的三大黃金指標（同時看量化與質化）：\n\n1. Sean Ellis 40% 測試：問核心活躍用戶「如果明天起再也不能用這個產品，你會有什麼感覺？」如果回答「非常失望（Very Disappointed）」的比例超過 **40%**，代表已經跨過 PMF 門檻。\n2. 留存曲線是否「拉平（Flatten）」：畫出新用戶第 1、7、30、90 天的留存率折線圖。如果曲線一路掉到 0%，代表沒有 PMF；如果曲線掉到某個數字（例如 25%）後穩定走平不再往下掉，代表你抓到了一群鐵粉！\n3. 有機口碑與自發回訪：不靠推播與折扣，自然搜尋與朋友推薦佔比持續上升，且用戶開始拿你的產品去解你原本沒想到的場景。", "lv3": "Marc Andreessen 將 Product-Market Fit 定義為「身處一個好市場，並擁有能滿足該市場的產品」。Superhuman 創辦人 Rahul Vohra 進一步將 Sean Ellis 測試轉化為系統化「PMF 引擎」：\n\n1. 將受訪者分為「非常失望」、「有點失望」、「不失望」三群。\n2. 完全忽略「不失望」族群（避免被非目標用戶帶偏）。\n3. 鎖定「非常失望」族群最愛的價值作為核心定位，並專注解決「有點失望」族群中「認同核心價值但被某個小障礙卡住」的痛點。\n從單位經濟學來看，PMF 亦體現在 LTV/CAC > 3 且 Payback Period 合理，代表成長動能具備正向複利而非靠補貼維生。"}, "myNotes": "留存曲線有沒有「走平」，比下載量或註冊總數誠實一百倍。", "relatedIds": ["prod-s3-3", "prod-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "prod-s4-1", "categoryId": "cat-product", "stageId": "s4", "subtopic": "排程排序", "title": "功能優先級排序框架（RICE／Kano 模型）", "oneLiner": "當老闆、用戶和工程師都覺得自己的需求最急時，用客觀公式與滿意度曲線排出無爭議的路線圖。", "tags": ["#決策框架", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "開餐廳時，客人的需求其實分三種（這就是 Kano 模型）：\n\n1. 基本必備型（沒有會翻桌，有了也不會誇你）：碗盤乾淨、廁所有衛生紙。\n2. 期望線性型（越好越開心）：出餐快、份量足、CP 值高。\n3. 魅力驚喜型（沒有不會怎樣，有了一秒圈粉）：飯後免費送上現烤舒芙蕾、桌邊幫手機無線充電。\n\n排產品功能也是同樣道理：先把「基本必備型」補齊別讓用戶氣跑，再把資源拿去打磨 1–2 個「魅力驚喜型」功能做出記憶點！", "lv2": "實務上把「Kano 類型篩選」與「RICE 計分排序」合體使用：\n\n1. 先用 **Kano 模型**分類：確保 P0 必備項目無漏洞，並選出本季 1 個主打驚喜亮點。\n2. 再用 **RICE 公式**替候選功能打分排序：\n   `RICE 分數 = (觸及人數 Reach × 影響力 Impact × 信心度 Confidence) ÷ 投入工時 Effort`\n   • Reach：本季會用到這個功能的人數。\n   • Impact：3（極大）、2（高）、1（中）、0.5（低）、0.25（極微）。\n   • Confidence：100%（有數據佐證）、80%（中等把握）、50%（純猜測）。\n   • Effort：需要幾「人週（Person-Weeks）」完成。\n3. 分數最高的優先進開發排程，有爭議時直接攤開四個數字討論假設，而不是比誰聲音大。", "lv3": "Kano 模型由狩野紀昭（Noriaki Kano）於 1984 年提出，揭示了產品屬性表現與顧客滿意度之間的非線性關係，包含五類屬性：基本型（Must-be）、期望型（One-dimensional）、魅力型（Attractive）、無差異型（Indifferent）與反向型（Reverse）。值得注意的是 Kano 具備「時間衰減效應」——五年前的魅力型功能（如手機指紋辨識、AI 自動摘要），今天已演變為基本必備型。\n\nRICE 由 Intercom 團隊推廣，其高明處在於納入 Confidence（信心度）懲罰拍腦袋的過度樂觀點子，並將 Effort 置於分母，從本質上優化「單位工程產出的預期價值（Expected Value per Engineering Week）」。"}, "myNotes": "RICE 的精髓是把「信心度」放進公式，沒數據佐證的大膽點子自動打折，逼大家先小步驗證。", "relatedIds": ["prod-s2-4", "prod-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "prod-s4-2", "categoryId": "cat-product", "stageId": "s4", "subtopic": "用戶體驗", "title": "用戶引導（Onboarding）與提升首次核心價值體驗", "oneLiner": "大多數用戶在打開產品的前 3 分鐘就決定要不要再回來，Onboarding 的唯一任務是帶他最快嚐到「啊哈時刻」。", "tags": ["#實作工具", "#底層模型"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "想像你第一次玩一款新遊戲，一進來就跳出 15 頁密密麻麻的操作說明書逼你背按鍵，你大概 10 秒就關遊戲了。但好玩的大作（像薩爾達或瑪利歐）完全不丟說明書，它直接把你放在草原上，讓你走兩步撿起樹枝打敗第一隻小怪，30 秒內你就愛上這遊戲了！\n\n軟體產品的「用戶引導（Onboarding）」就是遊戲的新手村：千萬別一開門就塞一堆彈窗教學或叫人填 10 欄個人資料，而是用最短路徑帶他親手體驗一次「哇，這東西真的超好用！」的那一瞬間（Aha Moment）。", "lv2": "大幅拉升首次體驗與次日留存的五個設計技巧：\n\n1. 縮短「首次價值時間（TTV, Time to Value）」：能免註冊先體驗就免註冊，把填寫資料延後到他真的要儲存或匯出時。\n2. 消滅「空白頁恐懼（Empty State）」：第一次打開千萬別給一個空蕩蕩的白畫面！預先塞入 2–3 筆高品質範例模板或種子資料（就像這座知識庫一打開就有完整卡片能點），讓用戶一秒看懂成品長怎樣。\n3. 進度條與微成就（Checklist）：給 3 個超簡單的新手任務，且把第 1 步設為「已自動完成」（利用稟賦效應與完成欲）。\n4. 情境式提示（Contextual Tooltips）：等用戶真的滑到某功能時才跳出一行小提示，別在首頁一次連環彈 8 個視窗。\n5. 追蹤啟動漏斗：量測「新訪客 → 完成首次核心動作」的轉換率，這往往是拉升留存槓桿最高的指標。", "lv3": "在成長駭客與產品主導成長（PLG, Product-Led Growth）體系中，Onboarding 對應 AARRR 漏斗中的 Activation（啟動）階段。其核心指標為 TTV（Time to Value）與啟動率（Activation Rate）。\n\n經典案例如 Facebook 早期發現「10 天內加滿 7 位好友」、Slack 發現「團隊互傳 2,000 則訊息」與長期留存高度相關。行為設計學（BJ Fogg Behavior Model: B = MAP）指出，新用戶初始動機雖高但能力（熟悉度）極低，因此必須極度降低初始摩擦力（Friction）並提供即時正回饋，將用戶從「好奇試用」平滑過渡到「習慣形成」。"}, "myNotes": "消滅空白頁！讓新用戶一打開就能直接點、直接感受核心價值，勝過寫一萬字的使用說明書。", "relatedIds": ["prod-s3-4", "prod-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "prod-s4-3", "categoryId": "cat-product", "stageId": "s4", "subtopic": "產品紀律", "title": "技術債、功能膨脹與勇敢砍功能的減法紀律", "oneLiner": "每個新功能都不只花一次開發時間，它還會永遠增加介面的複雜度與未來的維護利息；高手靠減法保持產品鋒利。", "tags": ["#底層模型", "#決策框架"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "你看過那種有 80 顆按鈕的傳統電視遙控器嗎？每天真正會按的只有電源、音量和轉台那 5 顆，剩下 75 顆只是讓你每次找按鈕都要找半天。軟體做久了也會得這種病，叫「功能膨脹（Feature Bloat）」——每次有一個人許願就加一顆按鈕，最後產品又重又難用。\n\n而「技術債」就像刷信用卡買東西：為了趕明天上線，先用膠帶把程式碼胡亂黏起來。偶爾應急沒問題，但如果一直不還債重構，以後每加一個小功能都會把舊功能弄壞，利息高到整個系統動彈不得。", "lv2": "維持產品輕盈與健康的四項常態紀律：\n\n1. 每季做一次「功能使用率體檢」：畫出「使用人數 vs 使用頻率」散點圖，位於左下角（沒幾個人用、久久才用一次）的功能，果斷評估合併或下線。\n2. 實施「一進一出」或「預設對新功能說不」原則：每個新增按鈕都要能回答「為什麼不能放進現有流程裡？」。\n3. 幫技術債編列固定還款預算：每個開發衝刺（Sprint）固定保留 15–20% 時間做重構、補測試與清理死碼，別等系統爆炸才想「全部重寫」。\n4. 優雅退場機制（Sunset Protocol）：要砍舊功能時，提前通知受影響用戶、提供替代路徑與資料匯出，把反彈降到最低。", "lv3": "「技術債（Technical Debt）」由敏捷宣言起草人之一 Ward Cunningham 於 1992 年提出，Martin Fowler 進一步提出「技術債四象限」（魯莽 vs 審慎、刻意 vs 無意）：審慎且刻意的技術債（「我們知道這不夠完美，但為了搶先驗證市場先上線，驗證成功立刻重構」）是合理的策略槓桿；無意且魯莽的債則是災難。\n\n在產品複雜度管理上，根據 Tesler 定律（複雜度守恆定律）與 Hicks 定律（選項越多決策時間呈對數上升），無節制的新增功能會產生「複合維護成本（Compounding Complexity）」，導致創新速度隨系統規模增長而指數級衰退，唯有透過定期的產品修剪（Feature Pruning）才能維持核心體驗的清晰度。"}, "myNotes": "加功能很容易，砍功能需要勇氣；把 80% 精力拿來打磨那 20% 大家每天按的功能。", "relatedIds": ["prod-s4-1", "prod-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "prod-s4-4", "categoryId": "cat-product", "stageId": "s4", "subtopic": "商業化與上市", "title": "從單一工具到生態系：產品定價與商業化上市節奏", "oneLiner": "定價不是成本加兩成，而是錨定你幫用戶省下或賺到的價值；先用單點工具切入，再把工作流連成護城河。", "tags": ["#決策框架", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・創新方法與產品開發", "levels": {"lv1": "很多工程師做完一個很棒的工具，定價時心裡想：「伺服器一個月才花我 300 元，那我收 50 元應該很佛心吧？」結果反而沒人買，還虧錢！為什麼？因為顧客根本不在乎你的成本，他只在乎「這東西幫我省了多少時間、或幫我多賺多少錢」。如果這套工具能讓設計師每個月多接兩個案子賺兩萬塊，收月費 500 元他都覺得賺翻了！\n\n另外，想把小工具做成大事業，有一個經典口訣：「單點工具進場（Come for the tool），工作流與生態留人（Stay for the network / workflow）」。像 Notion 先讓你做筆記，再把任務、知識庫、團隊協作全部接在一起，你就再也離不開了。", "lv2": "個人開發者與產品團隊可直接落地的商業化四步驟：\n\n1. 選對定價模式（Value Metric）：收費單位要跟著用戶獲得的價值一起成長（例如按生成數量、按團隊人數、按處理檔案量），並設計「三層階梯方案（免費體驗／個人專業／團隊旗艦）」，把最想賣的方案放在中間加上「最受歡迎」錨點。\n2. 用 Van Westendorp 價格敏感度四題測試定價：問目標客群「多少錢太便宜會懷疑品質？多少錢覺得划算？多少錢有點貴但會考慮？多少錢太貴絕不買？」，找出最佳定價區間。\n3. 設計「滾雪球式」上市節奏（GTM）：封閉內測（10 位種子鐵粉打磨口碑）→ 公開測試（Product Hunt／垂直社群／技術部落格首發）→ 內容 SEO 與用戶案例驅動的長尾自然流量。\n4. 佈局生態擴張：開放 JSON/Markdown 匯入匯出、模板市集或 API 串接，讓用戶把自己的資料與習慣沉澱在你的系統裡。", "lv3": "產品商業化戰略的核心在於對齊「價值指標（Value Metric）」、「獲客管道（Distribution Channel）」與「護城河演進」。Patrick Campbell（ProfitWell）研究顯示，優化定價策略（Monetization）對 SaaS 淨利成長的槓桿效率是獲客（Acquisition）的 4 倍、留存（Retention）的 2 倍。\n\n在成長飛輪設計上，Chris Dixon 提出「Come for the tool, stay for the network」模式：初期靠單人即用的高效率工具克服冷啟動（Cold Start）問題，累積足夠的資料與資產後，再延伸至模板共享、插件生態或協作網路，建立高轉換成本（Switching Costs）與網路效應。"}, "myNotes": "定價決定你吸引什麼樣的客戶：過低的定價往往帶來要求最多、最難伺候且留存最差的客群。", "relatedIds": ["prod-s4-3", "biz-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "life-s1-1", "categoryId": "cat-life", "stageId": "s1", "subtopic": "精力模型", "title": "精力管理四維度：體能、情緒、專注與意義循環", "oneLiner": "時間人人每天都只有 24 小時無法增加，但「精力」可以透過節律訓練不斷擴容與再生。", "tags": ["#底層模型", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "你有沒有遇過這種情況：明明整個週末沒安排行程、時間超多，結果坐在電腦前發呆兩小時一行字都寫不出來；反觀某天精神超好，專心 45 分鐘就把原本要花半天的報告搞定了！這證明真正決定產出的不是「時間」，而是你的「電量（精力）」。\n\n精力就像一座四層金字塔：\n1. 底層是「體能」（睡飽、吃好、有動，沒電一切免談）。\n2. 第二層是「情緒」（焦慮生氣超耗電，平靜開心效率翻倍）。\n3. 第三層是「專注」（一次只做一件事，別邊寫報告邊回訊息）。\n4. 頂層是「意義」（知道自己為什麼而做，內心才有源源不絕的燃料）。", "lv2": "把精力金字塔變成每天 10 分鐘的「四維充電檢核」：\n\n• 體能維度（數量）：固定起床時間、每 90 分鐘起身走動喝水、避開高糖精緻澱粉造成的午後血糖昏迷、每週至少 2–3 次心肺或肌力訓練。\n• 情緒維度（品質）：遇到煩躁時先做 3 次「生理嘆息（吸兩口氣、長吐一口氣）」，每天睡前寫 1 件今天做得不錯的小事。\n• 專注維度（聚焦）：重要任務開「飛航／勿擾模式」，把手機放到看不見的另一個房間。\n• 意義維度（方向）：每天開工前花 30 秒問自己：「今天完成哪一件事，晚上回頭看會覺得很有價值？」", "lv3": "Jim Loehr 與 Tony Schwartz 在《精力管理（The Power of Full Engagement）》中，基於對頂尖職業運動員的生理監測研究指出：高績效的關鍵不在於「線性地撐更久」，而在於「張弛有度的振盪（Oscillation）」——亦即高強度專注投入與刻意深度恢復的規律循環。\n\n在生理學上，這對應人類的「次晝夜節律（Ultradian Rhythm）」：大腦每約 90–120 分鐘會經歷一次從高警覺到疲勞的波峰與波谷。無視波谷強行硬撐會觸發皮質醇（Cortisol）與腎上腺素長期偏高，最終導致職業倦怠（Burnout）與認知功能顯著退化。"}, "myNotes": "管理精力而不是死撐時間：沒電時硬坐兩小時，不如徹底充電 20 分鐘再戰。", "relatedIds": ["life-s1-2", "life-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "life-s1-2", "categoryId": "cat-life", "stageId": "s1", "subtopic": "生理節律", "title": "生理時鐘與黃金產出時段（Chronotype）校準", "oneLiner": "順著自己的生理時鐘排課表，把最燒腦的工作放在頭腦最清醒的 3 小時，別拿黃金時段去回雜事信件。", "tags": ["#實作工具", "#底層模型"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "每個人體內都有一顆天生的生理時鐘：有人像「早起鳥」清晨六點靈感爆棚，晚上九點就想睡；有人像「夜貓子」早上像喪屍，晚上十點才真正開機。這不是懶惰或自律的問題，有一半是基因決定的！\n\n聰明人的排程秘密很簡單：不管你是哪一型，一天中通常只有「連續 2–4 小時」是頭腦最銳利的黃金高峰期。把寫程式、做決策、學最難的新知識全塞進這段時間；等到下午腦袋霧霧的低谷期，再拿去處理整理檔案、回信、開例行會這種不燒腦的雜事。", "lv2": "一週找出並校準你個人黃金時段的實作法：\n\n1. 記錄 7 天「精力溫度計」：每 2 小時在筆記裡打一個 1–5 分的清醒度分數，一週後你會清楚看到自己的高峰（Peak）、低谷（Trough）與反彈期（Recovery）。\n2. 實施「三段式任務配對」：\n   • 高峰期（分析力最強）：排深度工作、寫作、架構設計、困難學習。\n   • 低谷期（通常是午飯後 1–3 點）：排行政瑣事、回訊息、散步、或 20 分鐘小睡。\n   • 反彈期（傍晚或晚間，抑制力較低反而有創意）：排腦力激盪、閱讀、輕鬆覆盤。\n3. 早上起床後 30 分鐘內曬 5–10 分鐘自然光，並把咖啡因延後到起床後 60–90 分鐘再喝，可大幅減少下午斷電感。", "lv3": "時間生物學（Chronobiology）研究顯示，人類睡眠覺醒週期由下視丘視交叉上核（SCN）調控的晝夜節律（Circadian Rhythm）與腺苷累積驅動的睡眠壓力共同決定。Daniel Pink 在《什麼時候是好時候（When）》綜合大型認知實驗數據指出，約 80% 的人遵循「高峰 → 低谷 → 反彈」三段曲線（夜貓型則呈反轉順序）。\n\n有趣的是，Wieth 與 Zacks 的「非最佳時段洞察效應（Inspiration Paradox）」證實：邏輯分析任務應安排在生理高峰期（前額葉抑制雜訊能力最強），但需要跳躍聯想的創意發想，在精力略微下降的反彈期反而常有更高突破率。"}, "myNotes": "保衛每天最清醒的那 2–3 小時，絕對不要一早打開電腦就先陷進信箱和聊天訊息裡。", "relatedIds": ["life-s1-1", "life-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "life-s1-3", "categoryId": "cat-life", "stageId": "s1", "subtopic": "認知省電", "title": "決策疲勞與認知省電術：把日常瑣事自動化", "oneLiner": "大腦的意志力與決策額度像手機電池一樣越做越少，把重複小決定變成固定規則，留電給真正重要的人生抉擇。", "tags": ["#底層模型", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "你一定聽過賈伯斯每天穿一樣的黑色高領毛衣、歐巴馬只穿灰或藍西裝。他們不是沒錢買衣服，而是懂一個殘酷的大腦真相：「每做一個小決定，都在扣你的腦力血條！」\n\n早餐吃什麼、今天穿什麼、這封信要不要先回、中午訂哪家便當……一個早上做完 50 個雞毛蒜皮的小選擇，到了下午要決定重要工作方案時，你的大腦早就沒電了，只好隨便選一個最省事的爛答案，或者乾脆拖延滑手機。把無關緊要的事變成「預設自動駕駛」，就是最強的認知省電術。", "lv2": "替自己建立「日常自動化省電包」的五個立即可行做法：\n\n1. 固定化高頻瑣事：設計 3 套輪替的工作日早餐／午餐名單與固定穿搭公式，早上零思考出門。\n2. 建立「如果－那麼（If-Then）」預先決策規則：例「如果現在是晚上 10 點半，那麼手機自動放到書桌充電不帶上床」，把當下的掙扎改成自動觸發。\n3. 善用檢核表（Checklist）與模板：每週報表、出差打包、寫文章流程全部做成可重複打勾的清單，別每次靠大腦從零回想。\n4. 批次處理（Batching）：把回信、報帳、繳費集中到固定時段一次清空，別分散在整天不斷打斷專注。\n5. 重大決策一律改約「上午或吃飽休息後」，絕不在深夜疲憊時做財務或關係決定。", "lv3": "決策疲勞（Decision Fatigue）源自 Roy Baumeister 的自我耗損（Ego Depletion）研究體系，著名實證如 Danziger 等人對以色列假釋法官的統計分析（雖後續學界對其效應量與混雜因素有討論，但休息與進食前後的決策品質差異仍具高度啟發）：在連續高負荷判斷後，個體傾向退回最省力的「維持現狀偏誤（Status Quo Bias）」或衝動選擇。\n\n在認知負荷理論（Cognitive Load Theory）下，透過建立習慣迴路（基底核自動化處理）與外化工作記憶（清單、腳本、預設選項），能大幅降低無關認知負荷（Extraneous Load），將稀缺的前額葉執行功能（Executive Function）保留給高價值的系統二思考。"}, "myNotes": "凡是重複超過三次的小決定，都值得寫成一條個人規則、一個清單或一段自動化腳本。", "relatedIds": ["life-s1-1", "life-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "life-s1-4", "categoryId": "cat-life", "stageId": "s1", "subtopic": "深度恢復", "title": "高品質休息與主動恢復：為何滑手機越滑越累", "oneLiner": "滑短影音不是在休息，而是在用高頻資訊繼續轟炸大腦；真正的充電是讓前額葉徹底下線。", "tags": ["#底層模型", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "工作兩小時覺得腦袋快炸了，你想說「休息 15 分鐘吧」，於是拿起手機刷 Reels、看新聞、回群組訊息。結果 15 分鐘過去，你不但沒有神清氣爽，反而覺得眼睛痠、腦袋更脹、更不想回到工作上！\n\n為什麼？因為大腦處理短影音和社群貼文時，仍然在瘋狂接收刺激、判斷喜不喜歡、比較自己跟別人，CPU 其實一直跑在 90%，根本沒停機！真正的休息像讓滾燙的引擎「熄火降溫」：閉眼放空、散步看遠方樹木、伸展拉筋或小睡 15 分鐘，回來才會真的滿血復活。", "lv2": "替換「假休息」的五種高品質主動恢復清單（依可用時間挑選）：\n\n• 3 分鐘微休息：遠眺窗外 6 公尺以上景物（20-20-20 護眼）、起身深呼吸伸展、喝一大杯水。\n• 10–20 分鐘黃金充電：NSDR（非睡眠深度休息／引導放鬆音檔）或 15–20 分鐘 Power Nap（切記別超過 30 分鐘以免進入深睡期起床更昏沉）。\n• 30 分鐘切換大腦：不帶手機去公園散步（讓大腦進入預設模式網路，常會自己蹦出剛才卡關的靈感）。\n• 週末主動恢復：做一件需要「動手不動腦」或流點汗的事（煮飯、運動、拼樂高、畫畫），比整天躺床滑手機更能消除心累。\n• 黃金睡眠守則：睡前 1 小時調暗燈光、遠離藍光與刺激性工作訊息，把睡眠當成隔天戰力的第一優先投資。", "lv3": "神經科學指出，滑手機屬於「高刺激被動消費」，會持續觸發多巴胺預測誤差迴路並佔用工作記憶，阻斷大腦的記憶鞏固與代謝廢物清除（如大腦在深度休息與睡眠時透過膠淋巴系統 Glymphatic System 清除 β-澱粉樣蛋白）。\n\nStephen Kaplan 的「注意力恢復理論（Attention Restoration Theory, ART）」證實，接觸自然環境的「柔和著迷（Soft Fascination）」能讓耗竭的定向注意力（Directed Attention）快速復原；而史丹佛教授 Andrew Huberman 推廣的 NSDR（Non-Sleep Deep Rest）協議則顯示，10–20 分鐘的清醒深度放鬆可顯著補充紋狀體多巴胺儲備並提升後續學習留存率。"}, "myNotes": "工作空檔想充電，記得「離開螢幕＋不輸入新資訊」兩原則，10 分鐘放空勝過滑一小時手機。", "relatedIds": ["life-s1-1", "life-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "life-s2-1", "categoryId": "cat-life", "stageId": "s2", "subtopic": "優先級守衛", "title": "艾森豪矩陣與「重要不緊急」象限的實戰守衛戰", "oneLiner": "平庸的人整天在救「緊急但不重要」的火；高手每天先鎖死一塊時間，專門推進「重要但不緊急」的人生複利。", "tags": ["#決策框架", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "想像你要把大石頭、小碎石和細沙裝進一個玻璃罐。如果你先把細沙（雜事、別人臨時丟來的急件）倒滿，大石頭（健康、核心技能、長期專案）就永遠塞不進去了；但如果你先把大石頭放進去，小碎石和細沙自然會填進縫隙裡。\n\n艾森豪矩陣把所有事分成四格：\n1. 重要又緊急（立刻救火）：明天截止的報稅、系統當機。\n2. **重要不緊急（人生大石頭）**：運動、深造學新技能、經營個人知識庫、維護重要關係。\n3. 緊急不重要（偽裝成急事的雜音）：不斷跳出來的群組訊息、別人的臨時小請求。\n4. 不重要不緊急（時間黑洞）：無意識刷八卦。\n\n人生拉開差距的秘密全在第 2 格：它今天不做不會怎樣，但一年不做就會徹底落後。", "lv2": "打贏「第二象限守衛戰」的四個日常戰術：\n\n1. 每天早上先排「1–2 顆大石頭」：在打開通訊軟體之前，先花 60–90 分鐘推進一件重要不緊急的事。\n2. 辨識「偽緊急」：對第三象限的請求別立刻秒回，先問自己「這件事晚 3 小時處理真的會天塌下來嗎？」。\n3. 把第二象限「人為設下截止日與儀式感」：重要不緊急的事最容易被無限期拖延，直接把它寫進行事曆變成不可取消的約會（例：每週二四晚上 8 點固定運動／進修）。\n4. 縮減第一象限的根治法：每次救完一場火，花 5 分鐘問「當初如果提前做好哪件第二象限的事（如自動化備份、提早溝通），這場火就不會燒起來？」。", "lv3": "艾森豪矩陣由 Stephen Covey 在《高效能人士的七個習慣》中系統化為「要事第一（Put First Things First）」。行為心理學上的「單純緊急效應（Mere Urgency Effect，Zhu et al., 2018）」實驗證明：人類天生傾向優先選擇「有緊迫期限但回報低」的任務，而放棄「期限寬鬆但回報高」的任務，這是一種演化殘留的短期注意偏誤。\n\n因此，守衛第二象限不能靠意志力硬扛，必須靠「結構性預設」——在行事曆上預先封鎖時段（Pre-commitment）、關閉非同步通訊的即時推播，並將長期目標拆解為當週可驗收的微小里程碑。"}, "myNotes": "把「重要不緊急」的事當成跟重要客戶的會議直接寫進行事曆，它才不會永遠被瑣事擠掉。", "relatedIds": ["life-s2-2", "life-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "life-s2-2", "categoryId": "cat-life", "stageId": "s2", "subtopic": "清空大腦", "title": "GTD（搞定）清空大腦法與收件匣歸零節奏", "oneLiner": "大腦是用來產生好點子的，不是用來當便利貼記雜事的；把所有未竟事項倒進可信賴的外部收件匣，心就會瞬間安靜下來。", "tags": ["#實作工具", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "你有沒有過這種煩躁感：正在專心做事，腦袋裡突然冒出「啊！忘記繳水電費」、「等一下要回小明訊息」、「下禮拜報告還沒找資料」，結果越想越焦慮，什麼事都做不好？這就像電腦背景開了 50 個沒關的網頁分頁，記憶體直接爆滿卡死！\n\nDavid Allen 發明的 GTD（Getting Things Done）核心超簡單：準備一個「統一收件匣（Inbox）」，腦中只要閃過任何待辦，立刻 5 秒丟進去，然後放心忘記它！等固定時間再一次打開收件匣分類處理，你的大腦記憶體瞬間釋放出來。", "lv2": "直接套用的 GTD 五步極簡閉環（不用買昂貴軟體，一個筆記或待辦 App 就能跑）：\n\n1. 捕捉（Capture）：所有靈感、雜事、待辦全部秒丟進單一收件匣（Inbox），絕不靠腦記。\n2. 釐清（Clarify）：每天固定 1–2 次清空收件匣，逐條問「這件事能不能行動？」\n   • 不能行動 → 丟垃圾桶、存成參考資料、或丟進「有一天／也許」清單。\n   • 可以行動且 **2 分鐘內搞定** → 立刻做完（兩分鐘法則）！\n   • 超過 2 分鐘 → 寫成具體的「下一步實體動作（Next Action）」（不要寫「辦護照」，要寫「上網預約下週三領務局時段」）。\n3. 整理（Organize）：放進「行事曆（特定日期）」、「下一步行動清單」或「等待他人回覆清單」。\n4. 反思（Reflect）：每週五花 20 分鐘做「週覆盤」，把收件匣歸零並校準下週。\n5. 執行（Engage）：依當下時間、精力與地點，放心挑清單上的事做。", "lv3": "GTD 的心理學基石是「蔡格尼克效應（Zeigarnik Effect）」：人腦對尚未完成的任務會產生持續的侵入性回想與焦慮。然而 Masicampo 與 Baumeister（2011）的後續實驗證實，只要替未完成任務寫下「具體執行計畫」並存入外部可信系統，大腦的侵入性干擾就會立即大幅下降，無須等到任務真正完成。\n\nGTD 失敗最常見的原因不是捕捉不夠，而是「缺乏每週覆盤（Weekly Review）」——一旦清單過期失真，大腦就會失去對外部系統的信任，重新退回用腦袋硬記的焦慮狀態。"}, "myNotes": "不要在待辦清單寫模糊大詞（如「寫論文」），永遠寫成 15 分鐘內能動手的「下一步具體動作」。", "relatedIds": ["life-s1-3", "life-s2-1"], "updatedAt": "2026-11-24"},
        {"id": "life-s2-3", "categoryId": "cat-life", "stageId": "s2", "subtopic": "深度工作", "title": "時間區塊（Time Blocking）與單核深度工作", "oneLiner": "沒有排進時間表的待辦清單只是許願清單；給重要任務劃出受保護的專屬時段，一次只跑單核引擎。", "tags": ["#實作工具", "#底層模型"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "「待辦清單」有個致命缺點：你很容易一口氣寫下 15 件事，卻完全沒算過一天根本塞不下 15 件事！結果晚上只打勾 5 個，滿滿挫折感。\n\n「時間區塊法（Time Blocking）」就像把一天切成幾塊樂高積木，直接把任務「放進」行事曆的格子裡（例如：09:00–11:00 深度寫作、11:00–11:30 回信、14:00–15:30 專題開發）。你一眼就能看出時間夠不夠用，而且當那個時段開始時，不用再猶豫「現在要做哪一件？」，照著積木專心做完就好！", "lv2": "四步驟建立不會中途崩盤的彈性時間區塊：\n\n1. 每天留出 **20–30% 緩衝區塊（Buffer Block）**：千萬別把行事曆排得像俄羅斯方塊一格不漏！預留一塊緩衝時間吸收突發狀況，計畫才不會一被打斷就整天報銷。\n2. 區分「深度工作塊（90 分鐘起跳）」與「淺度雜事塊（30 分鐘批次）」：深度塊期間關閉所有通知、只開跟當前任務有關的視窗。\n3. 善用「開工儀式」與「收工儀式」：進入深度塊前倒杯水、開計時器、手機翻面；結束一天時把未完成事項移到明天區塊並喊一聲「今日收工」，避免下班後大腦繼續空轉。\n4. 允許即時重排：有突發急事插進來沒關係，只要順手把被擠掉的積木往後拖到緩衝區即可，重點是「永遠清楚自己此刻的選擇」。", "lv3": "Cal Newport 在《深度工作力（Deep Work）》中指出，知識工作者的核心產出公式為：`高品質產出 = 專注時間 × 專注強度`。商學院教授 Sophie Leroy 的「注意力殘留（Attention Residue）」實驗證實：當你從任務 A 切換去瞄一眼信件或訊息，再切回任務 A 時，大腦並不會瞬間歸零，而是有大量認知資源殘留在剛剛的雜訊上，導致實質智商與準確率顯著下降，單次切換恢復深度專注平均需耗時 15–23 分鐘。\n\n時間區塊法結合單核工作模式，本質上是將「多工切換稅（Context Switching Tax）」降到最低的作業系統排程演算法。"}, "myNotes": "行事曆排太滿一定會崩潰，每天刻意留一塊「突發緩衝區」，時間區塊才真的活得下去。", "relatedIds": ["life-s1-2", "life-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "life-s2-4", "categoryId": "cat-life", "stageId": "s2", "subtopic": "視覺化流暢度", "title": "個人看板（Kanban）與限制在製品（WIP Limit）", "oneLiner": "停止同時開十個坑卻一個都填不平；把正在做的事限制在最多 3 件以內，你反而會完成得更快。", "tags": ["#實作工具", "#底層模型"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "看高速公路塞車就知道一個神奇道理：車子越多，大家反而開越慢；只要匝道儀控限制同時上路的車數，每台車都能順暢飆到終點！\n\n個人工作也完全一樣。很多人書桌上同時翻開 5 本書、電腦開著 4 個半成品專案，每天每件事各做一點點，結果過了一個月竟然「一件都沒完成」。「個人看板（Personal Kanban）」只要三欄——【待辦】、【進行中】、【已完成】——再加一條鐵律：**【進行中】那欄永遠不能超過 3 張卡片！**想開新坑？先把手上這張推到【已完成】再說！", "lv2": "5 分鐘搭建你的個人看板（用白板便利貼、Notion、Trello 或任何數位看板皆可）：\n\n1. 建立四個基礎欄位：`待辦池（Backlog）` → `本週目標（This Week）` → `進行中（Doing，上限 2–3 件）` → `已完成（Done）`（可外加一欄 `等待中 Waiting` 放卡在別人那裡的事）。\n2. 嚴格執行 **WIP 上限（Work In Progress Limit）**：同時進行中的核心任務最多 3 件（甚至深度寫作或開發時只限 1 件）。\n3. 讓「已完成」欄位保留整週：每週五看著滿滿的 Done 欄位，能給你極強的成就感與真實產能估計（原來我一週其實只能推完 5 張大卡，下週別再貪心塞 12 張）。\n4. 抓出瓶頸卡片：哪張卡在 Doing 裡躺超過 4 天動也不動？立刻把它拆成更小的卡片，或檢討是不是遇到阻礙。", "lv3": "看板系統源自豐田精實生產（TPS），後由 Jim Benson 發展為 Personal Kanban。其背後的數學鐵律是排隊理論中的「利特爾法則（Little's Law）」：\n`平均交付週期（Lead Time）= 在製品數量（WIP）÷ 產出速率（Throughput）`\n\n這條公式用數學證明了：在個人產出速率固定的前提下，想要把單一專案「最快做完」，唯一槓桿就是**壓低同時進行的在製品數量（WIP）**。「Stop starting, start finishing（停止一直開新坑，開始把事收尾）」不僅加速價值交付，也能徹底消除大量半成品帶來的心理負債。"}, "myNotes": "停止一直開新坑，開始把事做完！把「進行中」鎖死在最多 3 件，完成速度立刻翻倍。", "relatedIds": ["life-s2-3", "life-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "life-s3-1", "categoryId": "cat-life", "stageId": "s3", "subtopic": "數位整理", "title": "PARA 數位整理法：按行動力而非學科管檔案", "oneLiner": "不要再按「學科分類」建十層找不到東西的資料夾了，改按「你何時會用到它」分成四個抽屜。", "tags": ["#實作工具", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "想像你進廚房準備炒蛋，你是希望「蛋、油、鹽、鍋鏟」都在瓦斯爐旁邊順手一拿就有，還是希望它們被按照「植物類、動物類、礦物類、金屬類」分散鎖在四個不同房間裡？\n\n大多數人整理電腦資料夾就是犯了這個錯，開了一堆「行銷、財務、設計、個人」資料夾，結果做一個專案時資料散落六個地方！Tiago Forte 提出的 **PARA** 法則把全世界所有的數位檔案只分成 4 個資料夾，依照「現在多急著用」由熱到冷排列：\n• **P（Projects 專案）**：現在正在做、有明確終點的事（例：2026 論文寫作、日本五日遊）。\n• **A（Areas 領域）**：長期要維護、沒有終點的責任（例：健康、財務、職涯）。\n• **R（Resources 資源）**：未來可能派上用場的興趣與知識庫（例：Prompt 技巧、投資筆記）。\n• **A（Archives 封存）**：已經做完或暫時用不到的東西，全部丟進冷宮，眼不見為淨但隨時搜得到！", "lv2": "15 分鐘把混亂的電腦桌面、Google Drive 與筆記軟體統一成 PARA 架構：\n\n1. 先別逐一整理舊檔案！直接開一個 `4_Archives/舊檔案大掃除_2026` 把桌面與根目錄全部掃進去（以後用到再搜出來移回 P/A/R，省下 10 小時白工）。\n2. 在每個工具（電腦本機、雲端硬碟、筆記 App）都建立一模一樣的四個頂層資料夾：`1_Projects`、`2_Areas`、`3_Resources`、`4_Archives`。\n3. 專案一結束，立刻整個資料夾拖進 `4_Archives`，讓 `1_Projects` 永遠只保留正在燃燒的 3–7 個現役專案，一眼清爽。\n4. 搭配搜尋而非深層巢狀資料夾：每個資料夾最多只建 2 層，檔名加上清楚關鍵字或日期（如 `20261124_提案初稿`）。", "lv3": "PARA（Projects, Areas, Resources, Archives）的革命性在於將資訊架構從傳統圖書館式的「靜態主題分類法（Taxonomy by Subject）」轉向「行動導向組織法（Organization by Actionability）」。\n\n根據資訊檢索的「即時性原則（Just-in-Time Organization）」，人在執行專案時需要的是跨學科材料的「情境聚合」。PARA 讓知識資產像流水一樣在四個層級間自然流動——資源（R）在開案時被拉進專案（P），專案結案後成品與復盤沉澱為領域標準（A）或資源（R），其餘過程稿退入封存（A），達成低維護摩擦與高複用率。"}, "myNotes": "整理舊檔案最快的方法不是一個一個分類，而是全部塞進一個「舊檔案封存」資料夾，從今天開始用 PARA 乾淨重開！", "relatedIds": ["life-s3-2", "life-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "life-s3-2", "categoryId": "cat-life", "stageId": "s3", "subtopic": "知識複利", "title": "CODE 知識處理流程：捕捉、整理、蒸餾與表達", "oneLiner": "只收藏不消化叫「數位倉鼠」；把讀過的精華一層層提煉並實際輸出成作品，知識才會產生複利。", "tags": ["#底層模型", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "很多人手機裡存了 500 篇「以後一定會看」的好文章、買了 30 本書，結果真的要用時腦袋一片空白——這叫做「收藏家謬誤」，以為按了讚或存進書籤就等於自己學會了。\n\n想讓知識真的長在你身上，要跑完 **CODE** 四個步驟：\n1. **C（Capture 捕捉）**：只存真正讓你「心頭一震」的重點，別整篇無腦複製。\n2. **O（Organize 整理）**：用 PARA 放進你未來真的會用到的專案或領域。\n3. **D（Distill 蒸餾）**：像把一整鍋高湯熬成濃縮雞精，幫筆記畫重點、用自己話寫三句摘要。\n4. **E（Express 表達）**：這步最關鍵！把筆記變成一篇文章、一份簡報、一個小工具或跟朋友分享的觀點。只有「輸出」，知識才真正屬於你。", "lv2": "把 CODE 落地到你每天使用這座「智光個人知識庫」的四個習慣：\n\n1. 捕捉門檻：問自己「這段話能幫我解決哪個正在煩惱的問題？」，通過才存進來。\n2. 漸進式總結（Progressive Summarization）：\n   • 第 1 層：貼上原文或 AI 生成內容。\n   • 第 2 層：把最關鍵的句子加粗。\n   • 第 3 層：在「個人筆記（myNotes）」寫下 1–2 句你自己的大白話心得或生活案例。\n3. 打造「半成品積木（Intermediate Packets）」：每次做完專案，把好用的模板、Prompt、分析框架拆出來存成獨立卡片，下次新專案直接拼裝，速度提升三倍。\n4. 每週強制小輸出：挑 1 張最有感的卡片，改寫成一則貼文、一段對團隊的分享，或實際套用在當週工作上。", "lv3": "CODE（Capture, Organize, Distill, Express）是《打造第二大腦（Building a Second Brain）》的核心知識管線，與認知學習科學中的「生成效應（Generation Effect）」與「費曼學習法（Feynman Technique）」高度契合。\n\n心理學實證顯示，被動重讀與劃線的長期留存率極低，而「蒸餾（用自身語意重構）」與「表達（主動檢索並轉化為外部產出）」能強迫大腦建立多節點神經連結。當知識庫從「靜態檔案櫃」升級為「半成品組件工廠」，個人產出便從線性時間投入躍升為指數型知識複利。"}, "myNotes": "你不是靠「存了多少篇」變強，而是靠「用自己的話改寫並實際用過幾篇」變強。", "relatedIds": ["life-s3-1", "life-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "life-s3-3", "categoryId": "cat-life", "stageId": "s3", "subtopic": "覆盤校準", "title": "週覆盤、月校準與年度人生盤點儀表板", "oneLiner": "沒有覆盤的努力只是在原地重複同一天的經驗；每週 20 分鐘的冷靜回看，能幫你避開走歪一整年的大彎路。", "tags": ["#實作工具", "#決策框架"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "開飛機從台北飛東京，其實有 95% 的時間飛機都稍微偏離航線，之所以最後能精準降落，是因為儀表板每隔幾秒就在微調修正方向。人生也是一樣——如果一整年都只顧著低頭狂奔、從來不抬頭看地圖，很可能拼命跑了一年才發現跑錯方向！\n\n不用寫幾千字的沉重日記，只要每週五花 20 分鐘問自己三個超簡單問題：\n1. 這週最值得慶祝的 3 個小勝利是什麼？\n2. 哪裡卡住了？下週做哪一個小調整就能更順？\n3. 下週最重要的 3 件事是什麼？\n\n光是這個小習慣，就能讓你比 90% 盲目忙碌的人活得更清醒。", "lv2": "建立「三層節律覆盤儀表板」（省時又能真正落地）：\n\n• **週覆盤（每週五／日，20 分鐘）**：清空收件匣與桌面 → 檢視本週 Done 看板 → 寫下「3 贏（Wins）＋1 改進（Improve）＋下週 Top 3 焦點」。\n• **月校準（每月底，45 分鐘）**：檢查本月專案進度、財務收支、運動與睡眠紀錄，果斷砍掉已經不值得投入的分支專案。\n• **年度盤點（每年 12 月，半天咖啡廳儀式）**：回顧一整年的相簿與行事曆（相簿是最誠實的人生紀錄！），用「高光時刻／耗能事件／關鍵成長／明年三大主題詞」收尾，訂出明年 Q1 的第一批行動。", "lv3": "覆盤機制在組織學習與控制論中對應「雙環學習（Double-Loop Learning，Chris Argyris）」與 PDCA 閉環：單純埋頭修正動作只是單環學習，而月度與年度盤點則會回頭檢視「我們當初設定的目標與底層假設本身對不對？」。\n\n在個人表現心理學中，定期覆盤還能對抗「近因偏誤（Recency Bias）」與「負面偏誤」——透過客觀紀錄數據與成就清單，讓大腦看見真實的累積軌跡，顯著提升自我效能感（Self-Efficacy）並降低長期焦慮。"}, "myNotes": "年度盤點時先翻一遍手機相簿和行事曆，你會驚訝自己這一年其實走了這麼遠。", "relatedIds": ["life-s3-2", "life-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "life-s3-4", "categoryId": "cat-life", "stageId": "s3", "subtopic": "資訊減法", "title": "數位斷捨離與資訊飲食（Information Diet）設計", "oneLiner": "你吃進什麼食物就長出什麼身體；你每天餵大腦吃什麼資訊，就長出什麼樣的專注力與世界觀。", "tags": ["#實作工具", "#底層模型"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "大家都知道天天吃炸雞泡麵會傷身，卻常常毫無防備地讓大腦每天吃三小時的「資訊垃圾食物」——聳動標題新聞、演算法自動推播的短影音、讓人越滑越焦慮的炫耀貼文。這些東西專門設計來綁架你的注意力，讓你又累又煩，卻什麼真正有用的東西都沒學到。\n\n「資訊飲食」不是要你去深山當原始人，而是奪回主動權：從「演算法餵什麼我吃什麼」，改成「我自己決定每天看哪幾個高營養來源」，把剩下的雜音全部靜音！", "lv2": "30 分鐘完成個人「數位環境大掃除」五步驟：\n\n1. 關掉 90% 的手機推播：只留真正重要的人（家人、核心工作）與行事曆提醒，所有社群、購物、新聞 App 紅點全部關閉。\n2. 區分「高頻雜訊（日更即時新聞）」與「低頻高質（深度書籍、每週精選電子報、經典論文）」：把資訊攝取從分鐘級拉長到週級。\n3. 幫社群軟體增加「摩擦力」：把容易沉迷的 App 移出手機第一頁（甚至改成只用電腦網頁版開），把知識庫、電子書或筆記放到最順手的位置。\n4. 設立「無螢幕緩衝區」：起床後 30 分鐘與睡前 1 小時不碰社群與新聞，保護大腦開機與關機品質。\n5. 每季做一次「訂閱大清倉」：退訂超過一個月沒點開的電子報、頻道與群組。", "lv3": "Cal Newport 的《數位極簡主義（Digital Minimalism）》與 Clay Johnson 的《Information Diet》共同指出，在注意力經濟（Attention Economy）下，免費平台的商業模式必然透過「間歇性變動獎勵（Intermittent Variable Rewards）」與情緒極化（特別是憤怒與焦慮）來最大化停留時長。\n\nNassim Taleb 在《反脆弱》中提出「訊噪比（Signal-to-Noise Ratio）」隨觀察頻率急劇惡化的法則：每分鐘盯新聞看到的幾乎 100% 是雜訊，拉長到每週或每月閱讀深度長文與經典書籍，訊號比例才大幅上升。設計環境摩擦力（Choice Architecture）遠比靠意志力克制滑手機有效得多。"}, "myNotes": "不要考驗自己的意志力，直接把干擾 App 關推播、移出首頁，讓好習慣阻力最小、壞習慣阻力最大。", "relatedIds": ["life-s1-4", "life-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "life-s4-1", "categoryId": "cat-life", "stageId": "s4", "subtopic": "多維平衡", "title": "生命之輪與多維度目標平衡：職涯、財務、健康與關係", "oneLiner": "人生不是單科競賽；如果事業考了 100 分，健康和關係卻掉到 20 分，這台車的輪子照樣會劇烈顛簸跑不遠。", "tags": ["#決策框架", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "把一個圓分成八塊披薩：健康、事業、財務、家庭與伴侶、友誼社群、個人成長、休閒娛樂、心靈意義。給每一塊打 1 到 10 分並連成一圈，這就是「生命之輪（Wheel of Life）」。\n\n很多人一輩子只盯著「事業」跟「錢」猛衝，結果畫出來的輪子長得像一顆畸形馬鈴薯——滾起來顛簸不堪，甚至某天身體突然亮紅燈，前面賺的錢全部拿去補健康。生命之輪不是要求你每一項都同時衝到 10 分（那會累死），而是提醒你：「先補齊掉到 5 分以下的那塊短板，別讓任何一顆玻璃球摔碎！」", "lv2": "每半年做一次「生命之輪體檢」的四個步驟：\n\n1. 誠實打分（1–10 分）：針對 6–8 個核心生活維度，以「自己內心的滿意度」（不是跟別人比較）打分。\n2. 分辨「玻璃球 vs 橡膠球」：工作專案常是橡膠球，掉了還能彈起來；但健康、家人關鍵時刻與個人誠信是玻璃球，摔碎了極難修補，優先級永遠最高。\n3. 找出「高槓桿短板」：挑出 1–2 個分數最低（或拖累其他維度最嚴重，例如睡眠與體能）的面向，訂為下一季的優先修補區。\n4. 接受「動態平衡（Seasonality）」：人生不同階段本來就有不同重心，衝刺事業的季節可以讓娛樂暫時維持 6 分即可，只要每個維度都守住「最低安全底線（例如 6 分）」就不會翻車。", "lv3": "生命之輪源於生涯教練與正向心理學領域，呼應 Martin Seligman 的 PERMA 幸福模型（Positive Emotion 正向情緒、Engagement 投入、Relationships 關係、Meaning 意義、Accomplishment 成就）。\n\n在系統動力學視角下，人生各維度並非互相獨立，而是存在強耦合的增強與調節迴路——例如健康與睡眠是所有維度的底層乘數（Multiplier），一旦低於臨界閾值會引發全面崩盤。此外，「動態平衡」概念破解了完美主義式的「同時面面俱到」迷思，改以「設定下限底線（Floor）＋單季聚焦單一突破（Focus）」達成長期穩健成長。"}, "myNotes": "不用追求八個維度同時拿 10 分，先守住每一項的「6 分安全底線」，再挑選當季 1–2 項全力突破。", "relatedIds": ["life-s3-3", "life-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "life-s4-2", "categoryId": "cat-life", "stageId": "s4", "subtopic": "長期規劃", "title": "反向規劃法：從五年後的理想日常倒推本季行動", "oneLiner": "別只從「我現在會什麼」往外推，試著先畫出五年後理想的一天長什麼樣，再一層層倒推回這個月該踏出的第一步。", "tags": ["#決策框架", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "走迷宮有一個大家都知道的偷吃步：從「起點」往裡走很容易撞死胡同，但從「終點」往回畫，路徑一下子就清楚了！規劃人生也是同樣道理。\n\n如果你只看眼前，每天都在被眼前的帳單、老闆的需求和別人的節奏推著走，五年後往往只是今天的放大版。試著閉眼描繪「五年後某個平凡的星期二」：你幾點自然醒？跟誰吃早餐？上午在做什麼讓你眼睛發亮的事？收入從哪裡來？把這個畫面寫清楚後，一路倒推：「要過上那種日子，三年後我要具備什麼？一年後要有什麼成果？那**這 90 天**我該先完成哪一件事？」", "lv2": "用「5 年 → 1 年 → 90 天 → 本週」四階倒推模板寫下你的人生藍圖：\n\n1. **五年理想日（1 頁紙）**：具體寫下居住環境、工作型態、財務自由度、身體狀態與日常節奏（越具體越有畫面感）。\n2. **一年關鍵里程碑（3 個以內）**：如果明年此時回頭看，完成哪 3 件事會讓你確定自己正穩穩走在前往五年藍圖的路上？\n3. **本季 90 天衝刺（OKR／專案）**：90 天是人類執行力最強的週期（不會太短做不出東西，也不會太長導致麻痺）。只挑 1–2 個核心專案，設定清楚的可驗收成果。\n4. **本週領先指標（Lead Measures）**：把 90 天目標拆成每週可控的具體行動（例如：每週投入 5 小時打造核心作品、每週運動 3 次）。", "lv3": "反向規劃法（Backcasting）原為永續發展與策略管理領域的未來學方法，相較於傳統「預測法（Forecasting，從過去趨勢線性外推未來）」，Backcasting 特別適合高度不確定或需要結構性躍遷的情境——它先定義期望的未來終態，再逆向推演所需的轉折點與能力資產。\n\n在執行落地上，搭配《執行力的修練（4DX）》區分「滯後指標（Lag Measures，如年底存款或減重公斤數，你無法直接控制）」與「領先指標（Lead Measures，如每週儲蓄率與訓練次數，你 100% 能直接控制且能預測結果）」，即可將遙遠願景精準錨定到每一天的具體行動。"}, "myNotes": "不要問「五年後我想擁有什麼頭銜」，要問「五年後我希望每個平凡的星期二怎麼過」。", "relatedIds": ["life-s4-1", "life-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "life-s4-3", "categoryId": "cat-life", "stageId": "s4", "subtopic": "習慣系統", "title": "系統勝過目標（Systems vs Goals）：打造可持續節律", "oneLiner": "贏家和輸家往往有著一模一樣的目標；真正決定誰能走到終點的，是每天毫不費力就能重複運轉的「日常系統」。", "tags": ["#底層模型", "#經典案例"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "「今年我要瘦 10 公斤」是一個目標；「每天晚餐後散步 30 分鐘、家裡不買含糖飲料」是一個系統。「今年我要寫一本書」是一個目標；「每天早上喝完咖啡後固定寫 300 字」是一個系統。\n\n只靠目標有兩個大陷阱：第一，在還沒達成之前你每天都在覺得自己「還沒成功」很痛苦；第二，就算某天咬牙達標了，一放鬆馬上反彈打回原形。把焦點換成「愛上每天的微系統」，你每天做到就贏一次，結果只是時間到了自然掉下來的果實！", "lv2": "套用《原子習慣》四法則，把任何好習慣改造成自動運轉的系統：\n\n1. 讓提示顯而易見（Make it obvious）：把書放在枕頭旁、把運動鞋擺在玄關、把知識庫設成瀏覽器首頁，並用「習慣堆疊」綁在既有動作後（例：泡完早茶後，立刻看 1 張知識卡）。\n2. 讓習慣有吸引力（Make it attractive）：把需要做的事跟喜歡的事綁在一起（例：邊踩飛輪邊看喜歡的節目）。\n3. 讓行動輕而易舉（Make it easy）：善用「兩分鐘規則」把門檻壓到不可能失敗（不是「每天讀書 1 小時」，而是「每天翻開書讀 1 頁」）。\n4. 讓獎賞令人滿足（Make it satisfying）：在月曆或看板上打勾累積連勝紀錄，並遵守「絕不錯過兩次（Never Miss Twice）」原則——偶爾破功一天沒關係，隔天立刻接上就不算失敗！", "lv3": "James Clear 在《原子習慣（Atomic Habits）》與 Scott Adams 提出的「系統優先哲學」揭示了目標導向的四個結構性盲點：倖存者偏誤（輸贏雙方目標相同）、暫時性改變（達標即停手）、延遲幸福（把快樂綁在未來條件），以及與長期進步的衝突。\n\n更深層的驅動力來自「身分認同層級的習慣（Identity-Based Habits）」：每一次執行微小系統動作，都是在為「我是一個持續學習者／健康的人／創作者」投下一張選票。當行為與自我認同對齊時，執行系統不再消耗意志力，反而成為維持認知一致性的自然本能。"}, "myNotes": "設定目標用來定方向，設計系統用來真正抵達；偶爾破功沒關係，守住「絕不錯過兩次」就贏了！", "relatedIds": ["life-s4-2", "life-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "life-s4-4", "categoryId": "cat-life", "stageId": "s4", "subtopic": "人生作業系統", "title": "個人人生作業系統（Life OS）整合與彈性迭代", "oneLiner": "把精力節律、任務看板、第二大腦與長期藍圖接成一套極簡可演化的個人作業系統，讓工具服務生活，而不是你服務工具。", "tags": ["#底層模型", "#實作工具"], "status": "mastered", "sourceType": "ai_generated", "sourceRef": "第八階段・精力管理與人生系統", "levels": {"lv1": "手機如果沒有 iOS 或 Android 作業系統，所有 App 都只是一堆散落的零件。你的生活也是一樣：如果筆記放這裡、待辦記那裡、目標寫在年初就忘掉、累了就亂滑手機，每天都會覺得很忙卻說不出成就感。\n\n所謂「個人人生作業系統（Life OS）」，就是把前面學的所有好工具用最精簡的方式串成一條順暢流水線：\n• **底層硬體**：精力管理與睡眠（確保有電）。\n• **即時排程**：GTD 收件匣 ＋ 時間區塊 ＋ 看板 WIP 上限（把每天過好）。\n• **長期硬碟**：PARA ＋ 智光個人知識庫（讓學過的東西不斷複利）。\n• **導航核心**：生命之輪 ＋ 週月年覆盤（確保方向沒跑偏）。\n\n而且記住最高原則：**系統是活的，越簡單越能陪你走一輩子！**", "lv2": "設計「永不荒廢」的極簡 Life OS 四大黃金原則：\n\n1. 工具越少越好（不超過 3–4 個核心工具）：行事曆（管時間）、待辦／看板（管行動）、知識庫／筆記（管智慧與複利）、定期 JSON 備份（管資產安全）。\n2. 設定「低電量降級模式（Low-Energy Mode）」：狀態爆棚時跑完整版系統；生病、加班或低潮期自動切換到極簡保底版（只做：睡飽＋每天完成 1 件最重要的事），絕不因為一天沒完美執行就全盤放棄。\n3. 讓 AI 成為你的系統副駕駛：把重複整理、白話轉譯、初稿產出與覆盤提問交給 AI，把判斷力、品味與真實體驗留給自己。\n4. 每季做一次「系統減法升級（v1.0 → v2.0）」：刪掉連續一個月都沒填的複雜欄位，只留下真正讓你感到平靜、清晰又有前進感的核心流程。", "lv3": "從系統工程與控制論視角，個人 Life OS 是一個具備「輸入（資訊飲食）→ 處理（CODE 蒸餾與 GTD 執行）→ 輸出（作品與價值創造）→ 回饋控制（週月年覆盤）」的開放適應性系統（Complex Adaptive System）。\n\n頂級生產力系統的最終衡量標準不是花俏的儀表板或打卡率，而是「低摩擦度（Low Maintenance Overhead）」與「反脆弱性（Antifragility）」——當生活發生突發變動或階段轉換時，系統能快速重構參數而不崩潰，讓人把注意力從「管理系統本身」徹底解放，全心投入創造、連結與體驗人生。"}, "myNotes": "最好的 Life OS 不是功能最複雜的那套，而是你累到不行時依然用得下去、能陪你一起長大的那套！", "relatedIds": ["life-s4-3", "life-s3-1"], "updatedAt": "2026-11-24"}
      ];

      // App State
      let state = {
        groups: [],
        categories: [],
        cards: [],
        activeGroupId: 'grp-tech',   // Group tab active on homepage (prevents long scroll!)
        showAllGroupsHome: false,
        expandedGroups: { 'grp-tech': true, 'grp-biz': false, 'grp-strat': false, 'grp-expr': false, 'grp-life': false },
        selectedCategoryId: 'all',   // 'all' (homepage grouped view) or category.id
        selectedCardId: null,
        activeLevel: 'lv1',
        isEditingCard: false,
        searchQuery: '',
        activeTag: null,
        fontScaleIndex: 1,
        apiKey: '',
        viewMode: 'home',            // 'home' | 'dashboard' | 'review' | 'graph'
        dashFilter: 'all',           // 'all' | 'fav' | 'edited_notes' | 'in_progress' | 'mastered' | 'not_started' | 'srs'
        dashGroupFilter: 'all',
        dashQuery: '',
        dashLimit: 36,
        dailySparkOffset: 0,
        dailySparkLevel: 'lv1',
        reviewReveal: false,
        reviewLevel: 'lv1',
        graphMode: 'cross',          // 'cross' | 'all' | groupId
        graphSelectedId: null,
        graphQuery: '',
        googleClientId: '',
        driveAccessToken: '',
        driveTokenExpiresAt: 0,
        lastSyncedAt: '',            // YYYYMMDD-HHmm
        localModifiedAt: '',         // YYYYMMDD-HHmm
        hasUnsyncedChanges: false,
        remoteSyncTimestamp: ''
      };

      const FONT_SCALES = [
        { scale: 0.94, label: '精簡字級' },
        { scale: 1.0, label: '標準字級' },
        { scale: 1.12, label: '舒適大字' }
      ];

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.groups) && Array.isArray(parsed.categories) && Array.isArray(parsed.cards) && parsed.categories.length > 0) {
              state.groups = parsed.groups;
              state.categories = parsed.categories;
              state.cards = parsed.cards;
              // Merge any newly published DEFAULT_CATEGORIES & DEFAULT_CARDS seamlessly without overwriting user edits
              let merged = false;
              const existingCatIds = new Set(state.categories.map(c => c.id));
              DEFAULT_CATEGORIES.forEach(dc => {
                if (!existingCatIds.has(dc.id)) {
                  state.categories.push(JSON.parse(JSON.stringify(dc)));
                  merged = true;
                }
              });
              const existingIds = new Set(state.cards.map(c => c.id));
              DEFAULT_CARDS.forEach(dc => {
                if (!existingIds.has(dc.id)) {
                  state.cards.push(JSON.parse(JSON.stringify(dc)));
                  merged = true;
                }
              });
              if (merged) saveData(true);
            } else {
              resetToDefaultsInMemory();
            }
          } else {
            resetToDefaultsInMemory();
          }
          const prefsRaw = localStorage.getItem(PREF_KEY);
          if (prefsRaw) {
            const prefs = JSON.parse(prefsRaw);
            if (typeof prefs.fontScaleIndex === 'number') state.fontScaleIndex = prefs.fontScaleIndex;
            if (typeof prefs.apiKey === 'string') state.apiKey = prefs.apiKey;
            if (['lv1', 'lv2', 'lv3'].includes(prefs.activeLevel)) state.activeLevel = prefs.activeLevel;
            if (typeof prefs.activeGroupId === 'string') state.activeGroupId = prefs.activeGroupId;
            if (typeof prefs.googleClientId === 'string') state.googleClientId = prefs.googleClientId;
            if (typeof prefs.lastSyncedAt === 'string') state.lastSyncedAt = prefs.lastSyncedAt;
            if (typeof prefs.localModifiedAt === 'string') state.localModifiedAt = prefs.localModifiedAt;
            if (typeof prefs.hasUnsyncedChanges === 'boolean') state.hasUnsyncedChanges = prefs.hasUnsyncedChanges;
          }
        } catch (e) {
          resetToDefaultsInMemory();
        }
        applyFontScale();
      }

      function resetToDefaultsInMemory() {
        state.groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
        state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
        state.cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
      }

      function formatTimestampNow() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${y}${m}${day}-${hh}${mm}`;
      }

      function updateSyncStatusPill() {
        const btn = document.getElementById('btnOpenDriveSync');
        const txt = document.getElementById('syncPillText');
        if (!btn || !txt) return;
        if (state.hasUnsyncedChanges) {
          btn.className = 'px-3 py-2 rounded-full text-xs sm:text-sm font-semibold flex items-center gap-1.5 border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 transition';
          txt.textContent = `待手動同步 (${state.localModifiedAt || formatTimestampNow()})`;
        } else if (state.lastSyncedAt) {
          btn.className = 'px-3 py-2 rounded-full text-xs sm:text-sm font-semibold flex items-center gap-1.5 border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition';
          txt.textContent = `已同步 (${state.lastSyncedAt})`;
        } else {
          btn.className = 'btn-pill-ghost px-3 py-2 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition';
          txt.textContent = '雲端同步';
        }
      }

      function saveData(skipMarkUnsynced) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            groups: state.groups,
            categories: state.categories,
            cards: state.cards
          }));
          if (!skipMarkUnsynced) {
            state.localModifiedAt = formatTimestampNow();
            state.hasUnsyncedChanges = true;
            savePrefs();
            updateSyncStatusPill();
          }
        } catch (e) {}
      }

      function savePrefs() {
        try {
          localStorage.setItem(PREF_KEY, JSON.stringify({
            fontScaleIndex: state.fontScaleIndex,
            apiKey: state.apiKey,
            activeLevel: state.activeLevel,
            activeGroupId: state.activeGroupId,
            googleClientId: state.googleClientId,
            lastSyncedAt: state.lastSyncedAt,
            localModifiedAt: state.localModifiedAt,
            hasUnsyncedChanges: state.hasUnsyncedChanges
          }));
        } catch (e) {}
      }

      function applyFontScale() {
        const cfg = FONT_SCALES[state.fontScaleIndex] || FONT_SCALES[1];
        document.documentElement.style.setProperty('--font-scale', cfg.scale);
        const label = document.getElementById('fontLabel');
        if (label) label.textContent = cfg.label;
      }

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('toast');
        const txt = document.getElementById('toastText');
        if (!el || !txt) return;
        txt.textContent = msg;
        el.classList.remove('hidden');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
      }

      function copyToClipboard(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(successMsg || '已複製到剪貼簿'))
            .catch(() => fallbackCopy(text, successMsg));
        } else {
          fallbackCopy(text, successMsg);
        }
      }

      function fallbackCopy(text, successMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(successMsg || '已複製到剪貼簿');
        } catch (e) {
          showToast('無法自動複製，請手動全選複製');
        }
        document.body.removeChild(ta);
      }

      function getGroup(gid) { return state.groups.find(g => g.id === gid) || state.groups[0] || null; }
      function getCategory(cid) { return state.categories.find(c => c.id === cid) || null; }
      function getStage(cat, sid) { return (cat?.stages || []).find(s => s.id === sid) || (cat?.stages || [])[0] || null; }
      function getCard(cardId) { return state.cards.find(c => c.id === cardId) || null; }

      function getStatusMeta(status) {
        if (status === 'mastered') return { label: '已精熟', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' };
        if (status === 'in_progress') return { label: '學習中', cls: 'bg-orange-50 text-orange-700 border-orange-200', dot: 'bg-[#FF7A00]' };
        return { label: '未開始', cls: 'bg-zinc-100 text-zinc-600 border-zinc-200', dot: 'bg-zinc-400' };
      }

      function getCategoryStats(cat) {
        const cards = state.cards.filter(c => c.categoryId === cat.id);
        const syllabusTotal = (cat.stages || []).reduce((acc, s) => acc + (Array.isArray(s.syllabus) ? s.syllabus.length : 0), 0);
        const built = cards.length;
        const planned = Math.max(syllabusTotal, built);
        const mastered = cards.filter(c => c.status === 'mastered').length;
        const inProgress = cards.filter(c => c.status === 'in_progress').length;
        const pct = planned === 0 ? 0 : Math.round((built / planned) * 100);
        return { built, planned, mastered, inProgress, pct };
      }

      function getTotalSyllabusCount() {
        return state.categories.reduce((acc, c) => acc + getCategoryStats(c).planned, 0);
      }

      function getAllTags() {
        const counts = {};
        state.cards.forEach(c => (c.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
        return Object.entries(counts).sort((a, b) => b[1] - a[1]);
      }

      // --- SRS, Favorites, Daily Spark & Graph Helpers ---
      const SRS_INTERVALS = [1, 3, 7, 14, 30, 60];

      function todayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function addDaysStr(baseDateStr, days) {
        const parts = (baseDateStr || todayStr()).split('-').map(Number);
        const d = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
        d.setDate(d.getDate() + days);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function isCardDue(card) {
        return !!(card && card.srs && card.srs.nextReviewDate && card.srs.nextReviewDate <= todayStr());
      }

      function getDueCards() {
        return state.cards.filter(isCardDue).sort((a, b) => (a.srs.nextReviewDate || '').localeCompare(b.srs.nextReviewDate || ''));
      }

      function getUpcomingSrsCards() {
        const t = todayStr();
        return state.cards.filter(c => c.srs && c.srs.nextReviewDate && c.srs.nextReviewDate > t)
          .sort((a, b) => (a.srs.nextReviewDate || '').localeCompare(b.srs.nextReviewDate || ''));
      }

      function enrollCardInSrs(card, daysFromNow) {
        if (!card) return;
        const d = typeof daysFromNow === 'number' ? daysFromNow : 1;
        card.srs = {
          intervalDays: Math.max(1, d),
          nextReviewDate: addDaysStr(todayStr(), d),
          reviewCount: card.srs ? (card.srs.reviewCount || 0) : 0,
          lastReviewedAt: card.srs ? (card.srs.lastReviewedAt || '') : ''
        };
        saveData();
      }

      function gradeSrsCard(card, quality) {
        if (!card) return;
        const curInt = card.srs ? (card.srs.intervalDays || 1) : 1;
        let nextInt = 1;
        if (quality === 'forgot') {
          nextInt = 1;
        } else if (quality === 'fuzzy') {
          nextInt = 3;
        } else {
          const idx = SRS_INTERVALS.findIndex(v => v > curInt);
          nextInt = idx >= 0 ? SRS_INTERVALS[idx] : 60;
        }
        const t = todayStr();
        card.srs = {
          intervalDays: nextInt,
          nextReviewDate: addDaysStr(t, nextInt),
          reviewCount: (card.srs ? (card.srs.reviewCount || 0) : 0) + 1,
          lastReviewedAt: t
        };
        if (quality === 'good' && card.status === 'not_started') card.status = 'in_progress';
        if (quality === 'good' && nextInt >= 14) card.status = 'mastered';
        card.updatedAt = t;
        saveData();
      }

      function getDailySparkCard() {
        if (!state.cards.length) return null;
        const t = todayStr();
        let hash = 0;
        for (let i = 0; i < t.length; i++) hash = ((hash << 5) - hash + t.charCodeAt(i)) | 0;
        const idx = Math.abs(hash + state.dailySparkOffset * 17) % state.cards.length;
        return state.cards[idx];
      }

      function buildKnowledgeGraphData() {
        const cardMap = new Map(state.cards.map(c => [c.id, c]));
        const catMap = new Map(state.categories.map(c => [c.id, c]));
        const edgeSet = new Set();
        const edges = [];
        state.cards.forEach(c => {
          (c.relatedIds || []).forEach(tid => {
            if (!cardMap.has(tid) || tid === c.id) return;
            const key = c.id < tid ? `${c.id}::${tid}` : `${tid}::${c.id}`;
            if (edgeSet.has(key)) return;
            edgeSet.add(key);
            const tCard = cardMap.get(tid);
            const catA = catMap.get(c.categoryId);
            const catB = catMap.get(tCard.categoryId);
            edges.push({
              source: c.id,
              target: tid,
              isCrossDomain: c.categoryId !== tCard.categoryId,
              isCrossGroup: (catA?.groupId || '') !== (catB?.groupId || '')
            });
          });
        });
        return { cardMap, catMap, edges };
      }

        const matchedCards = state.cards.filter(c => {
          if (state.activeTag && !(c.tags || []).includes(state.activeTag)) return false;

          return hay.includes(q);
        });

        const matchedSyllabus = [];
        if (q && !state.activeTag) {
          const builtSet = new Set(state.cards.map(c => c.categoryId + '::' + c.title.trim()));
          state.categories.forEach(cat => {
            (cat.stages || []).forEach(st => {
              (st.syllabus || []).forEach(topic => {
                if (!builtSet.has(cat.id + '::' + topic.trim()) && (topic.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q))) {
                  matchedSyllabus.push({ cat, st, topic });
                }
              });
            });
          });

        const heading = q ? `搜尋「${esc(state.searchQuery.trim())}」的結果` : `標籤「${esc(state.activeTag)}」的跨領域知識`;

          renderAll();

          card.updatedAt = new Date().toISOString().slice(0, 10);

            noteTimer = setTimeout(() => { hint.style.opacity = '0'; }, 1500);

              window.scrollTo({ top: 0, behavior: 'smooth' });

      // View 5: Inline Card Editor

        const currentCat = getCategory(card.categoryId) || state.categories[0];
        container.innerHTML = `

                  </select>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-zinc-700 mb-1.5">所屬學習階段</label>

                    ${(currentCat?.stages || []).map(s => `<option value="${esc(s.id)}" ${s.id === card.stageId ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}

                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                </div>
                <div>
                  <label class="block text-sm font-semibold text-zinc-700 mb-1.5">子主題</label>
                  <input id="edSubtopic" type="text" value="${esc(card.subtopic || '')}" class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm">

              </div>

              <div>
                <label class="block text-sm font-semibold text-zinc-700 mb-1.5">一句話核心摘要</label>

              </div>

              <div>
                <label class="block text-sm font-semibold text-zinc-700 mb-1.5">跨領域標籤（空白分隔）</label>
                <input id="edTags" type="text" value="${esc((card.tags || []).join(' '))}" class="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl text-sm">
              </div>

              <div>
                <label class="block text-sm font-bold text-[#C2410C] mb-1.5">Lv.1 高中生白話直覺版</label>
                <textarea id="edLv1" rows="5" class="w-full p-3.5 bg-orange-50/30 border border-orange-200 rounded-2xl text-sm leading-relaxed">${esc(card.levels?.lv1 || '')}</textarea>
              </div>
              <div>
                <label class="block text-sm font-bold text-blue-700 mb-1.5">Lv.2 實務應用版</label>

          if (chosen && edStage) {
            edStage.innerHTML = (chosen.stages || []).map(s => `<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('');

          saveData();
          showToast('知識卡修改已儲存');
          renderAll();
        });

      function createAndEditNewCard(catId, stageId, presetTitle) {
        const cat = getCategory(catId) || state.categories[0];
        const st = getStage(cat, stageId);
        const newCard = {
          id: 'card-' + Date.now(),
          categoryId: cat.id,
          stageId: st ? st.id : 's1',
          subtopic: '新單元',
          title: presetTitle || '未命名知識卡',
          oneLiner: '請用一句話概括這個概念的核心價值。',
          tags: ['#底層模型'],
          status: 'in_progress',
          sourceType: 'manual',
          sourceRef: '手動建立',
          levels: { lv1: '', lv2: '', lv3: '' },
          myNotes: '',
          relatedIds: [],
          updatedAt: new Date().toISOString().slice(0, 10)
        };
        state.cards.push(newCard);
        state.selectedCategoryId = cat.id;
        state.selectedCardId = newCard.id;
        state.isEditingCard = true;
        saveData();
        renderAll();
      }

      // Modals
      function openModal(title, bodyHtml) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = bodyHtml;
        document.getElementById('modalOverlay').classList.remove('hidden');
        refreshIcons();
      }
      function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

        openModal(title, `
          <p class="text-sm sm:text-base text-zinc-700 leading-relaxed mb-6">${esc(message)}</p>

          const c = getCategory(upCat.value);

        let uploadedFileName = '';
        document.getElementById('upFileInput')?.addEventListener('change', (e) => {
          const file = e.target.files?.[0];

          uploadedFileName = file.name;

          reader.onload = () => {
            const text = String(reader.result || '');
            if (file.name.endsWith('.json')) {
              try {
                const parsed = JSON.parse(text);
                if (Array.isArray(parsed.categories) && Array.isArray(parsed.cards)) {
                  if (Array.isArray(parsed.groups)) state.groups = parsed.groups;
                  state.categories = parsed.categories;
                  state.cards = parsed.cards;
                  state.selectedCategoryId = 'all';

                  closeModal();
                  showToast(`已成功匯入備份（共 ${parsed.cards.length} 篇知識卡）`);

                  importSingleCardJson(parsed, upCat.value, upStage.value);

                showToast('JSON 格式有誤，已載入為純文字');

          reader.readAsText(file, 'utf-8');

            levels: { lv1: text, lv2: text, lv3: text }, myNotes: '', relatedIds: [],
            updatedAt: new Date().toISOString().slice(0, 10)
          };
          state.cards.push(newCard);
          state.selectedCategoryId = newCard.categoryId;
          state.selectedCardId = newCard.id;
          state.isEditingCard = false;
          saveData();
          closeModal();
          showToast(`已收錄「${title}」`);
          renderAll();
        });

        document.getElementById('btnUpToGen')?.addEventListener('click', () => {
          openGeneratorModal(upCat.value, document.getElementById('upTitle').value.trim(), document.getElementById('upText').value.trim(), upStage.value);
        });
      }

      function importSingleCardJson(obj, fallbackCatId, fallbackStageId) {
        const cat = getCategory(obj.categoryId) || getCategory(fallbackCatId) || state.categories[0];
        const stage = getStage(cat, obj.stageId || fallbackStageId);
        const newCard = {
          id: obj.id && !getCard(obj.id) ? obj.id : ('card-' + Date.now()),
          categoryId: cat.id, stageId: stage ? stage.id : 's1',
          subtopic: obj.subtopic || '教學產出',
          title: obj.title || '新產出知識卡',
          oneLiner: obj.oneLiner || obj.one_liner || '',
          tags: Array.isArray(obj.tags) ? obj.tags : ['#教學產出'],
          status: 'not_started', sourceType: 'ai_generated', sourceRef: 'AI 教學產出',
          levels: {
            lv1: obj.levels?.lv1 || obj.levels?.lv1_highschool || '',
            lv2: obj.levels?.lv2 || obj.levels?.lv2_practical || '',
            lv3: obj.levels?.lv3 || obj.levels?.lv3_expert || ''
          },
          myNotes: obj.myNotes || obj.my_notes || '',
          relatedIds: Array.isArray(obj.relatedIds) ? obj.relatedIds : [],
          updatedAt: new Date().toISOString().slice(0, 10)
        };
        state.cards.push(newCard);
        state.selectedCategoryId = newCard.categoryId;
        state.selectedCardId = newCard.id;
        state.isEditingCard = false;
        saveData();
        showToast(`已匯入三層教學卡「${newCard.title}」`);
        renderAll();
      }

      // GOOGLE DRIVE MANUAL SYNC & SAFETY WORKFLOW (DriveNote v6 Architecture)
      // =========================================================================
      const DRIVE_FOLDER_NAME = 'ZhiGuangKB';
      const DRIVE_BACKUP_FOLDER = 'backups';
      const DRIVE_DATA_FILENAME = 'zhiguang_kb_data.json';
      const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

      function hasValidDriveToken() {
        return !!(state.driveAccessToken && Date.now() < state.driveTokenExpiresAt - 30000);
      }

      function requestDriveToken(promptMode) {
        return new Promise((resolve, reject) => {
          const cid = (state.googleClientId || '').trim();
          if (!cid) {
            reject(new Error('請先輸入並儲存 Google OAuth Client ID'));
            return;
          }
          if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
            reject(new Error('Google 登入元件尚未載入完成，請確認網路連線後重試'));
            return;
          }
          try {
            const client = window.google.accounts.oauth2.initTokenClient({
              client_id: cid,
              scope: DRIVE_SCOPE,
              callback: (resp) => {
                if (resp && resp.access_token) {
                  state.driveAccessToken = resp.access_token;
                  state.driveTokenExpiresAt = Date.now() + ((Number(resp.expires_in) || 3500) * 1000);
                  resolve(resp.access_token);
                } else {
                  reject(new Error((resp && (resp.error_description || resp.error)) || 'Google 授權未完成'));
                }
              },
              error_callback: (err) => {
                reject(new Error((err && err.message) || 'Google 授權視窗已關閉或被阻擋'));
              }
            });
            client.requestAccessToken({ prompt: promptMode || '' });
          } catch (e) {
            reject(e);
          }
        });
      }

      async function getDriveTokenOrAuth() {
        if (hasValidDriveToken()) return state.driveAccessToken;
        return await requestDriveToken('');
      }

      async function driveFetch(token, url, options) {
        const res = await fetch(url, Object.assign({}, options || {}, {
          headers: Object.assign({ Authorization: 'Bearer ' + token }, (options && options.headers) || {})
        }));
        if (!res.ok) {
          const txt = await res.text().catch(() => '');
          throw new Error(`Google Drive API 錯誤 (${res.status}): ${txt.slice(0, 140)}`);
        }
        return res;
      }

      async function findOrCreateDriveFolder(token, folderName, parentId) {
        const parentClause = parentId ? ` and '${parentId}' in parents` : ` and 'root' in parents`;
        const q = `name='${folderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false${parentClause}`;
        const listRes = await driveFetch(token, `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&spaces=drive`);
        const listData = await listRes.json();
        if (listData.files && listData.files.length > 0) return listData.files[0].id;
        const meta = { name: folderName, mimeType: 'application/vnd.google-apps.folder' };
        if (parentId) meta.parents = [parentId];
        const createRes = await driveFetch(token, 'https://www.googleapis.com/drive/v3/files?fields=id', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(meta)
        });
        const created = await createRes.json();
        return created.id;
      }

      async function findDriveFileInFolder(token, fileName, folderId) {
        const q = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
        const res = await driveFetch(token, `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,modifiedTime)&spaces=drive`);
        const data = await res.json();
        return (data.files && data.files.length > 0) ? data.files[0] : null;
      }

      async function downloadDriveJsonFile(token, fileId) {
        const res = await driveFetch(token, `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
        return await res.json();
      }

      async function uploadDriveJsonFile(token, fileName, folderId, jsonObj, existingFileId) {
        const boundary = '-------zhiguangkb_' + Date.now();
        const metadata = existingFileId ? { name: fileName } : { name: fileName, parents: [folderId] };
        const body =
          `--${boundary}
Content-Type: application/json; charset=UTF-8

` +
          JSON.stringify(metadata) +
          `
--${boundary}
Content-Type: application/json; charset=UTF-8

` +
          JSON.stringify(jsonObj) +
          `
--${boundary}--`;
        const url = existingFileId
          ? `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=multipart&fields=id`
          : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id';
        const res = await driveFetch(token, url, {
          method: existingFileId ? 'PATCH' : 'POST',
          headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
          body
        });
        return await res.json();
      }

      function mergeCloudDataIntoLocal(remote) {
        // Merge categories
        const localCatMap = new Map(state.categories.map(c => [c.id, c]));
        (remote.categories || []).forEach(rc => {
          if (!localCatMap.has(rc.id)) state.categories.push(rc);
        });
        // Merge cards preserving richer notes, favorites, SRS & newer edits
        const localCardMap = new Map(state.cards.map(c => [c.id, c]));
        (remote.cards || []).forEach(rc => {
          const lc = localCardMap.get(rc.id);
          if (!lc) {
            state.cards.push(rc);
            return;
          }
          if (rc.isFavorite) lc.isFavorite = true;
          if (rc.userEditedNote && !lc.userEditedNote) {
            lc.myNotes = rc.myNotes;
            lc.userEditedNote = true;
          } else if (rc.userEditedNote && lc.userEditedNote && (rc.myNotes || '').trim() && (rc.myNotes || '').trim() !== (lc.myNotes || '').trim()) {
            lc.myNotes = `${lc.myNotes}

--- [雲端合併筆記] ---
${rc.myNotes}`;
          }
          if (rc.srs && (!lc.srs || (rc.srs.reviewCount || 0) > (lc.srs.reviewCount || 0) || (rc.srs.lastReviewedAt || '') > (lc.srs.lastReviewedAt || ''))) {
            lc.srs = rc.srs;
          }
          const statusRank = { not_started: 0, in_progress: 1, mastered: 2 };
          if ((statusRank[rc.status] || 0) > (statusRank[lc.status] || 0)) lc.status = rc.status;
          if ((rc.updatedAt || '') > (lc.updatedAt || '')) {
            lc.levels = rc.levels || lc.levels;
            lc.oneLiner = rc.oneLiner || lc.oneLiner;
            lc.updatedAt = rc.updatedAt;
          }
        });
        // Guarantee all built-in defaults stay present
        const finalIds = new Set(state.cards.map(c => c.id));
        DEFAULT_CARDS.forEach(dc => { if (!finalIds.has(dc.id)) state.cards.push(JSON.parse(JSON.stringify(dc))); });
      }

      function applyCloudOverwriteLocal(remote) {
        if (Array.isArray(remote.groups) && remote.groups.length) state.groups = remote.groups;
        if (Array.isArray(remote.categories) && remote.categories.length) state.categories = remote.categories;
        if (Array.isArray(remote.cards) && remote.cards.length) state.cards = remote.cards;
        const catIds = new Set(state.categories.map(c => c.id));
        DEFAULT_CATEGORIES.forEach(dc => { if (!catIds.has(dc.id)) state.categories.push(JSON.parse(JSON.stringify(dc))); });
        const cardIds = new Set(state.cards.map(c => c.id));
        DEFAULT_CARDS.forEach(dc => { if (!cardIds.has(dc.id)) state.cards.push(JSON.parse(JSON.stringify(dc))); });
      }

      // =========================================================================
      // NEW VIEW C: 跨領域知識關聯圖譜 (renderGraphView)
      // =========================================================================
      function renderGraphView(container) {
        const { cardMap, catMap, edges } = buildKnowledgeGraphData();
        const crossEdges = edges.filter(e => e.isCrossDomain);

        // Determine visible nodes & edges based on graphMode
        let visibleEdges = [];
        let visibleNodeIds = new Set();
        if (state.graphMode === 'cross') {
          visibleEdges = crossEdges;
          crossEdges.forEach(e => { visibleNodeIds.add(e.source); visibleNodeIds.add(e.target); });
          if (state.graphSelectedId && cardMap.has(state.graphSelectedId)) visibleNodeIds.add(state.graphSelectedId);
        } else if (state.graphMode === 'all') {
          visibleEdges = edges;
          state.cards.forEach(c => visibleNodeIds.add(c.id));
        } else {
          // Specific Group mode: include all cards in that group + their direct cross-domain neighbors
          const grpCatIds = new Set(state.categories.filter(c => c.groupId === state.graphMode).map(c => c.id));
          state.cards.forEach(c => { if (grpCatIds.has(c.categoryId)) visibleNodeIds.add(c.id); });
          visibleEdges = edges.filter(e => visibleNodeIds.has(e.source) || visibleNodeIds.has(e.target));
          visibleEdges.forEach(e => { visibleNodeIds.add(e.source); visibleNodeIds.add(e.target); });
        }

        const visibleNodes = Array.from(visibleNodeIds).map(id => cardMap.get(id)).filter(Boolean);
        if (!state.graphSelectedId || !visibleNodeIds.has(state.graphSelectedId)) {
          // Pick highest cross-degree node as default focus
          const deg = {};
          visibleEdges.forEach(e => {
            deg[e.source] = (deg[e.source] || 0) + (e.isCrossDomain ? 2 : 1);
            deg[e.target] = (deg[e.target] || 0) + (e.isCrossDomain ? 2 : 1);
          });
          const best = visibleNodes.slice().sort((a, b) => (deg[b.id] || 0) - (deg[a.id] || 0))[0];
          state.graphSelectedId = best ? best.id : null;
        }

        const selCard = state.graphSelectedId ? cardMap.get(state.graphSelectedId) : null;
        const selCat = selCard ? catMap.get(selCard.categoryId) : null;
        const selNeighbors = selCard ? visibleEdges
          .filter(e => e.source === selCard.id || e.target === selCard.id)
          .map(e => ({ card: cardMap.get(e.source === selCard.id ? e.target : e.source), isCross: e.isCrossDomain }))
          .filter(x => !!x.card) : [];

        container.innerHTML = `
          <section class="glass-card rounded-3xl p-5 sm:p-6 mb-4">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
              <div>
