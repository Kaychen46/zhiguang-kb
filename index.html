        {"id": "fin-s4-4", "categoryId": "cat-finance", "stageId": "s4", "subtopic": "投資紀律", "title": "建立個人投資檢查清單（IPS）與反脆弱策略", "oneLiner": "在平靜理智的時候寫好一頁「個人投資憲法（IPS）」，市場暴跌暴漲時只照憲法執行，不聽當下情緒指揮。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "機師開了三十年飛機，每次起飛前還是會乖乖拿著「檢查清單」一條一條勾選，因為緊張的時候大腦一定會漏掉基本動作。\n\n投資也一樣！趁今天心情平靜、市場沒大崩盤時，寫下一張 A4 紙（個人投資政策聲明 IPS）：\n• 我這筆錢預計投資幾年？（例如 10 年以上）\n• 我的目標股債比例是多少？（例如 75% 股 / 25% 債）\n• 每年什麼時候做再平衡？（例如每年 12 月 1 日）\n• 股市大跌 30% 時我要做什麼？（照原定計畫繼續扣款並賣債補股，絕不恐慌賣出！）", "lv2": "一頁式個人投資檢查清單（IPS）必備五條款：\n\n1. 投資目標與時間跨度（區分 3 年內購屋款 vs 20 年退休金）。\n2. 目標資產配置與允許偏離區間（±5% 觸發再平衡）。\n3. 明確的「絕對不買清單」（例如不懂的衍生品、高內扣主動基金、借錢槓桿）。\n4. 買進前強制冷靜 48 小時條款（防止看影片腦衝下單）。\n5. 年度檢視日：一年只允許在固定日子修改這份憲法，盤中禁止臨時改規則。", "lv3": "機構法人必備之 IPS（Investment Policy Statement）核心精神在於「事前約束（Pre-Commitment / Ulysses Pact）」：將投資決策由易受情緒與近期偏誤劫持的系統一，轉移至冷靜期預先設計的規則引擎；並可結合槓鈴策略（90% 極度穩健核心 + 10% 高凸性探索）達成長期反脆弱。"}, "myNotes": "趁心平氣和寫好自己的投資憲法，大跌那天拿出來照著做就贏過九成人！", "relatedIds": ["fin-portfolio", "psy-system12"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s1-2", "categoryId": "cat-marketing", "stageId": "s1", "subtopic": "洞察顧客", "title": "買家人物誌（Persona）與待辦任務理論（JTBD）", "oneLiner": "顧客買的從來不是「四分之一吋的電鑽」，而是「牆上那個四分之一吋的洞」——看懂他想完成的生活任務才抓得到真需求。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "以前速食店想把奶昔賣更好，找來「25–35 歲上班族」做問卷調口味，改半天銷量都沒變。後來哈佛教授在店裡觀察發現：一大早買奶昔的人，其實是為了「開車通勤 40 分鐘超無聊、單手就能喝、不會掉麵包屑又撐到中午不餓」！\n\n所以奶昔真正的競爭對手根本不是別家奶昔，而是「香蕉、貝果跟咖啡」！\n\n**待辦任務理論（JTBD）**就是告訴你：別只看顧客幾歲、住哪裡，要看他在「什麼情境下」想「雇用你的產品幫他搞定哪件麻煩事」。", "lv2": "畫出真正有用的人物誌與 JTBD 的實戰步驟：\n\n1. 拒絕廢話人物誌：寫「30 歲、愛喝拿鐵、喜歡旅遊」對賣產品毫無幫助；要寫「他在哪個瞬間痛到想付錢找解法、現在用什麼爛方法湊合」。\n2. 套用 JTBD 句型：「當我處於【某個具體情境】時，我想要【完成某項任務】，好讓我能夠【獲得某種結果／情緒】。」\n3. 同時盤點三種任務：功能性任務（省時間）、情感性任務（感到安心）、社會性任務（看起來專業有品味）。", "lv3": "Clayton Christensen 與 Tony Ulwick 發展之 Jobs-to-be-Done（JTBD）理論將分析單元從「人口統計屬性（相關性弱）」轉向「因果情境任務（Causality）」。\n\n• 結合推拉四力模型（Switch Forces：現狀推力 + 新方案拉力 vs 既有習慣慣性 + 轉換焦慮），能精準診斷為何產品功能更強卻仍無法促成顧客轉換。"}, "myNotes": "永遠問：「顧客在什麼情境下，雇用我的產品／內容來幫他解決哪件任務？」", "relatedIds": ["mkt-stp", "prod-mvp"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s1-3", "categoryId": "cat-marketing", "stageId": "s1", "subtopic": "產品契合", "title": "價值主張畫布：痛點、爽點與產品契合度（PMF）", "oneLiner": "把「維他命（可有可無）」變成「止痛藥（非買不可）」，先對準顧客最痛的地方，再談放大行銷預算。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "同樣是賣東西，「維他命」聽起來不錯但今天不吃也不會怎樣；「止痛藥」則是牙痛到睡不著時，半夜三點你都願意衝出去買！\n\n**價值主張畫布**就是把顧客畫在右邊（他想做的事、卡住的痛點、渴望的爽點），把你的產品畫在左邊（你的功能、解痛藥、加分項），一一連線對對看：你的產品到底有沒有精準打中他最痛的那一點？如果打中了、大家搶著用甚至主動推薦，就叫達成 **PMF（產品市場契合度）**！", "lv2": "檢驗產品是否達到 PMF 的實務方法：\n\n1. Sean Ellis 40% 測試：問現有用戶「如果明天這個產品消失了，你會有多失望？」若有超過 **40%** 回答「非常失望」，代表已跨過 PMF 門檻。\n2. 觀察自然留存曲線：留存率是否在一段時間後「走平不再掉到零」？\n3. 沒達 PMF 前的鐵律：不要砸大錢買廣告，把預算留著改產品跟訪談用戶。", "lv3": "價值主張畫布（Alexander Osterwalder）作為商業模式畫布的核心放大鏡，透過 Problem-Solution Fit → Product-Market Fit → Scale 三階段降低創業失敗率。\n\n• Marc Andreessen 指出在市場、產品與團隊三要素中，「市場需求拉動（Market Pull）」最具決定性——當真實 PMF 出現時，市場會把產品從團隊手中拉走，而非靠行銷硬推。"}, "myNotes": "優先做「止痛藥」而不是「維他命」；沒到 40% 非常失望前，別急著砸錢買流量！", "relatedIds": ["mkt-s1-2", "prod-mvp"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s1-4", "categoryId": "cat-marketing", "stageId": "s1", "subtopic": "行銷基礎", "title": "4P 與 4C 行銷組合的現代演變", "oneLiner": "從廠商自嗨的「我賣什麼、定多少錢（4P）」，翻轉成顧客視角的「解決什麼痛點、總成本划不划算（4C）」。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "傳統教科書教的 **4P** 是站在老闆角度想事情：\n• Product（產品）、Price（價格）、Place（通路）、Promotion（促銷）。\n\n但現代選擇太多了，顧客根本不管你多努力做產品！於是進化成站在顧客角度的 **4C**：\n• Customer（顧客需求）：這東西幫我解決什麼煩惱？\n• Cost（總成本）：不只標價，還包含我花的時間、學習門檻跟踩雷風險！\n• Convenience（便利性）：我能不能三秒鐘就買到、用到？\n• Communication（雙向溝通）：你不是單方面塞廣告給我，而是像朋友一樣聽我回饋。", "lv2": "用 4C 幫現有產品或內容做快速健檢：\n\n1. 檢查「隱形成本（Cost）」：就算免費工具，如果介面超難懂、要填 10 個欄位註冊，時間成本太高用戶一樣會跑掉。\n2. 檢查「便利性（Convenience）」：購買與體驗路徑每多一步點擊，轉換率通常就掉一層。\n3. 保持四項一致：精品定位（高價）卻配粗糙低廉的促銷文案與難用結帳頁，會瞬間摧毀品牌信任。", "lv3": "E. Jerome McCarthy（1960）系統化 4P 行銷組合，Robert Lauterborn（1990）提出 4C 對應顧客導向轉型；服務業則進一步擴展為 7P（加入 People 人員、Process 流程、Physical Evidence 實體環境線索），反映體驗經濟下接觸點一致性對品牌資產的關鍵影響。"}, "myNotes": "「價格」只是冰山一角，顧客真正在算的是包含時間與學習門檻的「總成本（Cost）」！", "relatedIds": ["mkt-stp", "mkt-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s2-2", "categoryId": "cat-marketing", "stageId": "s2", "subtopic": "體驗優化", "title": "顧客旅程地圖（CJM）與關鍵接觸點優化", "oneLiner": "把顧客從「第一次聽說你」到「買完回家用」的每一步情緒起伏畫成曲線，專修讓他最生氣或最猶豫的那兩個點。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "去一間餐廳吃飯，就算牛排超好吃，但如果門口排隊動線亂七八糟、點餐等半小時、結帳還不能刷卡，你下次一定不想再來。\n\n**顧客旅程地圖（Customer Journey Map）**就是假裝自己是第一次來的客人，把「看到廣告 → 查評價 → 進店／進網站 → 結帳 → 使用 → 售後」每一步的感受畫成表情折線圖。你不用把 20 個環節都做到 100 分，只要把「跌到谷底的雷點」修平，再刻意製造 1 個「超驚喜的高峰時刻」，口碑就會爆棚！", "lv2": "畫顧客旅程地圖並落地優化的三重點：\n\n1. 找出「關鍵時刻（Moment of Truth）」：例如電商開箱那一刻、軟體第一次打開的 3 分鐘引導、客服回應客訴的第一句話。\n2. 善用心理學「峰終定律（Peak-End Rule）」：人對整段體驗的記憶，幾乎由「最高峰（或最糟谷底）」跟「結尾最後一印象」決定。\n3. 親自走一遍自己的購買／閱讀流程，把每個讓你皺眉的摩擦點記下來立刻修掉。", "lv3": "顧客旅程管理整合服務設計（Service Design）與 Daniel Kahneman 的峰終定律（Peak-End Rule）。實務上常將旅程拆為前台接觸點（Frontstage Touchpoints）與後台支撐流程（Backstage Operations），透過服務藍圖（Service Blueprint）對齊跨部門交接斷點。"}, "myNotes": "修掉最氣人的谷底 + 設計一個超棒的結尾（峰終定律），體驗分數直接暴衝！", "relatedIds": ["mkt-funnel", "mkt-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s2-3", "categoryId": "cat-marketing", "stageId": "s2", "subtopic": "轉換文案", "title": "高轉換文案結構：AIDA、PAS 與說服敘事", "oneLiner": "好文案不是辭藻華麗的散文，而是順著讀者的心理滑梯：先抓注意力、戳中痛點、秀出解方，再給一個無痛的下一步。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "為什麼有些文案短短五句話就讓人忍不住點下去，有些寫了兩千字卻沒人看？因為高手都照著心理滑梯寫！\n\n兩套最萬用的白話公式：\n• **PAS 公式（痛點神器，最適合短文與貼文）**：\n  1. P（問題）：「每天加班整理報表到九點？」\n  2. A（放大痛感）：「最崩潰的是手動複製貼上，錯一格還得整份重來！」\n  3. S（解法）：「這套自動化模板只要按一下，3 分鐘幫你搞定。」\n• **AIDA 公式（適合銷售頁）**：抓注意（Attention）→ 引興趣（Interest）→ 燃渴望（Desire）→ 行動呼籲（Action）。", "lv2": "寫出高轉換文案的四個立竿見影技巧：\n\n1. **賣好處（Benefit）而不是只列規格（Feature）**：不要只寫「容量 1TB」，寫「裝得下你十年旅行的 20 萬張照片不用刪」。\n2. 標題決定 80% 閱讀率：把「給誰看 + 具體結果 + 數字或反差」寫進前 15 個字。\n3. 用「真實證據」消除懷疑：具體案例、前後對比圖與用戶原話，比自己誇一百句「最強」有用。\n4. 結尾只給 **1 個清楚低門檻 CTA**（例如「免費領取檢核表」）。", "lv3": "直效行銷（Direct Response Copywriting）強調文案本質是「紙上業務員」，核心在於降低轉換阻力與建立社會認同。結合 Eugene Schwartz《突破性廣告》的「市場成熟度與顧客意識五階段（從無意識到最熟知）」，不同意識階段的受眾須採用截然不同的標題切入角度。"}, "myNotes": "短文必背 PAS（點痛點 → 放大痛感 → 給解法），把規格翻譯成「這對我有什麼好處」！", "relatedIds": ["mkt-s3-2", "mkt-funnel"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s2-4", "categoryId": "cat-marketing", "stageId": "s2", "subtopic": "成長數據", "title": "數據歸因基礎：CAC、LTV 與回本週期判讀", "oneLiner": "行銷不是花越多錢越厲害，而是算清「買一個客人花多少錢（CAC）」跟「這客人一生幫你賺多少錢（LTV）」。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "想像你開一家健身房：\n• **CAC（獲客成本）**：你花 10,000 元買廣告，成功拉來 10 位新會員，平均買一位客人花了 **1,000 元**。\n• **LTV（顧客終身價值）**：每位會員平均會續費 10 個月、每月幫你淨賺 400 元，所以一位客人總共能幫你賺 **4,000 元**。\n\n花 1,000 賺 4,000（LTV / CAC = 4 倍），這就是一台印鈔機，可以放心放大投入！如果花 2,000 卻只賺回 1,500，廣告買越多反而賠越快。", "lv2": "判讀行銷投資報酬的三條業界健康線：\n\n1. **LTV / CAC 黃金比 ≥ 3**：低於 1 代表賠錢買客，1–2 代表利潤太薄扛不住廣告漲價，高於 3 才是健康可擴張模型。\n2. **CAC 回本週期（Payback Period）**：越短越好（SaaS 通常希望 ≤ 12 個月），否則帳面雖賺錢卻會先被現金流壓垮。\n3. 算 LTV 一定要用「毛利」算而不是用「營業額」算，才不會高估獲利能力。", "lv3": "單位經濟模型核心公式：LTV = (ARPU × Gross Margin%) / Churn Rate。當月流失率（Churn）從 5% 降至 2.5%，LTV 直接翻倍，這正是留存優化槓桿遠大於前端買流量的數學證明。\n\n• 歸因模型（Attribution）：實務上須警惕「最終點擊歸因（Last-Click）」過度高估收割型搜尋廣告、卻低估前端品牌內容助攻的系統性偏差。"}, "myNotes": "LTV 一定要用「毛利」算！LTV / CAC >= 3 才是能放心放大投放的健康印鈔機。", "relatedIds": ["mkt-funnel", "fin-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s3-2", "categoryId": "cat-marketing", "stageId": "s3", "subtopic": "說服心理", "title": "影響力六大原則：互惠、稀缺、社會認同與權威", "oneLiner": "人類做決定時會依賴六個心理捷徑；懂這六招，既能做出超有說服力的產品與內容，也能一眼看破商家的促銷話術。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "心理學大師 Cialdini 觀察無數頂尖業務後，歸納出最能打動人心的六個按鈕：\n\n1. **互惠**：先送免費試吃或超實用乾貨，人收到好處會自然想回報。\n2. **承諾與一致**：讓人先點頭答應一個小動作（如免費訂閱），後面更容易同意大合作。\n3. **社會認同**：看到「已有 5,000 人購買、4.9 星好評」，大腦立刻覺得「大家都在買一定沒錯」。\n4. **喜好**：我們更願意跟親切、跟自己有共同點的人買東西。\n5. **權威**：醫師白袍、真實數據與專業背書能大幅降低懷疑。\n6. **稀缺**：「限量 30 組、倒數 2 小時」，怕錯過的焦慮會瞬間催促下單！", "lv2": "正派運用六大影響力原則的實務清單：\n\n1. 內容與產品頁：先透過免費高品質教學建立「互惠 + 權威」，再放真實使用者評價建立「社會認同」。\n2. 拒絕假稀缺：不要用永遠重設的「假倒數計時器」，被拆穿會永久毀掉信任；稀缺必須是真實名額或真實早鳥截止日。\n3. 個人防禦：看到「限時最後 3 組！」先關掉網頁去喝杯水，隔天還想要再買。", "lv3": "Robert Cialdini《影響力》（Influence，後於新版新增第七原則「聯盟感 Unity」）揭示此六大原則皆源於人類在資訊過載環境下演化出的系統一決策啟發式（Click-Whirr Fixed-Action Patterns）。正派行銷強調以「真實價值與透明訊號」觸發捷徑，而非製造虛假訊號套利。"}, "myNotes": "免費高品質乾貨 = 互惠 + 權威 + 喜好三連擊，這就是內容行銷最正派的說服力！", "relatedIds": ["mkt-pricing", "psy-system12"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s3-3", "categoryId": "cat-marketing", "stageId": "s3", "subtopic": "定價模型", "title": "免費增值（Freemium）、訂閱制與分層定價模型", "oneLiner": "好定價不是把價格壓最低，而是設計階梯讓輕度用戶零門檻試用、重度用戶心甘情願為進階價值付費。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "看看 Spotify、Notion 跟 Canva 怎麼賺錢：基礎版全部免費讓你用到離不開，等你開始想無廣告、想團隊協作或匯出高畫質時，再升級月費 Pro 版——這就是 **免費增值（Freemium）**。\n\n而「訂閱制」則是把以前一次收 3,000 元的軟體，改成每月收 150 元：對用戶來說入手門檻超低、持續拿新功能；對公司來說每個月都有穩定可預測的現金流！", "lv2": "設計分層定價與付費牆的三個關鍵拿捏：\n\n1. 免費版要「夠好用讓人上癮」，但「在真正產生高價值或規模放大時設下清楚付費牆」（例如容量上限、進階自動化或商業授權）。\n2. 價值指標（Value Metric）對齊：隨著客戶用越爽、賺越多，你的收費自然跟著升級（例如按專案數、團隊席次或用量分級）。\n3. 年繳方案給 15%–20% 折扣：既鎖定一年留存，又立刻拿回整年現金流。", "lv3": "從個體經濟學視角，分層定價（Tiered Pricing）屬於「二級價格歧視（Second-Degree Price Discrimination / Versioning）」，透過設計功能組合讓不同支付意願（WTP）的客群自行篩選分流，大幅擷取消費者剩餘並擴大總市場覆蓋。"}, "myNotes": "免費版給足「上癮體驗」，付費牆設在「高價值與規模放大」的節點！", "relatedIds": ["mkt-pricing", "mkt-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s3-4", "categoryId": "cat-marketing", "stageId": "s3", "subtopic": "成長實驗", "title": "A/B 測試設計與統計顯著性避坑指南", "oneLiner": "不要在會議室吵「橘色按鈕還是藍色按鈕好」，讓一半訪客看 A、一半看 B，用足夠樣本的真實點擊數據說話。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "老闆覺得網站標題寫 A 比較帥，設計師覺得寫 B 比較潮，吵兩小時誰也說服不了誰。\n\n**A/B 測試**就像科學課的控制變因實驗：把進網站的訪客隨機丟硬幣分兩半，A 組看舊標題、B 組看新標題，其他圖片價格全部一模一樣。跑滿一兩週後直接看哪組下單率高！\n\n但小心新手最大地雷：才測了 20 個人看到 B 組多 2 個人買就歡呼宣布勝利——這跟丟硬幣連三次正面一樣，很可能只是純運氣！", "lv2": "執行乾淨 A/B 測試的四條鐵律：\n\n1. **一次只改一個核心變因**，否則結果變好也不知道是標題還是換圖的功勞。\n2. **事前算好所需樣本數與跑滿整週（7 或 14 天）**：避開平日與週末消費習慣差異，且不要每天偷看數據提前叫停（Peeking Problem）。\n3. 設好護欄指標：別為了衝高點擊率把標題寫得超聳動，結果進站後跳出率飆升。\n4. 流量太小的早期網站別硬做微調 A/B 測試，直接做用戶訪談與大幅度改版更有效。", "lv3": "A/B 測試為隨機對照實驗（RCT）在數位產品的落地，通常設定顯著水準 α = 0.05 與統計檢定力 1 − β = 0.80 事前計算最小樣本數（Power Analysis）。\n\n• 嚴防「多重檢定膨脹偽陽性」與「新奇效應（Novelty Effect）」；進階平台採 CUPED 方差縮減技術加速實驗收斂，或以多臂老虎機演算法動態分配流量。"}, "myNotes": "流量還小的時候別浪費時間測按鈕顏色，把精力拿去改核心價值主張與大結構！", "relatedIds": ["mkt-funnel", "algo-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s4-2", "categoryId": "cat-marketing", "stageId": "s4", "subtopic": "搜尋能見度", "title": "SEO 與 AAO（AI 搜尋時代的內容能見度策略）", "oneLiner": "以前寫文章是為了討好 Google 排第一頁（SEO），現在更要寫得結構清楚、有獨家數據與清楚結論，讓 AI 摘要也優先引用你（AAO / GEO）。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "以前大家查資料會點進十個部落格慢慢看，所以網站拚命塞關鍵字搶 Google 第一名（SEO）。\n\n現在越來越多人直接問 AI 幫他總結答案！所以新時代的寫作多了 **AAO（AI Answer Optimization，或稱 GEO）**：\n• 結論寫前面、段落有清楚小標題與對照表。\n• 提供「只有你親身實測過的真實體驗、具體數字與清楚觀點」（AI 最愛引用有具體細節的來源，而不是網路上抄來抄去的空話）。", "lv2": "同時拿捏 SEO 與 AAO 的內容寫作檢核表：\n\n1. 鎖定「真實提問意圖」：用讀者真正會打在搜尋框的問題當小標題（例如「XX 跟 YY 差在哪？怎麼選？」）。\n2. 開頭 100 字先給精準摘要答案（方便 Google 精選摘要與 AI 引擎直接抓取引用）。\n3. 建立 E-E-A-T 訊號：放入第一手實拍圖、實測數據、明確日期與作者真實經驗脈絡。\n4. 做好內部連結網：把同主題文章互相串聯，讓搜尋引擎看懂你在這個領域的專業深度。", "lv3": "從傳統基於關鍵字詞頻與反向連結（PageRank）的檢索排序，演進至生成式引擎優化（GEO, Aggarwal et al., 2024）：研究顯示在內容中加入「具體統計數據、權威來源引用、清晰結構化對比與直接定義句」，可將被生成式搜尋引擎引用的能見度顯著提升 30%–40%。"}, "myNotes": "寫部落格或專業文章時，加「第一手實測細節 + 清楚對照表 + 結論先行」，SEO 跟 AI 搜尋雙贏！", "relatedIds": ["algo-s4-2", "mkt-flywheel"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s4-3", "categoryId": "cat-marketing", "stageId": "s4", "subtopic": "口碑裂變", "title": "社群病毒傳播係數（K-Factor）與口碑裂變機制", "oneLiner": "讓人主動分享的秘密不在「求求你幫我轉發」，而在於分享這件事能讓他「看起來很懂行、幫到朋友或抒發情緒」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "為什麼有些文章、梗圖或工具（像心理測驗、年度回顧）沒花一毛錢廣告費卻瞬間洗版？\n\n這背後有個像傳染病一樣的數字叫 **病毒係數（K-Factor）**：如果平均每 1 個用戶會成功帶進 1.2 個新用戶（K > 1），人數就會像滾雪球一樣指數爆發！\n\n大家願意按分享通常不是為了幫你宣傳，而是為了自己：\n• 社交貨幣（轉發這個讓我顯得很有品味／很懂趨勢）。\n• 實用價值（收藏＋轉給需要的朋友看）。\n• 情緒共鳴（太好笑、太有感或太驚訝了！）。", "lv2": "幫內容或產品植入自然口碑機制的四招：\n\n1. **雙邊獎勵推薦**：像 Dropbox 或 Uber「邀請朋友，你跟朋友各得免費容量／折價券」，降低推薦的尷尬感。\n2. **把產品成果做成「可炫耀的分享卡」**：像 Spotify 年度回顧，讓用戶超想截圖發限動。\n3. 提煉「一眼看懂的圖表或金句清單」：高密度懶人包天然具備極高的收藏與轉傳率。\n4. 降低分享摩擦：一鍵複製連結或精準預覽圖，別讓步驟太繁瑣。", "lv3": "病毒係數 K = i × c（每位用戶平均發出邀請數 i × 邀請轉換率 c），結合病毒週期時間（Viral Cycle Time）決定自然指數增長斜率。\n\n• Jonah Berger《瘋潮行銷》（Contagious）實證歸納高分享內容六大要素 STEPPS：社交貨幣、誘因、情緒、公開性、實用價值與故事包裝。"}, "myNotes": "問自己一句：「讀者把這篇轉發出去，會讓他自己在朋友眼中顯得更有品味或更聰明嗎？」", "relatedIds": ["mkt-flywheel", "mkt-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "mkt-s4-4", "categoryId": "cat-marketing", "stageId": "s4", "subtopic": "個人品牌", "title": "個人品牌與小眾鐵粉經濟（1,000 位鐵粉模型）", "oneLiner": "你不需要一百萬個路人按讚才能靠專業變現；只要真心服務好 1,000 位高度信任你的鐵粉，就足以撐起一份獨立事業。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "很多人不敢經營個人品牌，覺得「我又不是百萬網紅怎麼可能賺錢？」\n\n科技作家 Kevin Kelly 算過一筆超振奮的帳：只要全世界有 **1,000 位鐵粉**（真正欣賞你、願意每年花大約 3,000 元買你的書、課程、貼圖或顧問服務的人），一年就能創造 300 萬收入！\n\n換句話說，你不必討好所有人，只要在一個細分交叉領域（例如「懂技術又會白話解說的跨領域整理者」）持續輸出真誠有用的內容，就能吸引到屬於你的鐵粉。", "lv2": "打造個人品牌複利的四個長期動作：\n\n1. **公開學習（Learn in Public）**：不必等成為世界第一大師才分享，把你整理筆記、解決問題的過程白話記錄下來，對比你晚兩步的人就是黃金教材。\n2. **獨特交叉定位**：單一領域很難拼過頂尖專家，但把「兩個以上領域交集」起來（如數據 + 設計 + 說故事），你就是獨一無二的品類第一。\n3. 建立「自有陣地」（個人網站／電子報／知識庫），不把所有鐵粉關係完全交給隨時改演算法的社群平台。", "lv3": "「1,000 True Fans」（Kevin Kelly, 2008）與 Li Jin 進一步提出之「100 True Fans」揭示數位時代長尾經濟與去中介化紅利：當邊際複製成本趨近於零，創作者可透過「高信任度 × 高單價深度價值（如利基工具、付費社群、顧問）」跳脫低單價流量廣告內卷。"}, "myNotes": "公開學習 + 跨領域交集定位 + 自有陣地，就是普通人最強的品牌複利路徑！", "relatedIds": ["mkt-stp", "mkt-flywheel"], "updatedAt": "2026-11-24"},
        {"id": "psy-s1-2", "categoryId": "cat-psych", "stageId": "s1", "subtopic": "認知資源", "title": "注意力資源、工作記憶與認知負荷理論", "oneLiner": "大腦的工作記憶就像只有 4 格的小書桌，同時開十個視窗分心切換，只會把寶貴腦力全部浪費在搬東西上。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "把你的大腦想像成一台電腦：長期記憶是超大硬碟，但「工作記憶」卻是一條超小的記憶體，一次頂多只能同時記住大約 **4 件事情**！\n\n這就是為什麼一邊讀書、一邊回訊息、旁邊還開著影片時，你覺得自己超努力卻什麼都沒看進去——因為每次切換注意力，大腦都得花十幾分鐘重新載入剛才讀到哪，光切換就把記憶體塞爆了。", "lv2": "保護工作記憶、讓學習與工作速度翻倍的四招：\n\n1. **外包暫存（寫下來）**：腦中閃過任何待辦或靈感立刻記在紙上，騰空工作記憶專心思考。\n2. **組塊化（Chunking）**：記 `0912345678` 很難，拆成 `0912-345-678` 三塊立刻好記——把零碎知識歸納成結構框架就是高階組塊。\n3. 一次只做一件事，深度工作時手機放另一間房。\n4. 設計簡報或教材時，去掉花俏無關裝飾（降低「外在認知負荷」）。", "lv3": "John Sweller 提出認知負荷理論（Cognitive Load Theory），將負荷分為三類：內在負荷（任務本身複雜度）、外在負荷（不良呈現方式造成的干擾）與增生負荷（建構長期基模 Schema 的有效努力）。\n\n• 工作記憶容量（Nelson Cowan 修正為約 4±1 資訊組塊）為一切學習與決策瓶頸；優秀教學設計的核心在於壓低外在負荷、分階控制內在負荷（這正是本知識庫三層難度的理論基石）。"}, "myNotes": "工作記憶只有約 4 格——寫下來清大腦、把知識分層組塊，吸收率瞬間暴增！", "relatedIds": ["psy-system12", "psy-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "psy-s1-3", "categoryId": "cat-psych", "stageId": "s1", "subtopic": "記憶科學", "title": "記憶運作原理：遺忘曲線、編碼與提取效應", "oneLiner": "光是一直重讀畫重點只會製造「我好像看懂了」的假象，真正把知識鎖進大腦的動作是「闔上書主動想出來」。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "為什麼考前把課本畫滿五顏六色螢光筆、看了五遍，一進考場還是腦袋空白？\n\n因為大腦很省電，只要你沒逼它「自己想出來」，它就覺得這資訊不重要，24 小時內自動幫你刪掉一半（**艾賓浩斯遺忘曲線**）！\n\n最省力的記憶黑科技有兩招：\n1. **提取效應**：讀完一張知識卡後，蓋起來用自己的話默念或寫出重點，逼大腦把記憶「抓出來」一次，記憶強度直接翻倍。\n2. **間隔重複**：不要一天硬背 5 小時，改成第 1 天、第 3 天、第 7 天、第 30 天各花 5 分鐘複習，記一輩子！", "lv2": "把記憶科學直接用在個人知識庫學習：\n\n1. 每讀完一張知識卡，立刻在最下方的「我的心得」用白話寫下 1 句自己的總結（即時提取練習）。\n2. 善用「精細編碼」：把新概念連到你原本就懂的舊知識（例如把五行生剋連到系統回饋迴路），有掛鉤就絕不會忘。\n3. 睡前複習 10 分鐘 + 睡飽 7–8 小時：睡眠中的海馬迴重播是把短期記憶轉成長期記憶的關鍵步驟。", "lv3": "Roediger & Karpicke（2006）經典實驗證實「提取練習效應（Testing Effect）」在一週後的長期保留率遠高於重複閱讀；結合 Bjork 夫婦之「合意困難（Desirable Difficulties）」理論，適度增加提取難度（間隔重複、交錯練習 Interleaving）雖在當下感覺較吃力，卻能最大化長期神經突觸鞏固。"}, "myNotes": "畫重點 = 假努力；闔上書寫下 1 句自己的話（提取）+ 間隔複習 = 真記憶！", "relatedIds": ["cross-ultralearning", "psy-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "psy-s1-4", "categoryId": "cat-psych", "stageId": "s1", "subtopic": "情緒神經", "title": "情緒的演化功能與杏仁核劫持機制", "oneLiner": "情緒不是理性的敵人，而是遠古大腦的快速警報器；但被激怒時前額葉會暫時斷線，學會熬過「90 秒情緒浪潮」就能奪回主導權。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "你有沒有遇過這種事：被某人一句酸言酸語氣到理智斷線，當下口不擇言回罵，結果十分鐘後冷靜下來後悔得要命？\n\n這叫 **杏仁核劫持（Amygdala Hijack）**！遠古人類在草原看到老虎時，負責恐懼憤怒的「杏仁核」會在 0.05 秒內直接接管身體、把負責理智思考的「前額葉」暫時斷電，好讓你立刻逃跑或反擊。\n\n問題是現代會議室裡沒有老虎，但主管一句批評卻照樣觸發了遠古警報！神經科學家發現，情緒化學物質在體內沖刷一輪大約只需要 **90 秒**——只要撐過這 90 秒不馬上回嘴、不按發送，理智就會重新上線！", "lv2": "面對杏仁核劫持的三步急救術：\n\n1. **物理暫停 90 秒**：氣到發抖時說「這件事我需要整理一下，十分鐘後回覆你」，立刻離開現場去喝杯水。\n2. **拉長吐氣（4 秒吸、6–8 秒慢吐）**：直接啟動副交感神經告訴大腦「現場沒有老虎」。\n3. **把情緒當成「儀表板訊號」**：生氣通常代表「界線被踩到了」，焦慮通常代表「某件在乎的事不確定性太高」——讀懂訊號而不是被訊號開著車跑。", "lv3": "Daniel Goleman 提出「杏仁核劫持」概念，源於 Joseph LeDoux 發現的丘腦—杏仁核「快速低路（Low Road）」直連機制，其神經傳導速度早於經過大腦皮層精細評估的「高路（High Road）」。神經解剖學家 Jill Bolte Taylor 進一步指出，純生理情緒迴路從觸發到代謝約 90 秒，超過 90 秒的持續憤怒皆來自大腦不斷重播負面念頭所重新點燃。"}, "myNotes": "氣到想立刻回嗆或傳訊時，逼自己撐過 90 秒——那 90 秒能救回無數段關係！", "relatedIds": ["psy-s4-3", "speak-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "psy-s2-2", "categoryId": "cat-psych", "stageId": "s2", "subtopic": "認知偏誤", "title": "確認偏誤、倖存者偏差與可得性啟發", "oneLiner": "大腦天生是個偏心的律師：只挑支持自己原本想法的證據、只看見活下來的成功者，並把腦中最容易想起來的例子當成全貌。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "這三個偏誤幾乎每天都在悄悄騙我們：\n\n• **確認偏誤**：你已經決定想買某支新手機，上網查評測時會不自覺只點開誇它好的影片，把說它耗電的評論自動略過。\n• **倖存者偏差**：二戰時工程師想幫轟炸機加裝裝甲，看飛回來的飛機「機翼彈孔最多」，差點全裝在機翼上！統計學家趕緊喊停：應該裝在「沒彈孔的引擎與駕駛艙」，因為被打中那裡的飛機全都墜毀沒飛回來！\n• **可得性啟發**：剛看新聞報導空難就覺得搭飛機超危險，其實開車出車禍的機率高出幾百倍——我們只是把「印象最鮮明」當成「機率最高」。", "lv2": "幫自己裝上這三套偏誤防禦開關：\n\n1. 防確認偏誤：做重大決定前，刻意去搜尋「為什麼不要買 XX／這方案最大的缺點是什麼」。\n2. 防倖存者偏差：看到成功創業故事或大神投資績效時，立刻問「用了同樣方法卻失敗沉默的那 99 個人在哪裡？」\n3. 防可得性啟發：別靠單一聳動新聞或朋友個案做判斷，查真實基礎統計比例。", "lv3": "確認偏誤（Confirmation Bias, Wason 1960）與可得性啟發（Availability Heuristic, Tversky & Kahneman 1973）屬於認知省力機制；倖存者偏差（Survivorship Bias, Abraham Wald 二戰研究）則屬嚴重的樣本選擇偏差（Selection Bias），在商業案例研究與基金績效回測中極易導致系統性高估勝率。"}, "myNotes": "看到「大神都這樣成功」立刻想起二戰轟炸機——去問沒飛回來的那些人在哪裡！", "relatedIds": ["psy-system12", "cross-bayes"], "updatedAt": "2026-11-24"},
        {"id": "psy-s2-3", "categoryId": "cat-psych", "stageId": "s2", "subtopic": "社會偏誤", "title": "光環效應、基本歸因謬誤與團體迷思", "oneLiner": "看別人犯錯就怪他「人品有問題」、自己犯錯就說「今天太倒楣」；人一多為了和氣不敢講真話，整組就會一起開進懸崖。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "三個超常見的人際與團隊大盲點：\n\n• **光環效應**：看到一個人長得好看、學歷很高或簡報做很美，大腦就會自動幫他腦補「他一定也很聰明、善良又靠譜」（反過來一處不好就全盤否定叫「尖角效應」）。\n• **基本歸因謬誤**：別人在路上切你車道，你大罵「這人超沒素質！」；但你自己趕時間切別人車道時，你心想「我今天真的快遲到沒辦法啦！」——對別人怪性格、對自己找環境藉口。\n• **團體迷思**：開會時老闆一臉得意提出爛點子，大家怕破壞氣氛通通點頭說好，結果大家一起把案子做爆。", "lv2": "職場與團隊避開這三大盲點的做法：\n\n1. 破除光環效應：面試或評估提案時，分項獨立打分（例如分開評「表達能力」跟「技術深度」），不被單一亮點蒙蔽。\n2. 破除基本歸因謬誤：先假設對方出包背後有你不知道的環境限制，問清楚再評價。\n3. 破除團體迷思：團隊開會指定一位「反方魔鬼代言人（Devil's Advocate）」，並讓最資淺的人先發言，避免大家只順著主管講。", "lv3": "光環效應由 Edward Thorndike（1920）發現；基本歸因謬誤（Fundamental Attribution Error, Lee Ross 1977）反映行動者—觀察者不對稱性；團體迷思（Groupthink, Irving Janis 1972）則解釋了為何高度凝聚且缺乏異議機制的菁英團隊（如豬玀灣事件、挑戰者號失事）反而做出災難性誤判。"}, "myNotes": "開會最怕一片和諧沒人敢唱反調——主動設一個「反方提問環節」超救命！", "relatedIds": ["psy-s2-2", "cross-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "psy-s2-4", "categoryId": "cat-psych", "stageId": "s2", "subtopic": "自我校準", "title": "達克效應（Dunning-Kruger）與過度自信校準", "oneLiner": "剛學一點皮毛的時候往往覺得自己超懂（愚昧之山），真正深入後才會驚覺自己懂的太少，謙卑反而是高手的標配。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "學任何新技能（投資、寫程式、攝影）幾乎都會走過同一條曲線：\n\n1. **愚昧之山**：剛看三支教學影片，覺得「這也太簡單了吧，我已經是專家了！」（這時最容易衝動下單或亂給建議）。\n2. **絕望之谷**：實際動手做才發現水超深、處處是坑，開始懷疑人生。\n3. **開悟之坡**：咬牙系統化補完地基後，真正實力穩定上升。\n4. **大師高原**：懂得多到清楚知道知識的邊界在哪，說話反而客觀謙遜。", "lv2": "幫自己校準自信、避開「愚昧之山」慘劇的三招：\n\n1. 剛入門新領域前半年，刻意縮小下注金額或風險規模（先交便宜的學費）。\n2. 建立「決策日誌」：每次下判斷前寫下你的信心百分比（例如 80% 把握）與理由，半年後回頭對答案，你會驚訝發現自己常過度自信。\n3. 聽取領域資深專家的「反面提醒」，多問「這件事最容易在哪裡翻車？」", "lv3": "David Dunning 與 Justin Kruger（1999）實證指出：能力低落者面臨「雙重負擔」——不僅容易做出錯誤判斷，更缺乏足夠的後設認知能力（Metacognition）去察覺自己的錯誤，因而高估自身表現；反觀高能力者常因「錯誤共識效應」誤以為對自己簡單的事對別人也很簡單而低估自身相對排名。"}, "myNotes": "剛學完一個新領域覺得「超簡單」的時候，立刻提醒自己：我可能正站在愚昧之山頂！", "relatedIds": ["cross-s1-4", "cross-bayes"], "updatedAt": "2026-11-24"},
        {"id": "psy-s3-2", "categoryId": "cat-psych", "stageId": "s3", "subtopic": "行為動力", "title": "多巴胺獎賞預測誤差與拖延症的真正成因", "oneLiner": "拖延症從來不是因為懶惰，而是大腦在逃避「任務太模糊、怕做不好」帶來的情緒不適，轉頭去滑手機拿廉價多巴胺。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "大家都以為拖延是因為「太懶、沒紀律」，結果越罵自己懶就越焦慮、越焦慮就越想滑短影音逃避！\n\n神經科學揭開了兩個驚人真相：\n1. **多巴胺不是快樂分子，而是「期待與渴望分子」**：滑短影音因為下一支影片充滿未知驚喜，瘋狂刺激多巴胺讓你停不下來。\n2. **拖延是「情緒逃避」**：當待辦寫著「寫完論文」或「整理年度財務」這種又大又模糊的怪物時，大腦覺得壓力山大，立刻逃去刷手機止痛。", "lv2": "根治拖延症的四個科學拆解動作：\n\n1. **把怪物切成「笨到不會失敗的第一步」**：不要寫「寫企劃書」，改成「打開空白文件，只寫下標題跟三個小標題（限時 5 分鐘）」。\n2. **先做 5 分鐘就好（蔡加尼克效應）**：大腦一旦開始動手，就會討厭「做一半沒收尾」，5 分鐘後通常自己就順順做下去了。\n3. **早上先別碰高刺激短影音**：一起床就狂吃垃圾多巴胺，會把你整天的專注基準線拉高，看正經書會覺得超無聊。\n4. 原諒昨天的拖延：研究證實「自我原諒」比「自我責罵」更能減少下一次拖延。", "lv3": "Wolfram Schultz 揭示中腦邊緣多巴胺系統編碼「獎賞預測誤差（Reward Prediction Error, RPE）」而非單純愉悅感，這解釋了隨機變動比率獎賞（如社群無限捲動）極易致癮的機制。\n\n• 拖延研究學者 Tim Pychyl 定義拖延為「以短期情緒修復優先於長期目標的自我調節失靈（Emotion-Focused Coping）」，故治本之道在於降低任務啟動的焦慮喚醒度與模糊性。"}, "myNotes": "拖延 = 逃避模糊與焦慮！切出 5 分鐘就能完成的超小第一步，就能瞬間破冰。", "relatedIds": ["psy-habit", "psy-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "psy-s3-3", "categoryId": "cat-psych", "stageId": "s3", "subtopic": "深度專注", "title": "心流（Flow）狀態條件與深度工作設計", "oneLiner": "當任務難度剛好比你現在的能力高出 4%，加上目標明確、零干擾與即時回饋，大腦就會進入忘我且產出極高的心流區間。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "玩一場勢均力敵的遊戲或畫一張超投入的圖，一抬頭發現兩小時竟然像十分鐘一樣飛過去，而且完全不覺得累——這就是心理學說的 **心流（Flow）**！\n\n為什麼平常上班讀書很難進入心流？因為：\n• 任務太簡單 → 覺得超無聊想滑手機。\n• 任務太難 → 焦慮到想逃避。\n• 每 5 分鐘手機叮咚一聲 → 剛要進入狀態就被硬生生打斷！\n\n調好「剛剛好的挑戰難度」＋「關掉通知 90 分鐘」，工作也能像打電動一樣上癮！", "lv2": "主動設計心流時段的四個必要條件：\n\n1. **目標極度清晰**：坐下來前就知道這 90 分鐘要完成哪個具體產出。\n2. **校準黃金難度（比現有能力高約 4%–10%）**：太難就先拆小步驟，太簡單就給自己加一點時間挑戰或品質要求。\n3. **零打擾結界**：開飛航／勿擾模式，前 15 分鐘最抗拒，撐過第 15 分鐘大腦就會滑進心流。\n4. **即時回饋**：像寫程式馬上跑測試、寫文章看字數與結構完成度，讓大腦持續看到進展。", "lv3": "匈牙利心理學家 Mihaly Csikszentmihalyi 系統化心流理論，指出心流發生於高挑戰（High Challenge）與高技能（High Skill）的交集通道，伴隨前額葉暫時性低活躍（Transient Hypofrontality，自我批判雜音關閉）與內在獎勵機制啟動。Cal Newport《深度工作力》進一步將其制度化為可排程的無干擾時間區塊。"}, "myNotes": "撐過前 15 分鐘抗拒期 + 關掉所有通知 + 目標明確，就能穩定喚出心流！", "relatedIds": ["psy-s3-2", "psy-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "psy-s3-4", "categoryId": "cat-psych", "stageId": "s3", "subtopic": "心理韌性", "title": "成長型思維（Growth Mindset）與習得性無助逆轉", "oneLiner": "把「我天生就不是這塊料」改成「我只是還沒找到對的方法」，一字之差決定了你在挫折前是直接放棄還是越挫越強。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "史丹佛教授 Carol Dweck 發現人對能力的看法分兩種：\n\n• **定型思維**：覺得聰明才智是天生固定的，失敗就代表「我很笨」，所以為了保全面子乾脆不敢挑戰難題。\n• **成長型思維**：把大腦當成肌肉，越練越強，失敗只是「還沒學會（Not Yet）」的回饋訊號！\n\n反過來說，如果一個人連續在沒辦法控制的情況下受挫太多次，就可能陷入「習得性無助」——就算後來逃生門已經打開了，也因為覺得「反正我怎麼努力都沒用」而原地放棄。", "lv2": "逆轉無助感、培養成長型思維的實務練習：\n\n1. **語句加上「目前還沒」**：把「我數學不好／不會理財」改成「我目前還沒掌握這套方法」。\n2. **拆解歸因（Seligman 樂觀歸因法）**：遇到失敗時，把原因界定為「暫時的、特定這件事的、可透過換策略改變的」，而非「永遠的、我整個人都很糟」。\n3. **累積微小掌控勝仗**：陷入低潮時，刻意先完成一件 100% 在自己掌控內的小任務，重新喚醒大腦的掌控感。", "lv3": "Martin Seligman（1967）提出習得性無助（Learned Helplessness），後發展為正向心理學與解釋風格理論（從永久性、普遍性、個人化三維度重塑歸因）；神經可塑性（Neuroplasticity）研究亦證實成年人海馬迴與皮層神經連結終生皆可透過刻意練習重塑。"}, "myNotes": "在任何「我不會」後面強制加上「目前還沒」，就能打開大腦的學習開關！", "relatedIds": ["psy-habit", "cross-ultralearning"], "updatedAt": "2026-11-24"},
        {"id": "psy-s4-2", "categoryId": "cat-psych", "stageId": "s4", "subtopic": "關係心理", "title": "依附理論（Attachment Theory）與親密／職場互動模式", "oneLiner": "我們長大後在親密關係與職場裡怎麼面對信任、爭執與距離，往往偷偷沿用著童年時期學會的「安全感腳本」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "為什麼有人對方半小時沒回訊息就焦慮到胡思亂想，有人卻只要關係一變親近就想逃跑？心理學把這分成四種主要依附風格：\n\n• **安全型**：相信自己值得被愛、也信任別人，吵架能好好溝通。\n• **焦慮型**：非常怕被拋棄，需要反覆確認對方的愛與肯定，一感覺冷淡就緊抓追問。\n• **逃避型**：習慣凡事靠自己，覺得過度依賴很危險，一有衝突就關上心門冷處理。\n• **混亂型**：既渴望親近又害怕受傷，常常推拉矛盾。\n\n最棒的好消息是：依附風格不是終生標籤，透過覺察與健康互動是可以後天練成「習得安全型」的！", "lv2": "把依附理論用在關係與職場相處的實務指南：\n\n1. 先辨識自己的「壓力觸發模式」：焦慮型練習「在腦中給對方 2 小時緩衝空間，直接說出需求而非情緒試探」；逃避型練習「想冷靜時先說『我需要一小時整理思緒，等等回來聊』，而不是直接消失」。\n2. 辨識職場互動：面對高度逃避型主管或同事，給足獨立空間與書面預期；面對焦慮型夥伴，主動提供清楚進度回報能大幅降低內耗。", "lv3": "由 John Bowlby 奠基、Mary Ainsworth 透過「陌生情境實驗」分類，後由 Hazan & Shaver（1987）延伸至成人依附雙維度模型（依附焦慮 Anxiety × 依附逃避 Avoidance）。實證研究顯示成人依附具可塑性，透過「後設覺察 + 伴侶／心理安全環境 + 情緒調節練習」可逐步轉化為 Earned Security（習得安全感）。"}, "myNotes": "衝突時逃避型記得說「我需要冷靜一小時再回來聊」，焦慮型練習直接說需求而非試探！", "relatedIds": ["psy-dissonance", "psy-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "psy-s4-3", "categoryId": "cat-psych", "stageId": "s4", "subtopic": "情緒調節", "title": "情緒標記、認知重評與壓力調節技術", "oneLiner": "決定你崩潰與否的往往不是事件本身，而是你對事件的解讀；精準叫出情緒的名字，就能立刻關小它的音量。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "同一場大雨，A 心想「倒楣透頂，今天全毀了」氣了一整天；B 心想「剛好省下出門跑腿，在家喝熱咖啡追進度」開心了一整天——這就是心理學著名的 **ABC 理論**：真正影響你心情（C）的不是事件（A），而是你對事件的看法（B）！\n\n兩招超好用的情緒開關：\n1. **情緒標記（Name it to tame it）**：別只說「我心情超差」，精準叫出它的名字：「我現在是『失望』加上『擔心進度來不及』」，大腦一命名，慌亂感立刻降溫一半！\n2. **認知重評**：問自己「一年後回頭看今天這件事，它還重要嗎？這件事有沒有第二種較客觀的解釋？」", "lv2": "高壓時期立刻上手的壓力調節工具箱：\n\n1. **拆解焦慮紙上法**：把擔心的事分成「我能控制（寫 1 個行動）」與「不能控制（劃掉放下）」。\n2. **情緒顆粒度練習**：區分「生氣、委屈、羞愧、無力、嫉妒」，越精準就越知道該對症下藥修什麼。\n3. **身體由下而上調節**：規律睡眠、快走 20 分鐘與長吐氣呼吸，常比硬在腦中想通更快把皮質醇降下來。", "lv3": "James Gross 情緒調節過程模型指出，「認知重評（Cognitive Reappraisal，在情緒完全升起前重塑詮釋）」在長期身心健康與人際效果上顯著優於「表達壓抑（Expressive Suppression）」。Matthew Lieberman 的腦造影研究亦證實情感標記（Affect Labeling）能活化右腹外側前額葉並直接抑制杏仁核反應。"}, "myNotes": "Name it to tame it：把「心情超爛」精準命名成具體情緒，焦慮立刻少一半！", "relatedIds": ["psy-s1-4", "psy-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "psy-s4-4", "categoryId": "cat-psych", "stageId": "s4", "subtopic": "心理界線", "title": "心理界線、投射效應與高情商衝突化解", "oneLiner": "分清「我的課題」與「你的課題」，不替別人的情緒買單，也不把自己的焦慮硬塞給別人，關係才會輕鬆長久。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "好人最容易累死的原因，就是沒有「心理界線」：別人心情不好，你以為是自己的錯；對方提出不合理要求，你怕他生氣只好委屈答應。\n\n阿德勒心理學給了一個超俐落的判斷題——**課題分離**：「這件事最後的後果是誰承擔？」\n• 你盡力把話說清楚是「你的課題」；對方聽完要不要生氣、接不接受是「他的課題」。\n\n另外也要留意 **投射效應**：有時候你超討厭某個同事愛比較、愛炫耀，其實是因為你自己心裡也很在意別人的眼光。看清這兩點，人際內耗直接少 80%！", "lv2": "守住健康界線又不顯冷漠的三步驟：\n\n1. **溫和界定責任**：可以同理對方難過（「我知道這讓你很難受」），但不必因為他難過就放棄自己的合理底線。\n2. **辨識情緒勒索三訊號（FOG）**：對方是否用恐懼（Fear）、義務（Obligation）或罪惡感（Guilt）逼你妥協？\n3. **衝突轉化原則**：把焦點從「誰對誰錯」移到「我們下次可以怎麼調整規則讓兩邊都舒服」。", "lv3": "整合阿德勒個體心理學「課題分離（Separation of Tasks）」、佛洛伊德防衛機制中的「心理投射（Projection）」與界線理論（Henry Cloud / Nedra Tawwab）：健康界線並非築牆隔絕，而是清楚定義自我責任邊界與互動條款，為長期互尊關係的必要前提。"}, "myNotes": "課題分離問句：「這個選擇的最終後果由誰承擔？」——瞬間斬斷 80% 人際內耗！", "relatedIds": ["psy-dissonance", "speak-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "meta-s1-2", "categoryId": "cat-metaphysics", "stageId": "s1", "subtopic": "易經架構", "title": "易經八卦與六十四卦的變易思維架構", "oneLiner": "《易經》不是算命神諭，而是古人用二進位陰陽符號推演出來的「六十四種人生與組織局勢演變沙盤」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "把《易經》想成一套古代的「戰略情景模擬器」！\n\n古人只用兩條線——陽爻（⚊，積極主動）和陰爻（⚋，柔順承載）——三個一組排出「八卦」（天、地、雷、風、水、火、山、澤八種自然現象），再把兩個八卦上下疊在一起，就變出 **8 × 8 = 64 種人生與局勢劇本（六十四卦）**！\n\n例如最出名的「乾卦」六個階段，簡直就是職場成長指南：剛入行先低調練功（潛龍勿用）→ 遇貴人嶄露頭角（見龍在田）→ 步步謹慎（終日乾乾）→ 準備躍升（或躍在淵）→ 大展身手（飛龍在天）→ 盛極而衰要懂收手（亢龍有悔）！", "lv2": "用易經「三易原則」看懂局勢變化：\n\n1. **變易**：世上沒有永遠的好運或永遠的逆境，順境要備寒冬、逆境要蓄實力。\n2. **不易**：表象天天變，但背後「物極必反、陰陽平衡、因果積累」的底層規律不變。\n3. **簡易**：把再複雜的局勢都先拆成「我現在處在起飛、高峰、卡關還是收斂哪個階段？」，就能選對行動策略。", "lv3": "《周易》由卦象（六爻結構）、卦辭與爻辭（動態階段指引）及《十翼》（儒家哲學詮釋）構成。其二元編碼結構曾啟發萊布尼茨對二進位數學的反思。\n\n• 決策思維核心為「時位觀（Timing & Position）」：同一種行動在不同時機與位階會產生截然不同的吉凶後果，強調審時度勢與中庸守正。"}, "myNotes": "乾卦六爻就是最經典的「從新手練功到巔峰止盈」完整職涯成長路徑！", "relatedIds": ["meta-yinyang", "strat-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "meta-s1-3", "categoryId": "cat-metaphysics", "stageId": "s1", "subtopic": "時間週期", "title": "天人相應、節氣曆法與時間週期觀", "oneLiner": "古人發現地球繞太陽的四季消長與萬物榮枯同步，因而用「天干地支與二十四節氣」建立了一套順應節奏的週期管理學。", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "農民不會在寒流來襲的冬天硬播種，也不會在酷暑才急著修水溝——這就是「順時而為」。\n\n傳統曆法其實是超精密的天文週期表：\n• **二十四節氣**看的是「太陽位置」（所以立春永遠在國曆 2 月 4 日前後，八字換年換月看的是節氣而不是農曆初一！）。\n• **十天干 × 十二地支**最小公倍數組成「六十甲子」循環。\n\n把這套時間觀放進生活，就是承認萬物都有「春生、夏長、秋收、冬藏」的波浪節奏，不必強求自己 365 天都維持 100% 滿血衝刺。", "lv2": "讀懂傳統時間系統的三個必備常識：\n\n1. 八字年份切換點是「立春」，月份切換點是十二節（立春、驚蟄、清明…），而不是過年除夕或國曆 1 號。\n2. 一天分成十二時辰（每兩小時一格，子時為 23:00–01:00），對應古人作息與身心節律。\n3. 個人規劃應用：幫自己的年度與專案也設計「衝刺期（春夏）、驗收期（秋）、沉澱復盤期（冬）」。", "lv3": "中國傳統農曆實為「陰陽合曆」：以朔望月（月球週期）定初一十五，以太陽回歸年（黃經每 15 度）定二十四節氣並置閏月校準誤差。命理系統借天文節氣標定季節寒暖燥濕（五行旺相休囚死），成為評估系統環境參數的基礎坐標系。"}, "myNotes": "重要冷知識：八字換年是看「立春」，不是農曆大年初一！", "relatedIds": ["meta-yinyang", "meta-bazi"], "updatedAt": "2026-11-24"},
        {"id": "meta-s1-4", "categoryId": "cat-metaphysics", "stageId": "s1", "subtopic": "東西比較", "title": "東方命理（動態系統）與西方占星（原型心理）比較", "oneLiner": "東方八字紫微像在看「氣流平衡與時間運勢賽局」，現代西方占星則像一套「探索內在多面性格的心理原型圖譜」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "很多人同時聽過八字、紫微跟星座星盤，它們到底差在哪？\n\n• **東方命理（八字／紫微）**：偏重「關係與平衡」——看你跟財富、事業、長輩、規矩之間的互動順不順，以及不同十年大運該進攻還是防守，風格像務實的「戰略顧問」。\n• **西方占星（太陽、月亮、上升與十二宮）**：特別經過現代心理占星發展後，偏重「內在自我與心理動力」——太陽代表人生核心渴望、月亮代表內在安全感需求、上升代表對外面具，風格像溫柔的「心理探索師」。\n\n兩邊沒有誰比較準，只是切入人生的「鏡頭語言」完全不同！", "lv2": "跨文化欣賞兩大符號系統的實用對照：\n\n1. 想盤點「不同年齡階段的進退節奏、職場角色與資源互動」→ 東方八字／紫微的系統感很強。\n2. 想探索「內在情感需求、關係拉扯與性格多面性」→ 西方心理占星（行星 + 星座 + 宮位 + 相位）詞彙極豐富。\n3. 共同底線：兩者皆屬於文化符號與類型學語言，用來啟發自我對話很棒，但不宜用來貼死板標籤歧視他人。", "lv3": "西方占星源於美索不達米亞與希臘化時期，20 世紀經 Dane Rudhyar 與 Liz Greene 結合榮格分析心理學轉向「人本與心理占星（Psychological Astrology）」，將行星視為集體潛意識原型；東方命理則紮根於陰陽五行與儒道入世倫理，高度結構化地映射宗族、功名與時間流轉。"}, "myNotes": "東方偏「動態平衡與進退策略」，西方偏「內在心理原型」，合起來看視角超立體！", "relatedIds": ["meta-bazi", "meta-ziwei", "meta-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "meta-s2-2", "categoryId": "cat-metaphysics", "stageId": "s2", "subtopic": "八字核心", "title": "日主強弱、月令氣候（調候）與平衡取用思維", "oneLiner": "八字看盤不是在找「越多財官越好」，就像冷氣房間太冷需要暖氣、太熱需要冰水，缺什麼補什麼讓系統平衡才是核心。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "新手看八字常有一個大誤解：「財星越多一定越有錢吧？」其實完全不是！\n\n想像你背著一袋 100 公斤的金條（財星超旺），但你自己體力很弱（日主身弱），這袋金條不但不會讓你變爽，還會把你壓到走不動路——這時你最需要的不是再多一袋金條，而是「先練身體或找隊友幫忙扛（印星、比劫）」！\n\n同樣的，冬天出生太寒冷的命盤需要一點火來取暖（**調候**），夏天太酷熱則需要水來降溫。這套「找系統最缺的那塊拼圖」就叫 **取用神（平衡思維）**。", "lv2": "看懂八字平衡邏輯的三步驟：\n\n1. **先看月令（出生季節）**：季節決定了整個命盤 40%–50% 的基礎氣候與能量強弱。\n2. **評估身強 vs 身弱**：身強（能量足）不怕挑戰、適合靠輸出才華（食傷）或承擔責任（官殺）發揮；身弱（能量易耗）則重團隊支援、貴人學習（印）與蓄力節奏。\n3. **動態看喜忌**：沒有天生永遠好或壞的五行，全看它是否幫助整體回到平衡。", "lv3": "子平正宗取用體系主要分為四大視角：扶抑（強者抑之、弱者扶之）、調候（《窮通寶鑑》寒暖燥濕中和）、通關（化解兩行對峙）與病藥（去其太過之病）。\n\n• 系統論啟發：任何系統的優化目標皆非單一變數極大化，而是在約束條件下尋找整體動態均衡點（Dynamic Equilibrium）。"}, "myNotes": "身弱財多扛不住，得先練體力找隊友——這在現代職涯與理財上也是大實話！", "relatedIds": ["meta-bazi", "meta-yinyang"], "updatedAt": "2026-11-24"},
        {"id": "meta-s2-3", "categoryId": "cat-metaphysics", "stageId": "s2", "subtopic": "八字進階", "title": "地支藏干與刑沖合害的力量轉化規則", "oneLiner": "天干是擺在檯面上的公開表現，地支藏干是檯面下的真實底牌；而刑沖合害描述了元素相遇時是「聯手合作」還是「正面碰撞」。", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "八字上面四個字（天干）像一個人公開的社群形象，下面四個字（地支）則是他的真實家底與內心世界——而且每個地支裡面都「藏著 1 到 3 個天干（地支藏干）」，代表表面看不出來的隱藏潛力！\n\n當不同地支遇到彼此時，會發生幾種互動：\n• **合（六合、三合）**：像兩個原本不熟的部門聯手合作，產生新默契（有時也會因為牽手太緊而分不開）。\n• **沖（六沖）**：像正反兩股力量正面撞擊，代表變動、搬家、換跑道或打破僵局（不一定是壞事，死水遇到沖反而活起來！）。\n• **刑、害**：代表內在摩擦、細節糾結或溝通卡頓。", "lv2": "理性理解「沖」與「合」的實用視角：\n\n1. 別聽到「沖」就嚇到：沖的本質是「變動與震盪」，在人生卡關想轉型時，適度的沖反而帶來破局契機。\n2. 別以為「合」一定都好：如果把你最需要的關鍵能力給「合絆」住，反而會讓人猶豫不決、放不開手腳。\n3. 綜合看盤：單一刑沖合害必須放回整體平衡（喜忌）評估，切忌見沖就斷凶。", "lv3": "十二地支藏干體現五行在四季流轉中的「本氣、中氣、餘氣」交接遞嬗；三合局（申子辰水、亥卯未木、寅午戌火、巳酉丑金）對應「長生、帝旺、墓庫」三階段能量共振，為八字力學轉換與格局成敗的核心計算機制。"}, "myNotes": "「沖」的本質是變動而非絕對倒楣——死水遇到沖，反而能打破僵局！", "relatedIds": ["meta-bazi", "meta-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "meta-s2-4", "categoryId": "cat-metaphysics", "stageId": "s2", "subtopic": "時間策略", "title": "大運與流年：把時間節奏轉譯為人生攻守策略", "oneLiner": "原局像你出廠的車型，大運是接下來十年要開的地形，流年則是今年的天氣——好車遇雨天要減速，越野車上山路正好發揮。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "很多人以為算命是「一輩子固定好或壞」，其實東方命理最講究的是「時間動態變化」：\n\n• **原局（命）**：你天生這台車的屬性（跑車、休旅車還是省油小車）。\n• **大運（每 10 年換一次）**：這十年你開在什麼路況（高速公路、蜿蜒山路還是市區）。\n• **流年（每 1 年換一次）**：今年窗外的天氣（晴天、順風還是下大雨）。\n\n晴天跑高速就踩油門擴張（攻）；下雨走山路就穩穩練功、存糧、少冒險（守）。這就是把運勢翻譯成「人生攻守節奏表」！", "lv2": "把「順逆週期」轉化成健康行動策略：\n\n1. **順風擴張期（攻）**：大膽承接新專案、建立作品集、拓展人脈與談判爭取舞台。\n2. **逆風沉澱期（守）**：把重點放回「修內功（讀書考證照）、守現金流、整理身體健康、少做高槓桿豪賭」。\n3. 換大運交界前後（交運期）：環境與心境常有較大轉折，預留彈性與備案最穩妥。", "lv3": "八字大運依出生年份陰陽與性別順逆排布月柱干支，每十年一轉，構成「命（靜態結構）× 運（十年宏觀場域）× 歲（年度微觀觸發）」三層時間模型；其決策價值不在宿命預測，而在提醒決策者隨外在環境週期動態切換進攻與防禦模式。"}, "myNotes": "順風年踩油門擴張，逆風年練內功守現金——不管相不相信算命，這都是頂級人生策略！", "relatedIds": ["meta-s1-3", "strat-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "meta-s3-2", "categoryId": "cat-metaphysics", "stageId": "s3", "subtopic": "紫微星曜", "title": "十四主星性格光譜：開創、領導、支援與合作四類原型", "oneLiner": "把十四顆紫微主星歸納成四大性格陣營，就像古代版的 MBTI＋九型人格，一眼看懂每種人的天賦優勢與過度發揮時的盲點。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "十四顆主星名字聽起來超多超難背，其實只要分成四大性格隊伍就一秒記住：\n\n1. **開創型（七殺、破軍、廉貞、貪狼）**：天生衝鋒陷陣的冒險家！行動快、愛挑戰變化，但太急容易沒耐心。\n2. **領導型（紫微、天府、武曲、天相）**：天生管大局的 CEO！重原則、抗壓強、講究體面與紀律，但偶爾顯得固執強勢。\n3. **支援型（太陽、巨門、天機）**：天生軍師與點子王！愛思考、重表達與研究分析，但想太多容易焦慮糾結。\n4. **合作型（太陰、天梁、天同）**：天生協調者與暖心夥伴！細膩溫和、重和諧與體驗感，但面對衝突有時容易委屈退讓。\n\n每顆星都像一把雙面刃，沒有哪顆最好，放對舞台都是王牌！", "lv2": "用四類主星原型做團隊協作與自我盤點：\n\n1. 找天賦組合：開創型適合開疆闢土做 0 到 1，領導型適合建立制度管 1 到 100，支援型適合策略企劃與研究，合作型適合維繫客戶與團隊潤滑。\n2. 覺察「優勢過度發揮」：例如天機（點子多）過度變成三心二意；武曲（務實果斷）過度變成太硬太衝。\n3. 注意「空宮」不是沒星，而是彈性大、高度受對宮（遷移宮）與環境影響。", "lv3": "現代紫微類型學（如張盛舒將十四主星分四類對照現代性格測驗）將古典星情去神秘化為特質光譜（Trait Spectrum）：由陽性外放（開創／領導）過渡至陰性內省（支援／合作），並依星曜廟旺平陷與六吉六煞輔星微調行為表現強度。"}, "myNotes": "開創（衝鋒）、領導（大局）、支援（軍師）、合作（協調）——四組瞬間把十四主星全收服！", "relatedIds": ["meta-ziwei", "meta-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "meta-s3-3", "categoryId": "cat-metaphysics", "stageId": "s3", "subtopic": "紫微方法", "title": "三方四正與立太極：多維視角切換的關係分析法", "oneLiner": "紫微斗數最強的思考模型不是單看一格，而是「四點連動（三方四正）」與「隨時換主角視角（立太極）」。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "想看一個人的工作順不順，如果你只盯著「官祿宮（事業）」那一格看，就跟只看一個球員卻不看隊友一樣片面！\n\n紫微斗數教你兩套超強系統視角：\n1. **三方四正**：看「本宮」時，一定要同時連看對面（對宮）加上左右呈正三角形的兩個宮位！例如看事業（官祿宮），必定同時連動「命宮（你的個性）」「財帛宮（怎麼變現）」和「夫妻宮（外在合作互動）」。\n2. **立太極（切換主視角）**：整張盤的十二宮可以隨時換主角——例如以「夫妻宮」當成對方的命宮，就能順著轉一圈看對方的價值觀與互動方式。", "lv2": "把三方四正與立太極用在日常問題分析：\n\n1. **多維連動檢查**：遇到職涯卡關時，不要只檢討工作本身，同時檢查「自己性格（命）、變現模式（財）、外在市場表現（遷）」四個面。\n2. **立太極換位思考**：跟主管、客戶或伴侶意見不合時，刻意把對方的角色設成「中心點」重新推演他的壓力與目標，立刻看懂為何他會那樣決定。", "lv3": "「三方四正」在十二地支圓盤上構成等邊三角形（三合，間隔四宮）與 180 度對沖（對宮）的幾何共振結構；「宮位重疊與轉宮（立太極）」則展現了高度抽象的相對座標轉換思維，使 12 個靜態節點衍生出 12 × 12 = 144 種關係矩陣。"}, "myNotes": "立太極根本就是最高級的「換位思考坐標轉換」模型！", "relatedIds": ["meta-ziwei", "meta-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "meta-s3-4", "categoryId": "cat-metaphysics", "stageId": "s3", "subtopic": "時間推演", "title": "本命、大限與流年三盤疊合的時間推演邏輯", "oneLiner": "先天個性是體（本命），十年主軸是用（大限），今年發生的事是應期（流年）——三層疊看才不會把短暫波動當成一輩子。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "把紫微的三層時間盤想像成拍電影：\n\n• **本命盤（主角人設）**：這部電影主角天生的個性、擅長與在意的核心課題。\n• **大限盤（每 10 年一季）**：這一季的劇情主軸（例如 25–34 歲主打打拼事業、35–44 歲主打建立家庭與累積資產）。\n• **流年盤（今年這一集）**：今年具體觸發的事件與考驗。\n\n懂三層疊看最大的好處是「拉遠焦距」：今年遇到一點不順（流年小插曲），看回十年大限其實正在往上走，心情瞬間就穩下來了！", "lv2": "運用三層時間架構做個人生涯規劃：\n\n1. **體用分明**：先認清自己長期不變的核心特質與底層渴望（本命），不要因為今年流行什麼就盲目亂跳。\n2. **十年看主題、年度看聚焦**：每個十年給自己定 1–2 個大主題，每年年底盤點今年是該衝刺、轉換還是收斂。\n3. 避免「流年焦慮症」：不要每天盯著流日流月恐慌，把注意力放在長期可累積的能力與習慣。", "lv3": "紫微「本命為體、大限為用、流年為應期」構成多尺度時間疊代架構（Multi-Scale Temporal Layering），透過宮位重疊（例如流年官祿重疊大限財帛）詮釋不同生活領域在特定年度的連動焦點，與企業策略中的「願景（本命）→ 五年戰略（大限）→ 年度 OKR（流年）」高度同構。"}, "myNotes": "拉遠焦距看「十年主題」而非困在「今年小波折」，這是最棒的抗焦慮視角！", "relatedIds": ["meta-s2-4", "meta-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "meta-s4-2", "categoryId": "cat-metaphysics", "stageId": "s4", "subtopic": "心理投射", "title": "榮格共時性（Synchronicity）與符號投射心理學", "oneLiner": "為什麼抽一張塔羅或易經卦象常常覺得「剛好說中我心裡最糾結的事」？因為模糊符號像一面鏡子，照出了你潛意識裡原本就有的答案。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "心理學大師榮格（Carl Jung）非常喜歡研究《易經》，他提出一個超迷人的概念叫 **共時性（有意義的巧合）**：兩件事明明沒有物理因果關係（例如你剛心想著要辭職，一翻開書剛好看到講「勇敢轉身」的一頁），但在你心中卻瞬間產生了強烈共鳴。\n\n從現代心理學來看，這背後還有強大的「投射效應」：當你盯著一張象徵圖案或卦象思考「這對我來說代表什麼？」時，你腦中第一個浮現的聯想，往往就是你潛意識裡一直不敢承認的真心話！", "lv2": "把符號系統健康地當成「潛意識對話鏡子」的用法：\n\n1. 當你陷入選擇困難（例如兩份工作糾結不下），不妨把抽牌、看卦或丟硬幣當成「真心測試」：看到結果那一瞬間，你心裡是「鬆一口氣」還是「有點失望想重抽」？那個瞬間的情緒反應就是你真正的答案！\n2. 把符號當「提問卡」而不是「預言書」：問「這段象徵提醒我忽略了哪個角度？」，而非問「我會不會發財？」。", "lv3": "Carl Jung（1952）與物理學家包立（Wolfgang Pauli）合著探討非因果聯繫原則（Acausal Connecting Principle）。在諮商臨床上，羅夏克墨漬測驗、OH 卡與去宿命化的符號牌卡皆運用「投射假說（Projective Hypothesis）」：透過低結構化刺激繞過意識層的理性防衛，協助個案將內隱情緒與衝突外化並具象化。"}, "myNotes": "丟硬幣或抽牌看到結果瞬間的「鬆一口氣」或「想重抽」，就是潛意識最誠實的答案！", "relatedIds": ["meta-barnum", "meta-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "meta-s4-3", "categoryId": "cat-metaphysics", "stageId": "s4", "subtopic": "防騙與界線", "title": "命理諮詢常見話術辨識與去宿命化思維", "oneLiner": "好的命理討論讓你看清盲點、更有力量行動；壞的算命話術只會製造恐懼、讓你花大錢消災或喪失行動勇氣。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "接觸命理最需要學會的一件事，就是一眼分辨「理性參考」跟「神棍話術」！\n\n四個立刻轉身就走的危險話術紅燈：\n1. **恐嚇行銷**：「你今年有血光大劫／破財大關，不花幾萬塊買開運物改運就會出大事！」\n2. **絕對宿命論**：「你命中註定沒財運／註定婚姻失敗，努力也沒用。」\n3. **彩虹詭計（正反全包）**：「你平常人很好，但被踩到底線也會生氣。」（這不是廢話嗎！）\n4. **套話回推（熱讀／冷讀）**：先從你的穿著、表情跟問句套出資訊，再換句話講回去裝神準。", "lv2": "建立健康的「去宿命化」命理使用守則：\n\n1. 嚴守 **不花冤枉錢買焦慮** 原則：任何以「恐懼」為賣點推銷高額改運法事的，一律視為詐騙紅線。\n2. **賦權檢驗（Empowerment Test）**：聽完一段分析後，如果覺得自己「更清楚風險、更知道怎麼努力」，那是好的；如果覺得「無力、恐慌、什麼都不敢做」，立刻丟掉這段結論。\n3. 重大醫療、法律與投資決策，一律優先諮詢執業醫師、律師與客觀財務數據。", "lv3": "冷讀術（Cold Reading, Ray Hyman 系統分析）結合巴納姆陳述、漁網式試探（Fishing）與確認偏誤，能在無任何超自然能力下營造極高命中錯覺。\n\n• 傳統正派儒道思想本就反對消極宿命（《了凡四訓》「命由我作，福自己求」），強調性格慣性與環境趨勢可透過後天修身、學習與選擇主動改寫。"}, "myNotes": "黃金檢驗標準：聽完讓你「更有力量行動」才收下；讓你「恐慌無力或花錢消災」立刻拉黑！", "relatedIds": ["meta-barnum", "strat-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "meta-s4-4", "categoryId": "cat-metaphysics", "stageId": "s4", "subtopic": "自我覆盤", "title": "用命盤結構做年度覆盤與生涯盲點檢核", "oneLiner": "把紫微十二宮與八字十神變成一套每年年底的「全人生活體檢表」，提醒你那些平常忙到忘記照顧的人生面向。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "年底做年度回顧時，大家常常只記得檢討「今年賺多少錢、工作順不順」，卻忘了身體、人際跟內心快樂。\n\n試試把紫微十二宮直接拿來當「年度 12 格全人盤點表」：\n• 命宮／福德宮：今年我的內在狀態與快樂程度如何？\n• 官祿／財帛宮：今年事業成長與儲蓄投資進度？\n• 疾厄宮：睡眠、運動與健檢數字有沒有亮紅燈？\n• 遷移／交友宮：今年認識了哪些帶來新視野的好夥伴？\n\n這樣一轉化，千年傳統架構立刻變成超實用的現代自我管理工具！", "lv2": "每年 12 月 30 分鐘的「結構化全人覆盤」步驟：\n\n1. 從紫微十二宮中挑出當下最核心的 6 個面向（自我成長、事業、財務、健康、親密／家庭、人脈／視野）各打 1–10 分。\n2. 找出分數最低的 1 個短板（找出系統失衡點），訂出明年 1 個具體改善習慣。\n3. 對照十神五視角檢核自己今年是否「輸入太多（印）卻輸出太少（食傷）」或「只顧眼前忙（比劫）卻忘了累積資產（財）」。", "lv3": "將傳統十二宮結構對映現代生命教練（Life Coaching）之「生命之輪（Wheel of Life）」與平衡計分卡（Balanced Scorecard），能提供一套文化親切度高、涵蓋物質／關係／精神三層面的完整自我審計框架，實現古典智慧的現代工具化落地。"}, "myNotes": "把十二宮拿來做年度 12 格全人檢核表，傳統智慧瞬間變成現代 Life OS！", "relatedIds": ["meta-ziwei", "meta-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "cross-s1-2", "categoryId": "cat-interdisciplinary", "stageId": "s1", "subtopic": "逆向思考", "title": "逆向思維（Inversion）與事前驗屍法（Pre-mortem）", "oneLiner": "與其絞盡腦汁想「怎麼做才會大成功」，不如先反過來想「怎麼做保證會慘敗」，把那些蠢事全部避開你就贏了大半。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "查理・蒙格最愛講一句幽默名言：「如果我知道我會死在哪裡，我就一輩子不去那個地方！」\n\n很多複雜問題正向想超難，反過來想（**逆向思維**）一秒就清楚：\n• 想「怎麼擁有幸福婚姻」好抽象 → 反過來想「怎麼把婚姻搞砸？」（冷暴力、亂花錢、從不溝通）——只要堅決不做這些，關係自然好一半！\n• 開新專案前做 **事前驗屍法（Pre-mortem）**：假裝現在已經是半年後，這個案子「徹底失敗了」，請大家用 10 分鐘寫下最可能害死它的 5 個原因，趁現在還沒動工立刻提前拆彈！", "lv2": "把逆向思維與事前驗屍用在重大決策的實戰三步：\n\n1. 在啟動創業、轉職、大額投資或重要專案前，固定留 15 分鐘開一場「失敗預演會」。\n2. 列出前 3 個最致命的失敗劇本，並為每個劇本寫好「預防措施」或「止損警報線」。\n3. 個人成長用法：想變專業前，先列出「害一個人十年都原地踏步的五個壞習慣」（例如只收藏不輸出、從不覆盤），逐一戒掉。", "lv3": "逆向思考源於德國數學家雅可比（Carl Jacobi）「Man muss immer umkehren（永遠要反過來想）」；事前驗屍法由決策心理學家 Gary Klein 提出，實證顯示其能有效對抗團體迷思與「計畫謬誤（Planning Fallacy）」，將團隊預測潛在風險的能力提升約 30%。"}, "myNotes": "開大事前先假裝半年後已經慘敗，做 10 分鐘事前驗屍，比事後救火便宜一百倍！", "relatedIds": ["cross-first-principles", "psy-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "cross-s1-3", "categoryId": "cat-interdisciplinary", "stageId": "s1", "subtopic": "思維剃刀", "title": "奧卡姆剃刀與漢隆剃刀：用最簡假設避開過度解讀", "oneLiner": "解釋一件事時，別把簡單問題腦補成複雜陰謀論（奧卡姆）；別人出包時，多半只是疏忽忙昏頭，別急著當成惡意針對（漢隆）。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "思維工具箱裡有兩把超好用的「剃刀」，專門用來幫大腦剃掉多餘雜念：\n\n1. **奧卡姆剃刀（如無必要，勿增實體）**：早上發現客廳餅乾不見了，最合理的推測是「家人半夜嘴饞吃掉了」，而不是「外星人瞬間移動進來偷走又幫你把門鎖好」——在都能解釋現象的說法裡，先選假設最少、最簡單的那個！\n2. **漢隆剃刀**：「能用疏忽、忙碌或誤解解釋的事，就不要輕易歸咎於惡意。」同事忘了回你信，90% 是他忙到淹沒在 200 封信裡，而不是刻意針對你！", "lv2": "這兩把剃刀在工作與除錯中的實戰價值：\n\n1. 程式或系統出包除錯（奧卡姆剃刀）：先檢查最基本簡單的地方（是不是沒存檔、變數打錯字、網路斷線），別一開始就懷疑作業系統底層有世紀大 Bug。\n2. 職場溝通降內耗（漢隆剃刀）：遇到對方漏掉交辦事項，先用中性友善口氣提醒確認，省下大量無謂猜忌與情緒消耗。\n3. 邊界提醒：漢隆剃刀是「預設起手式」，若對方反覆多次針對且涉及重大利益，仍須回歸證據保護自己。", "lv3": "奧卡姆剃刀（Occam's Razor）源於 14 世紀哲學家奧卡姆的威廉，在現代統計與機器學習中具象化為「最小描述長度原則（MDL）」與正規化懲罰（AIC / BIC），防止模型引入過多無效參數導致過擬合。漢隆剃刀（Hanlon's Razor）則可視為對抗人際「敵意歸因偏誤（Hostile Attribution Bias）」的實務啟發式。"}, "myNotes": "同事沒回信先套漢隆剃刀（他大概忙昏了），系統壞了先套奧卡姆剃刀（先查最簡單的錯）！", "relatedIds": ["cross-s1-2", "psy-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "cross-s1-4", "categoryId": "cat-interdisciplinary", "stageId": "s1", "subtopic": "認知邊界", "title": "能力圈邊界與地圖不等於疆域", "oneLiner": "能力圈有多大不重要，清楚知道「圈的邊界畫在哪裡」才重要；同時永遠記得：任何模型與公式都只是簡化地圖，不是真實世界本身。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "兩個讓頂尖決策者一輩子不翻車的謙卑原則：\n\n1. **能力圈（Circle of Competence）**：你不需要什麼都懂，只要在自己真正懂的圈子裡出手，圈外的東西大方承認「這我不懂，我先不碰或找專家」就不會亂賠錢！最危險的人是把「聽過名詞」誤以為「在自己能力圈裡」。\n2. **地圖不等於疆域**：捷運路線圖把路線畫成超整齊的直線，幫你快速轉車超好用——但它不是真實的地下軌道！如果你照著捷運圖的直線距離去估算走路時間，一定會走到懷疑人生。所有理論、報表與模型都是「地圖」，永遠要回頭核對真實世界（疆域）！", "lv2": "日常守住這兩條認知安全線的方法：\n\n1. 測試一件事在不在自己能力圈內：試著不看資料，向一個高中生講清楚它的底層邏輯與最容易失敗的點——講不出來就代表還在圈外。\n2. 擴大能力圈要「慢慢往外拓荒」（用小額實驗與系統學習），絕不在圈外下重注。\n3. 遇到報表數字超漂亮但一線真實感受很差時，永遠相信真實世界（疆域），回頭檢查模型漏了什麼變數。", "lv3": "「地圖非疆域（The map is not the territory）」由語意學家 Alfred Korzybski（1931）提出，呼應統計學家 George Box 名言「所有模型都是錯的，但有些很有用」。「能力圈」則由巴菲特與蒙格推廣，界定了個體具備真實資訊與判斷優勢的決策領域，是對抗達克效應與過度自信的終極防線。"}, "myNotes": "模型與理論只是方便導航的地圖；數字跟現場感覺打架時，記得回頭看真實世界！", "relatedIds": ["psy-s2-4", "cross-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "cross-s2-2", "categoryId": "cat-interdisciplinary", "stageId": "s2", "subtopic": "系統推演", "title": "二階效應（Second-Order Thinking）與意外後果法則", "oneLiner": "一般人只看到行動後的「第一個結果（一階）」，高手會習慣多問一句：「然後呢？接下來會引發什麼連鎖反應（二階）？」", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "一階思考很直覺、很誘人，但常常藏著陷阱：\n\n• 熬夜喝三杯濃咖啡趕報告 → **一階結果**：今晚把報告趕完了（好爽！）→ **二階結果**：隔天整天腦霧效率掉一半、免疫力下降感冒三天，反而落後更多進度。\n• 商家大打流血一折促銷 → **一階結果**：今天業績暴衝 → **二階結果**：顧客從此認定原價買就是盤子，不打折再也不買！\n\n反過來說，很多好習慣（運動、讀書、存錢）都是「一階有點累，但二階、三階回報超級香」。", "lv2": "訓練二階思考的三個時間軸提問法（10-10-10 法則）：\n\n做重要決定前，強迫自己寫下這個選擇在 **10 天後、10 個月後、10 年後**會帶來什麼連鎖效應：\n1. 對手的反應會是什麼？（例如我降價，對手也會跟著降價嗎？）\n2. 這個做法會改變人們的長期誘因嗎？\n3. 我們現在省下的麻煩，會不會在三個月後變成十倍大的技術債或信任危機？", "lv3": "投資大師 Howard Marks《投資最重要的事》區分「第一層思考（簡單、膚淺、人人皆能想到）」與「第二層思考（深入、多維、考量時間維度與他人反制）」。社會學家 Robert K. Merton（1936）則歸納「意外後果法則（Law of Unintended Consequences）」，揭示複雜適應系統中干預行為常因回饋延遲與行為者適應而產生非預期副作用。"}, "myNotes": "多問一句「然後呢？10 個月後會怎樣？」就能避開 80% 短期爽、長期慘的陷阱！", "relatedIds": ["cross-systems", "econ-incentive"], "updatedAt": "2026-11-24"},
        {"id": "cross-s2-3", "categoryId": "cat-interdisciplinary", "stageId": "s2", "subtopic": "非線性成長", "title": "臨界點、規模效應與網路效應", "oneLiner": "世界很多現象不是均勻慢慢變化的：燒開水前 99 度都沒沸騰，跨過 100 度臨界點瞬間質變；懂這點就不會在爆發前夕放棄。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "三個解釋為什麼「強者恆強、前期無感後期爆發」的核心模型：\n\n• **臨界點（Tipping Point）**：把水從 20 度加熱到 99 度，它都還是普通液態水；再多加關鍵的 1 度到 100 度，整鍋水瞬間沸騰變蒸汽！學外語、經營自媒體、做複利投資全都有這段漫長的「蓄熱期」。\n• **規模效應**：工廠做 1 支手機成本 50 萬，做 1,000 萬支平均成本降到 1 萬，賣越多越便宜。\n• **網路效應**：全世界只有 1 支電話毫無用處；當你朋友全部都在用 LINE，每多一個人加入，這個軟體對所有人的價值就越大，對手幾乎搶不走！", "lv2": "把這三個模型轉化成個人與商業策略：\n\n1. **熬過蓄熱平緩期（失望之谷）**：知道臨界點的存在，就不會在 85 度的時候誤以為「沒效」而半途放棄。\n2. **用零邊際成本放大個人產出**：寫一篇文章、做一個軟體工具或一套數位知識庫，寫一次就能無限複製給一萬人用，這就是現代個人最強的規模效應。\n3. 評估商業護城河時，優先尋找具備「雙邊或多邊網路效應」的結構。", "lv3": "相變（Phase Transition）與滲流理論描述複雜系統跨過臨界閾值後的非線性劇變。網路效應於通訊網路中常以梅特卡夫定律（Metcalfe's Law, 網路價值正比於節點數平方 n²）近似刻畫，但實務上須區分同邊網路效應、跨邊網路效應與擁擠負效應（Congestion）。"}, "myNotes": "很多長期累積前期看起來都像沒動靜，其實是在從 20 度加熱到 99 度！", "relatedIds": ["mkt-flywheel", "fin-compound"], "updatedAt": "2026-11-24"},
        {"id": "cross-s2-4", "categoryId": "cat-interdisciplinary", "stageId": "s2", "subtopic": "槓桿聚焦", "title": "瓶頸理論（TOC）與八二法則（帕累托分佈）", "oneLiner": "整條隊伍的前進速度由「走最慢的那個人」決定；在任何系統裡，先找出關鍵 20% 瓶頸集中打通，其餘地方優化全是白忙。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "想像全班同學排成單行去爬山，如果走在中間的小明腳程最慢，就算排在最前面的體育健將跑得再快，全班抵達山頂的時間還是完全由小明決定！\n\n這就是 **瓶頸理論（TOC）**：在一個多步驟流程裡，改善「非瓶頸」的環節幾乎沒用，你必須把所有資源拿去幫「最卡的那一關」解圍！\n\n搭配 **八二法則（80/20 法則）**：80% 的成果往往來自最關鍵的 20% 行動（例如學新領域先掌握最核心的 20% 概念，就能看懂 80% 的應用）。", "lv2": "瓶頸理論五步聚焦法（用在學習、工作與產品優化）：\n\n1. **找出系統唯一最大瓶頸**（例如英文聽力卡住、網站轉換頁跳出率最高）。\n2. **榨乾瓶頸潛力**（別讓瓶頸閒置或浪費時間在雜事上）。\n3. **其他環節全力配合瓶頸節奏**。\n4. **投入資源拓寬瓶頸**。\n5. **打破後立刻找下一個新瓶頸**，持續循環升級。", "lv3": "以色列物理學家 Eliyahu M. Goldratt 於《目標》（The Goal）提出限制理論（Theory of Constraints, TOC），揭示局部最優化總和不等於全局最優化。帕累托分佈（Pareto Principle）則反映冪律非均勻特性，且具自我相似遞迴性（最頂尖的 4% 往往貢獻高達 64% 的核心價值）。"}, "myNotes": "改善非瓶頸全是假忙碌！永遠先問：「現在整件事卡住的唯一最大瓶頸是哪一關？」", "relatedIds": ["mkt-funnel", "cross-systems"], "updatedAt": "2026-11-24"},
        {"id": "cross-s3-2", "categoryId": "cat-interdisciplinary", "stageId": "s3", "subtopic": "博弈思維", "title": "賽局理論基礎：囚徒困境、納許均衡與重複賽局", "oneLiner": "為什麼兩個聰明人各自做對自己最有利的選擇，最後卻一起跌進雙輸局面？答案就在「這是一次性交易，還是會長期見面」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "想像兩家開在隔壁的奶茶店，本來都賣 50 元大家一起賺錢。但 A 店心想：「如果我偷降到 40 元，客人全跑來我這！」B 店也這樣想。結果兩家都降到 40 元，客人數沒變、兩家利潤一起腰斬——這就是著名的 **囚徒困境**！\n\n當雙方都不敢單方面改回 50 元（誰先漲誰死），這種卡死在原地的狀態叫 **納許均衡**。\n\n怎麼破解？靠 **重複賽局（長期往來）**！電腦實驗發現，長期互動最強的策略叫 **「一報還一報（Tit-for-Tat）」**：一開始先釋出善意合作；對方背叛我就立刻反擊讓他痛；只要對方改過合作，我就立刻原諒恢復合作！", "lv2": "把賽局思維用在人生與合作選擇的四條黃金法則：\n\n1. **只跟「重視長期重複賽局」的人合作**：遠離只想撈一票就跑的一次性投機者。\n2. **採取「善良、可預測、有底線、願寬恕」策略（Tit-for-Tat 精髓）**：先當好人，但被踩線時絕不軟弱容忍，對方示好則不記仇。\n3. **改變賽局規則**：透過簽訂清楚合約、建立公開評價機制或質押保證金，讓「守信合作」變成對雙方都最划算的選項。", "lv3": "John Nash 證明有限非合作賽局必存在至少一個混合策略納許均衡（Nash Equilibrium，無任何參與者能靠單方面改變策略獲得更高報酬）。政治學家 Robert Axelrod（1984）透過迭代囚徒困境錦標賽證實，在未來折現因子足夠高的重複賽局中，互惠合作可自發湧現並穩定擊敗純自私策略。"}, "myNotes": "人生最賺的策略：選擇長期重複賽局 + 先釋善意 + 被踩線立刻有底線反擊！", "relatedIds": ["strat-s3-4", "cross-bayes"], "updatedAt": "2026-11-24"},
        {"id": "cross-s3-3", "categoryId": "cat-interdisciplinary", "stageId": "s3", "subtopic": "反脆弱策略", "title": "黑天鵝、反脆弱與槓鈴策略（Barbell Strategy）", "oneLiner": "玻璃杯一摔就碎（脆弱），鐵球摔不壞（強韌），肌肉越重訓越壯（反脆弱）——用「極保守＋極小額高爆發」槓鈴結構擁抱不確定性。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "世界常常發生誰都沒預測到的「黑天鵝」大事件（像疫情、AI 突然爆發、金融風暴）。面對意外衝擊，事物分三種：\n\n• **脆弱**（陶瓷杯）：最怕震盪，一摔就破。\n• **強韌**（石頭）：耐得住震盪，維持原樣。\n• **反脆弱**（人體肌肉與免疫系統）：受點適度壓力與波動，反而長得更強大！\n\n普通人怎麼讓人生變反脆弱？用 **槓鈴策略**：避開不上不下的「中度風險」——把 **85%–90%** 的資金與時間放在極度穩健的保底陣地（現金、指數 ETF、穩定本業），只拿 **10%–15%** 去試極小成本、但一旦成功回報十倍百倍的新嘗試（寫程式做工具、學 AI、副業創作）！", "lv2": "把槓鈴策略直接套進理財與職涯設計：\n\n1. **職涯槓鈴**：85% 穩住核心專業收入與現金流，15% 週末低成本實驗個人品牌、AI 小產品或跨領域技能——失敗零傷害，成功直接躍遷。\n2. **閱讀槓鈴**：85% 讀經過百年考驗的經典底層知識（林迪效應），15% 快速掃描最新前沿科技趨勢。\n3. **避開「假安全」的脆性結構**：單一收入來源 + 滿載房貸 + 零預備金，看起來安穩其實極度脆弱。", "lv3": "Nassim Nicholas Taleb《反脆弱》（Antifragile）以數學凸性（Convexity，Jensen's Inequality）精確定義反脆弱：當報酬函數對波動呈凸性（下檔有界、上檔開放），波動率 σ 上升反而提高期望值。槓鈴策略（Barbell）透過兩端極化配置消除「中庸風險」潛藏的隱蔽肥尾毀滅風險。"}, "myNotes": "85% 極度保底 + 15% 低成本高上檔實驗，輸了無傷大雅、贏了徹底翻盤！", "relatedIds": ["fin-s2-4", "fin-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "cross-s3-4", "categoryId": "cat-interdisciplinary", "stageId": "s3", "subtopic": "決策速度", "title": "機會成本、比較利益與不可逆決策（單向門 vs 雙向門）", "oneLiner": "所有選擇的真正代價都是「你因此放棄的最佳替代方案」；同時學會分清可逆小事快決定（雙向門），不可逆大事慢研究（單向門）。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "兩個讓決策又快又準的頂級心法：\n\n1. **機會成本**：週末看一場免費但超無聊的展覽，真的「免費」嗎？錯！你付出的代價是「那三小時原本可以好好睡飽、陪家人或學新技能的價值」！\n2. **單向門 vs 雙向門（貝佐斯決策法）**：\n   • **雙向門（可逆決策）**：選錯了可以推門走回來重選（例如試用新工具、改網站配色、發一篇測試貼文）→ 只要有 70% 把握就立刻拍板執行！\n   • **單向門（不可逆決策）**：走過去就回不來了（例如買房簽長約、借巨額貸款、結婚、賣掉核心資產）→ 必須放慢速度、反覆查證與做事前驗屍！", "lv2": "消除決策癱瘓的日常分類習慣：\n\n1. 每天 90% 的日常糾結其實都是「雙向門」：別花三小時研究買哪款 300 元的滑鼠墊，時間的機會成本早就超過 300 元！\n2. 善用 **比較利益**：就算你做美編跟寫程式都比外包快，也該把時間花在你「相對優勢最大、時薪產出最高」的那一件事上，其餘交給工具或 AI 協作。\n3. 遇到單向門時，刻意強制冷靜 72 小時並找兩位客觀朋友幫你挑毛病。", "lv3": "比較利益原理（David Ricardo, 1817）證明只要兩方生產不同任務的機會成本比率不同，專業分工與交換必能創造淨剩餘；Jeff Bezos 於 2015 年致股東信提出 Type 1（不可逆單向門）與 Type 2（可逆雙向門）分類，指出大組織官僚僵化的主因正是「拿嚴苛的 Type 1 審核流程去卡住無數 Type 2 小決策」。"}, "myNotes": "雙向門 70% 把握就快衝，單向門放慢做足功課——光分清這兩扇門，效率直接倍增！", "relatedIds": ["cross-s1-2", "econ-incentive"], "updatedAt": "2026-11-24"},
        {"id": "cross-s4-2", "categoryId": "cat-interdisciplinary", "stageId": "s4", "subtopic": "深度內化", "title": "費曼學習法：用「教給高中生」檢驗真懂或假懂", "oneLiner": "如果你沒辦法把一個專業概念用簡單白話講給高中生聽懂，那通常代表你自己也還沒真正搞懂它。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "諾貝爾物理獎得主理查・費曼被譽為「最偉大的解釋者」，他有個超狠的測謊器：\n\n很多人背了一堆聽起來超帥的專有名詞（例如「非線性量子耦合」「多維協同賦能」），就以為自己懂了。費曼的方法只要四步，瞬間照出真假懂：\n1. 選定一個你想學的概念。\n2. 假裝你正在教一個完全沒基礎的高中生，只准用**日常白話和生活比喻**講出來。\n3. 講到卡住、含糊帶過或忍不住想烙專有名詞的地方，立刻圈起來！\n4. 回去重查資料補齊漏洞，直到整段講起來像聊天一樣順暢！", "lv2": "把費曼學習法變成你用這座知識庫的標準動作：\n\n1. 看完任何一篇知識卡的 Lv.2／Lv.3 後，先切回 Lv.1 對照它的生活比喻，再試著在「我的心得」區自己發明一個更貼近你生活的新比喻。\n2. 善用「以教代學」：寫一篇短文、拍一分鐘語音筆記或講給朋友聽，教一遍的吸收深度等於自己默讀十遍。\n3. 拆穿假懂警訊：只要發現自己只能「照唸定義」卻舉不出生活反例，就代表還沒真正內化。", "lv3": "認知心理學稱此現象為「門徒效應（Protégé Effect）」與「解釋深度錯覺（Illusion of Explanatory Depth, Rozenblit & Keil 2002）」：人類普遍大幅高估自己對日常與專業機制的理解深度，唯有在被要求逐步產出因果解釋（Self-Explanation）時，知識缺口才會顯形並驅動深層基模重組。"}, "myNotes": "你設計這座知識庫「高中生能懂又保有專業度」的初衷，本身就是最高級的費曼學習法！", "relatedIds": ["cross-ultralearning", "psy-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "cross-s4-3", "categoryId": "cat-interdisciplinary", "stageId": "s4", "subtopic": "知識網絡", "title": "卡片盒筆記法（Zettelkasten）與跨領域創意連結", "oneLiner": "不要按死板資料夾把筆記關進墳墓裡；把每個概念拆成獨立原子卡片並互相串連，知識放越久越會自己撞出新點子。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "為什麼大家做了十年的筆記，最後幾乎從來沒翻過？因為傳統筆記像「塞滿舊書的紙箱」，越收越難找，而且筆記之間彼此沒講話。\n\n德國社會學家魯曼一輩子寫出 70 本巨著、400 篇論文，秘密就是他的「卡片盒（Zettelkasten）」：\n1. **原子化**：一張卡片只用自己的話講透「一個核心概念」（就像我們知識庫的一張知識卡！）。\n2. **雙向連結**：每次存新卡片時，強迫自己連到舊盒子裡 2 張相關卡片（例如把「金融均值回歸」連到「易經物極必反」）。\n\n當卡片累積到幾百張，你寫報告或做企劃根本不用從空白開始，直接把串起來的卡片群組抽出來就完成八成了！", "lv2": "讓卡片盒筆記法真正跑起來的三條極簡原則：\n\n1. **絕不直接整篇複製貼上**：貼上別人的長文不算你的知識，一定要轉成「一句話核心 + 自己的白話理解」。\n2. **用「連結」取代「完美分類焦慮」**：別糾結這張卡該放金融還是心理學，放一個主分類後用跨領域標籤與相關連結串起來就好。\n3. **從卡片長出文章**：定期沿著相關連結漫遊，把跨領域撞出的火花整理成新的觀點。", "lv3": "Niklas Luhmann 的 Zettelkasten（由 Sönke Ahrens《卡片盒筆記》現代化）本質為由下而上（Bottom-Up）的超文本知識圖譜（Knowledge Graph），區分閃念筆記（Fleeting）、文獻筆記（Literature）與永久筆記（Permanent Notes）。其威力來自網絡組合爆炸效應——隨節點數增加，跨學科洞見的湧現機率呈超線性成長。"}, "myNotes": "這座知識庫的「單一概念卡 + 跨領域關聯跳轉 + 個人筆記」，就是把 Zettelkasten 搬進專屬網站！", "relatedIds": ["cross-s4-4", "cross-ultralearning"], "updatedAt": "2026-11-24"},
        {"id": "cross-s4-4", "categoryId": "cat-interdisciplinary", "stageId": "s4", "subtopic": "多元模型", "title": "類比遷移與心智模型網格（多元思維模型）", "oneLiner": "在拿著鐵鎚的人眼裡，全世界看起來都像釘子；收集各領域底層模型織成網格，就能用多副眼鏡交叉看清問題全貌。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第三階段擴充課綱", "levels": {"lv1": "只懂行銷的人看到業績掉就喊「砸錢買廣告」；只懂工程的人就喊「重寫系統」；只懂財務的人就喊「砍預算裁員」——這叫「鐵鎚人傾向」。\n\n投資大師查理・蒙格提出 **多元思維模型（Latticework of Mental Models）**：你不需要成為每個領域的博士，只要從物理、心理、經濟、系統、兵法、設計各挑出最核心的 5–10 個底層模型掛在腦子裡。\n\n遇到難題時，輪流戴上「經濟學眼鏡（誘因對嗎？）」「心理學眼鏡（大家怕失去什麼？）」「系統眼鏡（瓶頸跟延遲在哪？）」交叉掃描，瞬間就能看出單一專家看不見的破局答案！", "lv2": "建立個人心智模型網格的三個實戰習慣：\n\n1. **跨領域找同構（結構類比）**：每學一個新概念，問自己「這跟我以前在別的領域學過的哪個模型長得很像？」（例如：複利 ≈ 行銷飛輪 ≈ 正回饋迴路）。\n2. **重要決策啟動「三眼鏡檢核」**：強制自己用至少三個不同學科的模型各分析一次同一個問題。\n3. **警惕表面類比陷阱**：類比只能用來啟發假設，最終仍須回到該領域的具體事實與邊界驗證。", "lv3": "多元思維模型呼應認知科學的「遠距遷移（Far Transfer）」與結構映射理論（Structure-Mapping Theory, Dedre Gentner）：專家與新手的本質差異在於專家依「深層關係結構」而非「表面特徵」檢索並遷移跨領域解法。這正是打造跨 21 領域個人知識庫的終極價值所在。"}, "myNotes": "這張卡就是整座 21 領域知識庫的終極意義：織出屬於自己的多元思維模型網格！", "relatedIds": ["cross-s4-3", "cross-systems", "meta-yinyang"], "updatedAt": "2026-11-24"},
        {"id": "biz-s1-1", "categoryId": "cat-biz", "stageId": "s1", "subtopic": "商業模式", "title": "商業模式畫布（BMC）九宮格拆解", "oneLiner": "把一家公司複雜的營運拆成「賣給誰、賣什麼、怎麼做、怎麼賺」九格藍圖，一張 A4 紙看穿任何生意邏輯。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "想開一家店或看懂一間上市大公司，不用翻 200 頁企劃書，畫一張 **九宮格（商業模式畫布）** 就夠了！\n\n右邊四格看「怎麼把錢賺進來（市場面）」：客群是誰、解決什麼價值、靠什麼通路送達、怎麼維繫關係。\n左邊三格看「背後怎麼把東西做出來（營運面）」：關鍵活動、核心資源、重要合作夥伴。\n最下面兩格算帳：左邊是「花多少成本」，右邊是「怎麼收費賺錢（賣斷、訂閱、抽成還是廣告）」。", "lv2": "用 BMC 快速檢驗任何創業點子或副業：\n\n1. 先填右邊（目標客群 + 價值主張 + 收費方式），確認有人願意付錢再填左邊資源與成本。\n2. 拆解成功案例練習：把 Netflix、Costco（靠會員費而非商品差價賺錢）填入九宮格，五分鐘就能看出它們真正的賺錢引擎。\n3. 商業模式創新往往不是改產品，而是改「收益流」（如一次性買斷改訂閱）或改「合作夥伴」。", "lv3": "Alexander Osterwalder《獲利世代》（Business Model Generation）將企業系統化為 9 大構面，對應財務損益表：右側驅動營收與定價權（Desirability / Viability），左側驅動成本結構與營運效率（Feasibility）。"}, "myNotes": "看任何新商業點子，10 分鐘畫一張九宮格就能立刻抓出漏洞！", "relatedIds": ["mkt-s1-3", "biz-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "biz-s1-2", "categoryId": "cat-biz", "stageId": "s1", "subtopic": "單位經濟", "title": "單位經濟模型：毛利、邊際貢獻與規模經濟", "oneLiner": "算清「每多賣出一份商品到底多賺多少錢」，避免陷入「賣越兇、虧越快」的假繁榮陷阱。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "想像你開一家手搖飲店：\n• 房租水電不管賣 1 杯還是 1,000 杯每月都要繳 5 萬元（**固定成本**）。\n• 每做一杯珍奶的茶葉、牛奶、杯子要 20 元（**變動成本**），賣 60 元，所以每多賣一杯淨賺 **40 元（邊際貢獻）**。\n\n算出「損益兩平點」超簡單：50,000 ÷ 40 = 1,250 杯！賣超過 1,250 杯之後，房租已經攤平了，接下來每賣一杯都是純利潤（規模經濟）！但如果一杯成本 65 元卻賣 60 元，賣一萬杯只會倒更快。", "lv2": "經營專案或評估公司必看的單位經濟指標：\n\n1. **邊際貢獻必須為正**：若單筆訂單毛利為負，除非有極高把握靠後續高毛利交叉銷售或網路效應翻盤，否則絕不盲目燒錢擴張。\n2. **高固定成本 + 近零邊際成本（如軟體、線上課、數位工具）**：過了損益兩平點後利潤率會呈爆炸性成長。\n3. 區分毛利率（扣直接成本）與營業利益率（扣房租行銷薪資），看清獲利結構。", "lv3": "損益兩平點 BEP = Fixed Costs / (Price − Variable Cost per Unit)。營運槓桿（Operating Leverage）衡量固定成本佔比：高營運槓桿企業在景氣擴張時獲利彈性極大，但在營收下滑時虧損放大速度亦極劇烈。"}, "myNotes": "數位產品與知識庫最迷人的地方就是「邊際複製成本趨近於零」！", "relatedIds": ["mkt-s2-4", "fin-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "biz-s1-3", "categoryId": "cat-biz", "stageId": "s1", "subtopic": "競爭壁壘", "title": "護城河理論（Moat）：網路效應、轉換成本與品牌壁壘", "oneLiner": "賺錢的生意一定會引來無數抄襲者；沒有「護城河」保護的高利潤，兩年內就會被價格戰殺成紅海。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "巴菲特把好公司比喻成「城堡」，而 **護城河** 就是城堡外那條又深又寬、滿是鱷魚的河，讓競爭對手就算想抄也抄不走！\n\n五大經典護城河：\n1. **網路效應**：越多人用越好用（LINE、蝦皮）。\n2. **高轉換成本**：換去別家太麻煩太痛（銀行薪轉、公司全套 ERP、蘋果生態系）。\n3. **無形資產**：超強品牌信任、獨家專利或政府特許執照。\n4. **成本優勢**：規模大到別人賣這個價會虧錢你還能賺（台積電、Costco）。\n5. **有效規模**：市場就這麼大，容不下第二家大廠進來搶。", "lv2": "判斷一項事業或個人技能有沒有護城河：\n\n1. 問一句殘酷的話：「如果對手明天帶著兩倍資金與更低價格抄我，我的客戶會立刻跑光嗎？」\n2. 個人職涯護城河：單一工具操作很容易被 AI 或新人取代；把「領域專業 + 系統整合 + 溝通信任」組合成複合護城河才難被複製。\n3. 護城河不是永遠不乾涸，科技典範轉移（如智慧手機取代傳統相機）可能一夜填平舊護城河。", "lv3": "晨星（Morningstar）將經濟護城河（Economic Moat）定義為企業能長期維持「投入資本回報率（ROIC）高於加權平均資金成本（WACC）」的結構性競爭優勢，分為寬護城河（20 年以上防禦力）與窄護城河（10 年左右）。"}, "myNotes": "高毛利沒有護城河只會引來群狼分食；個人也要靠「複合技能 + 信任」挖護城河！", "relatedIds": ["cross-s2-3", "biz-s2-1"], "updatedAt": "2026-11-24"},
        {"id": "biz-s1-4", "categoryId": "cat-biz", "stageId": "s1", "subtopic": "產業結構", "title": "價值鏈與供應鏈定位：微笑曲線與利潤池分布", "oneLiner": "同一支賣 3 萬元的手機，組裝廠可能只賺 300 元，而上游晶片研發與品牌行銷卻拿走大部分利潤——站對位置比埋頭苦幹更重要。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "宏碁創辦人施振榮畫過一條超有名的 **「微笑曲線」**（像一個 U 字形笑臉）：\n\n• **左邊高點**：核心研發、專利技術、產品設計（利潤超高）。\n• **中間谷底**：標準化組裝代工（最辛苦、最容易被低價取代，利潤最薄）。\n• **右邊高點**：品牌行銷、通路服務、售後體驗（利潤超高）。\n\n這不只適用科技業，對個人職涯也一針見血：只做標準化「照單執行（谷底）」最容易被取代；往左邊「解決複雜問題／技術創新」或往右邊「品牌溝通／客戶價值」移動，收入天花板立刻打開！", "lv2": "用價值鏈與利潤池看懂產業與個人卡位：\n\n1. 先找「利潤池（Profit Pool）」在哪：同樣是咖啡產業，生豆種植毛利薄、品牌體驗與高周轉連鎖門市卻拿走最大塊利潤。\n2. 觀察產業鏈議價權：誰掌握最稀缺的瓶頸環節（例如先進製程晶圓代工反轉傳統代工印象，靠極高技術壁壘把谷底拉成高峰），誰就有定價權。", "lv3": "Michael Porter（1985）提出價值鏈分析（Value Chain），區分主要活動（進料、營運、出貨、行銷、服務）與支援活動（基礎設施、人資、研發、採購）。利潤池分析（Bain & Company）則強調「營收佔比最大的環節，往往不是利潤佔比最高的環節」。"}, "myNotes": "個人職涯也要沿著微笑曲線往兩端走：不是左端核心解題，就是右端品牌與溝通！", "relatedIds": ["biz-s1-3", "biz-s2-1"], "updatedAt": "2026-11-24"},
        {"id": "biz-s2-1", "categoryId": "cat-biz", "stageId": "s2", "subtopic": "競爭分析", "title": "波特五力與 SWOT 的正確用法與常見誤區", "oneLiner": "波特五力幫你看「這行好不好賺」，SWOT 幫你看「我打不打得贏」；別把 SWOT 寫成空洞填空題，重點在交叉推導出具體行動。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "挑戰場之前，哈佛大師麥可・波特教你用 **五道力量** 掃描這行好不好賺：\n1. 現有同行有多殺紅眼？\n2. 新競爭者好不好進場（門檻低就慘了）？\n3. 有沒有別的替代品能取代你（高鐵取代國內線飛機）？\n4. 供應商會不會卡你脖子漲價？\n5. 買家會不會聯合殺你價？\n\n五力越弱，這行越像躺著賺；五力全強（如航空業、普通餐飲），就算老闆是天才也賺得很辛苦！", "lv2": "把 SWOT 用出專業深度（TOWS 交叉矩陣）的三要點：\n\n1. **分清內外部**：S（優勢）、W（劣勢）是「內部可控」；O（機會）、T（威脅）是「外部環境趨勢」，很多人常把兩邊填混。\n2. **一定要交叉產出策略**：不能寫完四格就結束！要進一步配對「SO 進攻策略（拿優勢抓機會）」「WT 防禦策略（避開劣勢撞威脅）」。\n3. 每格只留最致命的 3 點，並附上具體事實證據，拒絕空泛形容詞。", "lv3": "Porter Five Forces（1979）屬於產業組織經濟學（SCP 典範），解釋跨產業長期平均利潤率差異。現代策略實務常加入「第六力：互補品（Complements, Brandenburger & Nalebuff）」（如軟體生態與硬體相輔相成），補齊平台時代的合作動態。"}, "myNotes": "SWOT 寫完四格只是熱身，交叉配對出 SO／WT 行動方案才是真正有用的策略！", "relatedIds": ["biz-s1-3", "strat-s1-1"], "updatedAt": "2026-11-24"},
        {"id": "biz-s2-2", "categoryId": "cat-biz", "stageId": "s2", "subtopic": "創新戰略", "title": "藍海策略與破壞式創新（Disruptive Innovation）", "oneLiner": "大公司常因為太聽既有高價客戶的話而把產品越做越貴；新進者只要用更簡單便宜的方案服務原本被忽略的人，反而能從邊緣翻盤。", "tags": ["#經典案例", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "兩個專為「不想在血腥紅海硬拼」而生的破局戰略：\n\n• **藍海策略**：傳統馬戲團都在拚「獅子更多、特技更危險」，太陽馬戲團卻乾脆「拿掉昂貴的動物表演」，改加入百老匯劇院音樂與藝術故事，瞬間開出完全沒對手的全新藍海市場！\n• **破壞式創新**：一開始看起來「有點簡陋但超便宜方便」的新東西（像早期的數位相機、Netflix 寄 DVD、Canva 線上製圖），大廠（柯達、百視達、專業設計軟體）一開始完全看不上眼，等這小東西越做越好時，大廠已經來不及轉身了！", "lv2": "運用藍海「ERRC 四步架構」重新設計產品或服務：\n\n1. **消除（Eliminate）**：業界習以為常但顧客其實不在乎的昂貴元素。\n2. **減少（Reduce）**：過度設計的功能，砍掉壓低成本。\n3. **提升（Raise）**：拉高顧客真正超在意的關鍵體驗。\n4. **創造（Create）**：引入跨界新價值，吸引原本的「非顧客」。", "lv3": "Clayton Christensen《創新者的兩難》（1997）指出巨頭落敗並非因為管理愚蠢，恰恰是因為「太理性地追求高毛利維持性創新（Sustaining Innovation）」而主動讓出低階與新市場破口。藍海策略（W. Chan Kim & Renée Mauborgne）則打破「差異化與低成本必然互斥」的傳統假設，透過價值創新（Value Innovation）同時壓低成本並拉高買方價值。"}, "myNotes": "用 ERRC（消除、減少、提升、創造）四格表重新設計方案，常能瞬間跳出紅海！", "relatedIds": ["strat-s1-3", "prod-mvp"], "updatedAt": "2026-11-24"},
        {"id": "biz-s2-3", "categoryId": "cat-biz", "stageId": "s2", "subtopic": "平台商業", "title": "平台經濟與雙邊市場冷啟動難題", "oneLiner": "外送平台沒有司機就沒餐廳、沒餐廳就沒客人——破局關鍵在於「先鎖定超小區域集中引爆，或單邊先提供獨立好用工具」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "做雙邊平台（像 Uber、Airbnb、交友軟體）最痛的難題就是「先有雞還是先有蛋」：司機看沒乘客就不想上線，乘客打開 App 看不到車也立刻刪掉！\n\n頂尖平台破局的三招經典起手式：\n1. **單點極致濃縮**：Uber 一開始只在舊金山幾個街區跑，把所有司機集中塞在超小範圍，保證叫車 5 分鐘必到！\n2. **補貼比較難拉的那一邊**：夜店讓女生免費入場吸引男生付費；外送平台先補貼司機保底時薪。\n3. **單邊工具先留人（Come for the tool, stay for the network）**：Instagram 一開始只是免費好用的濾鏡修圖工具，等大家聚起來才長成超大社群！", "lv2": "評估或設計平台型服務的實務檢核：\n\n1. 辨識「跨邊網路效應」強弱與「多棲成本（Multi-homing）」：若司機跟乘客可以同時裝兩家 App 無痛切換，平台就會陷入無止盡補貼戰。\n2. 追求「原子網絡（Atomic Network）」：算出最小能自己運轉的單位（例如一個大學校園、一個興趣社群），先打穿第一個再複製。", "lv3": "雙邊市場理論（Jean Tirole, 2014 諾貝爾經濟學獎）揭示其定價結構不同於傳統單邊市場：平台應對價格彈性高或對另一邊產生強烈正外部性的族群採取低價甚至負價（補貼），再向彈性低的一邊變現。Andrew Chen《冷啟動問題》系統化拆解了「原子網絡 → 臨界點 → 逃逸速度」的平台成長階段。"}, "myNotes": "Come for the tool, stay for the network——先給單邊獨立好用的工具，是破解冷啟動最優雅的招！", "relatedIds": ["cross-s2-3", "biz-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "biz-s2-4", "categoryId": "cat-biz", "stageId": "s2", "subtopic": "策略取捨", "title": "核心競爭力與策略取捨：決定「不做什麼」的藝術", "oneLiner": "策略的本質不是列出十個聽起來很棒的願望，而是清楚決定「為了把最關鍵的一件事做到極致，我願意果斷放棄哪九件事」。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "賈伯斯 1997 年重回瀕臨破產的蘋果時，當時蘋果桌上擺了幾十款不同型號的電腦跟印表機，他走上白板只畫了一個 2×2 格子（消費／專業 × 桌機／筆電），大筆一揮砍掉 **70%** 的產品線！\n\n他留下一句經典名言：「專注不是對想做的事說 Yes，而是對其他一百個好點子說 No。」不管是公司還是個人，資源永遠有限，什麼都想抓的結果通常是一無所有。", "lv2": "檢驗一份計畫到底是不是「真策略」的測試：\n\n1. **反向測試**：把你寫的策略句子改成相反意思（例如「我們追求高品質、低成本、超快交付」改成「我們追求低品質」——沒有正常公司會選相反的，那就只是「口號」而不是策略！）。\n2. 真正的策略必包含**痛苦的取捨**（例如西南航空決定「不劃位、不供餐、只飛單一機型波音 737」，換來極致低價與 20 分鐘超快周轉）。\n3. 個人應用：每季寫下「本季明確不做的三件事清單（Not-to-Do List）」。", "lv3": "Michael Porter《What Is Strategy?》（HBR, 1996）嚴格區分「營運效能（Operational Effectiveness，把跟對手一樣的事做得更快）」與「策略定位（Strategic Positioning，做跟對手不同的事，或用不同方式整合活動配適系統 Activity System Fit）」，指出唯有建立難以模仿的取捨權衡（Trade-offs），優勢方能持久。"}, "myNotes": "沒有伴隨「放棄什麼」的清單不是策略，只是許願池！", "relatedIds": ["mkt-stp", "strat-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "biz-s3-1", "categoryId": "cat-biz", "stageId": "s3", "subtopic": "目標管理", "title": "目標管理：OKR 與 KPI 的本質差異與搭配法", "oneLiner": "KPI 是汽車儀表板（確保油箱不見底、引擎不出事），OKR 則是衛星導航（告訴你這季要衝往哪座新山峰）。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "很多公司把 OKR 跟 KPI 混成一團，搞得員工怨聲載道。其實用開車一秒就分清：\n\n• **KPI（關鍵績效指標）**像車子儀表板上的時速、油量跟水溫：用來守住日常底線，一定要達標（例如客服 24 小時內回覆率 > 98%），通常跟獎金考績掛鉤。\n• **OKR（目標與關鍵結果）**像導航目的地：O（Objective）是激勵人心的方向（「打造讓高中生都秒懂的個人知識庫」），KR（Key Results）是 2–4 個可量化的驗收標準（「本季完成 6 大領域共 96 篇三層卡」）。OKR 鼓勵設高一點挑戰突破，做到 70% 就算超棒，通常**不直接綁死罰款**，大家才敢挑戰難題！", "lv2": "個人與團隊寫出好 OKR 的四條黃金規則：\n\n1. 每季最多設 **1–3 個 O**，每個 O 配 **2–4 個可量化 KR**（寫出數字，不要把待辦任務當成結果）。\n2. 區分「產出（Output，寫了 10 篇文章）」與「成果（Outcome，讀者完成閱讀率達 60%）」。\n3. 雙軌並行最穩：日常維運用 KPI 守住下限，創新突破用 OKR 拉高上限。\n4. 每週花 10 分鐘更新信心指數（1–10 分），偏低就立刻討論需要什麼支援。", "lv3": "OKR 由英特爾 Andy Grove 建立並由 John Doerr 引入 Google 普及，核心價值在於透過「公開透明對齊（Alignment）+ 雙向由下而上協商 + 脫鉤績效懲罰」激發內在自主動機與高野心目標（Moonshots），避開傳統純 KPI 導致的「沙袋效應（Sandbagging，刻意壓低目標好拿獎金）」。"}, "myNotes": "KPI 守底線（儀表板），OKR 拼突破（導航）；個人季度目標用 1 個 O 配 3 個量化 KR 超好用！", "relatedIds": ["econ-incentive", "biz-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "biz-s3-2", "categoryId": "cat-biz", "stageId": "s3", "subtopic": "敏捷執行", "title": "敏捷開發（Agile／Scrum）與精實創業（MVP 迭代）", "oneLiner": "別關起門悶頭做一年才交大成品，把大專案切成每 1–2 週交付一個能用小版本的衝刺節奏，邊跑邊修偏最不易翻車。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "以前蓋軟體像蓋大樓（瀑布式開發）：先花半年寫超厚規格書、再花一年寫程式，最後驗收才發現市場早變了、客戶根本不想要！\n\n**敏捷（Agile / Scrum）**改用「每兩週跑一次小衝刺（Sprint）」：\n• 週一挑出這兩週最重要的小目標放進看板。\n• 每天花 10 分鐘站著快速對齊三件事（昨天做了啥、今天做啥、哪裡卡住了）。\n• 兩週結束立刻交出一個「真的能點能用的小成品」讓使用者試玩，並開 15 分鐘復盤會把流程改得更順！", "lv2": "把敏捷思維用在個人專案與跨領域學習：\n\n1. **1 週短衝刺節奏**：每週日挑出下週最關鍵的 3 件交付成果，週五驗收並做 10 分鐘回顧（什麼做得好？下週改哪一點？）。\n2. **何時用瀑布、何時用敏捷**：需求極度明確且改動成本極高（如蓋橋樑、辦實體大型婚禮）→ 偏瀑布嚴密規劃；高度不確定、邊做邊摸索（如做軟體、寫作、個人知識庫）→ 必用敏捷迭代！", "lv3": "《敏捷宣言》（2001）四大價值觀：個體互動重於流程工具、可用軟體重於詳盡文件、客戶合作重於合約談判、回應變化重於遵循計畫。實務上常搭配 Scrum（固定時間盒衝刺）或 Kanban（連續拉動流 + 限制在製品 WIP）因應不同團隊節奏。"}, "myNotes": "需求明確的實體工程用瀑布，充滿未知的創新與學習用 1–2 週敏捷短衝刺！", "relatedIds": ["prod-mvp", "biz-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "biz-s3-3", "categoryId": "cat-biz", "stageId": "s3", "subtopic": "專案控管", "title": "關鍵路徑法（CPM）與資源排程風險控管", "oneLiner": "專案裡所有任務並不是一樣急——只要盯緊那條「一拖延就會讓整個交期延後」的關鍵路徑，就能把專案穩穩準時交出。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "想像你要準備一桌晚餐，有三個任務：\n• 燉一鍋牛肉湯（要 60 分鐘）\n• 洗菜切菜炒青菜（要 15 分鐘）\n• 擺碗筷倒飲料（要 5 分鐘）\n\n只要同時開工，這桌菜最快 60 分鐘就能上桌！這裡的「燉牛肉湯」就是 **關鍵路徑（Critical Path）**：擺碗筷就算慢了 10 分鐘也不影響開飯時間，但牛肉湯只要晚開火 5 分鐘，整桌飯就保證晚 5 分鐘！\n\n高手管專案就是把 80% 精力盯緊關鍵路徑上的任務，並在關鍵路徑尾端留好緩衝時間。", "lv2": "排程與救火的實戰三招：\n\n1. **專案鐵三角（範圍 × 時間 × 成本／人力）**：三者互相鎖死，老闆突然要求「時間砍半、功能加倍、不加人」，一定要攤開鐵三角請他選「砍哪塊範圍」或「加哪邊資源」。\n2. **破除人月神話**：九個孕婦沒辦法一個月生出一個小孩；專案快延誤時盲目塞一堆新人進去，光交接溝通反而拖更慢。\n3. 預留 **20% 緩衝（Buffer）** 在關鍵路徑末段，吸收意料之外的突發狀況。", "lv3": "關鍵路徑法（Critical Path Method, CPM）於有向無環任務網路（DAG）上計算每個節點的最早開始／最晚完成時間，浮時（Float / Slack）為零之最長路徑即關鍵路徑；進階管理結合 Goldratt 關鍵鏈專案管理（CCPM），將分散在各任務的隱蔽安全時間集中為統一專案緩衝管理。"}, "myNotes": "先找出「浮時為零」的關鍵路徑任務盯緊它，再善用專案鐵三角跟主管談取捨！", "relatedIds": ["algo-s2-3", "cross-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "biz-s3-4", "categoryId": "cat-biz", "stageId": "s3", "subtopic": "團隊協作", "title": "授權藝術、RACI 權責矩陣與高效會議設計", "oneLiner": "「大家都負責」的翻譯就是「沒有人負責」；每件事永遠只指定 1 位最終拍板負責人（A），開會前先發議程，團隊效率立刻翻倍。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "做分組報告最常發生的慘劇就是：群組裡說「簡報大家一起做喔！」，結果截止前一晚四個人通通以為別人會做！\n\n管團隊神器 **RACI 矩陣** 把每件事的角色切得一清二楚：\n• **R（執行者）**：實際捲起袖子做這件事的人。\n• **A（最終拍板負責人）**：出了事扛責任、有權拍板的人——**每件事永遠只能有 1 個人是 A！**\n• **C（諮詢對象）**：動工前要先問他專業意見的人。\n• **I（知會對象）**：做完通知他一聲就好的人。", "lv2": "讓開會不再浪費生命的四條鐵律：\n\n1. **無議程不開會**：會前先寫清楚「這場會要做出哪 2 個決定」，純同步進度用文字訊息就好。\n2. **會前先讀 5 分鐘（亞馬遜六頁紙精神）**：不讓大家花半小時聽人唸投影片，直接聚焦討論分歧點。\n3. **會後 24 小時發 3 行結論**：記下「決議什麼、誰是唯一負責人（A）、什麼時候交付」。\n4. 授權要「給目標與邊界，不微管理每個滑鼠點擊」。", "lv3": "組織協作成本隨團隊人數呈平方級上升（溝通通道數 n(n-1)/2）。RACI 明確化決策權邊界並消除「責任分散效應（Diffusion of Responsibility）」；搭配非同步優先溝通（Async-First）能保護核心知識工作者的連續深度工作時間。"}, "myNotes": "每件事只能有 1 個最終負責人（A），純同步進度不開會，這兩條能省下公司一半時間！", "relatedIds": ["speak-s4-4", "strat-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "biz-s4-1", "categoryId": "cat-biz", "stageId": "s4", "subtopic": "組織激勵", "title": "激勵機制設計與委託代理問題（Principal-Agent）", "oneLiner": "當老闆要的是「公司十年長青」，業務領獎金卻只看「這個月衝業績」，兩邊利益沒對齊就必然出現短視亂象。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "房東（委託人）請房仲（代理人）賣房子：房東希望多等兩週多賣 50 萬，但對房仲來說多賣 50 萬只多抽 1 萬元佣金，還不如勸房東降價快點成交去接下一筆案子！\n\n這就是經濟與管理學超經典的 **委託代理問題**：請別人替你辦事時，只要「他的獎金規則」跟「你的真實利益」沒綁在一起，他就會自然做出對自己最省力、卻對你最不利的決定。", "lv2": "設計好制度對齊利益的三個實務工具：\n\n1. **風險共擔（Skin in the Game）**：讓決策者或高階主管持有長期股權或遞延獎金，公司三年後還健康才能領完，徹底杜絕炒短線。\n2. **指標平衡設計**：業務獎金不只看「成交額」，同步綁定「客戶續約率／客訴率」作為發放門檻。\n3. **資訊透明化**：縮短監督者與執行者之間的資訊落差，降低摸魚與隱瞞風險的空間。", "lv3": "委託代理理論（Jensen & Meckling, 1976）將代理成本拆分為監督成本（Monitoring Costs）、約束成本（Bonding Costs）與剩餘損失（Residual Loss）。優秀公司治理透過激勵相容合約、績效股權歸屬期（Vesting）與獨立稽核機制將代理成本極小化。"}, "myNotes": "看到任何讓人傻眼的商業或職場亂象，先查背後的「獎金與考核規則」，答案立刻浮現！", "relatedIds": ["econ-incentive", "biz-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "biz-s4-2", "categoryId": "cat-biz", "stageId": "s4", "subtopic": "商業談判", "title": "商業談判策略：BATNA、保留底線與把餅做大", "oneLiner": "菜鳥談判只在「價格」一條線上你死我活，高手先算好自己的最佳備案（BATNA），再拉入時程、資源與長期合作把餅做大。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "兩姊妹搶廚房裡最後一顆橘子，吵到快翻臉，媽媽直接一刀切兩半一人一半——結果姊姊只是要「橘子皮」做蛋糕，妹妹只是要「橘子肉」榨果汁！\n\n如果她們早點問一句「你為什麼要這顆橘子？」，兩個人原本都可以拿到 **100%** 自己想要的東西！\n\n這就是商業談判兩大核心：\n1. **上桌前先準備好 BATNA（最佳替代方案）**：例如去談加薪前手上有另一份不錯的 Offer，你說話自然不慌。\n2. **別只盯著單一價格互砍**：多問對方背後需求，加入付款方式、交期、推薦見證等新變數「把餅做大」。", "lv2": "商業與職場談判的五步準備清單：\n\n1. 寫下自己的 **理想目標價**、**保留底線（Walk-away Point）** 與 **BATNA**。\n2. 估計對方的底線，找出雙方的「可能協議區間（ZOPA）」。\n3. 條件成熟時搶先合理開出「高錨點」（搭配客觀市場數據支撐）。\n4. 每次讓步幅度「越來越小」（例如讓 10% → 4% → 1%），傳達已逼近底線的訊號。\n5. 絕不無條件讓步，堅持「如果我給你 X，你能給我 Y 嗎？」", "lv3": "哈佛談判學派（Fisher & Ury《Getting to Yes》）區分「分配型談判（零和切餅）」與「整合型談判（Integrative Bargaining，利用雙方對多維度議題的不同邊際效用創造帕累托改進）」，強調對事不對人、聚焦底層利益而非表面立場、以客觀外部標準收斂分歧。"}, "myNotes": "記住橘子故事：問清楚對方要的是「橘子皮」還是「橘子肉」，常能把零和變成雙贏！", "relatedIds": ["speak-s4-2", "strat-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "biz-s4-3", "categoryId": "cat-biz", "stageId": "s4", "subtopic": "團隊文化", "title": "企業文化、心理安全感與高績效團隊特徵", "oneLiner": "Google 研究上百個團隊後發現，最強團隊不是學歷最高的那組，而是「成員敢承認犯錯、敢提笨問題也不怕被嘲笑」的那組。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "Google 曾花兩年做了著名的「亞里斯多德計畫（Project Aristotle）」，想找出最強團隊的秘密。大家原本猜是「把所有天才塞進同一組」，結果數據大翻盤！\n\n決定團隊績效的第一名關鍵竟然是 **心理安全感（Psychological Safety）**：\n• 團隊裡大家敢放心說「這部分我還沒懂，能再講一次嗎？」\n• 發現系統快出包時敢第一時間舉手回報，而不是怕挨罵偷偷把問題藏起來直到爆炸！\n\n注意：心理安全感**不是「大家當爛好人不講標準」**，而是「對事要求高標準，但對人保有尊重與容錯空間」。", "lv2": "帶團隊或當好隊友營造心理安全感的四個動作：\n\n1. **領導者帶頭示範承認不知道與犯錯**，瞬間打破「裝懂文化」。\n2. 犯錯檢討採「無責備事後回顧（Blameless Post-mortem）」：問「我們流程哪裡讓這件事容易出錯？」而非「今天要抓誰出來罵？」。\n3. 把「提出反對意見」視為對團隊最忠誠的貢獻。\n4. 文化不是牆上的海報，而是「你平時獎勵誰、容忍什麼行為」的總和。", "lv3": "哈佛商學院 Amy Edmondson 系統化定義心理安全感，並建立「心理安全感 × 績效當責（Accountability）」2×2 矩陣：低安全高當責落入「焦慮區（隱匿錯誤）」、高安全低當責落入「舒適區（平庸）」、唯有「高安全 ＋ 高當責」方能進入高效「學習與創新區」。"}, "myNotes": "高心理安全感 + 高標準當責 = 頂尖學習型團隊；文化看的是你實際獎勵什麼，不是牆上標語！", "relatedIds": ["psy-s2-3", "biz-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "biz-s4-4", "categoryId": "cat-biz", "stageId": "s4", "subtopic": "轉型變革", "title": "危機處理、轉型變革與第二曲線布局", "oneLiner": "等舊生意開始大幅衰退才想起要轉型通常已經太晚了——啟動「第二曲線」的最佳時機，永遠是第一曲線還在往上衝的時候。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "任何好產品、好技能跟大公司都會走過一條「S 型曲線」：剛開始摸索慢 → 爆發快速成長 → 最後遇到天花板開始走下坡。\n\n管理大師查爾斯・韓第提出 **第二曲線思維**：最難卻最正確的時刻，是在你「現在這份工作或業務還在賺錢、還有餘裕（A 點）」的時候，就撥出 15% 時間資源偷偷培育下一條成長曲線（例如傳統實體店趁賺錢時就佈局電商與數位會員；上班族趁本業穩定時就累積 AI 與跨領域複利資產）！\n\n而危機爆發時的黃金原則則是：**速度優先、誠實承擔、立刻給補償與預防方案**，越遮掩燒越大。", "lv2": "推動組織或個人轉型的實務四步：\n\n1. **趁順風期播種第二曲線**：不要等被裁員或產業夕陽化才倉促轉行。\n2. **危機公關 3T 原則**：Tell your own tale（主動自己說）、Tell it fast（越快越好）、Tell it all（一次坦白不擠牙膏）。\n3. 雙元組織思維：新業務不要完全交給靠舊業務領獎金的團隊管，給新專案獨立小空間與不同衡量指標。", "lv3": "Charles Handy《第二曲線》與 John Kotter《變革八步驟》揭示組織轉型的最大阻力來自「成功路徑依賴（Success Trap）」：既有高利潤業務的現金流與權力結構會本能排擠早期毛利較低的新芽，唯有領導者主動導入雙元能力（Organizational Ambidexterity）方能穿越典範轉移。"}, "myNotes": "趁現在還在順風期就播下第二曲線的種子——不管是企業還是個人都一樣！", "relatedIds": ["strat-s4-4", "cross-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "econ-s1-1", "categoryId": "cat-econ", "stageId": "s1", "subtopic": "選擇底層", "title": "稀缺性、機會成本與邊際效益遞減法則", "oneLiner": "經濟學不是在講深奧的股市，而是在教我們「資源與時間有限時，怎麼把下一塊錢與下一小時花在刀口上（邊際思考）」。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "口渴跑完操場喝下「第一杯」冰珍奶覺得像上天堂（爽度 100 分）；馬上再喝「第二杯」覺得還不錯（爽度 40 分）；逼你喝「第四杯」你會想吐（爽度變負的！）——這就是 **邊際效益遞減法則**！\n\n高手做決定從來不問「總體好不好」，而是問「**多做這一份（邊際）**，多花的時間跟錢值不值多換來的爽度？」：讀書從 60 分拉到 85 分花 10 小時超划算，從 98 分拉到 100 分卻可能要多花 30 小時，把那 30 小時拿去學新領域往往更賺！", "lv2": "用邊際思維優化日常時間與金錢配置：\n\n1. **停在「邊際收益 ＝ 邊際成本」的地方**：別在已經 90 分的簡報微調邊距多花三小時，把時間移去邊際報酬更高的任務。\n2. 忽略沉沒成本、只看「未來邊際」：過去花掉的無法改變，所有決策只比較「接下來多投入 1 單位能換回什麼」。\n3. 善用「邊際遞減」分配預算：旅行前 3 天最驚喜，把 10 天濃縮成 5 天高品質行程有時更快樂省錢。", "lv3": "邊際革命（Marginal Revolution, Jevons / Menger / Walras, 1870s）解決了古典經濟學的「水與鑽石悖論」：市場價格並非由總效用（水維生總效用極高）決定，而是由「最後一單位的邊際效用（鑽石極稀缺故邊際效用高）」決定。消費者均衡發生於各商品「邊際效用 / 價格」相等之處。"}, "myNotes": "從 60 分到 85 分超划算，從 98 分到 100 分邊際報酬暴跌——學會把時間花在邊際最高的地方！", "relatedIds": ["cross-s3-4", "econ-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "econ-s1-2", "categoryId": "cat-econ", "stageId": "s1", "subtopic": "市場機制", "title": "供需曲線與價格訊號：為何限價常常導致缺貨", "oneLiner": "價格不只是標籤，更是傳遞稀缺資訊的超級指揮棒；硬把價格壓低在市場均衡以下，往往只會換來大排長龍、缺貨與黑市。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "颱風來之前菜價飆漲、過年高鐵票難搶，如果政府好心硬性規定「菜價全部不准超過 20 元（價格上限）」，會發生什麼事？\n\n1. 買家覺得超便宜，本來只買一把菜的人一口氣搶十把（需求暴增）。\n2. 農夫覺得冒雨搶收才賣 20 元連運費都不夠，乾脆不採收了（供給暴跌）。\n3. 結果超市貨架一空如也、半夜排隊還買不到，甚至冒出私下賣 100 元的黃牛黑市！\n\n價格上漲雖然讓人心痛，卻會同時「叫大家省著用」並「吸引外地農夫連夜送菜進來」自動化解缺貨。", "lv2": "看懂價格訊號與供需的日常應用：\n\n1. 區分「價格變動（沿著線移動）」與「整條線移動（如科技突破讓成本暴降、或爆紅讓需求暴增）」。\n2. 看懂薪資高低邏輯：一份工作薪水高，不是因為它多辛苦或多偉大，而是「會做的人超少（供給稀缺）＋ 市場超需要（需求強勁）」。\n3. 遇到限價管制（如租金管制）時，留意背後衍生的「隱性排隊成本、屋況變差與黑市現象」。", "lv3": "經濟學家海耶克（Friedrich Hayek, 1945《知識在社會中的運用》）指出，價格體系是一套極度去中心化的資訊壓縮與協調系統，能在沒有中央計劃者掌握全貌的情況下，瞬間將分散在全球數十億人間的稀缺與偏好變動傳遞給所有生產者與消費者。價格上限（Price Ceiling）必然造成超額需求（Shortage）與無謂損失（Deadweight Loss）。"}, "myNotes": "薪水高低看的不是辛苦程度，而是「需求有多強 × 供給有多稀缺」！", "relatedIds": ["econ-s1-3", "econ-incentive"], "updatedAt": "2026-11-24"},
        {"id": "econ-s1-3", "categoryId": "cat-econ", "stageId": "s1", "subtopic": "定價權", "title": "需求彈性：為什麼漲價後有些商品照賣、有些沒人買", "oneLiner": "替代品越少、越是剛需的東西「需求越沒彈性（漲價照樣買單）」；這正是好企業擁有超強定價權的底層秘密。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "想想看這兩樣東西如果明天同時漲價 20%：\n• **胰島素、自來水、手機網路**：你會氣得跳腳，但幾乎還是得照買（**缺乏彈性**，因為沒替代品又不能沒有它）。\n• **某家普通手搖飲店**：明天漲 20%，你直接轉頭走去隔壁那家買就好（**富有彈性**，替代品滿街都是）。\n\n所以對老闆來說：賣「缺乏彈性」的東西，漲價總收入反而變多；賣「富有彈性」的東西，一漲價客人跑光、總收入暴跌！", "lv2": "把需求彈性用在商業定價與個人職涯：\n\n1. **想擁有定價權（敢漲價）**，唯一解就是「降低自己的可替代性」：建立獨特品牌、專利技術或深度綁定的工作流。\n2. **薄利多銷只在「富有彈性」市場有效**：降價能吸引來成倍新客才划算；如果是剛需市場降價，只是白白把利潤送掉。\n3. 短期彈性通常小於長期彈性（例如油價大漲，今天大家還是得開車，但三年後大家就會換成電動車）。", "lv3": "需求價格彈性 E_d = (%ΔQ) / (%ΔP)。當 |E_d| < 1（缺乏彈性），價格上升使總營收 P·Q 增加；當 |E_d| > 1（富有彈性），降價方能擴大總營收；邊際收益與彈性關係遵循 Lerner Index：(P − MC) / P = −1 / E_d，精確量化企業的市場定價力。"}, "myNotes": "降低自身可替代性 = 降低需求彈性 = 擁有真正定價權！", "relatedIds": ["biz-s1-3", "econ-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "econ-s1-4", "categoryId": "cat-econ", "stageId": "s1", "subtopic": "分工合作", "title": "比較利益與專業分工：為何強者仍要與人合作", "oneLiner": "就算你做兩件事都比別人快（絕對優勢），依然該專心做你「領先幅度最大」的那件事，把另一件外包合作，雙方總產出都會變多。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "假設全鎮最厲害的王牌律師，不只要價每小時 5,000 元，連打字速度都比他的助理快兩倍！那律師該自己打文件省下助理薪水嗎？\n\n算一下就懂了：律師自己花 1 小時打字，省了 300 元助理費，卻白白少賺了 5,000 元律師費（淨虧 4,700 元）！\n\n這就是經濟學最反直覺卻最偉大的法則 **比較利益**：就算你樣樣都比別人強，只要專心做你「機會成本最低、價值最高」的那件事，其他交給合作夥伴或 AI 工具，你跟對方兩邊都會一起變得更富有！", "lv2": "把比較利益用在個人效率與 AI 協作：\n\n1. **算自己的隱形時薪**：花 3 小時做你原本不擅長的雜事，如果花 500 元外包或交給工具 5 分鐘搞定，能騰出時間專攻高價值核心工作，果斷外包！\n2. **與 AI 的比較利益分工**：AI 擅長高速資料檢索、初稿生成與程式樣板；人類擅長定義真問題、審美判斷與承擔責任——兩者分工合作總產出遠大於各自單幹。", "lv3": "大衛・李嘉圖（David Ricardo, 1817）提出比較利益理論，證明國際貿易與專業分工並非零和遊戲：只要兩國／兩人的相對機會成本不同，各自專精於具比較利益之產出並透過交換，雙方的消費可能邊界（CPF）皆能嚴格突破自身生產可能邊界（PPF）。"}, "myNotes": "不要當事必躬親的苦幹王，專注自己比較利益最高的核心價值，其餘交給工具與協作！", "relatedIds": ["cross-s3-4", "it-ai-workflow"], "updatedAt": "2026-11-24"},
        {"id": "econ-s2-2", "categoryId": "cat-econ", "stageId": "s2", "subtopic": "資訊不對稱", "title": "資訊不對稱：逆向選擇（檸檬市場）與道德風險", "oneLiner": "買家分不清好貨爛貨時只願出低價，結果好貨全部退出市場只剩爛貨（逆向選擇）；買了全險後開車變粗心則是「道德風險」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "兩個在買車、買保險、找工作天天發生的經濟學現象：\n\n1. **逆向選擇（檸檬市場，交易前資訊不對稱）**：中古車市場裡，只有賣家知道這台車是不是泡水事故車（檸檬）。買家怕踩雷，只願意出超低價；結果車況超好的車主覺得賣太虧乾脆不賣了，市場上最後只剩滿滿爛車！\n2. **道德風險（交易後行為改變）**：如果你買了一張「撞壞全額免費賠新車、完全不漲保費」的保險，你停車可能就沒以前那麼小心了——因為出事的後果有人幫你買單！", "lv2": "破解資訊不對稱的商業與生活解法：\n\n1. **破解逆向選擇**：透過第三方驗車認證、七天無條件退貨鑑賞期、公開真實評價系統與長期保固，向買家證明「我是好貨」。\n2. **防範道德風險**：保險設計「自負額（出險自己也要付一筆）」與「出險隔年漲保費」；商業合作採「分期驗收付款」而非一次全額先付。", "lv3": "George Akerlof（1970《檸檬市場》）、Michael Spence 與 Joseph Stiglitz 因資訊經濟學獲 2001 年諾貝爾經濟學獎。當市場存在嚴重隱藏資訊（Hidden Information）或隱藏行動（Hidden Action）時，自由市場均衡將無法達成帕累托效率，須仰賴訊號傳遞（Signaling）、篩選機制（Screening）與激勵合約修復。"}, "myNotes": "怕踩雷先看有沒有第三方驗證與退換保障；怕對方偷懶就設計分期驗收與自負額！", "relatedIds": ["econ-s2-3", "biz-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "econ-s2-3", "categoryId": "cat-econ", "stageId": "s2", "subtopic": "訊號傳遞", "title": "訊號傳遞（Signaling）：學歷、保固與品牌為何值錢", "oneLiner": "好訊號的秘密不在於「講得多好聽」，而在於「造假成本極高」——只有真的夠強或品質夠好的人，才敢拿出這張證明。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "為什麼孔雀要長出那麼大、又重又容易被天敵抓到的華麗尾巴？生物學跟經濟學給了同一個答案：**高成本訊號（Costly Signal）**！只有基因超強壯的孔雀才扛得動這條尾巴還活得好好的，母孔雀一看就知道「這隻身體絕對超健康」！\n\n人類社會一模一樣：\n• 名校學歷不只是學知識，更是向雇主發訊號：「我有足夠智商與毅力熬過嚴格篩選」。\n• 敢提供「五年全機免費保固」的品牌，比廣告狂喊「品質第一」可信一百倍，因為爛貨根本賠不起五年保固！", "lv2": "在職場與個人品牌發出「高可信度訊號」的方法：\n\n1. **作品集勝過空泛履歷**：口頭說「我對數據跟 AI 很有熱情」（零成本廉價談話，Cheap Talk）沒人信；直接丟出你親手做好的專屬網站、開源專案或深度分析報告，一秒建立壓倒性信任！\n2. **敢承諾具體保障**：接案或賣產品時，清楚列出交付標準與修改保障，主動消除買家疑慮。", "lv3": "Michael Spence（1973）訊號模型證明，分離均衡（Separating Equilibrium）成立的關鍵條件是「單交叉性質（Single-Crossing Property）」：高能力者取得該訊號的邊際成本必須顯著低於低能力者，否則低能力者將群起模仿導致訊號失效（混同均衡）。"}, "myNotes": "口頭宣稱叫 Cheap Talk，親手做出來的作品集與深度知識庫才是最強高成本訊號！", "relatedIds": ["econ-s2-2", "mkt-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "econ-s2-4", "categoryId": "cat-econ", "stageId": "s2", "subtopic": "市場結構", "title": "獨佔、寡佔與完全競爭：不同市場結構的定價權", "oneLiner": "完全競爭市場裡所有人都只能當價格接受者賺辛苦錢；越往寡佔與差異化獨佔移動，企業才越有資格自己定價。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "把世界上所有生意排成一條光譜：\n\n1. **完全競爭**（菜市場賣高麗菜）：大家賣的東西一模一樣、誰都能進來擺攤，你只要貴別人 5 元就完全賣不出去，長期只剩微薄辛苦錢。\n2. **獨佔性競爭**（街邊咖啡館、手搖飲）：東西有點像，但靠裝潢、口味跟品牌故事做出一點點差異化。\n3. **寡佔**（電信三雄、兩大手機系統、少數先進晶片廠）：場上只有 2–4 家巨頭互相盯著看，沒事不會亂殺價，利潤豐厚。\n4. **獨佔**（自來水、專利藥、微軟早期作業系統）：場上只有你一家，定價權最大（但也容易被政府反壟斷盯上）。", "lv2": "投資與創業必看的市場結構心法：\n\n1. 彼得・提爾名言：「競爭是給輸家玩的！」創業與個人定位要避開完全競爭，透過細分差異化在自己的小池塘裡當「微獨佔冠軍」。\n2. 選股優先找「雙頭寡佔或區域獨佔」且有高轉換成本的龍頭，避開無差異化、永遠在比誰最便宜的紅海行業。", "lv3": "市場集中度常以赫芬達爾—赫希曼指數（HHI = Σ s_i²）衡量。在完全競爭長期均衡下 P = MC = min(ATC)，經濟利潤歸零；寡佔市場則呈現高度策略互動（古諾產量競爭、柏川德價格競爭與折彎需求曲線）。"}, "myNotes": "別在完全競爭裡比誰便宜，要在細分領域靠差異化成為小池塘裡的微獨佔！", "relatedIds": ["biz-s1-3", "econ-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "econ-s3-1", "categoryId": "cat-econ", "stageId": "s3", "subtopic": "市場失靈", "title": "正負外部性與寇斯定理：空污、疫苗與碳稅背後的邏輯", "oneLiner": "工廠排廢氣賺錢卻由全體居民吸毒氣買單（負外部性），種花與打疫苗則順便造福鄰居（正外部性）；政府課稅與補貼就是在把外部成本算回帳本。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "有些行為的好處或壞處會「外溢」到跟交易無關的路人身上，這叫 **外部性**：\n\n• **負外部性**：造紙廠把廢水偷排進河裡省了成本，但下游漁民魚全死光——工廠沒為污染付錢，就會生產過多髒東西！解決法是「課碳稅／環保罰款（皮古稅）」，逼它把污染成本算進售價。\n• **正外部性**：你花錢打流感疫苗、把家門口種滿漂亮花草，鄰居沒出錢也跟著少生病、心情變好！所以政府常透過「公費補助」鼓勵大家多做這類好事。", "lv2": "看懂新聞政策與日常協商的外部性視角：\n\n1. 碳費、菸捐、塞車費（擁擠稅）本質全都是「讓製造負外部性的人內部化成本」。\n2. **寇斯定理的實用啟發**：只要產權界定清楚、雙方溝通成本夠低，不一定要政府出手，當事人自己協商補償（例如工廠花錢幫附近住戶裝氣密窗）就能達成有效率解法！", "lv3": "庇古稅（Pigouvian Tax）將稅率定為邊際外部損害成本（MEC），使私人邊際成本與社會邊際成本重合。羅納德・寇斯（Ronald Coase, 1960《社會成本問題》）進一步證明：在零交易成本與明確產權前提下，無論初始產權歸誰，市場自發談判皆能達成帕累托最優配置；反面意義則是當交易成本極高（如全球暖化牽涉數十億人）時，制度與法規設計至關重要。"}, "myNotes": "碳費、菸捐、公費疫苗全都可以用「正負外部性內部化」一句話秒懂！", "relatedIds": ["econ-s3-2", "econ-incentive"], "updatedAt": "2026-11-24"},
        {"id": "econ-s3-2", "categoryId": "cat-econ", "stageId": "s3", "subtopic": "公共資源", "title": "公共財與公地悲劇：為何免費資源最容易被耗盡", "oneLiner": "沒有人獨佔擁有權、大家都能免費抓的公共魚池，每個人都怕「我不抓就被別人抓光」，結果最後整池魚一起絕種。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "想像村子裡有一片免費公用大草地，每個牧羊人都在想：「多放一隻羊吃草，賺的錢全歸我，草地變禿的代價卻是全村一起攤！我不放別人也會放！」結果每個人都拼命加羊，一年後草地變沙漠，全村羊都餓死——這就是著名的 **公地悲劇**！\n\n同樣的，像路燈、國防這種「做好了誰都能免費享用（無排他性）」的東西叫 **公共財**，因為大家都想「搭便車」等別人付錢，市場沒人想蓋，所以通常要靠政府收稅來提供。", "lv2": "破解公地悲劇的三條經典路徑：\n\n1. **明確產權私有化**：把公用草地分塊給個別牧羊人，大家立刻會細心照顧自己的草皮。\n2. **政府配額與收費管制**：像總量捕魚配額、國家公園入園名額、高速公路尖峰收費。\n3. **社區自治共管（歐斯壯方案）**：透過清楚邊界、公開監督與違規懲罰機制，靠在地社群自律也能成功守護共享資源（例如高品質開源社群與維基百科）。", "lv3": "經濟學依「排他性（Excludability）」與「敵對性（Rivalry）」將財貨分為四象限：私人物品、俱樂部財（如串流會員）、共有資源（Common-Pool Resources，易生公地悲劇）與純公共財（易生搭便車）。Elinor Ostrom（2009 首位女性諾貝爾經濟學獎得主）打破「非私有即國有」二分法，提出自主治理共享資源的八大設計原則。"}, "myNotes": "共有資源沒規則一定變沙漠；破解三招：明產權、設配額、建透明自治規則！", "relatedIds": ["cross-s3-2", "econ-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "econ-s3-3", "categoryId": "cat-econ", "stageId": "s3", "subtopic": "稅務與轉嫁", "title": "稅負轉嫁：加稅最後究竟是買家還是賣家買單", "oneLiner": "法律寫明「向老闆課稅」不代表真的老闆出錢——真正決定誰扛大頭的，是買賣雙方誰「比較離不開對方（彈性較小）」。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第四階段擴充課綱", "levels": {"lv1": "如果政府宣布「明天起向房東多課 10% 囤房稅」或「向飲料店多課 5 元糖稅」，最後到底是誰真的掏腰包？\n\n答案藏在 **彈性** 裡：\n• 如果市中心好房子一房難求、租客非租不可（買家沒彈性），房東只要一漲房租，稅金幾乎全部轉嫁到租客頭上！\n• 如果某種奢侈遊艇買家覺得「貴一點我就乾脆不買去國外玩」（買家超有彈性），賣家一漲價就賣不出去，只好自己咬牙吸收大部分稅金！\n\n一句話記住：**誰越不能轉身離開，誰就付越多稅！**", "lv2": "看懂日常新聞與商業報價的稅負歸宿思維：\n\n1. 不要只看條文寫「向誰徵收」（法定歸宿），要分析市場結構看「誰真的承擔」（經濟歸宿）。\n2. 薪資稅／勞健保雇主負擔比例提高時，長期可能部分轉嫁為起薪漲幅放緩或轉向約聘外包。\n3. 商業報價前先評估自家產品彈性，再決定原料上漲時能轉嫁多少給終端售價。", "lv3": "稅負歸宿（Tax Incidence）定理證明：法定納稅義務人歸屬與最終經濟負擔無關，買賣雙方承擔比例嚴格反比於各自彈性：買方負擔份額 = E_s / (E_s + |E_d|)。彈性越小之一方承擔越大稅負，且課稅必然在兩者之間產生無謂損失（哈伯格三角形）。"}, "myNotes": "稅金不是寫在誰頭上就誰出錢，而是「誰比較離不開這場交易，誰扛最大頭」！", "relatedIds": ["econ-s1-3", "econ-s3-4"], "updatedAt": "2026-11-24"},
