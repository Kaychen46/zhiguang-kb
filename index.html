        {"id": "comm-s2-4", "categoryId": "cat-comm", "stageId": "s2", "subtopic": "社群寫作", "title": "社群短文與自媒體寫作：觀點提煉與行動呼籲（CTA）", "oneLiner": "在滑動速度以 0.5 秒計算的社群裡，好短文只講透「一個銳利觀點 + 一個具體畫面」，最後給讀者一個輕鬆留言的出口。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "寫 FB、IG 或 Threads 短文最容易犯的錯，就是想在 400 字裡把十個道理全部講完，結果大家看完腦袋一片空白。\n\n高互動短文的黃金結構（300–500 字）：\n• **第 1 行（停滑鉤子）**：一句讓人停下大拇指的反差或感官細節（例如「這碗拉麵的湯頭第一口就讓我放下手機！」）。\n• **中段（1 個真實體驗 + 1 個可帶走的觀點）**：具體細節讓人有臨場感。\n• **結尾（低門檻互動 CTA）**：問一個好回答的小問題（例如「你心目中第一名是哪一家？」）並附上清楚導流連結。", "lv2": "建立多風格短文產出與測試習慣：\n\n1. **依受眾微調語氣溫度**：專業乾貨版（理性精簡）、親切分享版（生活口語）、創意吸睛版（幽默誇張反差）。\n2. **善用關鍵字與自然標籤**：把讀者會搜尋的店名、領域關鍵字自然融入前兩句，兼顧社群與搜尋曝光。\n3. 視覺留白與克制使用表情符號（3–5 個點綴即可，過多顯雜亂）。", "lv3": "注意力經濟下，社群短文遵循「鉤子留存（Hook Rate）→ 情感／資訊價值交付 → 互動訊號觸發演算法擴散（Comment / Save / Share Weighting）」，其中「收藏率（實用度）」與「轉發率（社交貨幣）」為現代社群推薦權重最高指標。"}, "myNotes": "一篇短文只打透「1 個核心畫面 + 1 個記憶點」，結尾給輕鬆好答的互動提問！", "relatedIds": ["mkt-s2-3", "mkt-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s3-1", "categoryId": "cat-comm", "stageId": "s3", "subtopic": "說服經典", "title": "說服力三角（亞里斯多德）：信譽、情感與邏輯配比", "oneLiner": "光靠冰冷數據（邏輯）很難讓人立刻行動，還需要讓他「信得過你（信譽）」且「心裡有共鳴（情感）」——三腳缺一不可。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "兩千三百年前亞里斯多德就把「怎麼讓人聽進去並點頭」拆成一張穩固的 **三腳凳**：\n\n1. **Ethos（信譽與人品）**：「你憑什麼講這個？」——你的真實經驗、客觀誠實、承認方案也有缺點，都會瞬間拉高信譽。\n2. **Pathos（情感與共鳴）**：「這跟我有什麼關係？」——用真實故事、痛點畫面與願景打動人心。\n3. **Logos（邏輯與證據）**：「你的推論站得住腳嗎？」——用清楚數據、案例與因果推演讓對方的理性點頭。\n\n理工與分析背景的人常把 95% 力氣全壓在 Logos，忘了先建立信譽與共鳴，才會覺得「我明明數據全對，為什麼大家不買單？」", "lv2": "依不同聽眾調整說服三角配比：\n\n1. **面對陌生客戶／群眾**：先立信譽（真實案例）→ 再喚共鳴（痛點故事）→ 最後給數據背書。\n2. **面對技術主管／財務長**：邏輯與數據（Logos）佔 60%，信譽（誠實揭露風險）佔 30%，情感（願景價值）佔 10%。\n3. **先承認小缺點（雙面論證）**：主動說「這方案唯一限制是初期要花兩週導入」，可信度瞬間飆升！", "lv3": "亞里斯多德《修辭學》奠定西方說服理論基石；現代說服心理學「推敲可能性模型（ELM, Petty & Cacioppo）」進一步揭示：當聽眾投入度高時走中央路徑（高度依賴 Logos），投入度低或時間緊迫時走周邊路徑（高度依賴 Ethos 權威線索與 Pathos 情感共鳴）。"}, "myNotes": "數據全對卻沒人買單？檢查是不是只放了 Logos，忘了先補上 Ethos（信任）跟 Pathos（共鳴）！", "relatedIds": ["mkt-s3-2", "comm-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "comm-s3-2", "categoryId": "cat-comm", "stageId": "s3", "subtopic": "故事敘事", "title": "英雄旅程與案例敘事：用真實故事包裝抽象理論", "oneLiner": "大腦記枯燥數據 20 分鐘就忘，但把同樣的數據包進「主角遇難 → 轉折突破 → 獲得改變」的故事裡，記憶留存率飆升數倍。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "從《星際大戰》、《哈利波特》到皮克斯動畫，全部都藏著同一套 **英雄旅程** 骨架：\n原本平凡的生活 → 突然出現大挑戰 → 遇見導師拿到新工具 → 歷經低谷與轉折 → 突破難關帶著寶藏回歸！\n\n在商業簡報與教學裡，記住一個超重要的大秘密：**「主角永遠是你的客戶或讀者，你（或你的產品／方法）只是那個遞上光劍的導師！」** 別一直在台上吹捧自己多厲害，多講主角怎麼靠這套方法從卡關走向翻盤！", "lv2": "商業簡報 1 分鐘案例故事萬用公式（皮克斯結構簡化版）：\n\n1. 以前，【主角／客戶】每天都被【具體痛點】困擾。\n2. 直到有一天，發生了【關鍵轉折／危機】。\n3. 後來他嘗試了【新方法／你的解法】。\n4. 結果，他在【具體時間內】達成了【可量化成果與感受改變】。", "lv3": "Joseph Campbell《千面英雄》（1949）歸納跨文化神話單一神話結構（Monomyth），Donald Miller《StoryBrand》將其轉譯為商業敘事框架；神經經濟學家 Paul Zak 實驗證實，具張力與轉折的角色故事能促使聽眾大腦分泌皮質醇（專注）與催產素（同理與信任），顯著提升行動意願。"}, "myNotes": "說商業故事永遠把「客戶／聽眾」當英雄主角，自己當遞上光劍的導師！", "relatedIds": ["comm-s3-1", "speak-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s3-3", "categoryId": "cat-comm", "stageId": "s3", "subtopic": "簡報演說", "title": "高階簡報演說技巧：開場破冰、節奏停頓與 Q&A 拆彈", "oneLiner": "投影片不是你的提詞機，而是你身後的電影布幕；真正決定簡報成敗的，往往是最後那 10 分鐘的 Q&A 現場應變。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "最毀掉一場簡報的做法，就是把 500 字講稿貼在投影片上，然後背對大家一字一句唸完！\n\n高階簡報的三大黃金法則：\n1. **投影片極簡、口說補細節**：一頁只放 1 個大結論 + 1 張關鍵圖表或 3 個短關鍵字。\n2. **進度路標**：每切到新章節口頭報一下位子（「剛剛看完了問題，接下來這 5 分鐘我們看解法」），讓走神的人隨時能跟上。\n3. **Q&A 拆彈**：提前猜出聽眾最可能刁難你的 5 個尖銳問題，做好「附錄備用頁（Appendix Slides）」藏在簡報最後面，對方一問立刻切過去秀數據，全場瞬間肅然起敬！", "lv2": "簡報前中後的實戰準備清單：\n\n1. **3-2-1 結構**：開頭 1 分鐘講清這場簡報的終極目標；主體不超過 3 大核心主張；結尾留 1 頁清楚行動清單。\n2. **Q&A 四步接招**：先複述確認問題（確保沒答非所問且讓全場聽到）→ 直接給核心結論 → 補 1 個證據 → 確認「這樣有回答到您的問題嗎？」。\n3. 嚴格控時：寧可提早 2 分鐘漂亮收尾，絕不超時狂趕投影片。", "lv3": "整合多媒體學習認知理論（Richard Mayer）：人類視覺與聽覺通道各自有限，當投影片塞滿大段文字又同時口語朗讀時，會觸發「冗餘效應（Redundancy Effect）」導致雙通道過載干擾；「極簡視覺圖像 ＋ 結構化口說」方能發揮雙編碼最大吸收率。"}, "myNotes": "把最怕被問的 5 個刁鑽問題做成「附錄備用頁」藏在最後，一被問就切出來秀數據超帥！", "relatedIds": ["speak-s3-2", "speak-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s3-4", "categoryId": "cat-comm", "stageId": "s3", "subtopic": "向上管理", "title": "跨部門向上管理：如何回報壞消息與爭取資源", "oneLiner": "向上管理不是拍馬屁，而是「幫老闆減少意外驚嚇、用他的語言呈現風險與選擇題，讓他能輕鬆拍板幫你掃平障礙」。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "老闆最怕的不是員工犯錯，而是「出大事前一天你才突然跟他說：老闆完蛋了！」\n\n高段位回報壞消息的四步公式：\n1. **及早預警（No Surprises）**：苗頭不對立刻回報，不藏到火燒眉毛。\n2. **客觀說清現況與影響範圍**（不推卸、不情緒化）。\n3. **附上 2 個補救選項與你的推薦**（例如 A 方案加人趕工、B 方案先交核心功能延後次要功能）。\n4. **明確說明需要老闆協助什麼**（簽核資源或協調跨部門）。", "lv2": "跨部門爭取資源與合作的必勝心法：\n\n1. **翻譯成對方的 KPI**：找別部門幫忙時，別只說「這對我很重要」，改說「這件事完成後能幫你們部門省下多少重複作業／拉高哪個指標」。\n2. **摸清主管的溝通偏好**：他是「閱讀型（愛先看簡短摘要再聊）」還是「傾聽型（愛直接口頭討論）」？對頻溝通省力一半。\n3. 定期主動同步進度（「紅黃綠燈狀態」），建立極高可靠度信任帳戶。", "lv3": "彼得・杜拉克《卓有成效的管理者》強調「管理上司（Managing Up）」是專業工作者的核心職責：本質在於對齊組織目標、主動管理預期（Expectation Management）並將資訊不對稱轉化為高信任度的雙向協作關係。"}, "myNotes": "回報壞消息四件套：早報 + 說影響 + 附兩選項 + 提推薦解法，老闆反而更信任你！", "relatedIds": ["speak-s3-4", "soc-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "comm-s4-1", "categoryId": "cat-comm", "stageId": "s4", "subtopic": "提問藝術", "title": "高階提問術：開放式探索、蘇格拉底追問與精準澄清", "oneLiner": "問對一個好問題，常常比直接給十個建議更有威力——好問題能幫對方自己看見盲點，還把思考主導權牢牢握在你手上。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "溝通高手有個超反直覺的秘密：他們講的話通常比對方少，但每問一個問題都直擊要害！\n\n四種讓你功力大增的好問題：\n1. **把「為什麼（Why）」改成「是什麼／怎麼做（What / How）」**：問「你為什麼沒做好？」像在審犯人；問「是什麼原因卡住了這一步？我們可以怎麼調整？」對方立刻願意說真話。\n2. **具體化追問**：「你說想要更流暢，能舉一個你最喜歡的參考例子嗎？」\n3. **探索底層目標**：「如果這個案子半年後大成功，你希望看到什麼具體畫面？」\n4. **逆向假設提問**：「這件事最有可能在哪裡出意外？」", "lv2": "你的專屬「五問釐清工作流」實戰模板：\n\n接到模糊需求或新任務先問清楚五維度：**1. 目標與對象** → **2. 核心範圍與邊界** → **3. 關鍵約束（時間／預算／工具）** → **4. 驗收標準** → **5. 偏好風格與現有素材**，一次對齊徹底避免做到一半大返工！", "lv3": "蘇格拉底詰問法（Socratic Questioning）透過六類提問（澄清概念、檢視假設、查核證據、切換視角、推演後果、反思問題本身）層層剝開表層意見；結合銷售領域 SPIN 提問法（背景 → 難點 → 暗示後果 → 價值確認），為高階顧問與教練對話核心工具。"}, "myNotes": "把「為什麼」換成「是什麼／怎麼做」，搭配你的五問釐清法，能省下無數返工！", "relatedIds": ["phil-s1-3", "comm-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "comm-s4-2", "categoryId": "cat-comm", "stageId": "s4", "subtopic": "深度傾聽", "title": "深度傾聽與覆述確認：聽懂言外之意的實戰練習", "oneLiner": "大部分人聽別人講話時其實只是在「等自己插嘴的空檔」；真正聽進心坎裡的秘密是「用自己的話覆述一次，直到對方點頭說沒錯！」", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "你有沒有跟人聊完天卻覺得「我講了半天你根本沒聽懂」？\n\n心理學把傾聽分成五個層次，多數人停在「邊聽邊想等等怎麼反駁」的第 3 層；最高段的 **同理心傾聽** 只要加一個超簡單動作——**覆述確認（Paraphrasing）**：\n「讓我確認一下我有沒有聽懂你的意思：你擔心時程太趕會犧牲品質，所以希望先縮減第一版範圍，對嗎？」\n\n當對方眼睛一亮說出「**對！我就是這個意思！**」那一秒，你們之間的信任度直接飆到滿格！", "lv2": "練成深度傾聽高手的四個刻意練習：\n\n1. **停下「急著給建議」的衝動**：先聽完 100%，再問「你需要我幫你一起想解法嗎？」。\n2. **聽三層資訊**：字面事實（說了什麼）+ 背後情緒（語氣焦慮還是興奮）+ 隱藏需求（沒說出口的期待）。\n3. **身體與眼神給回饋**：收起手機、適度點頭與簡短回應，讓對方感到完全被接住。", "lv3": "人本心理學大師 Carl Rogers 提出「主動傾聽（Active Listening）」與無條件正向關懷，為一切諮商與高階教練關係基石；Chris Voss 進一步指出讓對方說出「你說得沒錯（That's right!）」遠比敷衍的「好啦你對（You're right）」更具談判突破力。"}, "myNotes": "追求讓對方眼睛一亮說出「對！我就是這個意思！」，這比搶著給建議有力量十倍。", "relatedIds": ["speak-s4-1", "comm-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "comm-s4-3", "categoryId": "cat-comm", "stageId": "s4", "subtopic": "關鍵對話", "title": "關鍵對話與衝突化解：在高情緒壓力下守住安全感", "oneLiner": "當利益重大、意見對立又情緒高漲時，人們會本能「沉默冷戰」或「暴力開罵」；破局關鍵是先把「共同目標」放回桌中間重建安全感。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "遇到最難開口的對話（談分紅、給團隊尖銳回饋、跟伴侶談大錢），人一感覺不安全就會自動變成兩種模式：\n• **沉默模式**：裝沒事、冷戰、背後生悶氣。\n• **暴力模式**：大聲指責、翻舊帳、貼標籤。\n\n《關鍵對話》教了一招超神救火句——**對比說明法（先說我『不是』要幹嘛，再說我『是』要幹嘛）**：\n「我**不是**要否定你這週的辛苦付出，我**是**希望我們一起把最後這塊漏洞補齊，讓明天上台更穩！」——一句話立刻重建安全感！", "lv2": "處理困難對話的 STATE 五步落地流程：\n\n1. **S（分享客觀事實）**：從無爭議的具體觀察開始（不從指控開始）。\n2. **T（說出你的推論與擔心）**：用「我擔心這會影響…」取代「你就是不負責任」。\n3. **A（邀請對方說他的角度）**：「我想聽聽看你那邊是不是遇到了什麼困難？」\n4. **T（溫和陳述，留討論空間）**。\n5. **E（鼓勵探索共同目標）**：拉回「我們都希望這件事成功」。", "lv3": "Kerry Patterson 等《Crucial Conversations》指出，高張力對話崩盤的主因從來不是「內容本身」，而是「安全感破裂（相互目的或相互尊重受威脅）」；唯有暫停內容爭辯、先以對比說明修復共同目的（Mutual Purpose），資訊才能重新流入「共享觀點池（Pool of Shared Meaning）」。"}, "myNotes": "關鍵對話神句：「我不是要＿＿（解除誤會），我是希望＿＿（重建共同目標）」！", "relatedIds": ["psy-dissonance", "speak-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "comm-s4-4", "categoryId": "cat-comm", "stageId": "s4", "subtopic": "寫作思維", "title": "寫作即思考：透過公開輸出與費曼筆記倒逼認知升級", "oneLiner": "你以為「想清楚了才寫得出來」，其實真相完全相反——「動筆寫下來」本身就是把腦中一團漿糊逼成清晰邏輯的唯一方式。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "你有沒有過這種體驗：腦子裡覺得自己有個超棒的絕妙點子，結果一坐下來要寫成 300 字說明，寫到第三行突然卡死發現「欸，中間邏輯好像兜不起來！」\n\n矽谷創投教父 Paul Graham 說過：**「寫作不只是把想法印出來的印表機，寫作本身就是思考！」** 當你只用想的，大腦會偷偷跳過邏輯漏洞；一旦逼自己寫出來甚至公開分享，每個模糊的地方都會無所遁形！", "lv2": "建立「輸入 → 寫作思考 → 複利資產」個人飛輪：\n\n1. **最低門檻日常輸出**：讀完一張知識卡就在「我的筆記」寫下 3 句自己的消化心得。\n2. **用文章倒逼深度研究**：想徹底搞懂某個主題，最快方式就是答應自己「這週寫出一篇讓高中生看懂的短指南」。\n3. **把寫作當長期資產**：發出去的好內容會在你睡覺時持續替你連結同頻夥伴與機會。", "lv3": "寫作作為「延伸心智（Extended Mind, Andy Clark & David Chalmers）」的外置運算空間，突破了人腦 4 格工作記憶限制，使多層複雜論證能被視覺外化、檢視、重組與遞迴迭代，為知識工作者最高槓桿的認知鍛鍊工具。"}, "myNotes": "不要等想清楚才寫——動筆寫下去，邏輯才會真正變清楚！", "relatedIds": ["cross-s4-2", "cross-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "lang-s1-1", "categoryId": "cat-lang", "stageId": "s1", "subtopic": "習得原理", "title": "克拉申可理解輸入（i+1）假說與大量沉浸策略", "oneLiner": "學外語別硬啃每頁查 50 個單字的艱深天書，選「原本懂 80%、只有 20% 新詞（i+1）」且你超愛看的題材大量看，大腦會自然習得。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "為什麼很多台灣學生背了十年文法跟單字表還是不敢開口，但有人瘋狂追美劇、打英文遊戲兩年卻自然聽懂八成？\n\n語言學大師克拉申揭開了秘密——**可理解輸入（i + 1）**：\n• `i` 是你現在的程度，`+1` 是「只比你現在難一點點」。\n• 如果看完全聽不懂的純新聞（i + 10），大腦覺得像在聽白噪音直接關機。\n• 如果看懂 80%、靠前後文跟畫面就能猜出剩下 20% 的美劇、YouTube 料理頻道或分級讀物（i + 1），你越看越有成就感，大腦會在無壓力狀態下自動內化語感！", "lv2": "打造個人「i+1 沉浸環境」的四步實作：\n\n1. **用興趣選材取代教科書**：你愛美食、科技、金融還是動漫？直接把那些領域的 YouTube 與 Podcast 換成目標語言！\n2. **黃金門檻測試**：一頁文章或一分鐘影片，不用查字典能看懂 75%–85% 就是最完美的材料。\n3. **降低情感濾網（焦慮感）**：越怕講錯越學不會，在安全放鬆環境下大量聽讀吸收最快。", "lv3": "Stephen Krashen（1982）二語習得五大假說（習得 vs 學習假說、監控假說、輸入假說 i+1、自然順序假說、情感過濾假說）強調「潛意識自然習得（Acquisition）」才是流利口說的真正來源，有意識背文法規則僅能作為事後檢查校對工具。"}, "myNotes": "選自己真心愛看且「看得懂 80%（i+1）」的影片與文章，比硬背單字書爽又有效十倍！", "relatedIds": ["lang-s1-2", "cross-ultralearning"], "updatedAt": "2026-11-24"},
        {"id": "lang-s1-2", "categoryId": "cat-lang", "stageId": "s1", "subtopic": "記憶策略", "title": "間隔重複（SRS）與語塊（Chunks）記憶法取代單字表", "oneLiner": "不要孤零零背「make = 製作、decision = 決定」，直接整串記成「make a decision（語塊）」，再交給 Anki 間隔重複軟體算準快忘前複習。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "以前從 A 背到 Z 背單字書，每次都卡在 `abandon` 就放棄了——因為孤零零背一個字，講話時你根本不知道它要配哪個動詞、怎麼放進句子裡！\n\n兩招徹底翻轉背單字痛苦：\n1. **記「語塊（Chunks／搭配詞）」**：像樂高積木一樣整塊背，例如直接背 `It makes sense（這說得通）`、`take it for granted（視為理所當然）`，開口一秒直接整句吐出來，完全不用在腦中拼文法！\n2. **間隔重複軟體（SRS，如 Anki）**：系統自動幫你算遺忘曲線，快忘掉的那天才跳出來考你一次，記住的字越隔越久，省下 70% 複習時間！", "lv2": "建立高效率個人語塊庫的實務習慣：\n\n1. **只收「真實遇到且想用」的句子**：看劇或讀文章看到一句超帥的表達，整句剪進筆記或 Anki（正面挖空語塊 + 例句，背面中文意思）。\n2. 優先掌握 **最高頻 2,000–3,000 字與核心搭配詞**：它們已經覆蓋日常對話與文章高達 85%–90% 的內容！", "lv3": "詞彙法（Lexical Approach, Michael Lewis）與語料庫語言學指出，母語者流利輸出高度依賴大腦中預先封裝的數萬組「公式化序列（Formulaic Sequences / Collocations）」，而非即時從零套用語法規則組字；結合 FSRS 演算法間隔複習能將長期記憶留存率穩定鎖在 90% 以上。"}, "myNotes": "別再背孤兒單字！整塊記「實用短句語塊」+ 間隔複習，開口流暢度直接跳級！", "relatedIds": ["psy-s1-3", "lang-s1-1"], "updatedAt": "2026-11-24"},
        {"id": "lang-s1-3", "categoryId": "cat-lang", "stageId": "s1", "subtopic": "聽力發音", "title": "聽力與發音解碼：連音、弱讀與影子跟讀法（Shadowing）", "oneLiner": "英文聽不懂往往不是單字不認識，而是老外講話會把字黏在一起省略唸（連音弱讀）；每天 10 分鐘「影子跟讀」，聽力口說同時開竅。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "看字幕覺得每個字小學都學過，關掉字幕卻一句都聽不懂？因為課本唸的是「What are you going to do?」，老外真實講話唸的是「Whaddaya gonna do?」！\n\n只要懂了三個發音小秘密（**連音、弱讀、省音**），耳朵瞬間像通了電一樣全聽懂！\n\n最強訓練法叫 **影子跟讀法（Shadowing）**：戴上耳機聽一段 1 分鐘母語音檔，像影子一樣慢半秒「同步模仿他的語氣、重音與節奏跟著唸出來」——不用背文法，舌頭肌肉跟耳朵會直接記住真正的節奏！", "lv2": "每天 10 分鐘影子跟讀四步驟：\n\n1. 挑一段 1–2 分鐘你喜歡的母語音檔（TED／Podcast／劇集片段），先盲聽一遍抓大意。\n2. 打開原文對照，把沒聽出來的「連音與弱讀處」畫線標出來。\n3. 跟著音檔看稿同步朗讀 3 遍（重點模仿「語調起伏」而不是一個字一個字死唸）。\n4. 最後關掉稿子純跟讀 2 遍，一週就能明顯感覺耳朵變敏銳！", "lv3": "語音學稱此現象為「連貫語音變化（Connected Speech Phenomena：Catenation 連音、Elision 省音、Assimilation 同化與 Schwa /ə/ 中央弱化元音）」。影子跟讀（Alexander Arguelles 推廣）透過聽覺—發音運動皮層即時迴路同步訓練語韻（Prosody）與語音解碼速度。"}, "myNotes": "關字幕聽不懂不是單字量不夠，是沒熟悉連音弱讀——每天跟讀 1 分鐘母語音檔超有效！", "relatedIds": ["lang-s1-1", "lang-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "lang-s1-4", "categoryId": "cat-lang", "stageId": "s1", "subtopic": "口說突破", "title": "輸出倒逼輸入：用低焦慮自我對話與 AI 語伴突破啞巴外語", "oneLiner": "等文法 100% 完美才開口的人永遠開不了口；在零尷尬的「自言自語」與「AI 語音陪練」裡每天講 5 分鐘，三週就敢對真人開口。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "台灣學生不敢講外語的最大心魔就是「怕文法講錯被笑」！其實母語者根本不在乎你漏掉一個 `s` 或用錯時態，只要聽得懂意思就能開心聊下去。\n\n兩招完全零尷尬、免花大錢請家教的開口神器：\n1. **日常自言自語法**：洗澡或散步時，試著用英文小聲描述「我今天吃了什麼、等一下要做什麼」——講到卡住不會講的那個詞，立刻查一下，那一個詞你保證記一輩子！\n2. **AI 語伴情境演練**：直接請 AI 扮演咖啡店員、面試官或國外客戶跟你對話，並請它每次回覆完順手幫你把剛才的句子改得更道地！", "lv2": "AI 語伴高效練習的標準提示詞架構：\n\n1. 設定具體場景（「請扮演國外科技公司 PM，我們正在開 5 分鐘進度同步會」）。\n2. 每次只回 2–3 句保持自然對話節奏。\n3. 要求最後附上一行「更道地的母語者說法建議」，把改好的句子存進你的語塊庫！\n4. 善用「換句話說（Paraphrasing）」技巧：忘記某個難字就用簡單字繞過去解釋，絕不冷場卡死。", "lv3": "Merrill Swain（1985）提出「可理解輸出假說（Comprehensible Output Hypothesis）」補強克拉申理論：唯有當學習者被迫進行實際輸出時，才會觸發「注意功能（Noticing Gap）」精準暴露表達缺口並推動深層句法內化。"}, "myNotes": "自言自語卡住查到的那 1 個詞，記憶深度勝過背 100 個冷冰冰單字！", "relatedIds": ["lang-s1-3", "lang-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "lang-s2-1", "categoryId": "cat-lang", "stageId": "s2", "subtopic": "商務書信", "title": "英文商務書信禮儀：委婉語氣（Softening）與清晰行動項", "oneLiner": "中式直譯英文常聽起來太命令沒禮貌；學會加上幾個簡單的「柔化緩衝詞（Softeners）」，就能同時保持專業效率又顯得優雅得體。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "很多台灣人寫英文信不小心得罪外國同事，完全不是故意的，只是因為「太直譯」：\n• 聽起來像命令：*\"Send me the file today.\"* / *\"You made a mistake here.\"*\n• 加上 **柔化語氣** 瞬間變超優雅：*\"Could you please share the file by EOD today?\"* / *\"It looks like there might be a small discrepancy here—could we double-check?\"*\n\n多加 `Could you...`、`Would you mind...`、`It seems that...` 幾個字，對方收信心情完全不一樣！", "lv2": "專業英文 Email 的四大萬用句型模塊：\n\n1. **開頭破題**：`I hope this email finds you well. I'm writing to follow up on...`（熟人直接 `Hope you're having a great week!`）。\n2. **清楚催進度（不顯咄咄逼人）**：`Just a gentle reminder regarding...` / `Could you let me know if there's any update on...?`。\n3. **附檔提醒**：`Please find attached...` 或更現代自然 `I've attached... for your review.`。\n4. **收尾行動呼籲**：`Please let me know your thoughts by Thursday.`。", "lv3": "語用學（Pragmatics）與禮貌理論（Brown & Levinson Politeness Theory）指出，請求、催促與指正皆屬「面子威脅行為（Face-Threatening Acts, FTAs）」，英語商務文化透過情態動詞（Could / Would）、過去式距離化（I was wondering if...）與去人稱化（There seems to be...）降低壓迫感同時維持低語境清晰度。"}, "myNotes": "英文催進度與指正錯誤多用「Could we double-check...」與「It looks like...」，禮貌又俐落！", "relatedIds": ["lang-context", "comm-s2-1"], "updatedAt": "2026-11-24"},
        {"id": "lang-s2-2", "categoryId": "cat-lang", "stageId": "s2", "subtopic": "跨國會議", "title": "跨國線上會議高頻句型：插話、確認共識與總結推進", "oneLiner": "跨國視訊會議講得飛快完全插不上話？背熟 6 句「自然切入、沒聽清重問、收斂共識」的萬用功能句，瞬間展現國際專業存在感。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "開全英文線上會議時，亞洲人最常吃虧的就是「乖乖等別人完全講完才舉手」，結果等一小時完全沒輪到自己！\n\n背下這幾句超實用的「會議功能卡」：\n• **禮貌切入發言**：`Sorry to jump in, may I add a quick point here?`\n• **沒聽懂／網路卡頓**：`Sorry, you broke up for a second—could you repeat the last part?`\n• **確認共識**：`Just to make sure we're on the same page, we're going with Option A, right?`\n• **拉回時間**：`In the interest of time, let's take this offline and move to the next item.`", "lv2": "在跨國會議刷出高專業度的三個小技巧：\n\n1. **前 10 分鐘先開口一次**：哪怕只是簡短肯定或確認一個細節，打破沉默後整場發言都會順很多。\n2. **善用聊天室文字輔助**：複雜數字、專有名詞或行動結論順手打在會議 Chat 裡，消除口音誤解。\n3. **學會主動做 30 秒收尾總結**：最後一句說 `To wrap up, here are our next steps...`，存在感與領導力直接拉滿！", "lv3": "跨國職場溝通研究顯示，英語作為通用語（ELF, English as a Lingua Franca）環境中，溝通效能取決於「話輪轉換管理（Turn-Taking Signals）」與「意義協商能力（Negotiation of Meaning）」，而非追求完美英美原生口音。"}, "myNotes": "開英文視訊會前 10 分鐘先開口一次，善用 `Just to make sure we're on the same page...` 確認共識！", "relatedIds": ["lang-s2-1", "lang-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "lang-s2-3", "categoryId": "cat-lang", "stageId": "s2", "subtopic": "外語簡報", "title": "專業簡報與跨文化說故事：從數據過渡到結論的銜接語", "oneLiner": "英文簡報最怕每一頁只會說「Next slide please...」；學會一套清楚的「路標銜接語（Signposting）」，就算單字簡單也能講出 TED 級流暢感。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "聽外語簡報對外國聽眾來說本來就比較耗腦力，所以你就像導遊一樣，要不斷用簡單的 **路標句** 告訴大家現在走到哪裡了：\n\n• **開場給地圖**：`Today I'll walk you through three key points: first..., second..., and finally...`\n• **換頁過渡**：`Now that we've looked at the problem, let's turn to our solution.`\n• **點出圖表重點**：`If you look at the orange bar here, you'll notice a 20% jump in Q3.`\n• **收尾強調**：`If there's one thing I'd like you to remember today, it's this...`", "lv2": "非母語者做專業外語簡報的致勝策略：\n\n1. **短句為王**：把複雜從句拆成兩個乾淨短句，語速放慢 15%，清晰度遠勝飆快車。\n2. **把重點寫在圖表標題上**：讓視覺幫你的口語分擔 50% 負擔。\n3. **預備 3 句優雅 Q&A 句型**：`That's a great question.` / `Let me make sure I got that right...` / `I'll check the exact figure and follow up by email.`。", "lv3": "應用語言學稱結構提示詞為「後設話語標記（Metadiscourse Signposting）」，能有效在跨語境與非母語簡報情境下建立清晰認知路標，顯著提升聽眾資訊提取準確度與對講者專業威信的評價。"}, "myNotes": "外語簡報用短句 + 路標銜接語（Signposting），比背華麗長難字專業十倍！", "relatedIds": ["comm-s3-3", "lang-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "lang-s2-4", "categoryId": "cat-lang", "stageId": "s2", "subtopic": "AI 輔助外語", "title": "AI 時代的高效外語潤稿與雙語對照精讀流程", "oneLiner": "別只把整段文字丟給 AI 翻譯完複製貼上（那樣你永遠沒進步）；多加一句「請對照列出改了哪裡、為什麼這樣更道地」，每次寫信都在免費上私教課。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "以前寫英文信或讀英文論文要花兩小時查字典，現在 AI 三秒就翻完——但小心「只複製貼上」會讓你外語完全退化！\n\n聰明用法只要多加 30 秒：\n1. **先自己寫出破英文初稿**（哪怕文法歪七扭八也沒關係）。\n2. 丟給 AI 說：「請幫我潤飾成自然專業的商務英文，並用表格列出 **『我的原句 vs 潤飾版 vs 為什麼這樣改更道地』**。」\n3. 挑出最驚艷的 1–2 個用法存進自己的筆記——寫十封信，你的英文水準就會肉眼可見地暴漲！", "lv2": "AI 雙語精讀與寫作提效的三個神級指令：\n\n1. **調語氣開關**：「請給我三個版本：A. 正式客戶版 / B. 親切同事版 / C. 極簡 Slack 訊息版」。\n2. **拆解長難句**：「請把這段英文論文用高中生能懂的中文講核心意思，並列出 3 個最值得學的英文語塊」。\n3. **中式英文除錯**：「請抓出這段話裡聽起來太生硬或中式直譯的地方並修正」。", "lv3": "結合「反饋導向刻意練習（Feedback-Driven Deliberate Practice）」與生成式 AI 的即時個人化支架（Scaffolding）：「先自主輸出暴露盲點 → 再獲取對照式診斷回饋 → 最後提取語塊複習」，將單純代工工具轉化為高密度語言習得加速器。"}, "myNotes": "先寫破初稿，再請 AI 列出「原句 vs 道地版 vs 原因」——每次用 AI 都在免費上外師課！", "relatedIds": ["lang-s1-4", "it-ai-workflow"], "updatedAt": "2026-11-24"},
        {"id": "lang-s3-1", "categoryId": "cat-lang", "stageId": "s3", "subtopic": "文化地圖", "title": "霍夫斯泰德文化維度與艾琳・梅耶文化地圖（Culture Map）", "oneLiner": "跨國合作踩雷通常不是對方人品差，而是兩邊拿著完全不同的「隱形文化尺規」——攤開文化地圖八維度，瞬間看懂所有文化衝擊。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "跟美國、德國、日本同事一起開會，你常覺得「美國人好愛誇獎卻又聽不出真心」「德國人講話怎麼直白到像吵架」「日本人點頭說はい怎麼最後還是沒答應」？\n\nINSEAD 教授艾琳・梅耶畫了一張超實用的 **《文化地圖》八把尺**（溝通明暗、批評直婉、說服先理後例、權力距離、決策共識、信任來源、異議風格、時間觀念）。最關鍵的洞見是：**文化差異永遠是「相對的」**——美國人覺得法國人講話太衝，但德國人可能覺得法國人還算客氣！", "lv2": "跨國合作前 5 分鐘的文化地圖避雷檢查：\n\n1. **說服順序（原理派 vs 實例派）**：法德義等歐陸文化常愛「先講理論框架再舉例」，英美文化愛「先丟實際案例與結論再講原理」。\n2. **權力距離（平等 vs 層級）**：跟北歐荷蘭合作可以直接叫總經理名字並當場提出異議；跟日韓傳統企業合作則須高度尊重職稱順序與會前私下溝通。", "lv3": "Geert Hofstede 提出經典文化六維度（權力距離、個人／集體主義、不確定性規避、陽剛／陰柔、長期導向、放縱／克制）；Erin Meyer《The Culture Map》（2014）進一步將其操作化為商業八軸量表，揭示多國團隊衝突多半源於「未明說的互動規則錯位」。"}, "myNotes": "文化差異是「相對座標」，合作前先對照文化地圖八維度就能省去 80% 無謂誤會！", "relatedIds": ["lang-context", "lang-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "lang-s3-2", "categoryId": "cat-lang", "stageId": "s3", "subtopic": "回饋文化", "title": "不同文化的回饋方式：直接批評 vs 委婉暗示的誤解拆解", "oneLiner": "荷蘭主管說「這報告完全不行」只是就事論事幫你改好；美國主管說「超棒喔，只有一個小小地方可以調整」其實已經在拉紅色警報了！", "tags": ["#經典案例", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "跨國職場最容易鬧出心碎誤會的就是「給負面回饋」：\n\n• **直接派（德國、荷蘭、以色列）**：不廢話，缺點直接當面講清楚，完全不代表討厭你，講完下班照樣開心一起喝啤酒！\n• **三明治讚美派（美國）**：開頭先誇三個超棒，中間輕輕塞一句「如果這裡微調一下會更完美」，結尾再誇一次——亞洲或歐洲人常聽完還以為自己考了 100 分！\n• **極度委婉派（日本、泰國、台灣部分職場）**：很少當眾說「你錯了」，會用「我們或許可以再考慮看看另一種做法」暗示你需要大改！", "lv2": "給跨國夥伴回饋與接收回饋的解碼技巧：\n\n1. **收到直接派批評**：深呼吸提醒自己「這是他們的專業關心方式，對事不對人」，別往心裡去。\n2. **聽懂英美／亞洲委婉派的「軟化詞」**：聽到 `a little bit`、`perhaps we could revisit`、`interesting approach`，立刻警覺這可能是重大修改訊號，主動追問「具體哪個部分需要調整？」\n3. 給跨文化夥伴回饋時，事前講明：「接下來我會直接針對文件細節給建議，目的是幫我們一起把提案做到最好。」", "lv3": "Erin Meyer 區分「升級詞（Upgraders，如 totally / completely，常見於德荷直接回饋）」與「降級詞（Downgraders，如 sort of / a bit / slightly，常見於英美與東亞委婉回饋）」，指出在多元團隊中明確「點破回饋規則（Explicit Meta-Communication）」是化解跨文化摩擦的最佳實踐。"}, "myNotes": "英美與日台聽「軟化降級詞」要警覺；德荷聽「直接升級詞」別走心，只是就事論事！", "relatedIds": ["lang-s3-1", "lang-context"], "updatedAt": "2026-11-24"},
        {"id": "lang-s3-3", "categoryId": "cat-lang", "stageId": "s3", "subtopic": "時間與決策", "title": "時間觀（單向線性 vs 彈性多工）與決策共識節奏差異", "oneLiner": "德國瑞士約 9:00 就是 8:59 坐好（線性時間），南歐拉美則把時間看成彈性流動的河流；日本開會前早就私下跑完共識（根回し），美國則習慣當場拍板。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "跨國排程最常讓雙方抓狂的兩件事：\n\n1. **時間觀不同**：\n   • 線性時間文化（德、瑞、日、美）：時間像火車時刻表，一次做一件事、準時是最高尊重。\n   • 彈性時間文化（拉美、中東、部分南歐／東南亞）：人際關係比時鐘重要，議程可以邊聊邊改，遲到 15 分鐘是日常常態。\n2. **決策節奏不同**：\n   • 日本「根回し（Nemawashi）」：正式開會前早就私下一對一溝通完畢，開會只是走過場；前期慢但拍板後執行飛快！\n   • 美國「由上而下快決策」：會議上先快速拍板試跑，有問題後面再改（所以日本夥伴常嚇到「怎麼說改就改？」）。", "lv2": "跨國專案排程與開會的防踩雷實務：\n\n1. 跟線性時間夥伴合作：絕對準時、提前交件，遲到或臨時改議程會嚴重扣信任分。\n2. 跟彈性時間夥伴合作：把緩衝時間先藏進自己的內部時程裡，並用友善多次提醒確認關鍵里程碑。\n3. 跟日韓共識型團隊推案：務必在正式大會前先發資料並私下拜訪關鍵窗口收集意見。", "lv3": "Edward T. Hall 提出單向時間（Monochronic Time）與多向時間（Polychronic Time）二分法；決策模式則可依「共識決 vs 階層獨斷」與「決策前慢／執行快（D-shaped）vs 決策快／邊做邊改」進行跨國專案風險管理。"}, "myNotes": "日本「前期溝通慢、拍板後執行飛快」，美國「快速拍板、邊跑邊改」——懂節奏就不會互相抓狂！", "relatedIds": ["lang-s3-1", "lang-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "lang-s4-1", "categoryId": "cat-lang", "stageId": "s4", "subtopic": "跨文化談判", "title": "跨文化談判風格：關係導向 vs 契約導向的破冰與簽約", "oneLiner": "在美國先簽好合約再當朋友（任務信任）；在亞洲與拉美則是先一起吃兩頓飯交朋友，確認信得過你這個人才願意簽約（關係信任）。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "兩種完全相反的「建立信任」順序：\n\n• **任務導向（美、德、荷）**：靠「把事做對、準時履約、合約寫清楚」建立信任——第一天見面吃三明治直接談生意完全沒問題，合約簽了就照章辦事。\n• **關係導向（台、日、中、巴西、中東）**：靠「一起吃飯喝酒、聊家庭興趣、確認你這個人靠不靠譜」建立信任——如果第一分鐘就冷冰冰拿合約出來催簽字，對方反而覺得你沒誠意！", "lv2": "跨文化談判桌上的三招切換技巧：\n\n1. **對關係導向客戶**：別嫌前面寒暄吃飯浪費時間，那其實就是「正式談判中最重要的信任鋪陳」，且對合約保留彈性協商空間。\n2. **對任務導向客戶**：拿出乾淨透明的數據、過往成功實績與條理分明的書面合約，就是最高誠意。\n3. 遇到跨國合資時，同時兼顧「私下建立真實人情溫度」＋「白紙黑字清楚合約保障」。", "lv3": "社會心理學區分「認知型信任（Cognitive Trust，基於專業勝任度與制度可靠度）」與「情感型信任（Affective Trust，基於人際共鳴與長期互惠）」，不同法治成熟度與歷史社會結構造就了兩者在商業談判中的權重差異。"}, "myNotes": "美德是「先做事簽約再變朋友（認知信任）」，亞洲拉美是「先交朋友再談簽約（情感信任）」！", "relatedIds": ["biz-s4-2", "lang-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "lang-s4-2", "categoryId": "cat-lang", "stageId": "s4", "subtopic": "文化避坑", "title": "避免文化刻板印象與中式直譯造成的情境尷尬", "oneLiner": "文化地圖是幫你多一分敏感度的「起點」，絕不是用來把所有人都塞進刻板印象盒子的「終點」；每個個體都可能跳脫母國平均值。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "兩個跨文化互動裡最容易不知不覺踩到的坑：\n\n1. **拿平均值貼個人標籤**：雖然統計上日本人偏委婉、美國人偏直接，但你眼前這位在矽谷待過十年的日本工程師可能講話超直白！文化地圖只幫你「多留意可能差異」，真正怎麼相處還是要觀察眼前這個活生生的人。\n2. **中式直譯大尷尬**：中文客套說「你辛苦了」直譯成 `You worked hard` 聽起來像老闆在居高臨下評價下屬，改成 `Thanks so much for your help!` 才自然；「慢慢吃」別直譯 `Eat slowly`，直接說 `Enjoy your meal!`。", "lv2": "避開文化刻板印象與直譯雷區的三個習慣：\n\n1. **用好奇心取代預設評斷**：遇到對方行為讓你困惑時，先想「這是不是文化習慣不同？」，禮貌開口問「你們團隊平常習慣怎麼處理這件事？」\n2. 收集「高頻中式直譯修正表」（如 `I'm fine` 其實常帶點冷淡，熱情說 `I'm good, thanks!`；問名字用 `May I have your name?` 取代 `What's your name?`）。", "lv3": "跨文化能力（Intercultural Competence）高階指標在於區分「文化概化（Cultural Generalization，基於統計分佈的可修正先驗假設）」與「刻板印象（Stereotyping，拒絕根據個體證據更新的僵化標籤）」，並隨時保持文化謙遜（Cultural Humility）。"}, "myNotes": "文化地圖是「起點假設」，眼前這個活生生的人才是「最終答案」！", "relatedIds": ["lang-s3-1", "lang-s2-1"], "updatedAt": "2026-11-24"},
        {"id": "lang-s4-3", "categoryId": "cat-lang", "stageId": "s4", "subtopic": "多語系統", "title": "建立個人多語學習系統：把興趣內容變成日常語言環境", "oneLiner": "把學外語當成「一門要考及格的科目」註定半途而廢；把它變成「獲取你最愛領域第一手情報的工具」，你每天都會忍不住主動學。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "你不需要飛出國花一百萬遊學才能擁有全外語環境——你的手機跟電腦早就就是最棒的免費出國機票！\n\n打造零痛苦日常多語環境的四個開關：\n1. **把你本來就會看的東西換語言**：愛看科技評測、財經分析、美食探店或動漫？每週挑 3 支換成英文／日文頻道看！\n2. **手機／常用軟體介面切外語**：每天滑手機無痛多看幾百次真實生活用語。\n3. **零碎時間配音檔**：通勤、洗碗、散步時戴耳機聽外語 Podcast，把垃圾時間變黃金輸入。\n4. **每週只產出 1 次短輸出**：寫 5 句外語心得或跟 AI 聊 5 分鐘。", "lv2": "四象限均衡語言學習週課表（每天只要 25 分鐘）：\n\n1. 10 分鐘 **興趣輸入（聽／讀 i+1 材料）**。\n2. 5 分鐘 **語塊複習（SRS 卡片）**。\n3. 5 分鐘 **影子跟讀（練耳朵與嘴巴肌肉）**。\n4. 5 分鐘 **微輸出（寫 3 句筆記或 AI 對話）**。\n堅持 90 天，外語就會從「考試科目」蛻變成你的自然生活工具。", "lv3": "Paul Nation「語言學習四股均衡原則（Four Strands）」指出最優語言習得時間應平均分配於：意義導向輸入（25%）、意義導向輸出（25%）、語言焦點學習（25%）與流暢度發展（25%，用已會的簡單材料快速大量聽說讀寫）。"}, "myNotes": "語言不是考試科目，而是拿來讀第一手科技、金融與興趣情報的望遠鏡！", "relatedIds": ["lang-s1-1", "psy-habit"], "updatedAt": "2026-11-24"},
        {"id": "lang-s4-4", "categoryId": "cat-lang", "stageId": "s4", "subtopic": "雙語思維", "title": "雙語思維優勢：透過不同語言框架拓展思考維度", "oneLiner": "每多懂一門語言，就像多裝了一副看世界的新濾鏡；有趣的是，研究發現用第二語言思考困難問題時，人們的決策竟然會更冷靜理性！", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "芝加哥大學心理學家發現一個超酷的現象叫 **外語效應（Foreign Language Effect）**：\n當受試者用「母語」做困難投資選擇或道德兩難題時，很容易被損失恐懼與情緒牽著走；但改用「第二外語」讀題思考時，大家瞬間變得更冷靜、更少掉進認知偏誤陷阱！\n\n為什麼？因為母語綁定了我們從小到大的強烈情緒記憶，而第二語言多了一層微微的心理距離，能幫我們自動啟動「系統二理性慢想」！另外，不同語言獨有的詞彙（例如日文的「侘寂」、德文的「時代精神」）也會幫你看見母語沒切分出來的細膩概念。", "lv2": "善用雙語思維為自己加值的實務做法：\n\n1. **接觸一手資訊紅利**：英文世界佔了全球頂尖科技論文、開源文件與金融研究絕大部分比例，能直接讀一手原文讓你比等中文翻譯的人永遠領先半年到兩年。\n2. **情緒卡關換語言寫日記**：被某件事氣到或焦慮到轉不出來時，試著用英文寫下 3 句現況，情緒張力常會瞬間降溫！", "lv3": "溫和版語言相對論（Sapir-Whorf Hypothesis）指出語言雖不決定思考上限，但顯著影響注意力分配與概念分類習慣；Boaz Keysar（2012, Psychological Science）實證「外語效應」顯著降低了框架效應與損失趨避偏誤，同時雙語者終生在執行控制（Executive Control）與認知彈性上具神經可塑性優勢。"}, "myNotes": "懂英文直接讀一手論文與資料，就是最實在的資訊時間差紅利！", "relatedIds": ["psy-system12", "lang-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "design-s1-1", "categoryId": "cat-design", "stageId": "s1", "subtopic": "排版基石", "title": "設計四大黃金原則（CRAP）：對比、重複、對齊與親密性", "oneLiner": "就算完全沒學過美術，只要守住這四條鐵律，你做的簡報、履歷、筆記與網頁立刻從「學生報告」升級成「設計師作品」。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "設計師 Robin Williams 把所有好看排版的秘密濃縮成四個超好記的詞（**CRAP 原則**）：\n\n1. **對比（Contrast）**：要嘛一樣，要嘛差很多！標題用 32pt 粗體黑、內文用 16pt 細體灰，千萬別用 16pt 配 17pt 這種像手滑調錯的微弱對比。\n2. **重複（Repetition）**：整份簡報或網站重複使用同樣的 2 個主色、同樣圓角與標題樣式，瞬間就有專業品牌感。\n3. **對齊（Alignment）**：畫面上沒有任何東西是「隨便擺上去的」！通通乖乖靠左對齊一條隱形直線，畫面立刻變高級（新手最愛全部置中對齊反而最顯雜亂！）。\n4. **親密性（Proximity）**：相關的東西靠緊一點（標題貼近它的內文），不相關的拉開大留白，大腦一秒就分好組！", "lv2": "交出任何簡報或網頁前的 60 秒 CRAP 快檢：\n\n1. 拿一把隱形尺由上往下掃：所有標題、內文與圖表左邊界有沒有乖乖對齊同一條線？\n2. 標題跟「自己這段內文」的距離，有沒有明顯小於跟「上一段內文」的距離？（親密性最常出錯的地方！）。\n3. 全篇字體種類不超過 **2 種**、強調色不超過 **1–2 種**。", "lv3": "Robin Williams《寫給大家的設計書》（The Non-Designer's Design Book）將格式塔完形原則轉譯為非設計專業可立即執行的四維檢核框架，透過強化視覺分組（Proximity）與前注意對比（Contrast）大幅縮短讀者的視覺掃描路徑（Scan Path）。"}, "myNotes": "光是把「全部置中」改成「統一靠左對齊」+「拉大標題對比」，簡報質感立刻翻倍！", "relatedIds": ["design-s1-2", "design-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s1-2", "categoryId": "cat-design", "stageId": "s1", "subtopic": "留白與層級", "title": "視覺層級與留白藝術：引導讀者視線的隱形軌道", "oneLiner": "留白不是「浪費空間沒填滿」，而是讓主角發光的聚光燈；當頁面上每樣東西都在大喊「看我！」，結果就是沒人知道該看哪裡。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "走進一家平價大賣場 vs 走進一間 Apple 旗艦店，最大的差別是什麼？**留白！** 大賣場把貨架塞滿塞爆，顯得廉價又壓迫；Apple 店裡一張超大木桌上只放兩支手機，高級感瞬間爆棚！\n\n**視覺層級（Visual Hierarchy）**則是替讀者的眼睛排好「第一眼看大標題 → 第二眼看橘色重點按鈕或關鍵數字 → 第三眼才讀細節內文」的順序。記得：如果整頁文字都加粗又畫紅線，等於整頁都沒有重點！", "lv2": "打造清爽高級視覺層級的四個實務技巧：\n\n1. **給畫面 30%–40% 的呼吸留白**：區塊與區塊之間加大間距（Margin），卡片內邊距（Padding）放大一格，高級感立現。\n2. **只留 1 個視覺第一主角**：每一頁簡報或每個網頁畫面，決定一個最重要的數字、圖表或行動按鈕給它最高對比色。\n3. **瞇眼測試法（Squint Test）**：退後一步瞇起眼睛看你的設計，如果連模糊狀態下都能一眼看出「最大塊重點在哪」，層級就過關了！", "lv3": "視覺層級透過大小（Scale）、字重（Weight）、明度對比（Luminance Contrast）與空間隔離（Whitespace / Negative Space）四重訊號編碼資訊優先序；留白分為微留白（行高、字距，影響易讀性）與宏留白（版面邊距、區塊間隔，塑造品牌氣場與節奏）。"}, "myNotes": "做完簡報或網頁用「瞇眼測試法」看一眼：模糊狀態下還看得出第一主角在哪，層級就成功了！", "relatedIds": ["design-s1-1", "design-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "design-s1-3", "categoryId": "cat-design", "stageId": "s1", "subtopic": "網格排版", "title": "網格系統（Grid）與黃金比例排版實務", "oneLiner": "為什麼雜誌跟專業網站不管放多少圖文都看起來井然有序？因為背後都墊著一張看不見的「12 欄網格線」幫所有元素鎖住比例。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "你一定好奇過，為什麼網頁設計師最愛把螢幕切成 **12 欄** 而不是 10 欄？\n\n算一下小學除法就秒懂了！12 是超級萬能數字：它可以完美平分成 **2 欄（6+6）、3 欄（4+4+4）、4 欄（3+3+3+3）**，還能做出超耐看的 **不對稱比例（4+8，像左側導覽列 + 右側主內容）**！\n\n用網格線排版的感覺就像玩樂高積木：所有卡片、圖片跟文字都乖乖卡進格子裡，就算元素很多也絕對不會歪七扭八！", "lv2": "日常簡報、海報與網頁套用網格的三招：\n\n1. **8px 倍數間距系統（8pt Grid）**：所有邊距、圓角與高度盡量用 8 的倍數（8, 16, 24, 32, 48px），畫面立刻產生微妙的和諧節奏。\n2. **內文寬度上限（45–75 字元）**：文字行太長眼睛換行會迷路，把文章段落最大寬度鎖在舒服的閱讀寬度（如 `65ch`）。\n3. **三分法構圖（攝影與封面對齊）**：把視覺焦點放在井字線交叉點，比死板放正中央生動得多。", "lv3": "現代網格系統源於瑞士國際主義平面風格（Josef Müller-Brockmann《平面設計中的網格系統》），以數學模組化比例（含黃金比例 φ ≈ 1.618 與模組化字級階梯）實現跨媒體與響應式斷點（12 欄桌機 → 8 欄平板 → 4 欄手機）的結構一致性。"}, "myNotes": "12 欄網格 + 8px 倍數間距 + 內文行寬控制，是網頁與簡報永遠乾淨的數學骨架！", "relatedIds": ["design-s1-1", "design-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s1-4", "categoryId": "cat-design", "stageId": "s1", "subtopic": "視覺心理", "title": "格式塔心理學（Gestalt）在視覺分組中的應用", "oneLiner": "大腦天生討厭混亂，會自動把「靠得近、長得像、在同一條線上」的東西腦補成同一組——懂這套大腦自動濾鏡，不畫框線也能排得超清楚。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "為什麼你在網頁上看到三個長得一模一樣的藍色圓角按鈕排成一排，不用文字說明你一眼就知道「它們是同一組功能」？這就是大腦的 **格式塔完形法則**！\n\n最常用的五條大腦自動分組規則：\n1. **接近性**：靠越近的東西，大腦認定它們是一國的。\n2. **相似性**：同顏色、同形狀的元素，自動被歸成同一類（例如全站所有橘色藥丸按鈕都是「主要行動」）。\n3. **共同區域**：放在同一張白色圓角卡片裡的元素，一眼被看成一個獨立單元。\n4. **連續性**：眼睛會順著對齊直線與弧線自然往下滑。\n5. **閉合性**：就算圖標少畫一點邊線，大腦也能自動補完形狀（極簡 Logo 的秘密！）。", "lv2": "用格式塔法則幫介面與簡報「去框線減負」：\n\n1. **少畫多餘的黑框線**：多用「間距（接近性）」跟「極淡底色或 1px 細線」分組，畫面會瞬間清爽十倍。\n2. **互動一致原則**：不要把「純裝飾標籤」跟「可點擊按鈕」畫得長得一模一樣，免得使用者狂點卻沒反應！", "lv3": "格式塔心理學（Max Wertheimer / Kurt Koffka / Wolfgang Köhler, 1920s）核心命題為「整體不等於部分之總和（The whole is other than the sum of its parts）」，奠定了現代介面設計（UI）、資訊視覺化與品牌標誌設計的知覺心理學基礎。"}, "myNotes": "用「距離（接近性）」和「同色形（相似性）」分組，比到處畫滿粗黑框線高級太多了！", "relatedIds": ["design-s1-1", "design-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s2-1", "categoryId": "cat-design", "stageId": "s2", "subtopic": "配色法則", "title": "色彩基礎：色相、明度、彩度與 60-30-10 配色法則", "oneLiner": "新手配色最常犯的錯是把五六個超鮮豔彩虹色塞滿整頁；遵守「60% 乾淨底色 + 30% 輔助結構色 + 10% 亮點強調色」，零美感也能配出高級感。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "把顏色拆成三個超直覺的旋鈕（**HSB 模型**）：\n• **色相（Hue）**：它是紅、橘、藍還是綠？\n• **飽和度／彩度（Saturation）**：顏色有多鮮豔刺眼，還是偏柔灰耐看？\n• **明度（Brightness）**：顏色有多亮還是偏深黑？\n\n永遠不翻車的萬用 **60-30-10 配色公式**（就像你現在看到的這座知識庫！）：\n• **60% 主底色**：純白 `#FFFFFF` 或極淺灰，讓眼睛完全放鬆。\n• **30% 輔助色**：深炭黑文字、淺灰邊框與柔和天空藍光暈，撐起結構。\n• **10% 亮點強調色**：活力暖橘 `#FF7A00`，只用在最重要的按鈕與進度條，一秒吸睛！", "lv2": "零基礎配出耐看色盤的三個實戰秘訣：\n\n1. **永遠別用純黑 `#000000` 配純白**：把文字換成帶一點溫度的深炭灰（`#18181B` 或 `#111827`），閱讀起來柔和高級得多。\n2. **大面積用低飽和，小按鈕才用高飽和**：整頁鋪滿螢光色會閃瞎眼睛，把高飽和色留給那 10% 的重點！\n3. 善用「同色系深淺配（單色調）」或「互補微調（如暖橘配柔天藍）」，天然平衡又耐看。", "lv3": "色彩心理學結合 HSB/OKLCH 感知均勻色彩空間（相較傳統 RGB/HSL，OKLCH 能確保不同色相在相同數值下具備一致的人眼視覺亮度），搭配 60-30-10 室內與平面黃金比例，能系統化控制視覺張力與品牌情緒識別。"}, "myNotes": "純白 60% + 深炭灰與柔天藍 30% + 暖橘亮點 10%，就是最耐看又有活力的黃金配比！", "relatedIds": ["design-s2-2", "design-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s2-2", "categoryId": "cat-design", "stageId": "s2", "subtopic": "易讀與氛圍", "title": "對比度、無障礙易讀性（WCAG）與柔和光暈運用", "oneLiner": "再潮的淺灰字配白底，只要讓人看得瞇起眼睛就是失敗設計；守住 WCAG 對比標準，再用極柔和的背景光暈營造現代質感。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "你一定看過那種自以為文青、在白底上用「超淡淺灰色細字」的網站，看三分鐘眼睛就痠到想關掉！\n\n國際無障礙設計標準（**WCAG**）訂了一條超實在的易讀底線：\n• 一般內文與背景的亮度對比度至少要 **≥ 4.5 : 1（AA 級）**，長時間閱讀的知識庫最好做到 **≥ 7 : 1（AAA 級）**！\n• 想讓純白頁面不顯死板醫院風，只要在頁面頂部角落鋪上極淡的「大範圍柔光漸層（Ambient Soft Glow，透明度約 15%–30%）」，既夢幻有溫度，又完全不影響文字清晰度！", "lv2": "讓網頁與文件既好看又護眼的實務檢核：\n\n1. **色盲友善**：不要「只靠紅綠色」區分狀態（例如成功／失敗），同時加上圖示（勾勾／叉叉）或文字標籤。\n2. **圖片上放文字必加遮罩（Scrim）**：照片背景明暗雜亂，文字背後墊一層半透明深色或白色毛玻璃，才不會看不清楚。\n3. 舒適閱讀字級：中文網頁正文建議 **16px–18px**、行高 **1.7–1.9**，看久了眼睛完全不累。", "lv3": "W3C WCAG 2.1/2.2 以相對亮度比 (L₁ + 0.05) / (L₂ + 0.05) 量化對比度（AA 級正文 4.5:1 / 大字 3:1；AAA 級正文 7:1），並正演進至更貼合人眼對深淺模式感知差異的 APCA 演算法。良好的無障礙設計（Universal Design）不僅服務視障族群，更直接提升所有人在戶外強光與疲勞狀態下的閱讀體驗。"}, "myNotes": "正文 16px+、行高 1.8、深炭灰字配純白底 + 柔和角落光暈，兼顧護眼與現代美感！", "relatedIds": ["design-s2-1", "design-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "design-s2-3", "categoryId": "cat-design", "stageId": "s2", "subtopic": "字體排版", "title": "字體個性與中西文混排細節（襯線 vs 無襯線）", "oneLiner": "字體就像衣服的風格：襯線體像西裝雜誌（權威人文）、無襯線像極簡潮牌（現代俐落）、等寬字體則專屬於數字與程式碼。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "挑字體就像挑穿搭，挑對了整份作品質感瞬間升級：\n\n• **無襯線體（黑體，如思源黑體 Noto Sans TC）**：筆畫乾淨無多餘裝飾，手機跟電腦螢幕上最清楚耐看，最適合 **網頁介面、按鈕與正文**。\n• **襯線體（明體／宋體，如思源宋體 Noto Serif TC）**：筆畫末端有優雅小襯腳，散發書卷、權威與雜誌編輯氣息，最適合 **報告大標題與金句引述**。\n• **等寬字體（Monospace，如 JetBrains Mono）**：每個數字寬度一模一樣，表格裡的金額與編號對得超齊！\n\n另外一個超顯專業的小細節：**中文跟英文／數字之間記得留一個小空格**（例如 `第 3 階段 API 設計`），看起來立刻清爽十倍！", "lv2": "立竿見影的字體排版黃金規則：\n\n1. **一份作品最多配 2 種字體**（例如標題用宋體／襯線 + 內文用黑體／無襯線，或全黑體靠字重拉開層級）。\n2. **數字表格必設等寬數字（`tabular-nums`）與不換行**，小數點上下齊刷刷對齊。\n3. **字級階梯要有感**：大標題（32–48px）→ 章節標（22–28px）→ 內文（16–18px）→ 註解（12–14px，絕不小於 12px）。", "lv3": "排版學（Typography）核心在平衡「可辨識度（Legibility，單字清不清楚）」與「可讀性（Readability，長篇閱讀流不流暢）」。中文方塊字重心偏高、筆畫密集，故行高須設於 1.65–1.9（顯著高於西文之 1.4–1.5），且大標題可微收字距（−0.02em）增強緊湊張力。"}, "myNotes": "中英文數字間加小空格 + 中文行高設 1.8 + 最多 2 種字體，這三招讓排版立刻像雜誌！", "relatedIds": ["design-s2-2", "design-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s2-4", "categoryId": "cat-design", "stageId": "s2", "subtopic": "設計系統", "title": "建立一致的設計系統（Design Tokens）", "oneLiner": "不要每一頁都憑感覺重新調一次橘色、圓角跟陰影——把常用顏色、字級與間距存成統一「設計變數（Tokens）」，整套產品自然長得像同一家族。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "如果你做一個網站，首頁按鈕是圓角 12px 橘色、第二頁變成直角深橘色、第三頁又變成圓形淺橘色，使用者雖然說不出哪裡怪，但會直覺覺得「這網站好山寨」！\n\n大公司設計師的秘密武器叫 **設計系統（Design Tokens）**——就像樂高零件表，提前把所有規範寫死成變數：\n• `--brand-primary: #FF7A00`（主色）\n• `--radius-card: 24px`（卡片圓角）\n• `--radius-btn: 9999px`（藥丸按鈕）\n\n以後只要改一行變數，全站 100 個按鈕一秒全部同步換色，省時又絕對一致！", "lv2": "個人專案建立極簡 Design Tokens 的五個必備變數：\n\n1. **色彩層**：背景白、卡片白、主文字炭黑、次文字灰、品牌強調色、成功／警告色。\n2. **圓角層**：大卡片（24px）、輸入框（12px）、膠囊按鈕（9999px）。\n3. **字級層**：標題、副標、正文、標籤四階固定大小。\n4. **間距層**：4 / 8 / 16 / 24 / 32px。\n5. **陰影層**：只留一種輕柔懸浮陰影，不混用五種雜亂陰影。", "lv3": "Design Tokens（由 Salesforce Lightning 首創，現由 W3C Design Tokens Community Group 標準化）採三層語意抽象：原始色票（Primitive）→ 語意用途（Semantic，如 `surface-primary` / `text-muted`）→ 元件專屬（Component），讓設計師與前端工程師共用單一真實來源（Single Source of Truth）並輕鬆支援深淺主題切換。"}, "myNotes": "寫 CSS 先在 `:root` 定好 5 組變數（色、圓角、字級、間距、陰影），產品立刻長出高級一致性！", "relatedIds": ["design-s2-1", "design-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s3-1", "categoryId": "cat-design", "stageId": "s3", "subtopic": "設計思考", "title": "以人為本的設計思考（Design Thinking）五步驟", "oneLiner": "好設計不是關在辦公室畫酷炫特效，而是「同理觀察 → 定義真問題 → 發散點子 → 快速做紙上原型 → 拿給真人測試修正」的循環。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "醫院的核磁共振（MRI）機器又吵又像大鐵棺材，小朋友嚇到哭鬧不敢進去，常常得打麻醉才能照！工程師原本想花幾百萬把機器改小聲卻做不到。\n\n設計師改用 **設計思考** 蹲下來從小朋友視角看世界，最後沒改半顆螺絲，只把檢查室彩繪成「海盜船探險樂園」，告訴小朋友「躺進船艙保持不動就能躲過海盜找到寶藏！」——結果小朋友需要麻醉的比例瞬間暴跌超過 **80%**！\n\n五步驟超好記：**同理 → 定義 → 發想 → 原型 → 測試**！", "lv2": "日常解決問題套用設計思考的三個關鍵轉念：\n\n1. **看人們「實際怎麼做」，不要只聽他們「嘴上怎麼說」**：觀察卡關瞬間最誠實。\n2. **先發散、再收斂（雙鑽石模型）**：找問題與想點子時不急著批評，盡量多列選項，再冷靜收斂聚焦。\n3. **原型越粗糙越早測越好**：拿手繪草圖花 10 分鐘找 3 個人試點，比寫完一萬行程式才發現動線不順省下百倍成本！", "lv3": "史丹佛 d.school 與 IDEO（Tim Brown）系統化設計思考五階段，並與英國設計協會「雙鑽石模型（Discover → Define → Develop → Deliver）」結合，強調在問題空間與解法空間反覆非線性迭代，確保團隊「做對的事（Effectiveness）」而不只是「把錯的事做得很精美」。"}, "myNotes": "MRI 變海盜船的故事太神——先真正同理使用者恐懼，往往不用花大錢硬改技術就能破局！", "relatedIds": ["prod-mvp", "mkt-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "design-s3-2", "categoryId": "cat-design", "stageId": "s3", "subtopic": "介面易用性", "title": "易用性十大原則（Nielsen Heuristics）與防呆設計", "oneLiner": "如果使用者常常在你的網頁上按錯或迷路，永遠不是使用者太笨，而是介面沒做好「即時回饋、防呆確認與一眼看懂的線索」。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "推門的時候明明寫著「拉」，你卻忍不住一直往前推——設計大師唐・諾曼說：「**這不是你的錯，是裝了扁平推板的門設計太爛！**」\n\n好介面就像不需要看說明書就能直接上手的門把手，守住最關鍵的四條易用原則：\n1. **系統狀態可見**：按完儲存立刻跳出「已自動儲存」小提示，載入中要轉圈，別讓使用者呆坐著懷疑當機。\n2. **防呆與後悔藥**：刪除重要資料前一定跳確認視窗；誤操作能一鍵「復原（Undo）」。\n3. **符合真實世界慣例**：垃圾桶代表刪除、放大鏡代表搜尋、右上角叉叉代表關閉，別自作聰明顛覆習慣。\n4. **辨識勝於回憶**：讓使用者用「選的」而不是靠腦袋背指令。", "lv2": "幫自己做的任何網頁或表單做 3 分鐘易用性體檢：\n\n1. 找一位沒看過這網頁的朋友坐旁邊操作，**你全程閉嘴不提示**，只要他皺眉猶豫超過 3 秒的地方就是必改點！\n2. 錯誤訊息要說「人話 + 怎麼修」：別只顯示 `Error 400`，改寫「JSON 格式缺少結尾大括號 `}`，請檢查後重貼」。\n3. 高風險按鈕（如刪除重設）用紅色且與主要按鈕拉開距離防誤觸。", "lv3": "Jakob Nielsen（1994）十大易用性啟發式原則與 Don Norman《設計心理學》（Affordance 預設用途、Signifiers 符號指標、Feedback 回饋、Constraints 限制防呆）構成人機互動（HCI）的黃金檢核體系，研究顯示僅找 5 位代表性使用者測試即可抓出約 85% 的介面重大易用性問題。"}, "myNotes": "讓 5 個沒看過的人操作、自己全程閉嘴，就能抓出 85% 的介面盲點！", "relatedIds": ["design-s3-3", "design-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s3-3", "categoryId": "cat-design", "stageId": "s3", "subtopic": "資訊架構", "title": "資訊架構（IA）、導覽設計與響應式佈局（RWD）", "oneLiner": "資訊架構就像圖書館的樓層分類與路標：讓使用者在任何頁面都知道「我現在在哪、剛才從哪來、接下來能去哪」，而且手機桌機都好點。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "當一個網站只有 6 個分類時全部擺出來沒問題；但當它長大到 21 個領域、336 篇內容時，如果還全部攤平在首頁，使用者立刻迷失在資訊大海裡！\n\n好的 **資訊架構（IA）** 做三件事：\n1. **分層歸群（像我們升級成 5 大群組標籤 + 折疊選單）**：把 21 個選項收進 5 個清楚大抽屜，瞬間清爽！\n2. **麵包屑導覽**：頁面頂部顯示 `思辨與局勢 / 兵法謀略 / 三十六計`，永遠不會迷路。\n3. **響應式設計（RWD）**：同一份網頁在電腦上是寬敞雙欄、在手機上自動折成單欄 + 抽屜選單，不必兩指放大縮小！", "lv2": "響應式與導覽設計的四個實戰原則：\n\n1. **行動優先（Mobile-First）**：手機螢幕最窄、最考驗取捨，先確定手機版順暢好點（按鈕點擊區 ≥ 44×44px），再往寬螢幕展開多欄。\n2. **導覽列控制在一行內**：頂部主功能不超過 5–6 個，次要功能收進選單。\n3. **多路徑找資料**：同時提供「主題分類瀏覽」＋「頂部即時搜尋」＋「跨領域標籤」，滿足逛街型與目標查詢型兩種習慣。", "lv3": "資訊架構（Peter Morville & Louis Rosenfeld）涵蓋四大系統：組織系統、標籤系統、導覽系統與搜尋系統；並遵循「希克定律（Hick's Law，選擇越多決策耗時呈對數上升）」透過層級分組與漸進揭露（Progressive Disclosure）有效降低選擇過載。"}, "myNotes": "把 21 領域收進 5 大群組標籤 + 折疊手風琴，就是資訊架構與希克定律的最佳實戰！", "relatedIds": ["design-s3-2", "design-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s3-4", "categoryId": "cat-design", "stageId": "s3", "subtopic": "互動細節", "title": "微互動、視覺動線與認知減負技巧", "oneLiner": "真正讓人覺得「這產品好順好好用」的魔法藏在細微處：滑鼠移過去的輕微浮起、一秒即存的提示、與把複雜表單拆成輕鬆小步。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "你有沒有用過那種說不上來為什麼、但按起來超級療癒順手的 App？秘密叫做 **微互動（Micro-interactions）**：\n• 點完讚愛心跳動一下。\n• 滑鼠移到按鈕上輕輕浮起 1px 並出現柔和光影。\n• 打完筆記右上角悄悄浮現「已自動儲存」再溫柔淡出。\n\n再加上 **漸進揭露（Progressive Disclosure）**：不要一打開頁面就丟出 50 個進階設定把人嚇跑，先把最常用的 3 個開關擺在眼前，進階選項等使用者點開「進階設定」再優雅展開！", "lv2": "四招讓介面瞬間變順滑的微細節：\n\n1. **過渡動畫控制在 150–250ms**：太慢像卡頓、零動畫顯生硬，0.18 秒最自然流暢。\n2. **預填聰明預設值**：例如打開「產出新單元」視窗時，自動預選使用者當下所在的領域與階段，少點三次下拉選單！\n3. **空白狀態（Empty State）也要設計**：當某個清單還是空的，給一句友善引導加一顆「＋ 立即新增」按鈕，別留一片死白。", "lv3": "Dan Saffer《微互動》將其拆解為四結構：觸發器（Trigger）→ 規則（Rules）→ 回饋（Feedback）→ 循環與模式（Loops & Modes）。搭配費茲定律（Fitts's Law，目標越大且越靠近游標／拇指熱區越容易精準點擊），構成流暢互動體驗的工程基石。"}, "myNotes": "預填當下分類、180ms 柔順過渡與友善空白狀態，是把工具做出「高級手作感」的細節！", "relatedIds": ["design-s3-2", "design-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s4-1", "categoryId": "cat-design", "stageId": "s4", "subtopic": "資訊圖表", "title": "資料視覺化選圖指南：長條、折線、散點與佔比圖", "oneLiner": "圖表不是為了把簡報塞滿五顏六色，而是幫大腦用「眼睛一秒看懂大小與趨勢」取代「花三分鐘讀表格算減法」。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "做報告不知道該選哪種圖？背下這張「四秒選圖速查表」絕不出錯：\n\n• **比大小、排高低**（例如各部門業績）→ **水平長條圖**（類別名稱長也不會斜著擠成一團！）。\n• **看隨時間變化趨勢**（例如近 12 個月營收）→ **折線圖**。\n• **看兩個數字有沒有關聯**（例如廣告費 vs 成交額）→ **散點圖**。\n• **看部分佔整體比例** → 只有 **2–3 塊** 才用圓餅／甜甜圈圖；超過 4 塊改用堆疊長條圖或水平長條圖清楚一百倍！", "lv2": "讓圖表專業度瞬間碾壓預設 Excel 圖的四招：\n\n1. **直接標註數據在線端／條端**，直接刪掉多餘的右側圖例與密密麻麻格線。\n2. **水平長條圖必由大到小排序**（除非有自然順序如年齡／階段）。\n3. **雙 Y 軸圖表慎用**：調整兩邊刻度很容易製造假相關，改拆成上下並排兩張同步 X 軸的小圖（Small Multiples）更誠實清晰。\n4. 永遠為重點數據上亮色、其餘數據降成中性灰。", "lv3": "Cleveland & McGill（1984）視覺編碼精準度排序證實：人眼判讀「同一基準線上的位置與長度（長條／折線）」遠比判讀「角度（圓餅圖）」、「面積（氣泡圖）」與「色彩深淺（熱力圖）」精準數倍，故選圖核心是將最重要的數值維度映射到最高精度的位置／長度通道。"}, "myNotes": "類別多或名稱長一律用「由大到小排序的水平長條圖」，比圓餅圖清楚一百倍！", "relatedIds": ["data-s4-4", "it-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "design-s4-2", "categoryId": "cat-design", "stageId": "s4", "subtopic": "簡報設計", "title": "簡報視覺設計：一頁一重點與數據故事化", "oneLiner": "投影片不是 Word 文件的橫向影印本——把一頁砍到只剩「一個結論標題 + 一個視覺核心」，台下沒人會再低頭滑手機。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "好簡報跟爛簡報只有一個最簡單的檢驗標準：**「這頁投影片能不能在 3 秒鐘內看懂你想說什麼？」**\n\n把文字牆變神級簡報的三步減法：\n1. **把段落砍成關鍵詞卡片**：200 字長文拆成 3 個帶小圖示的重點欄，字級全部拉大到 18pt 以上。\n2. **標題寫「觀點」不寫「目錄」**：不要寫「Q3 銷售分析」，寫「Q3 靠回購客帶動成長 28%」！\n3. **關鍵數字超大化**：把最重要的核心數字（例如 `336 單元` 或 `+42%`）拉成超大字體當視覺錨點。", "lv2": "專業簡報的視覺節奏安排技巧：\n\n1. **封面與封底做深色或強烈風格定調**，內頁維持高對比白底清爽易讀。\n2. **避免連續三頁長得一模一樣**：交替使用「大數字頁 → 3 欄卡片頁 → 全幅圖表頁 → 對比表格頁」，聽眾視覺永不疲勞。\n3. 真的需要留大量文字給主管會後細讀？另外準備「完整書面文件」，簡報頁依然保持清爽！", "lv3": "Garr Reynolds《簡報禪》（Presentation Zen）與 Nancy Duarte《Slide:ology》倡導「訊噪比極大化」原則：簡報頁是視覺放大器而非檔案儲存庫（Slideument 反模式），每頁僅傳遞單一核心訊息（One Idea Per Slide），以視覺節奏（Visual Cadence）維持聽眾長時專注。"}, "myNotes": "簡報標題寫結論、一頁只留一個視覺主角、連續兩頁換版型，質感直接跳兩階！", "relatedIds": ["comm-s3-3", "design-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "design-s4-3", "categoryId": "cat-design", "stageId": "s4", "subtopic": "品牌視覺", "title": "品牌識別系統（VI）與情緒板（Moodboard）建立", "oneLiner": "開工設計前先花 15 分鐘收集 6–8 張代表你理想氛圍的參考圖（情緒板），就能避免做到一半風格跑偏成四不像。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "為什麼看到一抹特定橘色你會想到愛馬仕、看到特定綠白配會想到星巴克？這就是 **品牌視覺識別（VI）** 的長期記憶魔法！\n\n就算只是做自己的部落格、LINE 貼圖或個人知識庫，動手前只要先做一張 **情緒板（Moodboard）**：\n1. 寫下 3 個品牌個性關鍵字（例如：「專業、溫暖、輕盈」）。\n2. 收集 5 張你超喜歡的網站截圖、配色卡、插畫風格拼在同一頁。\n3. 從裡面抽出你的「固定主色 + 輔色 + 字體 + 圖像風格」，之後所有作品都照這套走，大家看一眼就知道是你的作品！", "lv2": "個人專案建立極簡品牌規範（Mini Brand Kit）的四要素：\n\n1. **色彩角色**：1 主色 + 1 輔色 + 中性黑白灰。\n2. **字體組合**：1 標題字 + 1 正文字。\n3. **圖形語言**：統一圓角大小、線條粗細、圖示風格（例如全套用細線條 Lucide Icon）。\n4. **插圖／照片調性**：例如「純白底柔和光暈」或「手繪水彩故事感」，絕不把寫實照片跟扁平卡通混雜亂貼。", "lv3": "品牌識別（Visual Identity）透過長期一致的感知線索在消費者記憶網絡中建立「獨特品牌資產（Distinctive Brand Assets, Byron Sharp《品牌如何成長》）」，降低辨識與心智提取成本，在資訊過載環境中累積長期品牌溢價。"}, "myNotes": "做任何視覺專案或網站前先拼一張 6 圖情緒板鎖定調性，效率跟質感都會高一截！", "relatedIds": ["design-s2-4", "mkt-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "design-s4-4", "categoryId": "cat-design", "stageId": "s4", "subtopic": "AI 視覺流", "title": "AI 輔助視覺設計工作流：從構圖提示詞到版面整合", "oneLiner": "AI 繪圖最怕「每張圖風格都長得不一樣」；學會鎖定參考圖、精準控管光線構圖，並把文字排版留給專業版面工具，就能穩定產出商業級作品。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第六階段擴充課綱", "levels": {"lv1": "用 AI 生圖做貼圖、海報或簡報配圖，新手常遇到兩大崩潰：第一張跟第二張主角長得完全不同人，或是圖片裡的繁體中文字變成外星鬼畫符！\n\n頂尖 AI 視覺工作流的三個黃金口訣：\n1. **圖歸 AI、字歸排版**：讓 AI 專心畫乾淨無字的畫面（加上 `no text, clean composition`），標題與說明文字交給 HTML／簡報／設計軟體疊上去，清晰 100%！\n2. **角色與風格鎖定**：產出第一張滿意的主角基準圖後，後續所有變化都附帶那張參考圖一起生成，風格與長相就不會走鐘。\n3. **提示詞結構化**：主體動作 ＋ 畫風媒材 ＋ 光線色調 ＋ 構圖留白 ＋ 排除項目。", "lv2": "實務產出一致高品質 AI 視覺資產的四步 SOP：\n\n1. **先做小圖風格測試（Style Preview）**：用同一主題快速試 3 種畫風（如水彩繪本、復古網點、極簡線條）確認方向。\n2. **配合最終版面選對長寬比**：簡報封面與網站橫幅用 `16:9`、卡片配圖用 `4:3`、頭像貼圖用 `1:1`。\n3. **為文字預留負空間**：提示詞指定「左側純淨留白」方便後續疊字。\n4. 產出後必做視覺檢驗（看手指、對稱性、邊框雜訊），有瑕疵立刻微調重跑。", "lv3": "生成式擴散模型（Diffusion Models）在語意構圖與材質渲染上具極高吞吐優勢，但在精確幾何排版與高密度中文字形上仍受限於潛在空間採樣隨機性；因此「AI 生成視覺底材（Visual Assets）＋ 程式／向量排版引擎精準控字（Deterministic Layout）」為目前品質最穩定的混合生產管線。"}, "myNotes": "圖交給 AI、字交給排版工具、多張連貫用參考圖鎖定角色風格——商業級 AI 視覺三鐵律！", "relatedIds": ["design-s4-3", "it-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "calc-s1-1", "categoryId": "cat-calc", "stageId": "s1", "subtopic": "極限直覺", "title": "極限（Limit）與無窮小：把無限逼近變精確的數學放大鏡", "oneLiner": "極限問的不是「走到終點站在哪裡」，而是「當你無限靠近那個點時，你正朝著哪個數字逼近」——這是整座微積分大廈的地基。", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "想像你距離牆壁 2 公尺，每次都往前走「剩下距離的一半」：先走 1 公尺、再走 0.5、再走 0.25、0.125……\n\n理論上你好像永遠差那麼一點點沒撞到牆，但肉眼看過去，你**無限逼近的目標位置**清清楚楚就是「2 公尺（牆壁）」！\n\n以前數學遇到 `0 ÷ 0` 就直接當機報錯；**極限（Limit）** 就像一台超級顯微鏡，不硬把分母塞成 0，而是觀察當分母縮到 `0.0000001` 時數值穩定趨近哪裡，一舉解開了「瞬間變化」的千古難題！", "lv2": "讀懂極限與連續性的三個實務直覺：\n\n1. **左極限 ＝ 右極限**：從左邊逼近跟從右邊逼近停在同一個高度，極限才存在（遇到階梯斷層就沒極限）。\n2. **連續函數的直覺**：畫圖時「筆尖不用離開紙面」一筆畫完就是連續。\n3. **生活中的極限思維**：銀行把複利結算從「每年一次 → 每月一次 → 每天一次 → 每微秒一次（連續複利）」，最後不會爆炸成無限大，而是精準收斂到自然常數 **e ≈ 2.71828**！", "lv3": "Cauchy 與 Weierstrass 以嚴謹的 ε-δ 定義取代牛頓與萊布尼茨早期的模糊無窮小量：lim(x→a) f(x) = L 意指對任意 ε > 0，皆存在 δ > 0，使所有滿足 0 < |x − a| < δ 之 x 皆滿足 |f(x) − L| < ε。此嚴謹化奠定了現代實分析基礎，並衍生出處理 0/0 或 ∞/∞ 不定型的羅必達法則（L'Hôpital's Rule）。"}, "myNotes": "自然常數 e ≈ 2.71828 竟然就是「100% 年利率無限次連續複利」的極限值！", "relatedIds": ["calc-s1-2", "fin-compound"], "updatedAt": "2026-11-24"},
        {"id": "calc-s1-2", "categoryId": "cat-calc", "stageId": "s1", "subtopic": "微分起點", "title": "導數與切線斜率：從平均速度到此刻瞬間速度", "oneLiner": "開車一小時跑 60 公里叫「平均速度」，但測速照相拍你那一毫秒的「儀表板指針數字」就是微分（導數）！", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "開車從台北開 1 小時跑了 60 公里，平均時速 60，但你可能在高速公路上曾飆到 110、塞車時停在 0！\n\n那測速照相機是怎麼抓出你「經過鏡頭那一瞬間」的速度？它把量測時間縮得超級短（例如 0.001 秒），算出那千分之一秒裡車子移動了幾公分再除以時間！\n\n把這套「時間差無限縮短到接近 0」畫在曲線上，就是該點 **切線的斜率（有多陡）**：\n• 導數 > 0：正在往上爬。\n• 導數 < 0：正在往下掉。\n• 導數 = 0：剛好平平的（山頂或谷底！）。", "lv2": "看懂微分符號與跨領域翻譯對照：\n\n1. `f'(x)` 或 `dy/dx` 讀成「當 x 稍微變動一點點時，y 會跟著變動多少倍」。\n2. **跨學科同一概念不同名字**：物理叫「速度（位置的導數）」與「加速度（速度的導數）」；經濟學叫「**邊際成本／邊際收益**」；投資選擇權叫「**Delta**（股價漲 1 元選擇權漲幾元）」！", "lv3": "導數定義為差商極限 f'(x) = lim(h→0) [f(x+h) − f(x)] / h。函數在一點可微（Differentiable）必連續，但連續未必可微（如絕對值函數 |x| 在尖點 x = 0 處左右斜率不等故不可微）。局部線性化 f(x+Δx) ≈ f(x) + f'(x)Δx 是數值計算與誤差傳遞分析的核心。"}, "myNotes": "物理的速度、經濟的邊際收益、選擇權的 Delta，底層全都是同一個東西：導數！", "relatedIds": ["calc-s1-1", "calc-s1-3", "econ-s1-1"], "updatedAt": "2026-11-24"},
        {"id": "calc-s1-3", "categoryId": "cat-calc", "stageId": "s1", "subtopic": "微分工具", "title": "基本微分法則：次方、乘積、商法則與連鎖律（Chain Rule）", "oneLiner": "把複雜函數拆成簡單零件算變化率——特別是「連鎖律」，就像咬合的齒輪組，一層一層把變化倍數相乘，正是現代 AI 反向傳播的核心公式！", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "算微分不用每次都從極限硬推，只要記住四個超直覺工具，其中最重要叫 **連鎖律（Chain Rule）**：\n\n想像腳踏車的三個齒輪 A → B → C：\n• 踏板 A 轉 1 圈，中間齒輪 B 轉 2 圈。\n• 中間齒輪 B 轉 1 圈，後輪 C 轉 3 圈。\n• 那踏板 A 轉 1 圈，後輪 C 轉幾圈？答案一眼就知道：**2 × 3 = 6 圈！**\n\n連鎖律就是這個「齒輪相乘」邏輯：當函數一層包一層 `f(g(x))` 時，總變化率等於「外層對內層的變化率 × 內層對 x 的變化率」！", "lv2": "最常用的四條速算口訣：\n\n1. **次方法則**：`xⁿ` 微分 = `n·x^(n−1)`（指數搬下來當係數，原指數減 1；如 `x³ → 3x²`）。\n2. **指數與對數**：`eˣ` 微分還是 `eˣ`（宇宙最懶函數！）；`ln(x)` 微分 = `1/x`。\n3. **乘積法則**：`(u·v)' = u'v + uv'`（前微後不微 ＋ 前不微後微）。\n4. **連鎖律（AI 必備）**：深度學習神經網路有幾十層，計算最後誤差怎麼回頭調整第一層權重（Backpropagation），本質上就是瘋狂套用連鎖律一路乘回來！", "lv3": "萊布尼茨記法直觀呈現連鎖律之美：dz/dx = (dz/dy) · (dy/dx)。商法則 (u/v)' = (u'v − uv') / v²；三角函數 (sin x)' = cos x, (cos x)' = −sin x。自動微分引擎（PyTorch / JAX Autograd）即建立於計算圖上的反向模式連鎖律累積。"}, "myNotes": "AI 訓練最神祕的「反向傳播（Backpropagation）」，說穿了就是齒輪相乘的連鎖律！", "relatedIds": ["calc-s1-2", "calc-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "calc-s1-4", "categoryId": "cat-calc", "stageId": "s1", "subtopic": "最佳化", "title": "極值與最佳化：找最高點、最低點與反曲點的實戰魔法", "oneLiner": "爬山走到山頂或谷底那一刻，腳下的坡度一定是平的（一階導數 = 0）；用微積分就能精準算出「怎麼定價利潤最高、怎麼包裝最省材料」。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "想像你手上有 100 公尺的圍欄，想在草地上圍出一個「面積最大」的長方形牧場，長寬該設幾公尺？或者你是咖啡店老闆，定價太低賺不到錢、定價太高沒人買，定幾元總利潤最高？\n\n微積分給了一把萬能找峰谷鑰匙：\n1. **一階導數 = 0**：找出所有坡度變平的「山頂或谷底候選點」。\n2. **二階導數（彎曲方向）**：開口往下像山峰（`f'' < 0`）就是 **最大值**；開口往上像山谷（`f'' > 0`）就是 **最小值**！\n3. **反曲點（`f'' = 0`）**：成長速度由「越來越快」轉變成「開始減速」的轉折點（S 型曲線中點）！", "lv2": "實務最佳化求解四步驟：\n\n1. 寫出目標函數（例如 `利潤 = (售價 − 成本) × 銷量(售價)`）。\n2. 對決策變數微分並令它等於 0，解出臨界點。\n3. 檢查二階導數確認是最高點還是最低點。\n4. **必查邊界點**：別忘了檢查區間最左與最右端點，並確認有沒有陷進「局部高點（小山丘）」而錯過更高的「全局最高峰」。", "lv3": "費馬定理（Fermat's Theorem on Stationary Points）保證光滑函數在內部極值點必有 f'(x) = 0；二階導數決定函數凹凸性（Convexity）：對嚴格凸函數（如最小平方法誤差函數），任一局部極小值即保證為全局唯一極小值，此為凸優化（Convex Optimization）能高效求解的基石。"}, "myNotes": "找最大利潤或最小成本：一階導數設 0 找平地，二階導數看開口分清山頂還是谷底！", "relatedIds": ["calc-s1-2", "calc-s3-3", "calc-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "calc-s2-1", "categoryId": "cat-calc", "stageId": "s2", "subtopic": "積分起點", "title": "黎曼和與定積分：切無限多薄片算出任意曲線下面積", "oneLiner": "長方形面積人人會算，但遇到彎彎曲曲的怪形狀怎麼辦？把它切成一萬條超細長方形薄片加起來（積分），誤差立刻趨近於零！", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "給你一張不規則曲線圖，想知道下面圍起來的面積有多大：\n• 切 4 塊粗長方形來湊 → 邊緣凹凸不平、誤差很大。\n• 切 100 塊細長方形 → 看起來已經超貼合曲線了！\n• 切 **無限多塊寬度趨近 0 的超薄片** 全部加總 → 就得到 100% 精準面積！\n\n積分符號 `∫` 其實就是把英文總和 **Sum** 的首字母 `S` 拉長變瘦的樣子，代表「把無限多微小碎片的貢獻全部累加起來」！", "lv2": "把「定積分（累積總量）」翻譯成各領域直覺：\n\n1. **物理**：把「每分每秒的速度」全部積分起來 ＝ **總移動距離**。\n2. **財經與商業**：把「每天的現金流速率」積分起來 ＝ **全年總營收**；把「每天新增確診率」積分起來 ＝ **累計總人數**。\n3. **統計與機器學習**：ROC 曲線下面積（AUC）直接衡量分類模型的整體準確度。", "lv3": "黎曼積分定義為分割網格寬度趨近於零時黎曼和的極限：∫[a,b] f(x) dx = lim(n→∞) Σ f(x_i*) Δx_i。若遇高度不規則函數（如處處不連續的狄利克雷函數），現代實分析與機率論則採更強大的「勒貝格積分（Lebesgue Integral，改切值域 y 軸而非定義域 x 軸）」。"}, "myNotes": "積分符號 ∫ 就是拉長的 S（Sum）——把無限多超細薄片加起來算總累積量！", "relatedIds": ["calc-s2-2", "calc-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "calc-s2-2", "categoryId": "cat-calc", "stageId": "s2", "subtopic": "核心橋樑", "title": "微積分基本定理：為何切碎（微分）與疊加（積分）互為反運算", "oneLiner": "微積分最震撼的奇蹟：看似毫無關係的「求切線斜率（微分）」跟「算曲線下面積（積分）」，竟然像加法跟減法一樣互為逆運算！", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "古希臘人花了一千年切薄片算面積累得半死，直到牛頓跟萊布尼茨發現了一條宇宙級捷徑（**微積分基本定理**）：\n\n想像你往水桶裡倒水，每分鐘的水流速度是 `v(t)`，而水桶累積的總水量是 `A(t)`：\n• 把總水量對時間「微分（看瞬間增加率）」，得到的當然就是此刻的水流速度 `v(t)`！\n• 反過來，想知道從第 1 分鐘到第 5 分鐘總共倒進多少水（積分），根本不用切一萬片去加，只要找出誰微分後等於水流速度（原函數 `F`），直接算 **`F(5) − F(1)`（終點減起點）** 一秒出答案！", "lv2": "記住這條定理帶來的兩大威力：\n\n1. **把無限求和降維成一次減法**：原本要加無限多塊面積，現在只要找反導函數代入上下限一減就搞定。\n2. **建立「存量（Stock）vs 流量（Flow）」的動態眼光**：系統思考裡存量是流量的積分，流量是存量的微分（如資產淨值是現金流的積分）！", "lv3": "微積分基本定理（FTC）分兩部：一、(d/dx) ∫[a,x] f(t) dt = f(x)；二、若 F' = f，則 ∫[a,b] f(x) dx = F(b) − F(a)（牛頓—萊布尼茨公式）。高維推廣即向量微積分中的格林定理、斯托克斯定理與高斯散度定理，統一表徵為微分形式之廣義斯托克斯定理 ∫_M dω = ∫_∂M ω。"}, "myNotes": "系統思考的存量（總水量）跟流量（流速），就是微積分基本定理最活生生的翻版！", "relatedIds": ["calc-s2-1", "cross-systems"], "updatedAt": "2026-11-24"},
        {"id": "calc-s2-3", "categoryId": "cat-calc", "stageId": "s2", "subtopic": "積分技巧", "title": "常用積分技巧：變數代換法（u-Substitution）與分部積分", "oneLiner": "微分有規則可直接套，積分則像「倒著猜誰微分變成這樣」——換個乾淨變數（u 代換）或拆開輪流處理（分部積分）就能化解九成難題。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "微分像把樂高拆開（照步驟閉著眼睛都會拆），積分像把一地零件拼回原本造型（需要一點巧思）！\n\n兩招最常用的積分拆彈法：\n1. **變數代換法（u-Substitution）**：就是「倒著用連鎖律」！看到式子裡有一坨長得很醜的重複塊（例如 `2x+1`），先幫它取個簡短綽號叫 `u`，整條算式瞬間瘦身變超簡單！\n2. **分部積分（Integration by Parts）**：就是「倒著用乘積法則」！遇到兩個不同類函數乘在一起（如 `x · eˣ`），把不好積的丟給微分消掉、好積的直接積起來，一步拆解！", "lv2": "實務中面對複雜積分的兩條路：\n\n1. 手算辨識口訣：分部積分挑誰當 `u`（拿去微分消掉）照 **LIATE 順序**：對數（Log）→ 反三角 → 代數多項式（如 x²）→ 三角 → 指數（eˣ）。\n2. **現代工程真相**：現實世界多數複雜函數根本沒有漂亮初等解析解（例如常態分佈鐘形曲線 `e^(-x²)`），實務上直接用電腦數值積分（梯形法／辛普森法／Python `scipy.integrate`）毫秒求高精度解！", "lv3": "變數代換公式 ∫ f(g(x))g'(x) dx = ∫ f(u) du；分部積分公式 ∫ u dv = uv − ∫ v du。對無封閉初等反導函數之積分（如高斯積分誤差函數 erf），工程上採高斯求積（Gaussian Quadrature）或蒙地卡羅積分求解。"}, "myNotes": "懂手算直覺即可，遇到真實世界複雜曲線別忘了還有數值積分與 Python SciPy！", "relatedIds": ["calc-s1-3", "calc-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "calc-s2-4", "categoryId": "cat-calc", "stageId": "s2", "subtopic": "無窮級數", "title": "廣義積分與無窮級數：無限多項相加竟然能等於有限數字", "oneLiner": "把無限多個正數加起來一定會變成無限大嗎？不一定！只要後面的數字縮得夠快（收斂），無限多筆未來現金流加起來竟然是個精準有限價錢！", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "拿一張面積為 1 的正方形大披薩：先切一半 `1/2` 吃掉，再切剩下的一半 `1/4`，再切 `1/8`、`1/16`……一路切到宇宙盡頭無限多塊！\n\n這無限多塊加起來有多大？答案絕不會變成無限大，它精準等於 **1（原本那張披薩）**！這叫 **收斂（Convergent）**。\n\n但小心！如果把 `1 + 1/2 + 1/3 + 1/4 + 1/5 + ...`（調和級數）一路加下去，雖然後面數字也越來越小趨近 0，但它縮得「不夠快」，加到最後竟然會慢慢衝向 **無限大（發散 Divergent）**！", "lv2": "無窮級數在金融與日常的震撼應用：\n\n1. **永續年金估值（股利折現模型）**：一檔每年永遠配息 5 萬元的資產值多少錢？因為未來的錢要打折現（公比 r < 1 收斂），套無窮等比級數公式瞬間算出精準現值 `PV = 每年配息 ÷ 折現率`（如 5 萬 ÷ 5% = 100 萬）！\n2. **銀行貨幣乘數**：存款不斷再放貸的無窮級數和 `1 / 準備率`。", "lv3": "幾何級數 Σ arⁿ 在 |r| < 1 時收斂至 a / (1 − r)；p-級數 Σ (1/nᵖ) 僅在 p > 1 時收斂（調和級數 p = 1 發散）。廣義積分（Improper Integrals）將定積分延伸至無窮區間或無界奇點，為機率論常態分佈歸一化 ∫[−∞,∞] pdf(x) dx = 1 與拉普拉斯變換的核心基礎。"}, "myNotes": "金融界幫永續配息資產定價的 `配息 ÷ 折現率`，底層竟然就是高中學的無窮等比級數收斂！", "relatedIds": ["fin-compound", "calc-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "calc-s3-1", "categoryId": "cat-calc", "stageId": "s3", "subtopic": "曲線逼近", "title": "泰勒展開式（Taylor Series）：用簡單多項式逼近任何複雜曲線", "oneLiner": "電腦其實只會算加減乘除，它怎麼算出 `sin(37°)` 或 `e^2.5`？秘密就是泰勒展開式：用一堆簡單的次方加減法，就能無限精準模仿任何複雜曲線！", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "想像你要模仿一條超複雜的雲霄飛車軌道，但你手上只有最簡單的積木（常數、直線、拋物線 `x²`、三次曲線 `x³`）：\n\n• **第 0 階**：先對齊這一點的高度。\n• **第 1 階**：再對齊這一點的坡度（一階微分）→ 貼得有點像了！\n• **第 2 階**：再對齊這一點的彎曲度（二階微分）→ 幾乎重疊了！\n• 一路加到第 5、第 10 階，簡單的加減乘除多項式就能把 `sin(x)`、`cos(x)`、`eˣ` 模仿到小數點後 15 位完全一模一樣！", "lv2": "泰勒展開在工程、物理與金融的三大神奇用途：\n\n1. **計算機核心**：CPU 算三角函數與對數底層全靠多項式展開近似。\n2. **物理簡化魔法**：單擺擺角很小時 `sin(θ) ≈ θ`（只取一階泰勒項），讓超難解的擺動瞬間變簡單！\n3. **金融債券與選擇權風險估計**：債券價格變動 ≈ `−存續期間(一階) × Δr + ½ 凸性(二階) × (Δr)²`；選擇權價格變動 ≈ `Delta × ΔS + ½ Gamma × (ΔS)²`——全都是二階泰勒展開！", "lv3": "光滑函數在點 a 附近的泰勒級數：f(x) = Σ [f^(n)(a) / n!] · (x − a)ⁿ，並由拉格朗日餘項精確界定截斷誤差上界。在複數平面上將泰勒展開套用於 e^(iθ) 更直接導出數學界最美公式——歐拉恆等式 e^(iπ) + 1 = 0。"}, "myNotes": "債券的「存續期間 + 凸性」、選擇權的「Delta + Gamma」，全都是二階泰勒展開的化身！", "relatedIds": ["fin-s4-2", "calc-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "calc-s3-2", "categoryId": "cat-calc", "stageId": "s3", "subtopic": "多變數微積分", "title": "偏微分與梯度（Gradient）：在三維山坡上找最陡的下山方向", "oneLiner": "真實世界很少只受一個變數影響；「偏微分」是先鎖住其他變數只動一個，而把所有偏微分合起來的「梯度箭頭」，永遠精準指向山坡最陡的方向！", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "以前學的微分像走在一條單行道上，只能往前或往後；但真實世界像站在一座立體大山坡上，往東（x 軸）走跟往北（y 軸）走坡度完全不同！\n\n• **偏微分（∂f/∂x）**：假裝北邊鎖死不動，只單獨測試「往東跨一小步，高度變化多少」；再鎖死東邊，單獨測試「往北跨一小步，高度變化多少」。\n• **梯度（Gradient, ∇f）**：把這兩個方向的斜率合成一支立體箭頭——數學保證這支箭頭永遠指向**「上山最陡的那個方向」**！所以只要往它的**反方向（負梯度）**跨步，就能用最快速度走下山谷！", "lv2": "偏微分與梯度在商業分析與 AI 中的直覺對應：\n\n1. **商業敏感度分析**：利潤同時受「廣告費、售價、轉換率」三個變數影響，各做一次偏微分就知道「現在多投入 1 單位哪個變數，對利潤拉升最猛」。\n2. **AI 訓練的羅盤**：大語言模型有幾百億個參數（幾百億維的山坡），靠計算損失函數對每個參數的偏微分組成梯度，AI 就知道該往哪裡調參數才能讓答錯率最快下降！", "lv3": "梯度向量 ∇f = (∂f/∂x₁, ∂f/∂x₂, ..., ∂f/∂x_n) 恆垂直於等高線（Level Curves），且沿單位向量 u 的方向導數 D_u f = ∇f · u = ||∇f|| cos θ，故在 θ = 0（正梯度）達最大上升率，在 θ = π（負梯度）達最速下降率。"}, "myNotes": "偏微分 = 一次只動一個旋鈕看反應；負梯度 = 蒙眼在濃霧裡也能找到最陡下山路！", "relatedIds": ["calc-s3-3", "data-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "calc-s3-3", "categoryId": "cat-calc", "stageId": "s3", "subtopic": "AI 訓練核心", "title": "梯度下降法（Gradient Descent）：現代 AI 神經網路訓練的真正引擎", "oneLiner": "AI 之所以能從笨蛋變成專家，本質上就是被蒙上眼睛丟在濃霧山谷裡，靠腳感受坡度（梯度），一步一步往谷底（誤差最小處）走下去。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "想像你被蒙上雙眼放在一座濃霧籠罩的大山上，目標是走到「整座山最低的谷底」（代表 AI 預測誤差 = 0）：\n\n你看不到全貌怎麼辦？\n1. 用腳感受現在站的位置哪個方向往下最陡（算 **梯度**）。\n2. 朝著下坡方向跨出一步（這一步的大小叫 **學習率 Learning Rate**）。\n3. 重複一萬次！\n\n小心跨步大小：**步子太小**走到天荒地老還沒下山；**步子太大**會一腳跨過谷底跳到對面山坡來回彈跳永遠停不下來！", "lv2": "看懂現代 AI 訓練名詞背後的梯度下降直覺：\n\n1. **隨機梯度下降（SGD / Mini-batch）**：資料有一億筆，每次全看太慢了，隨機抓一小把（例如 64 筆）估算大概下坡方向就先邁一步，雖然路線有點搖晃但速度快上萬倍！\n2. **動量（Momentum）與 Adam 優化器**：想像把一顆「重鐵球」滾下山，靠慣性衝過小坑洞（局部極小值），平緩處自動加速、陡峭處自動微調步幅，這就是今日訓練 LLM 的標配引擎！", "lv3": "核心更新規則：θ_(t+1) = θ_t − η · ∇L(θ_t)，其中 η 為學習率，L(θ) 為損失函數。實務訓練深度神經網路須克服鞍點（Saddle Points，高維空間遠比局部極小值常見）、梯度消失／爆炸（透過殘差連接 ResNet、LayerNorm 與梯度裁剪緩解），並普遍採用 AdamW 搭配餘弦退火學習率排程（Cosine Annealing）。"}, "myNotes": "所有最炫的 ChatGPT 與生成式 AI 訓練，底層都在重複這一行：參數 = 舊參數 − 學習率 × 梯度！", "relatedIds": ["calc-s3-2", "calc-s1-3", "it-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "calc-s3-4", "categoryId": "cat-calc", "stageId": "s3", "subtopic": "動態系統", "title": "微分方程直覺：描述人口成長、複利與冷卻過程的動態語言", "oneLiner": "普通方程式求的是一個「數字」，微分方程求的是一整條「隨時間演變的命運曲線」——從咖啡變涼、病毒擴散到人口上限全靠它寫成。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "微分方程聽起來超嚇人，其實翻譯成白話就是一句簡單的「變化規則」：\n\n• **複利與病毒初期爆發**：`成長速度正比於現有數量（dy/dt = r·y）` → 人越多傳越快、錢越多生越多，畫出來就是 **指數爆炸曲線**！\n• **咖啡冷卻（牛頓冷卻定律）**：`降溫速度正比於咖啡跟室溫的溫差` → 剛泡好超燙時降溫超快，快跟室溫一樣時就冷得很慢。\n• **邏輯斯成長（S 型曲線）**：加上環境資源上限（承載力 K），初期指數爆發，快滿了自然煞車走平——這就是新產品普及與人口成長的真實曲線！", "lv2": "用微分方程直覺看懂世界動態規律：\n\n1. **識別系統處於哪一段**：看到一個新趨勢正在爆發，先判斷它有沒有「環境上限（K）」——有的話必走 S 曲線，別拿前期指數段去幻想永遠翻倍！\n2. **SIR 傳染病／口碑傳播模型**：把人群分成「還沒聽說（S）→ 正在瘋傳（I）→ 退燒免疫（R）」三條連動微分方程，同時能預測疫情高峰與爆紅迷因退燒時間！", "lv3": "常微分方程（ODE）描述單一自變數（多為時間）的動態演化，如邏輯斯方程 dy/dt = r·y(1 − y/K) 與描述物種掠食循環的洛特卡—沃爾泰拉方程（Lotka-Volterra）；偏微分方程（PDE）如熱傳導方程、波動方程與金融界 Black-Scholes 選擇權定價方程，構成現代自然科學與量化金融的統一數學語言。"}, "myNotes": "微分方程其實超親切：它就是用數學寫下「現在的狀態如何決定下一秒的變化速度」！", "relatedIds": ["cross-systems", "cross-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "calc-s4-1", "categoryId": "cat-calc", "stageId": "s4", "subtopic": "約束最佳化", "title": "拉格朗日乘數法：在有限預算與約束條件下求最大效益", "oneLiner": "現實中你永遠不可能無上限花錢——拉格朗日乘數法教你「踩在預算圍牆上，找到能拿到最高滿意度的那一個相切黃金點」。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "以前學的極值是讓你「在整座山上隨便走，找最高峰」；但真實人生永遠綁著限制條件（例如「總預算只有 3 萬元，要怎麼配機票跟飯店讓旅行爽度最高？」）。\n\n拉格朗日發現了一個超美的幾何現象：想像你的「預算線」像一條固定小路畫在山坡上，沿著這條小路走到最高的那一點，**你的預算線一定剛好「相切」於山坡的等高線**（兩者的梯度箭頭剛好平行）！\n\n而且算出來那個神奇的乘數 `λ`（**影子價格**）還直接告訴你：「如果明天預算多給你 1 元，你的總爽度能多增加多少！」", "lv2": "拉格朗日思維在經濟、投資與資源分配的落地：\n\n1. **最優配置黃金條件**：把最後 1 元花在 A 項目與花在 B 項目帶來的「邊際效益」必須完全相等！如果不相等，就把錢從低邊際移往高邊際，總效益一定變高！\n2. **用「影子價格（λ）」找最值錢的瓶頸**：如果某項限制（例如團隊只有 1 位設計師）的影子價格極高，代表優先花錢擴充那項資源回報最大！", "lv3": "拉格朗日函數 L(x, λ) = f(x) − λ(g(x) − c)，極值必要條件為 ∇f(x) = λ∇g(x) 且 g(x) = c。面對不等式約束（g(x) ≤ c）則推廣為 KKT 條件（Karush-Kuhn-Tucker Conditions），為線性規劃、馬可維茨投資組合效率前緣與支援向量機（SVM）的統一求解核心。"}, "myNotes": "拉格朗日乘數 λ（影子價格）直接幫你算出「每多 1 單位稀缺資源到底值多少錢」！", "relatedIds": ["calc-s1-4", "econ-s1-1", "fin-portfolio"], "updatedAt": "2026-11-24"},
        {"id": "calc-s4-2", "categoryId": "cat-calc", "stageId": "s4", "subtopic": "連續機率", "title": "機率密度函數（PDF）與積分：從連續分佈算出真實機率", "oneLiner": "投骰子可以問「擲出 3 點的機率」，但身高是連續數字，問「剛好 170.000000... 公分的機率」其實是 0——連續世界的機率永遠看「區間下面的面積（積分）」。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "丟一顆骰子只有 1–6 六種結果，每個面機率都是 1/6。但如果量全台灣男生的身高，身高可以是 `170.1`、`170.1234`、`170.1234567...` 有無限多種可能！\n\n所以問「隨機挑一個人，身高剛好精準等於 170.000000 公分（無限多個零）」的機率是 **0**！我們真正問的是「身高落在 **170 到 175 公分之間** 的機率」——也就是鐘形曲線（機率密度函數 PDF）在 170 到 175 之間圍出來的 **面積（定積分）**！而整條曲線下的總面積永遠等於 **1（100%）**。", "lv2": "看懂統計圖表 PDF 與 CDF 的實用差別：\n\n1. **PDF（鐘形曲線）**：高度代表「資料在這裡有多密集」，面積才代表「機率」。\n2. **CDF（累積分佈函數，從左一路積分到 x）**：一路從 0% 爬到 100% 的 S 型曲線，直接一秒查出「我的分數贏過全國多少 % 的人（百分位數）」！\n3. 金融風控的 **風險值（VaR）** 就是找報酬分佈曲線最左邊 5% 尾巴面積的切點。", "lv3": "連續隨機變數 X 之機率由 P(a ≤ X ≤ b) = ∫[a,b] f_X(x) dx 定義，累積分佈函數 F_X(x) = ∫[−∞,x] f_X(t) dt，依微積分基本定理即得 F'_X(x) = f_X(x)。期望值 E[X] = ∫ x·f(x) dx 則對應物理上的質量重心（Center of Mass）。"}, "myNotes": "鐘形曲線的「高度」不是機率，「某區間下面的面積（積分）」才是真實機率！", "relatedIds": ["calc-s2-1", "data-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "calc-s4-3", "categoryId": "cat-calc", "stageId": "s4", "subtopic": "訊號分析", "title": "傅立葉變換直覺：把任何複雜聲音與波形拆成簡單純音的總和", "oneLiner": "把一杯混好的綜合果汁倒放回原來的「2 顆蘋果 + 1 根香蕉 + 3 顆草莓」——傅立葉變換能把任何複雜的音樂、心電圖或影像拆回最純粹的基礎頻率。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "當整個交響樂團同時演奏小提琴、大鼓跟長笛時，空氣中傳進你耳朵的其實只是「一條扭曲得超複雜的聲波線」。\n\n法國數學家傅立葉發現了一個近乎魔法的定理：**全世界任何再複雜的波形，都可以完美拆解成一堆簡單正弦波（純音）加起來！**\n\n你的手機天天都在瘋狂跑 **快速傅立葉變換（FFT）**：\n• 降噪耳機：把環境音拆出高頻與低頻，把轟轟飛機引擎頻率精準消掉，保留清晰人聲！\n• MP3 音樂與 JPEG 圖片壓縮：拆出頻率後，把人耳聽不到、人眼看不出來的高頻雜訊直接丟掉，檔案瞬間縮小十倍！", "lv2": "跨領域應用傅立葉「時域 ↔ 頻域切換」思維：\n\n1. **看時間序列資料（如銷售額、網站流量）**：在時間軸看起來亂七八糟的曲線，切到頻率視角一看，立刻抓出「每 7 天一個週末週期 + 每 365 天一個季節週期」！\n2. **醫療影像與通訊**：MRI 核磁共振成像、5G Wi-Fi 訊號傳輸、Shazam 聽歌辨識全靠傅立葉變換運作。", "lv3": "連續傅立葉變換 F(ω) = ∫[−∞,∞] f(t) e^(−iωt) dt 將函數由時域（Time Domain）無損映射至頻域（Frequency Domain）；Cooley-Tukey（1965）提出快速傅立葉變換（FFT）將離散計算複雜度由 O(N²) 驟降至 O(N log N)，被譽為 20 世紀對數位文明影響最深遠的演算法之一。"}, "myNotes": "降噪耳機、MP3、JPEG、Wi-Fi 跟聽歌辨識，背後竟然全都是傅立葉「把果汁拆回原水果」的魔法！", "relatedIds": ["calc-s2-1", "it-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "calc-s4-4", "categoryId": "cat-calc", "stageId": "s4", "subtopic": "數學世界觀", "title": "微積分看世界：邊際分析、曲線下面積與動態平衡思維", "oneLiner": "忘掉考試背過的所有積分表也沒關係——只要留下「看變化率（微分）、看長期累積（積分）、看反曲轉折」三副眼鏡，微積分就已經滋養你一輩子。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "很多人念完高中大學最疑惑：「我平常買菜又不用算 `∫ sin(x) dx`，學微積分到底要幹嘛？」\n\n其實微積分給你的不是手算能力（那交給電腦就好），而是 **看懂動態世界的三副超級眼鏡**：\n1. **微分眼鏡（看一階斜率與二階加速度）**：一家公司今年營收還在上漲（一階 > 0），但成長率已經連三季減速（二階 < 0），高手立刻嗅到見頂警訊！\n2. **積分眼鏡（看長期累積面積）**：每天進步 1% 看起來微不足道，但對 365 天積分累積起來的總面積驚人到不可思議！\n3. **動態平衡眼鏡**：萬物都在變化、反饋與收斂中尋找平衡點。", "lv2": "把微積分世界觀直接帶進每天的決策：\n\n1. **不只看「現在在哪（位置）」、更要看「往哪走（一階導數）」與「是在加速還是減速（二階導數）」**——選產業、挑公司、觀察自己習慣進度都超準！\n2. **分辨「瞬時高峰」與「曲線下面積（長期總效用）」**：不要為了追求一時短暫衝頂而把後面整段人生曲線透支掉，追求一生總積分最大化！", "lv3": "史蒂芬・斯托加茨《無限的力量》（Infinite Powers）揭示微積分核心哲學為「無限原理（Infinity Principle）」：面對任何彎曲、複雜、動態的難題，皆可先「無限切碎成簡單的線性局部（微分）」，逐一解完後再「重新加總還原全局（積分）」，此乃人類理性征服非線性世界的最強方法論。"}, "myNotes": "看趨勢必看三層：目前位置（值）、方向（一階）、加速或減速（二階）！", "relatedIds": ["calc-s2-2", "cross-systems"], "updatedAt": "2026-11-24"},
        {"id": "art-s1-1", "categoryId": "cat-art", "stageId": "s1", "subtopic": "鑑賞起點", "title": "建立「形式、內容與語境」的三層鑑賞眼光", "oneLiner": "進美術館看畫或看建築不再只能說「好漂亮、好酷」——依序問「眼睛看到什麼（形式）、它在講什麼（內容）、當時發生什麼事（語境）」，一秒變行家。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "很多人不敢逛美術館，覺得自己看不懂現代藝術（例如一整片白布畫一條線竟然賣一億！）。\n\n其實只要帶上 **三層鑑賞眼鏡**，看任何畫作、攝影、建築都立刻有話聊：\n1. **形式（眼睛直接看到的）**：它用了什麼顏色、光線從哪裡照過來、線條是溫柔的還是尖銳躁動的？這讓我感覺平靜還是壓迫？\n2. **內容（畫面在說的故事）**：主角是誰？他的表情與動作藏著什麼情緒或象徵？\n3. **語境（創作當下的時代背景）**：藝術家是剛經歷戰爭、剛失戀，還是為了反抗當時的權威才故意這樣畫？\n\n藝術沒有標準考卷答案，你的真實第一眼感受就是最棒的入口！", "lv2": "逛展覽不再走馬看花的「慢看 3 分鐘法則」：\n\n1. 別想把館裡 200 幅畫全部拍完（那只會腿痠又全忘光），整場只挑 **3 幅第一眼就拉住你的作品**，每幅靜靜站著看滿 3 分鐘。\n2. **先看作品 1 分鐘感受情緒，再去讀旁邊牆上的說明牌**，才不會被策展人牽著鼻子走。\n3. 離開前用一句話記下「這件作品哪個細節最打動我」。", "lv3": "藝術史學家 Erwin Panofsky 提出圖像學三層分析法：前圖像描述（自然形式與線條色彩）→ 圖像誌分析（典故與母題）→ 圖像學闡釋（文化、時代精神與深層象徵語境），為西方視覺文化詮釋的經典方法論。"}, "myNotes": "逛展挑 3 件最吸睛的作品「先看 1 分鐘感受，再看說明牌」，比拍兩百張照深刻十倍！", "relatedIds": ["art-s1-2", "art-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "art-s1-2", "categoryId": "cat-art", "stageId": "s1", "subtopic": "西方藝術史", "title": "西方藝術史極簡主軸：從古典寫實、印象派到現代抽象", "oneLiner": "19 世紀「照相機」發明之後，畫家發現再怎麼努力也畫不過快門一秒，於是徹底解放雙手——開始畫光線瞬間（印象派）、畫內心焦慮（表現主義）與純粹觀念（當代藝術）。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "用 60 秒貫穿 500 年西方繪畫史，你會瞬間懂為什麼現代藝術越畫越不像：\n\n1. **文藝復興（達文西、米開朗基羅）**：發明透視法與精準解剖，追求「畫得跟神一樣完美寫實」。\n2. **巴洛克（林布蘭、卡拉瓦喬）**：像電影打聚光燈一樣，玩極致明暗戲劇光影。\n3. **歷史大轉折——照相機發明了！**：既然相機 1 秒就能拍出 100% 寫實，畫家就問「那繪畫還能幹嘛？」\n4. **印象派（莫內、雷諾瓦）**：走出畫室，快速捕捉陽光灑在水面上那一秒的色彩震動！\n5. **後印象派與現代（梵谷、畢卡索、康丁斯基）**：不畫眼睛看到的，改畫「內心的狂熱情緒、同時從多角度看到的立體世界，甚至純粹的點線面與觀念」！", "lv2": "看懂現代／當代藝術不再困惑的關鍵問句：\n\n1. 面對古典畫問：「它怎麼用構圖與光線講神話故事？」\n2. 面對印象派與表現派問：「藝術家當下感受到什麼光線溫度或內心情緒？」\n3. 面對杜象《噴泉》（小便斗）等當代觀念藝術問：「他想透過這個惡作劇挑戰什麼社會定義或提問？」", "lv3": "藝術史學家 E. H. Gombrich《藝術的故事》指出西方藝術演進是「圖式與修正（Schema and Correction）」的對話史；隨攝影術普及與現代主義興起（Clement Greenberg 形式主義），繪畫逐步剝離敘事再現義務，轉向媒介本質與觀念哲學探索。"}, "myNotes": "「照相機的發明」是解鎖整個現代藝術史的萬能鑰匙——畫家從此改畫相機拍不到的情緒與觀念！", "relatedIds": ["art-s1-1", "art-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "art-s1-3", "categoryId": "cat-art", "stageId": "s1", "subtopic": "東方美學", "title": "東方美學核心：留白、氣韻生動與侘寂（Wabi-Sabi）", "oneLiner": "西方古典美學愛對稱、填滿與永恆大理石；東方美學卻鍾愛「不畫出來的大片留白」、時間留下的裂痕（金繼），以及無聲勝有聲的克制餘韻。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "把西方油畫跟中國水墨畫擺在一起，一秒看出兩大文明截然不同的審美密碼：\n\n• **留白（計白當黑）**：水墨畫常常整張紙 70% 全是空白，但你一眼就看得出那是雲霧、是江水、是無邊天空——「沒畫出來的地方」讓觀眾用想像力自己填滿，餘韻無限！\n• **侘寂（Wabi-Sabi）**：欣賞「不完美、不對稱、會隨時間老去」的自然之美！例如日本茶碗摔裂了，匠人不用膠水偷偷黏起來假裝沒事，而是用純金漆沿著裂痕修補（**金繼**），把傷痕變成獨一無二的歷史之美！", "lv2": "把東方留白與侘寂美學融入現代設計與生活：\n\n1. **視覺與寫作留白**：不必把每句話、每個角落塞到滿出來，留 30% 空白給觀眾呼吸與體會，高級感反而暴增。\n2. **空間與生活減法**：擁抱天然材質（木、石、亞麻、陶）隨使用產生的溫潤包漿與歲月痕跡，而非只追逐冰冷塑膠新品。\n3. 接受人生與作品的「動態不完美」，把歷練修補成自己的金繼紋路。", "lv3": "南齊謝赫《古畫品錄》提出六法，以「氣韻生動」居首，強調神似與筆墨流動勝於形似；日本美學受禪宗影響發展出侘寂（千利休茶道美學）與物哀（本居宣長），透過克制、簡素與無常觀照抵禦過度裝飾與消費主義疲勞。"}, "myNotes": "金繼哲學太美：不遮掩裂痕，而是用金漆把傷痕修成獨一無二的生命紋路！", "relatedIds": ["design-s1-2", "art-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "art-s1-4", "categoryId": "cat-art", "stageId": "s1", "subtopic": "視覺語言", "title": "光影、構圖與色彩情緒：大師如何默默操縱你的心情", "oneLiner": "大師從不靠旁白告訴你「這裡很溫馨」或「這裡有危險」——改一下光線角度、斜線構圖與冷暖色溫，你的大腦半秒就自動入戲。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "為什麼看電影或名畫，還沒聽到台詞你心裡就毛毛的或暖暖的？因為視覺創作者都在偷偷撥這三個情緒旋鈕：\n\n1. **構圖幾何情緒**：\n   • 水平線／正三角形 → 穩定、莊嚴、安全感。\n   • 傾斜對角線（荷蘭角）→ 不安、速度感、衝突即將爆發！\n2. **光影魔術**：柔光順光顯親切夢幻；強烈側光或底光（一半臉亮、一半臉黑）瞬間製造神祕、懸疑或內心掙扎。\n3. **色彩溫度**：暖橘黃色帶來懷舊、食慾與溫暖；冷青藍色帶來孤獨、科技感或冷酷疏離（電影最愛「橘青互補色調 Teal & Orange」拉高高級電影感！）。", "lv2": "日常拍照、拍美食與做簡報配圖的立竿見影四招：\n\n1. **拍美食與人像選「窗邊 45 度自然側光」**：立體感與質感瞬間碾壓頭頂死白日光燈！\n2. **善用引導線（Leading Lines）**：馬路、欄杆、走廊延伸線指向主角，視線自然被吸進去。\n3. **前景虛化加層次**：拍照時在鏡頭前緣微帶一點綠葉或杯緣，畫面立刻有電影景深感。", "lv3": "從文藝復興明暗對照法（Chiaroscuro，如卡拉瓦喬與林布蘭三角光）到現代電影色彩分級（Color Grading），視覺敘事仰賴知覺心理的跨感官聯想（色溫、明度對比與重心失衡）直接繞過理性分析觸發情感共鳴。"}, "myNotes": "拍美食與日常照只要靠窗找「45 度自然側光」+「橘青冷暖對比」，質感立刻像雜誌大片！", "relatedIds": ["design-s2-1", "art-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "art-s2-1", "categoryId": "cat-art", "stageId": "s2", "subtopic": "劇本結構", "title": "經典三幕劇與節拍表：好故事為何讓人欲罷不能", "oneLiner": "為什麼好萊塢大片跟高分動漫總在「第 25 分鐘踏上冒險、第 75 分鐘陷入最慘低谷、最後逆轉」？因為這條情緒過山車最貼合人類大腦的專注節奏。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "幾乎所有讓你看到忘記吃爆米花的電影，切開來都藏著 **三幕劇** 骨架：\n\n• **第一幕（前 25%｜建立與點火）**：先看主角原本的日常與小缺點 → 突然發生「激勵事件」（例如收到霍格華茲入學信、家園遇襲）→ 主角猶豫一下決定踏進新世界！\n• **第二幕（中間 50%｜試煉與谷底）**：一開始打怪挺順（有趣與遊戲）→ 中點出現大反轉 → 壞人反撲把主角打到失去一切（**靈魂暗夜**，全片最絕望時刻！）。\n• **第三幕（最後 25%｜覺悟與高潮）**：主角在谷底真正看懂自己的內在課題 → 整合力量打贏最終決戰 → 帶著全新自己回到世界！", "lv2": "看電影、追劇與寫長文簡報的節拍拆解用法：\n\n1. 下次看高分電影時偷偷瞄一下進度條，你會驚訝發現轉折點幾乎精準落在 **25%、50%、75%**！\n2. **寫演講與品牌故事直接套三幕**：現況日常（20%）→ 遭遇危機與反覆踩坑摸索（50%）→ 關鍵頓悟與破局收穫（30%），聽眾絕對從頭聽到尾！", "lv3": "溯源於亞里斯多德《詩學》之「開端、中段、結尾」與戲劇弧線（Freytag's Pyramid），由 Syd Field 系統化為現代電影三幕結構，Blake Snyder《救貓咪》（Save the Cat!）更細分為 15 個精準頁數節拍（Beat Sheet），成為全球影視工業共通的敘事工程藍圖。"}, "myNotes": "好故事一定要有「靈魂暗夜（75% 處最慘低谷）」——沒有先跌到谷底，最後逆轉就不夠爽！", "relatedIds": ["comm-s3-2", "art-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "art-s2-2", "categoryId": "cat-art", "stageId": "s2", "subtopic": "角色塑造", "title": "角色弧光（Character Arc）與內外衝突設計", "oneLiner": "觀眾愛上一個角色從來不是因為他開外掛超完美，而是看他在「想要什麼（外在目標）」與「真正需要什麼（內在成長）」之間掙扎蛻變。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "為什麼「樣樣滿分、從不犯錯的完美超人」看十分鐘就讓人覺得超無聊，反而像鋼鐵人（一開始自大愛現，最後願意犧牲自己救世界）或《天外奇蹟》的固執老爺爺讓人哭到不行？\n\n秘密就在 **Want（表層想要的）vs Need（內心真正需要的）**：\n• 鋼鐵人一開始 Want 的是名氣與掌控一切，但他真正 Need 的是學會信任夥伴與承擔責任。\n• 故事的動人之處，就是看角色原本抱著一個「錯誤執念（Lie）」，經歷重重打擊後親手打破執念、完成蛻變——這條心理成長曲線就是 **角色弧光**！", "lv2": "寫人物故事、自媒體人設與品牌敘事的三個心法：\n\n1. **有缺點才真實可愛**：適當展露自己曾經卡關、猶豫、踩雷的脆弱面，觀眾共鳴感瞬間拉滿。\n2. **沒有衝突就沒有故事**：衝突分三層——人與環境（求生）、人與人（對手／觀念對立）、人與自己（內心恐懼與誘惑拉扯，最深刻！）。\n3. **好反派都覺得自己是對的**：立體反派不是無腦壞人，而是「抱著另一套合理價值觀走到極端的人」。", "lv3": "現代劇作理論（Robert McKee《故事》／K. M. Weiland）將角色弧光分為正向蛻變弧（克服內在謊言擁抱真理）、悲劇墮落弧（如《教父》麥可／《絕命毒師》老白，執念吞噬人性）與扁平堅定弧（主角內在堅定，轉而改變周遭腐敗世界），指出唯有在「兩難極壓抉擇」下，角色真實性格方能顯影。"}, "myNotes": "人物魅力密碼 = 表層 Want 與內在 Need 的拉扯 + 願意展現真實缺點與成長！", "relatedIds": ["art-s2-1", "art-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "art-s2-3", "categoryId": "cat-art", "stageId": "s2", "subtopic": "電影語言", "title": "鏡頭語言與剪輯魔法：運鏡、蒙太奇與潛台詞", "oneLiner": "同樣一張面無表情的臉，前面接「一碗熱湯」觀眾覺得他好餓，前面接「一口棺材」觀眾覺得他好悲傷——這就是電影剪輯「1 + 1 > 2」的蒙太奇魔法。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "好導演最厲害的地方叫 **Show, Don't Tell（演出來，別用嘴巴唸出來）**！\n\n四個一看電影立刻看懂導演小心機的視覺密碼：\n• **仰拍（由下往上拍）**：讓角色看起來像巨人一樣威風、充滿壓迫力；**俯拍（由上往下）**：讓角色顯得渺小、無助孤單。\n• **特寫鏡頭（Close-up）**：逼近眼睛或顫抖的手，強迫觀眾直視角色藏不住的內心戲。\n• **庫里肖夫效應（蒙太奇魔法）**：把同一個面無表情的演員鏡頭，分別接在「熱湯、棺材、可愛小孩」後面，觀眾大腦會自己腦補出飢餓、悲傷跟慈愛三種完全不同的演技！", "lv2": "把鏡頭語言用在拍短影音、VLOG 與簡報視覺敘事：\n\n1. **遠景定場 → 中景互動 → 特寫抓情緒**：拍旅行或美食短片只要交替這三種景別，剪出來立刻有紀錄片高級感！\n2. **善用「潛台詞（Subtext）」**：角色嘴上說「我沒事，你去忙吧」，鏡頭特寫他默默攥緊衣角的手——話沒說滿，觀眾心裡反而更有戲！", "lv3": "蘇聯蒙太奇學派（庫里肖夫、愛森斯坦）證明電影意義誕生於「鏡頭與鏡頭之間的碰撞張力（Dialectical Montage）」而非單一畫面本身；結合巴贊的長鏡頭理論（保留時空完整性），構成當代影像剪輯與視聽敘事的兩大美學支柱。"}, "myNotes": "拍美食或旅遊短片只要交替「遠景定場 + 中景互動 + 特寫細節」，剪出來立刻像電影！", "relatedIds": ["art-s1-4", "art-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "art-s2-4", "categoryId": "cat-art", "stageId": "s2", "subtopic": "聲音敘事", "title": "聲音設計與配樂心理：為何關掉聲音恐怖片就不可怕了", "oneLiner": "視覺決定你「看到什麼」，聲音直接繞過理智決定你「感覺到什麼」——有時候高潮前那 1 秒的「完全靜音」，比炸裂音效更震撼人心。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "試試看把一部超可怕的鬼片按靜音來看——你會發現恐怖程度瞬間掉了 **70%**，甚至有點搞笑！\n\n聲音設計師操縱情緒的三把暗器：\n1. **主題動機（Leitmotif）**：《星際大戰》黑武士一出場那段低沉銅管、《名偵探柯南》破案神曲一響，大腦不用看畫面就自動熱血或緊張！\n2. **反差配樂**：激烈打鬥或悲劇畫面配上極度溫柔平靜的鋼琴曲，衝擊力反而比吵鬧配樂強十倍！\n3. **爆炸前的「真空靜音」**：把所有背景音突然抽空 0.5 秒再炸出關鍵音效，雞皮疙瘩瞬間掉滿地！", "lv2": "影音創作、簡報配樂與空間選歌的實用技巧：\n\n1. **背景音樂絕不搶人聲**：配樂音量壓在人聲底下，並挑選無歌詞的純音樂避免大腦語言區打架。\n2. **環境音（Ambience）造臨場感**：拍咖啡店或料理影片，保留一點點磨豆聲、煎牛排滋滋聲與倒水聲，感官代入感直接拉滿！", "lv3": "電影聲音理論家 Michel Chion 提出「視聽契約（Audio-Visual Contract）」與「附加價值（Added Value）」概念：人耳對不諧和音程、次聲波低頻（Infrasound）與突發瞬態音量具演化警戒反射，使聲音成為影像敘事中最隱蔽卻最強力的情感控制器。"}, "myNotes": "美食與生活影片保留一點「滋滋煎煮聲、倒水聲」，比套罐頭神曲更有高級臨場感！", "relatedIds": ["art-s2-3", "art-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "art-s3-1", "categoryId": "cat-art", "stageId": "s3", "subtopic": "空間美學", "title": "建築與空間美學：尺度、動線、採光與場域氛圍", "oneLiner": "走進高聳挑高的美術館瞬間感到敬畏平靜，走進溫暖低矮的小木屋感到安心放鬆——建築其實是「用光線與空間尺度雕刻出來的立體音樂」。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "下次去逛咖啡廳、飯店或美術館，別只看裝潢貴不貴，試著感受四個藏在空間裡的魔法開關：\n\n1. **尺度與挑高（大教堂效應）**：挑高空間會讓大腦自動切換成「宏觀發散創意模式」；低矮包覆感空間（像小書房角落）則讓人專注細節、有安全感。\n2. **光線設計**：安藤忠雄說「沒有光，空間就不存在」——自然天光隨時間在清水模牆上移動，讓靜止的房子活起來！\n3. **動線的「收與放」**：先穿過一條微微窄暗的入口廊道，轉個彎眼前豁然開朗迎來整片落地窗綠意，驚喜感直接翻倍！", "lv2": "改造自家房間與書桌的平價空間美學四招：\n\n1. **把冰冷死白的吸頂燈關掉一半，改用多點「暖色溫（2700K–3000K）間接檯燈／立燈」**：房間氛圍 5 秒從辦公室變精品飯店！\n2. **留出視覺呼吸面**：收納往封閉櫃子藏，桌面與牆面保留乾淨留白。\n3. **借景與綠意**：書桌面向窗光或放一盆姿態優雅的植物，瞬間提升長時間工作的身心愉悅度。", "lv3": "建築現象學（Peter Zumthor《氛圍》、Juhani Pallasmaa《肌膚之目》）強調空間體驗為視覺、聲學殘響、溫度與材質觸感的全身感官統合；環境心理學亦證實「大教堂效應（Cathedral Effect, Meyers-Levy & Zhu 2007）」中天花板高度直接影響抽象創造力與細節專注力之切換。"}, "myNotes": "改造居家質感最便宜神招：把頭頂死白大燈換成多點暖光（3000K）間接檯燈立燈！", "relatedIds": ["art-s1-3", "art-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "art-s3-2", "categoryId": "cat-art", "stageId": "s3", "subtopic": "音樂聆聽", "title": "音樂聆聽入門：旋律、和聲、節奏與情緒張力設計", "oneLiner": "不懂五線譜也能聽懂古典、爵士與流行神曲的秘密：音樂永遠在玩同一場遊戲——先製造一點點「緊張懸念（張力）」，再給你「回到家般的釋放（解決）」。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "把一首歌想成一道料理，它其實只有三個主要食材：\n• **節奏（骨架）**：讓你忍不住跟著點頭打拍子的心跳速度。\n• **旋律（主角）**：你聽完回家會忍不住哼出來的那條主線。\n• **和聲／和弦（情緒濾鏡）**：同一條旋律，配上大調聽起來陽光開朗，換成小調瞬間變憂鬱深情！\n\n為什麼有些歌副歌一進來就讓人起雞皮疙瘩？因為作曲家先在前面堆高「緊張、懸在半空」的感覺，再精準在副歌第一拍「完美落地釋放」——這跟好電影的劇情轉折原理 100% 一樣！", "lv2": "升級聽歌體驗的「分層聆聽」小遊戲：\n\n1. 選一首你超愛的歌重聽 3 遍：第 1 遍只聽主唱旋律；第 2 遍刻意把耳朵鎖定在最底層的「貝斯與鼓點節奏」；第 3 遍專心聽背景藏著的弦樂、吉他或和聲——你會驚訝原來這首歌藏了這麼多細節！\n2. 依場景配背景音：寫作深度工作選低人聲 Lo-Fi、巴洛克古典或極簡鋼琴，運動衝刺選高 BPM 強節奏。", "lv3": "西方調性音樂建立於「主和弦（Tonic，穩定歸屬）→ 下屬和弦（出發）→ 屬七和弦（Dominant，最高不穩定張力）→ 解決回主和弦（Cadence）」的張力—釋放循環；神經音樂學（David Huron《甜蜜的期待》）證實大腦預測迴路在「延遲滿足後精準命中預期」瞬間會釋放強烈多巴胺獎賞。"}, "myNotes": "同一首歌試著「只盯著底層貝斯和鼓點」重聽一次，立刻像開了高解析度外掛！", "relatedIds": ["art-s2-4", "calc-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "art-s3-3", "categoryId": "cat-art", "stageId": "s3", "subtopic": "感官品評", "title": "飲食文化與感官品評框架：風味輪、平衡感與餐桌敘事", "oneLiner": "吃美食別只會說「好好吃、很香、入口即化」——用「香氣前中後調 + 酸甜鹹鮮苦平衡 + 口感對比」三把尺，瞬間寫出讓人流口水的專業食評！", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "為什麼專業美食家或咖啡師喝一口就能講出一長串「前段帶柑橘花香、中段焦糖圓潤、尾韻回甘」？其實舌頭只分得出五種基本味覺（酸、甜、苦、鹹、鮮），80% 的「風味」全是靠**鼻後嗅覺（香氣）**聞出來的！\n\n讓一道料理封神的四大黃金密碼（《鹽、油、酸、熱》）：\n• **鹽**放大原本鮮味、**油**載運香氣與滑順感、**酸**（檸檬／醋）在油膩中拉出清爽亮點、**熱**透過梅納反應創造焦香酥脆！\n• 再加上 **口感反差**（外酥內嫩、熱布朗尼配冰香草冰淇淋），大腦直接宣告滿分！", "lv2": "寫出高質感美食評論與品評筆記的四步框架：\n\n1. **視覺與第一口衝擊**：色澤、擺盤熱氣、咬下去的「聲音與質地（酥脆／彈牙／綿密）」。\n2. **味道平衡與層次**：前段第一印象（如炭火焦香）→ 中段主體（肉汁甜鮮）→ 尾韻（胡椒微辛或回甘，不膩口）。\n3. **具體類比（借風味輪詞彙）**：別只說「很香」，說出「像烤堅果、奶油焦糖還是清香柚子皮」。\n4. **情境與記憶故事**：這道菜適合配什麼飲料、跟誰一起吃最棒。", "lv3": "感官科學（Sensory Science）以 SCA 咖啡風味輪與品酒結構（酸度、單寧、酒體、餘韻）將主觀體驗標準化；分子料理研究亦證實梅納反應（Maillard Reaction，140–165°C 胺基酸與還原糖生成數百種香氣分子）與多重感官對比（溫差、軟硬差、酸脂平衡）是人類大腦判定「極致美味」的底層生物機制。"}, "myNotes": "寫美食心得必備四層：視覺熱氣 → 口感反差（外酥內嫩）→ 前中後味平衡 → 具體香氣類比！", "relatedIds": ["comm-s2-4", "art-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "art-s3-4", "categoryId": "cat-art", "stageId": "s3", "subtopic": "器物工藝", "title": "工藝、材質與器物設計：從包浩斯到日本民藝精神", "oneLiner": "好器物不是擺在玻璃櫃裡供起來的昂貴擺飾，而是每天拿在手上「順手到忘記它的存在、卻越用越有溫潤光澤」的生活夥伴。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "兩股深刻影響現代人買東西與挑家具的百年美學思潮：\n\n1. **德國包浩斯（Bauhaus）**：「形隨機能（Form Follows Function）」——拿掉一切無用的浮誇雕花，用幾何線條、誠實材質做出「既極簡好看、又平價好用」的現代器物（從 IKEA、無印良品到 Apple 產品全是包浩斯的孫子！）。\n2. **日本民藝運動（柳宗悅）**：真正最美的東西不是皇宮裡的華麗花瓶，而是無名工匠為了每天真實使用做出來的「用之美」——一個握起來剛剛好貼合手掌、倒茶絕不滴漏的日常茶壺！", "lv2": "升級日常選物眼光的三個檢驗標準：\n\n1. **誠實材質優先**：原木、不鏽鋼、玻璃、陶瓷、純棉真皮，往往越用越有味道；廉價貼皮塑膠則越用越斑駁。\n2. **拿在手上的「觸覺與重量」**：買馬克杯、鍵盤、筆或椅子時，親自感受配重、重心與邊緣打磨細節。\n3. **少買十件廉價消耗品，不如買一件陪伴十年的好器物**（長期攤提反而更省錢又提升每天幸福感）。", "lv3": "包浩斯學院（Walter Gropius, 1919–1933）彌合了純藝術與工業量產鴻溝，奠定現代工業設計與 Dieter Rams「好設計十原則」（Less, but better）；柳宗悅之民藝哲學則強調日常實用性、在地風土與職人手作溫度，兩者共同構成當代極簡溫潤美學的雙重基因。"}, "myNotes": "好設計十原則的精髓：「Less, but better（少，卻更好）」——少買消耗品，多選陪伴十年的好器物！", "relatedIds": ["art-s1-3", "art-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "art-s4-1", "categoryId": "cat-art", "stageId": "s4", "subtopic": "靈感系統", "title": "模仿、拆解與再創造：建立個人靈感資料庫的方法", "oneLiner": "沒有任何藝術家或創作者是憑空變出靈感的——所有原創大師都是「大量收藏好作品 → 拆解背後結構 → 跨界混搭重組」的高手。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "畢卡索說過一句超誠實的話：「好的藝術家複製，偉大的藝術家偷竊。」這裡的「偷」不是抄襲，而是 **看透它為什麼這麼厲害，把底層骨架學起來用在你自己的題材上**！\n\n為什麼大家手機裡存了 500 張漂亮參考圖，真正要做東西時卻還是想不出來？因為「只收藏不拆解」！只要每次存一張好圖、一段好文案時，強迫自己順手補一句註解：**「它哪個具體設計打中了我？（例如：極大數字配細黑框線、暖橘光暈配純白）」**，靈感庫立刻變活的！", "lv2": "建立個人高戰力靈感庫（Swipe File）的三步驟：\n\n1. **按「功能與情緒」分類而非只按平台**：分成「神級開場句」「高級排版與配色」「超懂比喻」「好笑幽默反轉」。\n2. **拆解三要素**：看這件作品如何處理「結構、節奏、反差」。\n3. **跨界混搭（原創誕生的秘訣）**：只抄同一個領域叫抄襲；把「電影節奏 + 雜誌排版 + 技術筆記」三種養分混在一起，就是獨一無二的原創風格！", "lv3": "Austin Kleon《像藝術家一樣偷竊》與創造力認知科學（組合式創新 Combinatorial Creativity）指出，高創造力個體的核心優勢並非天降靈光，而是建立高密度的跨領域範本庫並能進行「遠距結構重組（Bisociation, Arthur Koestler）」。"}, "myNotes": "存參考圖或金句時多寫一句「到底哪個細節打動我」，收藏夾才會真正變成創作彈藥庫！", "relatedIds": ["design-s4-3", "cross-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "art-s4-2", "categoryId": "cat-art", "stageId": "s4", "subtopic": "跨界敘事", "title": "跨媒介敘事轉譯：把電影節奏用在簡報與產品體驗", "oneLiner": "最頂尖的產品發表會（像賈伯斯發表 iPhone）根本不是在介紹硬體規格，而是照著電影三幕劇的懸念、反派與高潮節奏在演一場秀！", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "回想當年賈伯斯發表初代 iPhone：他沒有一上台就唸「本機搭載 412MHz 處理器與 3.5 吋螢幕」，而是先拋出大懸念：「今天蘋果要推出三樣革命性產品：寬螢幕 iPod、革命性手機、網路通訊裝置……（重複三次吊足胃口）……其實它們不是三個裝置，而是同一個！我們叫它 iPhone！」全場尖叫沸騰！\n\n把電影導演的招式搬到你的簡報、網頁或教學裡：\n• **有懸念開場**、**有明確反派（舊方法的痛點）**、**有視覺呼吸留白**、**有驚喜收尾（One More Thing）**！", "lv2": "把敘事美學注入日常專業產出的四個切入點：\n\n1. **報告結構**：把枯燥流程改寫成「舊痛點（反派）→ 轉折發現（關鍵洞察）→ 新方案登場（英雄時刻）」。\n2. **網站與 App 體驗**：首次打開的歡迎畫面就像電影開場 3 分鐘，立刻讓使用者感受到氛圍與核心價值。\n3. **長文節奏**：高密度硬核段落之後，緊接著插一段輕鬆生活比喻或圖表，有張有弛不疲勞。", "lv3": "跨媒介敘事（Transmedia Storytelling, Henry Jenkins）與體驗設計指出，無論載體是銀幕、簡報、網頁介面或實體空間，人類注意力皆遵循一致的戲劇張力曲線（Tension-Release Arc），善用視覺節奏與懸念設計能將資訊傳遞效率提升為情感記憶烙印。"}, "myNotes": "簡報與產品發表會也要設一個「反派（讓大家痛恨的舊麻煩）」，你的解法登場時全場才會拍手！", "relatedIds": ["art-s2-1", "comm-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "art-s4-3", "categoryId": "cat-art", "stageId": "s4", "subtopic": "流行文化", "title": "流行文化與次文化解讀：從動漫、遊戲到迷因的時代心理", "oneLiner": "別小看爆紅動漫、手遊或網路迷因（Meme）——它們往往是整個世代最誠實的集體情緒晴雨表，看懂它們就看懂當代人的渴望與焦慮。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "為什麼某一陣子「異世界轉生開外掛」動漫突然全球爆紅？為什麼大家瘋狂轉傳厭世貼圖、躺平迷因與療癒系角色（像吉伊卡哇）？\n\n流行文化從來不是隨機巧合，它直接照出一個時代集體心裡最缺什麼：\n• 現實生活努力回報變慢、壓力太大 → 大家就愛看「努力馬上看到升級回饋」的爽感作品，或「被溫柔接住」的軟萌療癒 IP！\n• **迷因（Meme）** 更是現代版的成語與浮世繪：用一張圖配 6 個字，一秒壓縮整個世代的共同幽默與默契！", "lv2": "把流行文化觀察變成行銷、創作與跨世代溝通利器：\n\n1. **看爆紅現象必問「它幫觀眾紓解了哪種真實情緒？」**（焦慮、孤獨、渴望被認可、想逃離壓力）。\n2. 做 LINE 貼圖、自媒體或產品文案時，精準捕捉當代人「想講又不好意思直講」的微情緒（例如「禮貌性崩潰」「微笑加班」），極易引發瘋狂共鳴與轉傳！", "lv3": "文化研究學派（Stuart Hall 編碼／解碼理論）與 Richard Dawkins（1976《自私的基因》提出 Meme 文化複製子概念）指出，流行文化與次文化不僅是被動娛樂消遣，更是邊緣與年輕世代進行身分認同協商、象徵抵抗與集體情緒代償的重要場域。"}, "myNotes": "爆紅 IP 與貼圖背後永遠對應著一個時代最真實的「集體情緒缺口」！", "relatedIds": ["soc-s4-2", "mkt-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "art-s4-4", "categoryId": "cat-art", "stageId": "s4", "subtopic": "品味養成", "title": "打造個人生活美學標準：減法篩選與長期品味複利", "oneLiner": "好品味不是花大錢買滿名牌 Logo，而是「看過夠多真正好的東西，清楚知道自己喜歡什麼、不要什麼」，並用減法守住生活品質。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第七階段擴充課綱", "levels": {"lv1": "很多人以為「品味 ＝ 很有錢」，其實完全不是！把五個不同名牌大 Logo 同時穿在身上反而常顯得雜亂；反觀一套剪裁俐落、配色和諧的平價衣服配上一只乾淨好錶，走出來氣場超高級！\n\n養成好品味只要兩件事：**「提高眼界輸入」＋「日常減法篩選」**。\n• 多看經典電影、頂尖設計網站、建築展覽與好書，把眼睛「養刁」了，你自然一眼就能辨別廉價粗製濫造。\n• 買東西與整理空間時「寧缺勿濫」，只留下真正讓你每次看到都覺得舒服順眼的物品。", "lv2": "無痛累積個人品味複利的四個小習慣：\n\n1. **定出你的個人視覺／穿搭三色系**：衣櫃與書桌圍繞 3 個互相百搭的顏色建構，每天出門 30 秒就有整體感。\n2. **定期「審美排毒」**：取消追蹤製造焦慮與廉價聳動的帳號，改追蹤 5 個真正高質感的攝影、建築、設計或文字創作者。\n3. **在預算內優先投資「每天接觸超過 1 小時的東西」**：床墊、椅子、螢幕、鍵盤、水杯、鞋子，幸福感投資報酬率最高！", "lv3": "品味（Taste）在美學與設計實務中被定義為「高品質辨別力與一致篩選標準的內化能力」。在 AI 讓內容與視覺「生成成本趨近於零」的時代，**稀缺的不再是產出速度，而是知道什麼叫真正好作品的「策展與品味判斷力（Curatorial Taste）」**。"}, "myNotes": "在 AI 什麼都能一秒生成的時代，最值錢的個人護城河之一就是「知道什麼叫真正好的品味」！", "relatedIds": ["art-s3-4", "design-s4-4"], "updatedAt": "2026-11-24"},
