<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #FFFFFF;
      --ink-main: #18181B;
      --ink-sub: #3F3F46;
      --ink-muted: #52525B;
      --brand-orange: #FF7A00;
      --brand-orange-hover: #E66A00;
      --brand-sky: #A6D5F7;
      --font-scale: 1;
    }

    html {
      font-family: 'Noto Sans TC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-main);
      background-color: var(--bg-canvas);
      font-size: calc(16px * var(--font-scale));
      scroll-behavior: smooth;
    }

    body {
      background-color: #FFFFFF;
      background-image:
        radial-gradient(620px 380px at 8% -4%, rgba(166, 213, 247, 0.34), transparent 70%),
        radial-gradient(560px 340px at 94% 2%, rgba(255, 122, 0, 0.14), transparent 70%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(228, 228, 231, 0.92);
      box-shadow: 0 8px 30px -14px rgba(24, 24, 27, 0.08);
    }

    .btn-pill-orange {
      background-color: var(--brand-orange);
      color: #FFFFFF;
      border-radius: 9999px;
      transition: all 0.18s ease;
    }
    .btn-pill-orange:hover {
      background-color: var(--brand-orange-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px -6px rgba(255, 122, 0, 0.5);
    }

    .btn-pill-ghost {
      background-color: rgba(255, 255, 255, 0.92);
      color: var(--ink-main);
      border: 1px solid #E4E4E7;
      border-radius: 9999px;
      transition: all 0.16s ease;
    }
    .btn-pill-ghost:hover {
      border-color: #A1A1AA;
      background-color: #FAFAFA;
    }

    .group-tab-active {
      background-color: #18181B;
      color: #FFFFFF;
      border-color: #18181B;
      box-shadow: 0 4px 14px -4px rgba(24, 24, 27, 0.35);
    }

    .level-tab { transition: all 0.18s ease; }
    .level-tab.active-lv1 {
      background: #FFF7ED;
      color: #C2410C;
      border-color: #FF7A00;
      box-shadow: 0 2px 10px -4px rgba(255, 122, 0, 0.35);
    }
    .level-tab.active-lv2 {
      background: #EFF6FF;
      color: #1D4ED8;
      border-color: #3B82F6;
      box-shadow: 0 2px 10px -4px rgba(59, 130, 246, 0.35);
    }
    .level-tab.active-lv3 {
      background: #F4F4F5;
      color: #18181B;
      border-color: #18181B;
      box-shadow: 0 2px 10px -4px rgba(24, 24, 27, 0.25);
    }

    .prose-content {
      line-height: 1.9;
      color: #27272A;
      white-space: pre-line;
    }

    .mono { font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #A1A1AA; }
  </style>
</head>
<body class="text-zinc-900 antialiased selection:bg-orange-100 selection:text-orange-900">

  <!-- Mobile Search Bar -->

  <!-- Main Workspace Layout -->

    <!-- Left Sidebar: Collapsible Group Accordion Navigation -->
    <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-20 left-0 z-50 lg:z-10 h-full lg:h-[calc(100vh-6rem)] w-80 lg:w-72 shrink-0 bg-white lg:bg-transparent p-5 lg:p-0 overflow-y-auto transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="glass-card rounded-3xl p-4 flex flex-col gap-3.5">

            <button id="btnManageTopics" type="button" class="text-xs font-medium text-[#FF7A00] hover:text-[#E66A00] px-2.5 py-1 rounded-full bg-orange-50 hover:bg-orange-100 transition">
              ＋ 管理分類

        <!-- Overview Shortcut -->
        <button id="btnViewAll" type="button" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition text-left">

          </button>
          <button id="btnViewGraph" type="button" class="w-full flex items-center justify-between px-3.5 py-2 rounded-2xl text-sm font-semibold transition text-left text-zinc-700 hover:bg-zinc-100 border border-transparent">
            <span class="flex items-center gap-2.5">
              <i data-lucide="network" class="w-4 h-4 text-sky-600"></i>
              跨領域知識圖譜
            </span>

          </button>

        <!-- Collapsible Group Accordion Nav -->
        <nav id="categoryNav" class="flex flex-col gap-2" aria-label="五大群組可折疊導覽"></nav>

        <!-- Cross-Domain Tags Filter -->
        <div class="pt-3 border-t border-zinc-200/80">
          <div class="text-xs font-semibold text-zinc-500 mb-2 flex items-center justify-between">

            <button id="btnClearTag" type="button" class="text-[#FF7A00] hover:underline hidden">清除</button>
          </div>

        </div>

        <!-- Quick New Card Button -->
        <div class="pt-2 border-t border-zinc-200/80">
          <button id="btnNewCard" type="button" class="w-full btn-pill-ghost py-2.5 px-3 text-sm font-semibold flex items-center justify-center gap-1.5 hover:border-[#FF7A00] hover:text-[#FF7A00]">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            手動新增知識卡
          </button>

      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="mainContent" class="flex-1 min-w-0 pb-16"></main>
  </div>

  <!-- Modal Container -->
  <div id="modalOverlay" class="fixed inset-0 z-50 bg-zinc-900/45 backdrop-blur-xs hidden flex items-center justify-center p-4 overflow-y-auto">

    <i data-lucide="check-circle-2" class="w-4 h-4 text-[#FF7A00]"></i>
    <span id="toastText"></span>
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'zhiguang_kb_v2_grouped_data';
      const PREF_KEY = 'zhiguang_kb_v2_prefs';

      // 5 Top-Level Domain Groups (分類模式：徹底避免首頁拉太長)
      const DEFAULT_GROUPS = [
        { id: 'grp-tech', name: '科技與數據', icon: 'cpu', desc: '資訊架構、演算法、微積分直覺、數據統計與產品創新' },
        { id: 'grp-biz', name: '商業與財富', icon: 'briefcase', desc: '金融投資、經濟學決策、商業管理與行銷增長' },
        { id: 'grp-strat', name: '思辨與局勢', icon: 'shield', desc: '跨領域模型、邏輯哲學、兵法謀略、歷史地緣與社會潛規則' },
        { id: 'grp-expr', name: '表達與美學', icon: 'pen-tool', desc: '結構寫作、口語說話技巧、語言跨文化、視覺設計與藝術鑑賞' },
        { id: 'grp-life', name: '身心與命理', icon: 'sparkles', desc: '行為心理學、東方命理哲學與精力人生作業系統' }
      ];

      // Helper to build 4 stages with complete syllabus items concisely
      function mkStages(arr) {
        return arr.map((item, i) => ({
          id: 's' + (i + 1),
          order: i + 1,
          title: item[0],
          goal: item[1],
          syllabus: item[2] // array of unit titles in this stage
        }));
      }

      // 21 Complete Domains (each with 4 stages x 4 syllabus units = 336 total structured units!)
      const DEFAULT_CATEGORIES = [
        // === Group 1: 科技與數據 (4) ===
        {
          id: 'cat-it', groupId: 'grp-tech', name: '資訊科技', icon: 'cpu', accent: '#2563EB',
          description: '從運算地基、網路系統架構到生成式 AI 與工程自動化，建立現代數位世界的完整認知拼圖。',
          stages: mkStages([
            ['階段一・運算與資料地基', '建立程式效率、資料儲存與版本協作直覺。', ['資料結構與時間複雜度（Big-O）', '二進位、字元編碼與記憶體運作原理', '關聯式資料庫（SQL）與索引設計基礎', '版本控制（Git）與軟體開發生命週期']],
            ['階段二・系統與網路架構', '看懂前後端、API、資安驗證與雲端部署。', ['API、前後端分離與 RESTful 架構', '網路協定全貌：DNS、HTTP/HTTPS 與 TCP/IP', '身分驗證與資訊安全（JWT、OAuth、加密雜湊）', '容器化（Docker）與雲端部署基礎概念']],
            ['階段三・AI 與大語言模型核心', '穿透 AI 黑盒子，掌握注意力機制、RAG 與幻覺控制。', ['Transformer 與注意力機制（Attention）', '機器學習三範式：監督、非監督與強化學習', 'Token、Embedding 向量與 RAG 檢索增強生成', '模型幻覺、評測基準與上下文視窗管理']],
            ['階段四・工程化與 AI 問題解決', '把技術整合成自動化工作流與個人解題槓桿。', ['AI 蒸餾思維與系統化除錯框架', '結構化提示工程與 AI Agent 工作流設計', '資料視覺化與商業智慧（Star Schema／指標設計）', '低成本個人產品架構：靜態前端 vs 輕量後端選型']]
          ])
        },
        {
          id: 'cat-algo', groupId: 'grp-tech', name: '演算法與計算思維', icon: 'binary', accent: '#1D4ED8',
          description: '獨立深耕計算思維：從排序搜尋、樹與圖論、動態規劃到生活與推薦系統背後的演算法邏輯。',
          stages: mkStages([
            ['階段一・基礎資料結構與搜尋排序', '看懂資料怎麼排最快、怎麼找最省力。', ['二分搜尋與分治思維（Divide & Conquer）', '經典排序演算法對照：快排、合併與堆積排序', '堆疊（Stack）、佇列（Queue）與鏈結串列實戰場景', '雜湊表（Hash Table）碰撞處理與快取（LRU）設計']],
            ['階段二・樹、圖論與路徑搜尋', '把地圖導航、社群人脈與依賴排程抽象成節點與邊。', ['廣度優先（BFS）與深度優先（DFS）搜尋直覺', '最短路徑演算法（Dijkstra／A*）與導航原理', '拓撲排序（Topological Sort）與任務依賴排程', '最小生成樹與連通性在網路建設中的應用']],
            ['階段三・最佳化核心：貪婪與動態規劃', '學會拆解重疊子問題，避開暴力窮舉的指數爆炸。', ['貪婪演算法（Greedy）的適用條件與反例陷阱', '動態規劃（DP）入門：從費氏數列到背包問題', '回溯法（Backtracking）與剪枝加速技巧', '滑動視窗與雙指標：把 O(n²) 降維成 O(n) 的利器']],
            ['階段四・現實世界中的演算法應用', '看懂日常 App 推薦、加密與排程背後的真實演算法。', ['推薦系統演算法：協同過濾與內容推薦原理', '搜尋引擎排序邏輯（PageRank 與倒排索引）', '機率與近似演算法：布隆過濾器與蒙地卡羅模擬', '演算法思維用於日常決策：37% 最佳停止法則']]
          ])
        },
        {
          id: 'cat-data', groupId: 'grp-tech', name: '數據分析與統計素養', icon: 'bar-chart-3', accent: '#0284C7',
          description: '串聯資訊、金融與行銷的實證利器：識破平均數與百分比陷阱，掌握抽樣、因果推論與商業指標設計。',
          stages: mkStages([

        {"id": "strat-s1-1", "categoryId": "cat-strat", "stageId": "s1", "subtopic": "孫子兵法", "title": "廟算與五事七計：開戰前先算出勝率的情報框架", "oneLiner": "真正的高手從不在戰場上賭運氣，而是在動手前就先用結構化指標把勝率算清楚。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "準備一場重要球賽前，如果教練只喊「大家加油！衝就對了！」，這隊通常會輸很慘。孫子兵法第一篇《始計篇》說的「廟算」，就是開打前先在會議室把雙方實力攤開來比一比：\n\n• 道：團隊是不是一條心？\n• 天：大環境與時機對誰有利？\n• 地：主場優勢、地形與資源誰比較好？\n• 將：帶隊的人有沒有能力與判斷力？\n• 法：平常的紀律與獎懲制度清不清楚？\n\n「多算勝，少算不勝」——把這五件事先盤點完，勝率高才出手，勝率低就先練兵或換戰場。", "lv2": "把「五事七計」套用在商業提案、轉職或創業前的實戰清單：\n\n1. 先算再做：寫一張「我方 vs 對手」五維評分表（願景凝聚力、市場時機、通路資源、核心人才、執行紀律）。\n2. 辨識關鍵差距：不需要五項全贏，但必須知道自己靠哪一兩項建立壓倒性優勢。\n3. 設定「不打條件」：如果盤點完五項全輸，最聰明的戰略不是硬拚，而是延後或重選戰場。", "lv3": "《孫子兵法・始計篇》以「五事（道天地將法）」與「七計（主孰有道、將孰有能、天地孰得、法令孰行、兵眾孰強、士卒孰練、賞罰孰明）」建構古典決策分析矩陣。\n\n• 戰略哲學核心在於「先勝而後求戰」（《形篇》），與現代策略管理中的資源基礎觀（RBV）及戰前情報評估（Pre-Commitment Assessment）高度呼應：將不確定性盡可能前置消化於決策期，而非留待執行期承受不可逆代價。"}, "myNotes": "開新專案或投資前，先做五事七計盤點再決定要不要投入！", "relatedIds": ["cross-first-principles", "strat-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "strat-s1-2", "categoryId": "cat-strat", "stageId": "s1", "subtopic": "孫子兵法", "title": "不戰而屈人之兵：伐謀、伐交與最低成本贏法", "oneLiner": "硬碰硬打贏也往往兩敗俱傷，最高段的勝利是透過改變規則與結盟讓對手主動放棄對抗。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "兩家飲料店開在對面搶客人，最笨的方法是互相砍價砍到一杯 15 元，最後兩家一起賠錢倒閉（這叫「攻城」，成本最高）。\n\n孫子把贏法分成四個等級：\n1. 上兵伐謀：在對手剛想出計畫前，你就搶先推出獨家新品或鎖定核心客群，讓他打消開戰念頭。\n2. 其次伐交：跟周邊學校社團或外送平台結盟，孤立對手。\n3. 其次伐兵：正面行銷對決。\n4. 其下攻城：流血價格戰硬拼。\n\n真正會算帳的贏家，追求的是「代價最小、成果完整」，而不是打得最慘烈。", "lv2": "在職場與商業競爭中落實「全勝思維」：\n\n1. 遇衝突先問「有沒有雙贏或合作解（伐交）」：把潛在競爭者變成上下游夥伴，往往比正面消滅對方更賺錢。\n2. 搶佔標準與心智（伐謀）：在大家還在比拼規格參數時，重新定義客戶在意的新標準。\n3. 算清隱性戰損：就算贏了一場無謂的口水戰或價格戰，若賠掉團隊士氣與現金流，本質上就是輸了。", "lv3": "《謀攻篇》提出「全國為上，破國次之」，強調戰略目標是保存資源完整性（Full-Value Preservation）而非單純擊潰敵軍。\n\n• 與現代博弈論對照：伐謀對應「先發承諾與威懾（Preemptive Commitment）」改變對手預期報酬；伐交對應「聯盟博弈（Coalition Game）」重組多方均衡，避免陷入雙輸的消耗戰（War of Attrition）。"}, "myNotes": "遇到競爭先想「伐謀」跟「伐交」，永遠把流血硬拼放在最後一格。", "relatedIds": ["strat-s1-1", "strat-36-overview"], "updatedAt": "2026-11-24"},
        {"id": "strat-s1-3", "categoryId": "cat-strat", "stageId": "s1", "subtopic": "孫子兵法", "title": "虛實奇正：以正合、以奇勝的節奏與重心轉移", "oneLiner": "用常規主力穩住基本盤（正），再把關鍵奇兵打在對手最空虛意想不到的地方（奇）。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "看籃球比賽時，隊友先在弧頂穩穩傳導吸引防守（這叫「正」），趁對手全盯著持球者時，另一位隊友突然從底線空切接球上籃得分（這叫「奇」）。\n\n「虛實」就是避開對方人最多的銅牆鐵壁（實），專挑對方沒人防守的空檔（虛）進攻。就像水流永遠往低處流，聰明的做法不是拿頭去撞高牆，而是找到縫隙集中火力突破。", "lv2": "把虛實奇正用在產品、行銷與個人職涯：\n\n1. 先守正、再出奇：基本品質與主業口碑是「正」，沒有基本盤的奇招只是曇花一現；有了基本盤後，再用差異化創意當「奇」拉開差距。\n2. 資源集中法則：小團隊千萬不要處處跟大公司對打（無所不備則無所不寡），挑大公司覺得太小或太麻煩的細分痛點集中打穿。\n3. 保持彈性：當你的奇招被對手抄去變成常態，它就成了新的「正」，此時要立刻準備下一波奇招。", "lv3": "《勢篇》「凡戰者，以正合，以奇勝」與《虛實篇》「避實而擊虛」揭示了非線性兵力集中（Force Concentration）與動態不對稱原理。\n\n• 奇正並非固定招式而是相對轉化關係（奇正相生，如循環之無端）；透過製造「形（表象誘餌）」迫使對手分散配置資源，我方則在局部形成絕對優勢兵力比。"}, "myNotes": "小團隊打大市場的唯一活路就是「避實擊虛」＋「局部集中優勢」。", "relatedIds": ["mkt-stp", "strat-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "strat-s1-4", "categoryId": "cat-strat", "stageId": "s1", "subtopic": "孫子兵法", "title": "借勢與造勢（兵勢篇）：讓環境推著你贏的槓桿思維", "oneLiner": "一顆圓石放在平地上推不動，但放在千仞高山上輕輕一推就勢不可擋——位置與趨勢決定成敗。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "騎腳踏車逆風爬坡，踩到腳抽筋時速也只有 10 公里；但如果是順風下坡，輕輕一踩就能衝到 40 公里。\n\n孫子說的「勢」，就是這股大環境給你的推力。與其花十倍力氣逆著趨勢硬扛，不如先花時間觀察「現在的風往哪裡吹」（例如 AI 工具普及、高齡化需求），站到順風口上，同樣一份努力就能換來十倍成果。", "lv2": "實務中運用「借勢與造勢」的三步驟：\n\n1. 借大勢（趨勢選擇）：選對正在成長的賽道，比在萎縮市場當第一名輕鬆得多。\n2. 借平台勢（槓桿放大）：善用既有大平台流量、成熟開源工具與 AI 協作，不要凡事從零造輪子。\n3. 造小勢（節奏引爆）：新品發布或重要提案前先累積種子口碑與預熱，把能量壓縮到同一時間點釋放（如轉圓石於千仞之山）。", "lv3": "《兵勢篇》「故善戰者，求之於勢，不責於人」指出卓越領導者靠「系統結構與環境勢能（Structural Momentum）」驅動勝局，而非盲目壓榨個體意志力。\n\n• 對應物理與商業策略：「形」是靜態實力積累，「勢」是位能轉動能的釋放機制；節（時機節奏）如「擴弩發機」，強調能量蓄積與精準觸發點。"}, "myNotes": "「求之於勢，不責於人」——個人成長也是靠設計環境與順應趨勢，而不是靠死撐！", "relatedIds": ["cross-systems", "mkt-flywheel"], "updatedAt": "2026-11-24"},
        {"id": "strat-s2-2", "categoryId": "cat-strat", "stageId": "s2", "subtopic": "三十六計核心", "title": "攻戰計與混戰計：主動破防與複雜亂局中的精準收割", "oneLiner": "進攻時要抽掉對手最底層的支撐（釜底抽薪），身處亂局時則先穩住自己再趁勢取利（渾水摸魚）。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "這兩套計謀專門用來處理「想主動突破僵局（攻戰計）」與「場面一團混亂（混戰計）」：\n\n• 釜底抽薪：鍋裡水一直滾，拿杓子舀冷水降溫沒完沒了，直接把鍋底的柴火抽掉，水立刻就不滾了——意思是解決問題要直攻最根本的原因。\n• 擒賊擒王：抓到整個團隊的核心關鍵人物或解決最核心瓶頸，其他小問題自然瓦解。\n• 隔岸觀火：兩派人馬吵得不可開交時，別傻傻跳進去當炮灰，站遠一點觀察局勢演化。\n• 暗渡陳倉：明面上走常規路線吸引注意，暗地裡用新方法悄悄達成目標。", "lv2": "現代職場與專案破局對照：\n\n1. 釜底抽薪：面對不斷冒出的客服客訴，不要只加派人手滅火，直接修掉產品設計源頭的 Bug。\n2. 擒賊擒王：跨部門推動困難案子時，先找到真正握有拍板權與影響力的關鍵人對齊共識。\n3. 趁火打劫 → 現代版「危機承接」：市場動盪或競品出包時，提前準備好穩定可靠的替代方案，順勢承接流失客戶。", "lv3": "攻戰計（打草驚蛇、借屍還魂、調虎離山、欲擒故縱、拋磚引玉、擒賊擒王）聚焦「打破敵方防禦結構」；混戰計（釜底抽薪、渾水摸魚、金蟬脫殼、關門捉賊、遠交近攻、假途伐虢）聚焦「在多方高度不確定動態中辨識高槓桿節點」。\n\n• 系統論視角：釜底抽薪與擒賊擒王皆對應「切斷系統關鍵存量供給或核心節點（Hub Removal）」，以最小干預成本瓦解對手整體結構。"}, "myNotes": "遇到複雜爛攤子先別急著撲火，想想哪裡是「鍋底的柴火」（釜底抽薪）。", "relatedIds": ["strat-36-overview", "strat-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "strat-s2-3", "categoryId": "cat-strat", "stageId": "s2", "subtopic": "三十六計核心", "title": "並戰計與敗戰計：多方合縱與劣勢止損的翻盤智慧", "oneLiner": "多方博弈時懂結盟借力（並戰計），處於絕對劣勢時則敢於果斷撤退保留火種（走為上策）。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "當場上不只兩個人，或是你已經明顯處於下風時，硬拚只會全軍覆沒：\n\n• 遠交近攻：跟沒有直接利益衝突的遠方夥伴結盟，先專心處理眼前的核心對手。\n• 反客為主：一開始以協助者或合作夥伴身分進入，慢慢掌握核心話語權與關鍵資源。\n• 空城計：資源暫時見底時，冷靜展現自信與專業氣場，不自亂陣腳反而讓對手不敢輕舉妄動。\n• 走為上策：三十六計的最後一計不是投降，而是「留得青山在」——認清這局勝算歸零時，果斷止損退場，把實力留到下一場會贏的戰役。", "lv2": "劣勢翻盤與止損的實戰心法：\n\n1. 承認劣勢不丟臉：創業或投資看錯方向時，能果斷執行「走為上策」的人，才有機會活到下一波行情。\n2. 苦肉計／連環計的現代啟發：坦承自身小缺點反而能建立極高真實信任感；重要行動應設計多步驟互鎖方案，不把希望押在單一奇蹟上。\n3. 多方合縱：在生態系中永遠多交朋友、少樹敵，讓合作夥伴站在你這邊。", "lv3": "並戰計（偷樑換柱、指桑罵槐、假痴不癲、上屋抽梯、樹上開花、反客為主）處理「非零和與多方聯盟動態」；敗戰計（美人計、空城計、反間計、苦肉計、連環計、走為上）則體現「極端劣勢下的風險控制與不對稱翻盤」。\n\n• 實物選擇權（Real Options）視角：「走為上策」等同於在預期淨現值持續為負時行使「放棄選擇權（Abandonment Option）」，鎖死最大損失並保留資本的未來選擇權。"}, "myNotes": "走為上策就是策略版的「止損」！跟心理學的克服沉沒成本完全呼應。", "relatedIds": ["psy-loss-aversion", "strat-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "strat-s2-4", "categoryId": "cat-strat", "stageId": "s2", "subtopic": "現代對照", "title": "三十六計的現代商戰與職場對照圖譜", "oneLiner": "把古典軍事計謀剝除殺伐外衣，還原成商業定位、談判佈局與自我保護的現代思考模型。", "tags": ["#經典案例", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "讀古書最怕只會背成語卻不知道怎麼用。其實打開財經新聞，天天都在上演現代版三十六計：\n\n• 拋磚引玉：軟體公司提供超好用的免費工具（磚），吸引大量專業用戶付費升級（玉）。\n• 樹上開花：小品牌透過跟知名設計師聯名或設計高質感官網，讓自己看起來具備大品牌氣場。\n• 借屍還魂：把過氣的老品牌或經典 IP 重新包裝，結合現代社群行銷再次爆紅。\n• 假痴不癲：在還沒摸清會議室裡各方立場前，先低調傾聽裝作虛心請教，不急著亮底牌。", "lv2": "建立個人「三十六計現代轉換清單」的三原則：\n\n1. 去零和化：古代戰場是你死我活，現代職場與商業多半是「重複賽局」，計謀要以「創造資訊與結構優勢」為目標，而非欺騙毀約。\n2. 雙向解讀：每個計謀同時寫下「我能如何正派借力」與「別人若對我用這招，我該怎麼拆解」。\n3. 場景標籤化：依「談判、競爭、危機、合作」四場景歸類，遇到狀況直接查表。", "lv3": "策略史研究指出，古典兵法之所以能跨千年遷移至現代商管，係因其底層抽象的是「有限理性行為者在資訊不對稱與資源約束下的動態博弈結構」。\n\n• 現代應用紅線：任何違反契約誠信或法律合規的欺詐行為，在資訊高度透明與聲譽留痕的現代市場中皆屬負期望值（短期獲利遠低於長期信用破產成本）。"}, "myNotes": "把每一計都拆成「正向應用」與「反制防身」兩欄，實用度直接翻倍！", "relatedIds": ["strat-36-overview", "strat-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "strat-s3-1", "categoryId": "cat-strat", "stageId": "s3", "subtopic": "鬼谷子", "title": "捭闔術（開合之道）：掌握對話節奏的收放藝術", "oneLiner": "像推開或關上一扇門一樣控制溝通節奏：該開口引出對方想法時就「捭」，該沉默保留底牌時就「闔」。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "很多人談事情一緊張就從頭講到尾，把自己的底價、焦慮和秘密一次全倒出來，結果完全失去主導權。\n\n《鬼谷子》第一篇《捭闔》教的是「一開一合」的節奏：\n• 捭（打開）：透過提問、讚美或拋出一個小誘因，讓對方打開話匣子，說出他真正在意的事。\n• 闔（關閉）：當對方講到關鍵處，或你想觀察對方反應時，適度沉默、收住底牌，把球丟回給對方。\n\n懂收放的人，講的話不多，卻總是能掌控全場節奏。", "lv2": "在商務談判與日常溝通中練習捭闔術：\n\n1. 先捭後闔：會議前半段多問開放問題（例如「您對這個方案最重視的指標是什麼？」）讓對方充分表達。\n2. 善用 3 秒沉默（闔）：對方報出不合理條件時，不要急著反駁，平靜看著對方沉默 3 秒，對方往往會自己鬆口補充讓步空間。\n3. 檢核底牌：每次開口前先問自己「這句話講出去是幫我收集資訊，還是白白洩漏底線？」", "lv3": "《鬼谷子・捭闔第一》以陰陽動靜為哲學底蘊：「捭之者，開也，言也，陽也；闔之者，閉也，默也，陰也。」\n\n• 與現代談判心理學對照：「捭」對應資訊揭露引導（Information Elicitation），「闔」對應戰略沉默（Strategic Silence）與邊界控管；兩者交替運作能在不引發對立的情況下最大化資訊不對稱優勢。"}, "myNotes": "跟口語技巧的「沉默施壓」與高階提問完美連動！", "relatedIds": ["speak-prep", "strat-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "strat-s3-2", "categoryId": "cat-strat", "stageId": "s3", "subtopic": "鬼谷子", "title": "反應術與揣摩術：從微小線索反推對方真實底牌", "oneLiner": "不要只聽對方嘴上說的漂亮理由，透過交叉驗證與設身處地推演，看懂對方真正害怕與渴望的事。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "你想約朋友週末出去玩，他說「最近好像有點忙欸」，這句話背後可能有三種完全不同的真實想法：真的工作爆量、其實不想花錢、或是不想跟某個同行的朋友見面。\n\n鬼谷子的「反應術」就是像丟小石頭進水裡看波紋：拋出一個小測試（例如「那我們改約附近免費散步喝咖啡？」）觀察對方反應；「揣摩術」則是站到對方的位子上想：「如果我是他，我現在最在意面子、時間還是錢？」", "lv2": "職場與合作中精準判讀對方底牌的三招：\n\n1. 聽「重複出現的關鍵字」：一個人反覆提到「風險」「上級會看」「時程很趕」，那通常就是他真正的壓力源。\n2. 拋出低成本試探方案（反應術）：準備 A/B 兩個不同取捨的選項，看對方秒拒哪一個，就能精準定位他的底線。\n3. 區分「立場（他要什麼）」與「利益（他為什麼要）」：解決背後的真實利益，僵局常常瞬間解開。", "lv3": "《鬼谷子・反應篇》提出「象比」「釣語」之法，透過「以古驗今、以言釣實」逼近隱藏資訊；《揣篇》《摩篇》則將讀心拆為「揣情（量度對方的客觀處境與內在情緒）」與「摩意（順應其內在傾向微調溝通切入點）」。\n\n• 對應認知科學中的心智理論（Theory of Mind）與博弈論中的「篩選機制（Screening）」：透過設計選項組合讓對方在選擇過程中自行揭露真實偏好類型。"}, "myNotes": "準備 A/B 選項測試對方反應，比直接問「你底線是多少」聰明太多了！", "relatedIds": ["strat-s3-1", "strat-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "strat-s3-3", "categoryId": "cat-strat", "stageId": "s3", "subtopic": "鬼谷子", "title": "飛箝與摩意：建立信任引力並讓對方主動站隊", "oneLiner": "強逼別人合作只會引發反彈，先真誠肯定對方最引以為傲的價值（飛），再順勢用共贏框架鎖定合作（箝）。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "想請一位很資深的同事幫忙看企劃，如果你說「你幫我改一下這個」，他會覺得你在丟工作給他。\n\n如果換成「飛箝」的節奏：\n• 先「飛」（捧高與肯定）：「上次看你在簡報裡把數據收斂得超精準，全組就你最懂這塊的眉角！」\n• 再「箝」（順勢邀請鎖定）：「我這份草稿剛好卡在數據說服力，方便請你花 10 分鐘幫我把關兩個關鍵數字嗎？」\n\n對方不僅不會覺得被壓榨，反而會覺得被看見專業而樂意伸出援手。", "lv2": "正派運用飛箝術的三大要訣：\n\n1. 肯定必須「具體且真實」：拍空洞馬屁反而讓人起戒心，一定要點出對方真正花過心血的細節。\n2. 先給價值再提合作：先讓對方獲得被尊重感、好情報或實質幫助，合作自然水到渠成。\n3. 讓對方覺得是「自己的決定」：把建議包裝成符合對方既定目標的助力，對方會主動投入資源推動。", "lv3": "《鬼谷子・飛箝第五》：「引鉤箝之辭，飛而箝之。」本質是透過正向社會回饋降低心理防衛，再以「承諾與一致性原則（Commitment & Consistency）」鞏固合作同盟。\n\n• 倫理邊界：正派飛箝建立在真實雙贏與互補價值上；若刻意誇大虛偽吹捧以榨取對方利益，則淪為「捧殺」與操弄，長期必然反噬自身聲譽。"}, "myNotes": "真誠的具體讚美 + 清楚的小請求，就是最優雅的飛箝術。", "relatedIds": ["strat-s3-2", "strat-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "strat-s3-4", "categoryId": "cat-strat", "stageId": "s3", "subtopic": "權謀倫理", "title": "權謀倫理與長期信譽邊界：陽謀 vs 陰謀的本質差異", "oneLiner": "陰謀怕見光、拆穿就破功；陽謀攤在陽光下讓對手看清規則，卻依然不得不照你的節奏走。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "「陰謀」就像偷偷在背後造謠或設陷阱，只能用一次，一旦曝光大家以後都不敢跟你合作，信用直接歸零。\n\n「陽謀」則是把規則攤在陽光下，就算對手全部看懂也沒辦法破解！例如兩大飲料品牌競爭，一家公開宣布「全品項標示透明熱量與天然原料來源」——這招完全光明正大，對手就算知道你在逼他，要嘛被迫花大錢跟著升級原料，要嘛被消費者淘汰。", "lv2": "在現代社會用「陽謀思維」建立長期勝勢：\n\n1. 公開透明測試：任何策略出手前問自己「如果這件事明天登上新聞頭條，我還抬得起頭嗎？」\n2. 設計對自己有利的公開標準：靠長期累積的專業作品、口碑與公開透明流程形成門檻，對手抄不來也無法攻擊。\n3. 保護信用複利：現代人脈與網路都有記憶，一次陰謀賺的小錢永遠賠不起長期信任破產。", "lv3": "從重複賽局理論（Repeated Game Theory）視角，陰謀依賴一次性資訊欺瞞（One-Shot Defection），在重複互動環境下會觸發冷酷觸發策略（Grim Trigger）導致永久被排除於合作網絡之外。\n\n• 陽謀則屬於「公開承諾與結構優勢（Credible Commitment & Structural Advantage）」，透過改變整體賽局的成本結構與公開預期，即使在完全資訊（Complete Information）下仍為優勢策略。"}, "myNotes": "「攤在陽光下也無解」才是最高段、最長久的智慧！", "relatedIds": ["cross-bayes", "strat-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "strat-s4-1", "categoryId": "cat-strat", "stageId": "s4", "subtopic": "反套路防身", "title": "識破職場與商業設局：捧殺、甩鍋與資訊不對稱陷阱", "oneLiner": "學謀略最大的價值不是去算計別人，而是第一時間看出別人丟過來的「甜蜜毒藥」並優雅擋掉。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "職場或合作裡最常見的三種隱形陷阱：\n\n1. 捧殺：突然把你誇上天（「這個超難的爛攤子全公司只有你搞得定！」），目的其實是把沒人要扛的黑鍋塞給你。\n2. 口頭甩鍋：關鍵承諾永遠只用口頭講、不留文字紀錄，出事時兩手一攤說「我當初沒這樣說喔」。\n3. 製造緊迫感：故意在最後一小時才把複雜合約丟給你簽，讓你沒時間細看條款。\n\n識破這三招，就能幫你避開人生 80% 的無妄之災。", "lv2": "四個立刻能用的職場防身習慣：\n\n1. 聽到過度吹捧立刻警覺：先問清楚「資源、權限、成功標準與截止日」再決定接不接。\n2. 重要共識一律「會後文字留痕」：發一封簡短友善的確認信（Recap Email），既顯專業又能防甩鍋。\n3. 遇到催促馬上簽字時堅持「緩衝原則」：「這件事很重要，我需要確認完細節明天回覆您。」\n4. 保留獨立資訊管道，不單一依賴某個中間人傳話。", "lv3": "組織行為學將職場操弄歸納為「權力不對稱下的風險轉嫁（Risk Offloading）」與「資訊把關（Gatekeeping）」。\n\n• 反制核心在於「提高操弄者的交易成本與曝光成本」：透過書面化、多方抄送透明化（CC Alignment）與明確權責邊界（RACI），把私下模糊操作拉回公開規則下，操弄自然失效。"}, "myNotes": "會後一封簡短 Recap 確認信，就是最強又最有禮貌的防甩鍋護盾。", "relatedIds": ["strat-s3-4", "strat-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "strat-s4-2", "categoryId": "cat-strat", "stageId": "s4", "subtopic": "資訊戰防禦", "title": "資訊戰、輿論帶風向與議程設定防禦", "oneLiner": "網路上吵得最兇的議題，常常不是最重要的事；先問「誰希望我現在把注意力放在這裡？」", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "魔術師變魔術時，左手用力揮舞吸引你目光，右手就趁機把硬幣藏起來了。網路輿論跟新聞帶風向也是一樣的道理！\n\n當某個聳動話題突然洗版、讓你瞬間氣到想留言轉發時，先深呼吸 10 秒問三個問題：\n1. 這件事有沒有原始完整脈絡，還是被剪成 15 秒斷章取義？\n2. 這個消息讓誰賺到流量、或轉移了哪件更重要大事的焦點？\n3. 明天這件事還重要嗎？", "lv2": "建立個人「抗帶風向資訊濾網」：\n\n1. 延遲反應 24 小時：重大突發爭議先讓子彈飛一天，等各方證據浮出再形成觀點。\n2. 交叉比對立場相反的兩個來源：同時看正反雙方最強論點，避開單一演算法回音室。\n3. 警覺「情緒形容詞密度」：真正高品質的資訊多給事實與數據，帶風向的內容多用憤怒、恐懼與貼標籤字眼。", "lv3": "傳播學「議程設定理論（Agenda-Setting Theory, McCombs & Shaw）」指出：媒體與演算法未必能決定你『怎麼想』，但極度擅長決定你『想什麼』。\n\n• 結合「框架效應（Framing）」與「洪水區策略（Flooding the Zone）」：透過大量情緒化雜訊稀釋公眾注意力，使理性查證成本過高。防禦之道在於主動管理資訊輸入源與維持基礎率檢核。"}, "myNotes": "只要一則貼文讓你瞬間憤怒想轉發，就是最該先停下來查證的訊號！", "relatedIds": ["psy-system12", "strat-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "strat-s4-3", "categoryId": "cat-strat", "stageId": "s4", "subtopic": "不對稱破局", "title": "劣勢談判與不對稱破局：小博大的籌碼重構法", "oneLiner": "硬實力不如人時，別在對手的規則裡比大小；學會創造替代選項、拆分價值並改變賽場規則。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "如果一隻小貓跟大象比力氣，怎麼比都必輸無疑；但如果比賽項目改成「誰先爬上樹」或「誰能鑽進小洞拿鑰匙」，小貓就能輕鬆贏！\n\n在資源不如大公司或強勢對手時，破局關鍵是「不照對手的標準打」：\n• 對手資本大、流程慢 → 你就打「速度超快、高度客製化」。\n• 談判時對手覺得你非他不可 → 你就提前準備好另一個備案（BATNA），讓他知道你隨時可以轉身離開。", "lv2": "小博大與劣勢談判的四個籌碼重構法：\n\n1. 先建立備案（BATNA）：談判桌上的底氣永遠來自「談判桌外還有其他選擇」。\n2. 拆解非金錢籌碼：價格讓不動時，改談付款條件、交付時程、獨家推薦、長期合作或案例曝光。\n3. 放大你的「時間與靈活優勢」：大機構決策耗時三個月，你可以一週交付驗證版本。\n4. 善用聯盟借力：結合其他中小型夥伴形成共同採購或流量聯盟。", "lv3": "不對稱戰略（Asymmetric Strategy）核心在於改變競爭維度，將對手的「規模優勢」轉化為「慣性包袱（Incumbent's Dilemma）」。\n\n• 哈佛談判專案提出之 BATNA（Best Alternative to a Negotiated Agreement）界定了談判保留點；透過引入多議題整合談判（Integrative Bargaining），利用雙方對不同維度的邊際評價差異創造額外剩餘。"}, "myNotes": "談判底氣永遠來自「談判桌外還有備案」+「改打自己擅長的新維度」。", "relatedIds": ["strat-s1-3", "strat-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "strat-s4-4", "categoryId": "cat-strat", "stageId": "s4", "subtopic": "進退哲學", "title": "進退之道與急流勇退：看懂局勢轉折點的止盈藝術", "oneLiner": "會進攻的人很多，但能在盛極將衰前保住戰果、優雅轉身的人，才是真正笑到最後的贏家。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "玩大富翁或爬山時，大家最容易犯的錯都是在「最順的時候太貪心」：已經賺了很多卻想再賭一把更大的，結果天氣突然變壞或踩到地雷一次吐光。\n\n古人說「月盈則虧，水滿則溢」，范蠡幫越王勾踐復國成功後，馬上看出伴君如伴虎，果斷辭官經商善終；反觀留戀權位的文種最後卻慘遭賜死。懂得在局勢最高點提前留退路、分批落袋為安，才是真正的頂級智慧。", "lv2": "把「止盈與轉身智慧」落實在日常重大選擇：\n\n1. 事前寫下「滿意出場點」：無論是投資獲利、專案階段目標或一段合作，先訂好達到什麼成果就鎖定獲利，不被貪念拖著走。\n2. 辨識「邊際效益反轉」訊號：當你多投入兩倍心力，回報卻越來越小、風險越來越大時，就是該準備第二曲線的時候。\n3. 永遠留 20% 餘裕：不把名聲、體力、資金或人情一次透支到底，給自己留轉圜空間。", "lv3": "對應《易經》乾卦上九「亢龍有悔」與系統動力學的「成長上限基模（Limits to Growth）」：任何正向擴張一旦逼近環境承載極限，隱藏的負回饋力量（競爭者湧入、資源枯竭、政治反撲）將指數級放大。\n\n• 風險管理視角：在預期上檔空間收窄而尾部崩盤風險劇增時，主動降槓桿或切換賽道是最大化長期生存機率的理性選擇。"}, "myNotes": "會踩油門是本事，會在最高點優雅收手才是真智慧。", "relatedIds": ["fin-mean-reversion", "meta-yinyang"], "updatedAt": "2026-11-24"},
        {"id": "speak-s1-1", "categoryId": "cat-speaking", "stageId": "s1", "subtopic": "聲音氣場", "title": "聲音表達三要素：語速、停頓留白與關鍵字重音", "oneLiner": "聽眾記住你的重點，靠的不是講得有多快，而是講到關鍵字前那 1 秒的刻意停頓。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "聽過那種像機關槍一樣連珠炮講完十分鐘的報告嗎？聽完你只覺得好累，一個字都沒記住。\n\n專業主持人跟演說家其實只用三個超簡單的聲音開關：\n1. 語速放慢 15%：緊張時人會不自覺越講越快，刻意放慢反而顯得胸有成竹。\n2. 重點前停頓 1 秒：說「這個案子成敗的關鍵只有一件事……（停 1 秒）……留存率。」那 1 秒空白會瞬間把所有人的注意力吸過來！\n3. 關鍵字稍微加重音：每句話只挑 1 到 2 個字稍微拉慢加重，聲音立刻有立體感。", "lv2": "每天 3 分鐘就能見效的聲音訓練法：\n\n1. 手機錄音回聽 60 秒：只檢查兩件事——「我有沒有越講越快？」跟「句尾有沒有糊掉？」\n2. 腹式呼吸穩住尾音：講話前先輕吸一口氣到肚子，讓句尾保持穩定力量，避免越講越小聲顯得沒自信。\n3. 結構換段必停頓：每講完「第一點、第二點」刻意停 1.5 秒，幫聽眾大腦按下「存檔鍵」。", "lv3": "語音學與認知心理學研究（Prosody & Cognitive Processing）顯示，約每分鐘 180–220 中文字的語速搭配 0.5–1.2 秒的語意邊界停頓（Syntactic Pause），最契合聽眾短期語音迴路（Phonological Loop）的切塊吸收節奏。\n\n• 聲音權威感來自基頻穩定與停頓掌控力——敢在公開場合掌控沉默的人，潛意識裡會被賦予更高的地位與可信度。"}, "myNotes": "重點前停頓 1 秒，比提高音量十倍還有效！", "relatedIds": ["speak-s1-2", "speak-prep"], "updatedAt": "2026-11-24"},
        {"id": "speak-s1-2", "categoryId": "cat-speaking", "stageId": "s1", "subtopic": "聲音氣場", "title": "消除口頭禪（嗯、那個、就是）的刻意練習法", "oneLiner": "口頭禪其實是大腦在「怕冷場」時塞進去的噪音，把「嗯…」換成「安靜呼吸」，專業度立刻翻倍。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "為什麼大家講話常常一直冒出「嗯…然後…就是那個…」？因為大腦還沒想好下一句，又很怕空氣突然安靜會尷尬，於是嘴巴就自動發出雜音填補空白。\n\n其實聽眾根本不覺得安靜 1 秒很尷尬，反而覺得你沉穩有思考！改掉的秘訣超簡單：想說「嗯…」的時候，直接閉嘴吸一口氣，把噪音換成高級的停頓。", "lv2": "一週根除贅字的三步練習：\n\n1. 覺察統計：找一次 2 分鐘口語練習錄音，拿紙畫「正」字記下你最常說哪個贅字（例如「就是」「其實」「然後」）。\n2. 句號切斷法：強迫自己每講完一個短句就明確「閉嘴停半秒」，不靠「然後…」把十句話黏成一長串。\n3. 準備高級緩衝詞：真的需要思考時，用「這點很有意思」「我整理成兩個重點」取代「嗯嗯那個」。", "lv3": "語言心理學稱這類填充詞為「語流不暢標記（Disfluency Markers / Filled Pauses）」。當發言者處於高認知負荷（邊想內容邊組織語句）時，填充詞頻率會顯著上升。\n\n• 刻意將填充詞替換為「無聲停頓（Silent Pause）」不僅消除雜訊，還能透過視覺觀察研究證實顯著提升聽眾對講者專業度與誠信度的主觀評分。"}, "myNotes": "把「嗯、然後」全部換成「閉嘴停半秒」，光這招就能讓人耳目一新。", "relatedIds": ["speak-s1-1", "speak-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "speak-s1-3", "categoryId": "cat-speaking", "stageId": "s1", "subtopic": "非語言溝通", "title": "眼神接觸、手勢與非語言肢體信任訊號", "oneLiner": "你還沒開口前，你的眼神、站姿與手掌方向就已經替你說完一半的話了。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "跟人講話時如果對方一直低頭滑手機、雙手緊緊抱胸或眼神飄來飄去，就算他嘴上說「我很贊成」，你心裡一定覺得怪怪的。\n\n建立信任感的三個超實用肢體開關：\n• 眼神：講完一整句再換看下一個人（約 2–3 秒），不要像電風扇一樣快速左右掃射。\n• 手勢：多把「手掌稍微朝上或自然攤開」放在腰胸之間（黃金手勢盒），傳達開放與誠意，避開用食指指著對方。\n• 姿勢：肩膀放鬆微開、重心穩住，不亂晃身體。", "lv2": "一對一與上台簡報的肢體檢核表：\n\n1. 講到數字或重點時搭配具體手勢（比出「第一、第二」或「左邊 vs 右邊」），能幫聽眾視覺化記憶。\n2. 線上視訊會議技巧：講關鍵結論時看著「鏡頭小圓點」而不是螢幕下方，對方會感覺你正專注看著他的眼睛。\n3. 傾聽時適度點頭與微傾身體，對方會瞬間覺得被高度重視。", "lv3": "非語言溝通研究（含身體語言心理學與鏡像神經元機制）指出，當語言內容與非語言訊號不一致時，大腦杏仁核會優先採信非語言訊號以評估威脅或誠意。\n\n• 開放式手勢（Open Palm Gestures）在演化心理學中象徵「未持有武器與無隱瞞」，能有效降低聽眾的潛意識防衛。"}, "myNotes": "視訊開會時講重點記得看鏡頭！", "relatedIds": ["speak-s1-1", "speak-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "speak-s1-4", "categoryId": "cat-speaking", "stageId": "s1", "subtopic": "心理調適", "title": "克服上台緊張：生理降溫與把注意力轉向聽眾", "oneLiner": "緊張不是因為你不夠專業，而是大腦把「被很多人看」誤判成危險；把焦點從「我表現好不好」轉成「我能幫大家什麼」就能解開魔咒。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "上台前心跳狂飆、手心冒汗時，越跟自己說「不要緊張！不要發抖！」，反而越緊張！\n\n科學證實最有效的兩招降壓術：\n1. 生理嘆息呼吸法（Physiological Sigh）：用鼻子吸兩小口氣吸滿，再用嘴巴慢慢吐長氣，做 3 次心跳 30 秒內就會降下來。\n2. 改貼情緒標籤：不要說「我好緊張」，跟自己說「我現在好興奮、能量很滿！」（緊張跟興奮的生理反應幾乎一模一樣）。\n3. 上台前找台下 2 位友善點頭的人當「充電樁」，講話時多看看他們！", "lv2": "上台與重要發言前的 5 分鐘儀式清單：\n\n1. 只背熟「開場前 30 秒」與「結尾最後 2 句」：只要開場順了，大腦就會進入流暢狀態。\n2. 心態切換公式：把「大家會不會笑我？」換成「我今天帶了一個禮物（解決方案）要送給台下」。\n3. 允許小失誤：講錯字直接自然微笑重講就好，其實台下 90% 的人根本沒發現你漏了一頁。", "lv3": "哈佛商學院 Alison Wood Brooks（2014）實驗證明，面對演說焦慮時，採「焦慮重評為興奮（Anxiety Reappraisal: I am excited）」比強迫「冷靜下來（Try to calm down）」能顯著提升演說流暢度與說服力，因兩者皆屬高喚醒度狀態，轉換認知摩擦遠低於強行壓抑交感神經。"}, "myNotes": "上台前做三次「雙吸長吐」生理嘆息 + 只背熟前 30 秒開場！", "relatedIds": ["psy-dissonance", "speak-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "speak-s2-1", "categoryId": "cat-speaking", "stageId": "s2", "subtopic": "破冰聊天", "title": "30 秒自然破冰術：從環境、觀察與開放問句切入", "oneLiner": "破冰不需要硬擠笑話或查戶口，只要聊「此刻兩人共同看到的環境細節」，就能零尷尬開局。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "遇到陌生人或新同事最尷尬的開頭就是查戶口：「你做什麼工作？住哪裡？幾歲？」對方會覺得像在面試。\n\n自然破冰有個萬用三步驟（觀察 → 分享 → 輕提問）：\n「這場講座的場地好舒服喔（共同環境觀察），我剛剛看到他們還有準備手沖咖啡（分享小感受），你今天主要是對哪個主題最感興趣啊？（輕鬆開放問句）」\n\n因為聊的是眼前兩人都在現場的事，對方完全不用防備就能接話！", "lv2": "三個高成功率破冰切入點：\n\n1. 現場共同點：活動內容、空間裝潢、天氣交通、現場餐點。\n2. 對方身上的細節線索：特別的筆電貼紙、書、配件或剛剛他在台上提過的一句話。\n3. 輕鬆請教法：「不好意思請問一下，你之前有參加過這個社群的活動嗎？」人類天生樂意回答自己知道的小問題。", "lv3": "人際吸引心理學指出，「共同情境暴露（Shared Situational Context）」能快速建立微弱的內群體歸屬感（In-Group Affinity）；而將封閉式問題（是／否）改為低威脅開放式問題（What / How），能有效提升互動的自我揭露深度。"}, "myNotes": "破冰公式：共同環境觀察 + 自己一點感受 + 輕鬆開放小問句。", "relatedIds": ["speak-s2-2", "speak-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "speak-s2-2", "categoryId": "cat-speaking", "stageId": "s2", "subtopic": "高情商接話", "title": "接話不斷線公式：認同情緒 ＋ 延伸線索 ＋ 拋回球權", "oneLiner": "聊天會句點不是因為你沒話題，而是你只急著給結論或搶著講自己，忘了把球漂亮地拋回給對方。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "看看「句點王」跟「聊天高手」的差別：\n對方說：「我上週末去台南吃牛肉湯，排隊排了一小時但超好喝！」\n• 句點王：「喔喔不錯耶，我也很愛喝。」（空氣瞬間凝結）\n• 聊天高手：「哇排一小時也太拼了吧（認同情緒）！那間湯頭是不是偏清甜那種（延伸線索），你除了牛肉湯還有吃到哪家口袋名單？（拋回球權）」\n\n只要記住聊天像打羽球，接住對方的球之後，記得輕輕打一顆好接的球回去！", "lv2": "四個讓對話自然流動的接話技巧：\n\n1. 關鍵字抓取法：從對方剛剛那句話挑一個「名詞或情緒詞」往下問（例如抓「台南」「排隊」「牛肉湯」任一個）。\n2. 好奇心優先於給建議：對方抱怨工作累時，先同理「聽起來真的超耗神」，不要第一秒就當老師教他怎麼改進。\n3. 適度自我揭露（30% 自己 / 70% 對方）：分享一點自己的相似經驗，讓互動像雙向交流而不是拷問。", "lv3": "哈佛大學研究（Huang et al., 2017）分析數百場真實對話證實：在對話中提出較多「追問型問題（Follow-up Questions）」的人，在受訪對象心中的好感度顯著高於只換新話題或單向表達者，因其直接傳達了「主動回應性（Responsiveness）」與專注傾聽。"}, "myNotes": "聊天像打羽球：認同情緒 → 抓關鍵字延伸 → 丟回好接的球！", "relatedIds": ["speak-s2-1", "speak-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "speak-s2-3", "categoryId": "cat-speaking", "stageId": "s2", "subtopic": "高情商溝通", "title": "讚美與誇獎的進階心法：具體細節勝過空泛客套", "oneLiner": "說「你好厲害」對方三秒就忘了；點出對方「沒說出口卻花很多心血的小細節」，對方會記你一輩子。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "想像你熬夜做了超用心的簡報，A 跟你說「做得很棒喔！」，B 跟你說「你第三頁把複雜數據濃縮成那張對比圖超清楚，我一眼就看懂重點，你一定花很多時間整理吧！」\n\n哪一句讓你開心一整天？一定是 B！因為空泛稱讚像群發罐頭簡訊，具體細節的稱讚才代表「我真的有認真看見你的用心」。", "lv2": "三種讓人打從心底開心的進階讚美法：\n\n1. 誇「過程與選擇」勝過誇「天賦」：稱讚「你配色選得很有質感」勝過「你好聰明」。\n2. 誇「第二優勢」：大家常誇帥哥長得帥，你改誇他「很有條理又細心」，殺傷力翻倍。\n3. 背後讚美（第三人稱傳達）：「剛剛主管還特別稱讚你把這案子收尾得很漂亮」——間接聽到的誇獎可信度高達 100%。", "lv3": "社會心理學中的「自我驗證理論（Self-Verification Theory）」與成長型思維研究（Carol Dweck）指出：針對具體行為、策略與努力歷程的正向回饋，不僅能建立高度真實的社會連結，更能強化對方對自身勝任感的內在動機，避開廉價奉承帶來的心理戒心。"}, "myNotes": "讚美黃金公式：具體細節 + 帶來的正面影響。", "relatedIds": ["strat-s3-3", "speak-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "speak-s2-4", "categoryId": "cat-speaking", "stageId": "s2", "subtopic": "幽默魅力", "title": "幽默感底層結構：預期違背、自嘲與化解冷場技巧", "oneLiner": "幽默不是背笑話大全，而是先讓大家往左邊想，下一秒無傷大雅地轉往右邊，瞬間釋放壓力。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "為什麼脫口秀或幽默的人講一句普通的話大家就笑翻？秘密叫做「預期違背（良性衝突）」：\n\n前面先鋪一個很正經的預期：「我這個人對理財非常有紀律，每個月領薪水第一件事就是先存錢……」，大家以為你要講致富秘訣，你接著補一句：「……然後第 5 天就忍不住全部拿去繳宵夜保護費了。」\n\n最安全又最討喜的幽默就是「適度自嘲」——拿自己無傷大雅的小糗事開玩笑，永遠不會得罪人，還能瞬間拉近距離！", "lv2": "日常與簡報中安全用幽默的三條守則：\n\n1. 只開自己或共同處境（天氣、塞車、加班）的玩笑，絕對不拿別人的外貌、弱點或痛處開刀。\n2. 簡報卡頓或設備出包時用幽默化解：「看來連投影機都需要先喝杯咖啡才能開工」，瞬間把尷尬變成展現高情商的加分題。\n3. 留半秒停頓給笑點落地，不要自己急著解釋笑話。", "lv3": "心理學「良性違背理論（Benign Violation Theory, McGraw & Warren, 2010）」指出，幽默誕生於兩個條件同時成立：某件事打破了常規預期（Violation），但同時被大腦判定為安全無害（Benign）。\n\n• 過於安全則無趣，過於冒犯則令人不適；精準拿捏安全邊界並運用反差對比（Incongruity Resolution），即能穩定產出高情商幽默。"}, "myNotes": "幽默 = 安全無害的預期反轉；出糗時先輕輕自嘲，尷尬立刻消失。", "relatedIds": ["speak-s1-4", "speak-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "speak-s3-2", "categoryId": "cat-speaking", "stageId": "s3", "subtopic": "高壓應對", "title": "被質疑或挑釁時的「太極接招」：先穩情緒再轉框架", "oneLiner": "被當眾質問時立刻反擊只會變成吵架；先冷靜接住對方疑問、肯定合理部分，再把焦點拉回建設性解法。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "開會報告到一半，突然有人語氣很衝地說：「你這個方案成本這麼高，根本不可行吧！」\n\n如果硬碰硬回嘴「你根本沒看懂我的預算表！」，全場氣氛立刻結冰。\n\n試試「太極三步接招」：\n1. 停 2 秒穩住表情，不急著防衛。\n2. 感謝並重新定義問題：「謝謝你點出成本控制這個非常關鍵的風險！」（瞬間卸掉對方一半火氣）\n3. 轉回你的框架：「這也是我們把預算分兩階段執行的原因——第一階段只需 20% 成本先驗證成效，確認達標才投入後續。」", "lv2": "面對尖銳提問的萬用緩衝句型：\n\n1. 遇到沒數據或一時答不出來的問題：絕不硬掰，坦然說「這個細節我想提供最精準的數字，會後我查核完今天下午五點前回覆您。」\n2. 遇到惡意人身攻擊：只回應「事實部分」，完全無視「情緒字眼」，把對手留在自己發脾氣的尷尬裡。\n3. 把「你對 vs 我錯」改成「我們共同面對這個問題」。", "lv3": "在衝突心理學中，直接反駁會觸發對方的「心理抗拒（Psychological Reactance）」與面子防衛。太極接招（Jujitsu Persuasion / Aikido Communication）透過「先順勢認同共同目標（Agree on the Premise）」消除對立姿態，再透過「框架重構（Reframing）」奪回議題定義權。"}, "myNotes": "被質疑時的第一句話：「謝謝你點出這個非常關鍵的考量」——瞬間降溫 80%！", "relatedIds": ["speak-prep", "psy-dissonance"], "updatedAt": "2026-11-24"},
        {"id": "speak-s3-3", "categoryId": "cat-speaking", "stageId": "s3", "subtopic": "界線溝通", "title": "溫和而堅定的拒絕藝術：三明治法與替代方案話術", "oneLiner": "拒絕不代表傷感情，真正傷感情的是答應了卻做不好或滿肚子怨氣；好拒絕讓人感覺被尊重又清楚你的底線。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "同事臨時拜託你幫忙趕一份不在你工作範圍的急件，你其實忙到快炸了卻不好意思說不。\n\n用「溫和堅定三步法」拒絕，不傷和氣又守住界線：\n1. 肯定與同理：「看得出來這案子真的很趕，謝謝你想到我可以幫忙。」\n2. 明確說不（不給模糊希望）：「不過我這週手上兩個核心專案已經排滿，實在沒辦法接下這份簡報。」\n3. 給小替代選項：「但我可以把上次整理好的範本傳給你參考，應該能幫你省下一半排版時間！」", "lv2": "拒絕時最該避開的三個地雷：\n\n1. 不要過度編造複雜藉口：理由編越多，對方越容易幫你「解決藉口」逼你答應；簡短誠實說「目前行程與優先級不允許」最有力量。\n2. 不要用「我盡量看看」拖延：模糊回答會讓對方以為你答應了，最後交不出來反而更傷信任。\n3. 對事不對人：拒絕的是「這個時間點的這項任務」，不是否定對方這個人。", "lv3": "果斷溝通訓練（Assertiveness Training）將人際互動劃分為被動順從（Passive）、攻擊對立（Aggressive）與果斷尊重（Assertive）。\n\n• 正向拒絕（Positive No, William Ury）結構為「Yes!（守住自身核心價值）→ No.（清楚說出界線）→ Yes?（提出替代方案維繫關係）」，兼顧長期關係資本與個人時間主權。"}, "myNotes": "拒絕的關鍵是不給模糊希望，並順手給一個低成本替代協助。", "relatedIds": ["speak-s3-2", "psy-dissonance"], "updatedAt": "2026-11-24"},
        {"id": "speak-s3-4", "categoryId": "cat-speaking", "stageId": "s3", "subtopic": "職場溝通", "title": "向上彙報與電梯簡報：60 秒講完重點不繞圈", "oneLiner": "老闆或忙碌決策者最怕聽你從頭講流水帳；先講結論與需要他決定什麼，細節等他問再展開。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "想像你跟總經理剛好一起搭電梯，從 1 樓到 15 樓只有 45 秒。\n\n錯誤講法：「老闆，我們上週三開了個會，然後行銷部小王說最近流量有點掉，我們又查了後台資料……」（電梯門開了，你還沒講到重點！）\n\n電梯簡報神公式（結論 → 影響 → 選擇題）：\n「老闆，我們發現上週官網轉換率掉了 15%，原因是結帳頁載入太慢。技術團隊評估了兩個解法：A 方案兩天內先修圖片省一半載入時間，B 方案兩週徹底重寫。我建議先做 A 止血，您同意的話我們今天就動工？」", "lv2": "向上彙報的四個加分好習慣：\n\n1. 永遠帶著「方案選項與你的推薦」進門，不要只丟問題叫主管想辦法。\n2. 壞消息要「早報、主動報、附對策報」，千萬不要藏到蓋不住才爆。\n3. 講完 30 秒核心摘要後主動問：「這部分您想先看數據細節，還是直接確認下一步？」把主導權還給對方。", "lv3": "源自麥肯錫金字塔原理與軍事通訊 BLUF（Bottom Line Up Front）：高層決策者的注意力高度碎片化，將高資訊密度摘要前置可最小化溝通交易成本，並大幅提升決策通過率。"}, "myNotes": "電梯簡報三要素：一句話現況結論 + 影響多大 + 我建議選哪個方案。", "relatedIds": ["speak-prep", "strat-s4-1"], "updatedAt": "2026-11-24"},
        {"id": "speak-s4-1", "categoryId": "cat-speaking", "stageId": "s4", "subtopic": "情緒引導", "title": "先處理心情、再處理事情：共情引導與降溫話術", "oneLiner": "人在情緒上頭時，耳朵是關起來的；先讓對方覺得「你懂我有多氣或多難」，道理才進得去。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "朋友工作受委屈氣呼呼地找你吐苦水，如果你立刻理性分析「其實你主管這樣做也有他的考量啦」，朋友只會更火大覺得你在幫外人講話！\n\n因為人在生氣時，大腦理性區暫時斷線了。正確順序永遠是先降溫再解題：\n1. 說出他的情緒：「你花這麼多心血還被臨時改方向，換作是我也會超崩潰的！」\n2. 讓他吐完 80% 情緒。\n3. 等他語氣放軟後再問：「那你現在想先純粹發洩一下，還是我們一起想想怎麼處理最划算？」", "lv2": "安撫客戶、同事或家人的三句萬用共情開場：\n\n1. 「我完全理解你為什麼會這麼生氣／擔心，如果是我遇到這狀況也會有同樣感覺。」\n2. 「你最在意的其實是『＿＿＿』對嗎？」（精準幫對方命名痛點，信任感瞬間爆棚）\n3. 切記：共情是「理解他的感受」，不等於「無條件認同錯誤的要求」；等情緒降溫後依然可以堅定談原則。", "lv3": "前 FBI 談判專家 Chris Voss 提出的「戰術同理心（Tactical Empathy）」與「情緒標記（Labeling，如『聽起來你覺得…』）」在神經科學 fMRI 實驗中證實能顯著降低杏仁核活躍度，促使大腦重新啟動前額葉理性協商功能。"}, "myNotes": "在情緒還沒被接住前，所有正確的道理聽起來都像指責。", "relatedIds": ["psy-dissonance", "speak-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "speak-s4-2", "categoryId": "cat-speaking", "stageId": "s4", "subtopic": "談判話術", "title": "談判桌上的提問與沉默施壓：誰先說出底價就輸一半", "oneLiner": "談判不是比誰嗓門大，而是靠「怎麼做（How）」的校準問句把難題丟回對方，讓對方主動幫你找解法。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "買東西或談報價時，對手說「你們太貴了，打七折我就簽！」\n\n新手會慌張開始解釋成本或急著降價；高手會微笑反問一句魔力問題：\n「我很希望能促成這次合作，不過如果照七折這個預算，您覺得我們該怎麼調整服務範圍才能做到呢？」\n\n這句話既沒說「不行」惹毛對方，又把難題優雅地推回給對方，逼對方自己意識到「一分錢一分貨」，往往還會主動透露他真正的預算上限！", "lv2": "談判桌上最好用的四個實戰話術：\n\n1. 校準問句（Calibrated Questions）：多用「我們該如何…」「什麼條件下您會覺得合理？」，少用「為什麼（聽起來像質問）」。\n2. 鏡像覆述（Mirroring）：重複對方最後 2–3 個關鍵字並用疑問語氣停頓，對方會自動把背後細節全部講出來。\n3. 永遠保留「非現金籌碼」：絕不無條件降價，每次讓步都要換回對方的對等承諾（例如提前付款或延長合約）。", "lv3": "整合哈佛談判法與 Chris Voss《Never Split the Difference》核心：談判是資訊探索過程而非零和喊價。透過開放式「How / What」校準問句賦予對方「掌控錯覺（Illusion of Control）」，同時引導其主動投入解決我方約束條件。"}, "myNotes": "萬用談判神句：「我該怎麼做才能達到這個條件？」——溫柔又極具殺傷力！", "relatedIds": ["strat-s3-1", "strat-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "speak-s4-3", "categoryId": "cat-speaking", "stageId": "s4", "subtopic": "演說魅力", "title": "公開演說的開場鉤子、畫面感比喻與記憶金句收尾", "oneLiner": "聽眾在開場 15 秒就決定要不要滑手機，而在結尾 30 秒決定這場演講值不值得分享。", "tags": ["#實作工具", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "千萬不要再用「大家好，我是某某某，今天我要報告的主題是……」這種催眠開場了！\n\n三種 15 秒吸住全場的開場鉤子：\n1. 反常識提問：「在場有多少人覺得自己時間永遠不夠用？其實研究發現，你缺的根本不是時間。」\n2. 具體畫面故事：「去年冬天晚上十一點，我盯著電腦螢幕上閃爍的錯誤訊息……」\n3. 震撼數字對比：「同樣讀書一小時，用對方法的人吸收率是死背的 4 倍。」\n\n結尾則要收在一句「短、有對比、好背」的金句，讓聽眾散場後還記得帶走。", "lv2": "讓抽象演講瞬間變好懂的三大工具：\n\n1. 具體畫面替代抽象名詞：不要說「提升營運效率」，改說「把以前要跑五個部門蓋章三天，縮成手機按一下三分鐘」。\n2. 三的法則（Rule of Three）：人類大腦最愛三個重點，超過四個就會開始失焦。\n3. 結尾行動呼籲（CTA）：明確告訴聽眾「明天上班第一件事可以怎麼試」。", "lv3": "TED 經典演說結構研究顯示，高傳播度演講遵循「開端製造認知缺口（Curiosity Gap）→ 中段在『現況（What is）』與『願景（What could be）』間反覆對比（Nancy Duarte Sparkline）→ 結尾升華為可執行的單一核心理念（Idea Worth Spreading）」。"}, "myNotes": "好演講三件套：15 秒鉤子 + 具體生活畫面 + 一句帶得走的結尾金句。", "relatedIds": ["speak-s1-1", "speak-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "speak-s4-4", "categoryId": "cat-speaking", "stageId": "s4", "subtopic": "控場主持", "title": "即興主持與圓桌控場：串場、收斂離題與總結拔高", "oneLiner": "好主持人不是搶風頭的主角，而是讓每位來賓都發光、並把散落觀點收斂成共識的隱形導演。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "開會或當活動主持人最怕兩種失控：有人講太久偏題停不下來，或是全場一片死寂沒人說話。\n\n三個立刻見效的控場招式：\n• 優雅打斷離題：「這段背景補充超珍貴！為了確保我們今天能在五點前敲定核心方案，我們先把這點記進待辦，先拉回來看下一個決策……」\n• 化解冷場點名：不要問「大家有問題嗎？」，改成「剛剛提到實作成本，我很好奇技術組這邊怎麼看？」\n• 串場橋樑法：提煉上一位講者的一句亮點，順勢引出下一位講者。", "lv2": "高質感會議與圓桌主持的四步節奏：\n\n1. 開場 1 分鐘定調：講清楚「今天為什麼聚在這裡、結束前要產出哪兩個結論」。\n2. 中場定期做「小結（Checkpoint）」：「目前我們在 A 點已有共識，接下來針對 B 點討論十分鐘。」\n3. 平衡發言權：適時邀請安靜但懂行的專家發表看法。\n4. 結尾拔高收尾：用 30 秒把所有討論升華成一句有溫度的總結並確認下一步負責人。", "lv3": "團體促進學（Group Facilitation）強調主持人的核心職責為「流程權威（Process Authority）」而非「內容權威」：透過中立覆述（Neutral Paraphrasing）、結構化收斂（Diverge-Converge Rhythm）與心理安全維護，大幅降低團體迷思並提升集體智慧產出效率。"}, "myNotes": "優雅收斂離題的關鍵：先肯定對方價值 + 用「為了幫大家準時達成目標」當共同理由！", "relatedIds": ["speak-s4-3", "speak-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "algo-s1-1", "categoryId": "cat-algo", "stageId": "s1", "subtopic": "搜尋與分治", "title": "二分搜尋與分治思維（Divide & Conquer）", "oneLiner": "只要資料有排好順序，每次都從正中間砍一半，十億筆資料最多只要查 30 次就能精準命中。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "玩過「終極密碼（1 到 100 猜數字）」嗎？最笨的方法是從 1、2、3 慢慢猜，最慘要猜 100 次；聰明人第一把直接猜 50！\n\n如果對方說「太大」，51 到 100 瞬間全部淘汰；下一把猜 25，再砍掉一半！用這個方法，就算範圍放大到 10 億個數字，你最多只需要猜 30 次就保證猜中——這就是「二分搜尋（Binary Search）」，把大問題不斷對半切小的威力！", "lv2": "二分搜尋與分治思維的實務應用：\n\n1. 前提條件：資料必須具備「單調性（已排序或具清楚分界點）」，沒排好序不能直接二分。\n2. 除錯神器（git bisect）：程式改了 100 個版本不知哪一版改壞，直接測第 50 版，7 次測試就能精準抓出元兇！\n3. 實作避坑：寫迴圈邊界時注意 mid = left + Math.floor((right - left) / 2)，避免溢位與無限迴圈。", "lv3": "分治法（Divide & Conquer）遵循三階段遞迴結構：分解（Divide）→ 解決子問題（Conquer）→ 合併（Combine）。\n\n• 依主定理（Master Theorem）：二分搜尋 T(n) = T(n/2) + O(1) 解得 O(log n)；進階變體「對答案二分（Binary Search on Answer）」可將複雜的最佳化問題轉化為單調的「可行性判定問題」快速求解。"}, "myNotes": "git bisect 就是把二分搜尋用在找 Bug 上，超實用的日常分治思維！", "relatedIds": ["it-bigo", "algo-s1-2"], "updatedAt": "2026-11-24"},
        {"id": "algo-s1-2", "categoryId": "cat-algo", "stageId": "s1", "subtopic": "經典排序", "title": "經典排序演算法對照：快排、合併與堆積排序", "oneLiner": "不同排序法就像不同的整理撲克牌策略，理解它們的取捨就能在速度、記憶體與穩定性間選對工具。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "把一整副亂掉的撲克牌排整齊，有三種高段位玩法：\n\n• 快速排序（Quick Sort）：隨便抽一張當基準（例如 7），比 7 小的全部丟左堆、比 7 大的全部丟右堆，兩堆各自重複做，平常速度最快！\n• 合併排序（Merge Sort）：把牌拆成一小張一小張，再兩兩排好合併成大疊，速度極度穩定、永遠不會翻車。\n• 堆積排序（Heap Sort）：像辦淘汰賽，每次都直接把最大那張冠軍牌挑出來放旁邊，完全不佔額外桌面空間。", "lv2": "工程實務選型對照：\n\n1. 一般情況直接用語言內建排序（Python/Java 用 Timsort，融合合併排序與插入排序，針對「部分已排序」的真實資料極快）。\n2. 需要「穩定性」（相同分數的人保持原本先後順序）→ 選合併排序 / Timsort。\n3. 只要找「前 K 名（Top-K）」而不用全部排完 → 用大小為 K 的最小堆積（Min-Heap），複雜度僅 O(n log K)。", "lv3": "基於比較的排序演算法，其決策樹葉節點至少為 n!，故理論時間複雜度下界為 Ω(n log n)。\n\n• 快排平均 O(n log n)、原地空間 O(log n)，但最壞退化至 O(n²)（可透過隨機化或三數取中 Pivot 緩解）；合併排序最壞保證 O(n log n) 且穩定，但需 O(n) 輔助空間。若資料為有限範圍整數，計數排序／基數排序可突破比較下界達線性時間 O(n)。"}, "myNotes": "日常開發不用手寫快排，但一定要懂「穩定性」跟「Top-K 用 Heap」這兩個選型概念！", "relatedIds": ["algo-s1-1", "algo-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "algo-s1-3", "categoryId": "cat-algo", "stageId": "s1", "subtopic": "線性結構", "title": "堆疊（Stack）、佇列（Queue）與鏈結串列實戰場景", "oneLiner": "資料怎麼進、怎麼出決定了它的用途：疊盤子（後進先出）管復原，排隊買票（先進先出）管排程。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "這三種資料結構其實天天出現在你生活裡：\n\n• 堆疊（Stack，後進先出 LIFO）：像廚房疊盤子，最後放上去的盤子一定最先被拿走——這就是瀏覽器的「上一頁」跟 Word 的「Ctrl+Z 復原」原理！\n• 佇列（Queue，先進先出 FIFO）：像排隊買手搖飲，先排隊的人先拿到飲料——這就是印表機排程與客服排隊系統的原理！\n• 鏈結串列（Linked List）：像尋寶遊戲的線索紙條，每張紙條只告訴你下一張藏在哪，想在中間塞進新線索只要改一張紙條就好，不必把整排人往後挪。", "lv2": "辨識開發場景選對結構：\n\n1. 括號配對檢查、運算式求值、程式函式呼叫歷史、撤銷（Undo）功能 → 用 Stack。\n2. 非同步訊息佇列（Message Queue）、削峰填谷排程、BFS 層序遍歷 → 用 Queue。\n3. 頻繁在開頭或中間插入刪除且不需隨機索引（如雙向鏈結結合 Hash Map 做快取）→ 用 Linked List；若常需用編號直接查第 k 筆則用 Array。", "lv3": "陣列（Contiguous Array）提供 O(1) 隨機存取與優異 CPU Cache Locality，但中間插入刪除為 O(n)；雙向鏈結串列（Doubly Linked List）在已知節點指標下插入刪除為 O(1)，但隨機存取為 O(n) 且有額外指標記憶體開銷。\n\n• 單調堆疊（Monotonic Stack）與單調佇列（Monotonic Queue）是進階演算法利器，能以 O(n) 解決「下一個更大元素」與「滑動視窗最大值」問題。"}, "myNotes": "Ctrl+Z = Stack，買飲料排隊 = Queue，尋寶線索 = Linked List，一秒記牢！", "relatedIds": ["algo-s1-4", "algo-s2-1"], "updatedAt": "2026-11-24"},
        {"id": "algo-s1-4", "categoryId": "cat-algo", "stageId": "s1", "subtopic": "高速查詢", "title": "雜湊表（Hash Table）碰撞處理與快取（LRU）設計", "oneLiner": "用數學公式把名字瞬間轉成置物櫃編號達成 O(1) 秒查，再搭配 LRU 淘汰最久沒用的資料維持高速快取。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "雜湊表就像一間神奇寄物櫃：你報出名字「小明」，櫃檯用一個秘密算式瞬間算出「27 號櫃」，走過去一秒拿到東西，完全不用從 1 號櫃一個個翻。\n\n如果剛好「小美」算出來也撞到 27 號櫃（雜湊碰撞），只要在 27 號櫃裡多放一個小籃子把兩個人分開就好。\n\n而「LRU 快取（最近最少使用）」就像你的書桌：桌面空間有限，你把最常翻的書放手邊，新書要上桌時，就把「最久沒翻過的那本」收進書櫃，讓桌面永遠保持最高效率！", "lv2": "實務系統效能加速核心技巧：\n\n1. Python `dict` / `set`、JS `Map` / `Set` 底層都是雜湊表，去重、計數、兩數之和（Two Sum）查找全靠它把 O(n²) 變 O(n)。\n2. 經典系統面試與快取實作：LRU Cache = **雜湊表（O(1) 定位節點）＋ 雙向鏈結串列（O(1) 把剛用過的搬到最前面、刪掉最尾端）**。\n3. 負載因子（Load Factor）過高會讓碰撞增加，底層會自動擴容並重新雜湊（Rehashing）。", "lv3": "理想雜湊函數須具備確定性與均勻散佈性；碰撞處理分為「鏈結法（Separate Chaining，如 Java HashMap 在鏈長超閾值時轉紅黑樹避免退化為 O(n)）」與「開放定址法（Open Addressing，如 Python dict 採偽隨機探測以優化快取命中率）」。\n\n• 實務延伸：分散式快取叢集（如 Redis）採用「一致性雜湊（Consistent Hashing）」解決節點增減時的大規模資料重分佈風暴。"}, "myNotes": "LRU 快取 = Hash Map + Doubly Linked List，把兩種基礎結構組合出超強效能！", "relatedIds": ["it-bigo", "algo-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "algo-s2-1", "categoryId": "cat-algo", "stageId": "s2", "subtopic": "圖論搜尋", "title": "廣度優先（BFS）與深度優先（DFS）搜尋直覺", "oneLiner": "找最短步數像水波一圈圈擴散（BFS），走迷宮探險則是一條路走到底撞牆再回頭（DFS）。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "想像你把鑰匙掉在一棟有很多房間的大樓裡，有兩種找法：\n\n• 廣度優先（BFS）：從你站的地方像丟石頭起水波一樣，先把距離 1 步的所有房間找完，再找距離 2 步的房間。優點是「第一次找到時，保證就是步數最短的路」！\n• 深度優先（DFS）：選一條走廊一路衝到底，遇到死胡同就退回上一個岔路口換另一條。優點是「非常省腦容量（記憶體）」，適合用來探索迷宮所有可能路徑或檢查整個資料夾樹。", "lv2": "什麼題目該用 BFS，什麼該用 DFS？\n\n1. 求「無權重圖的最短路徑／最少轉乘次數／社群幾度人脈」→ 必選 **BFS**（底層用 Queue 實作）。\n2. 求「列出所有組合、判斷有沒有環、掃描連通區塊（如算地圖有幾座島）」→ 優先 **DFS**（用遞迴或 Stack 實作）。\n3. 必備防呆：在圖（Graph）裡搜尋一定要記下 `visited`（已拜訪集合），否則會在環狀路線裡永遠繞圈圈！", "lv3": "對具 V 個頂點與 E 條邊的圖，BFS 與 DFS 時間複雜度皆為 O(V + E)。\n\n• 空間複雜度權衡：對寬而淺的樹，DFS 空間 O(h) 遠優於 BFS 的 O(w)；對極深樹狀結構，遞迴 DFS 可能觸發 Call Stack Overflow，須改寫為顯式堆疊或採迭代加深搜尋（IDDFS）兼顧最短路徑與低記憶體。"}, "myNotes": "最短步數想 BFS（水波擴散），窮舉路徑想 DFS（一條路走到底）。", "relatedIds": ["algo-s1-3", "algo-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "algo-s2-2", "categoryId": "cat-algo", "stageId": "s2", "subtopic": "路徑規劃", "title": "最短路徑演算法（Dijkstra／A*）與導航原理", "oneLiner": "Google 地圖能在半秒內幫你避開塞車算出最快路線，靠的就是每次優先走累計最省時的路口，再加上終點方向直覺（A*）。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "BFS 只能算「經過幾個紅綠燈最少」，但現實開車每條路長度跟塞車時間都不同。\n\n• Dijkstra 演算法就像往地圖倒水，但水流在塞車路流很慢、在高速公路流很快——它每次都挑「目前累計花費時間最短的路口」繼續往外擴展，直到水流碰到終點。\n• A*（A-Star）演算法更聰明：除了算「已經開了多久」，還多加一個直覺「離終點直線距離還有多遠」，所以不會傻傻往反方向繞路，遊戲角色尋路跟地圖導航幾乎都靠它！", "lv2": "實務選擇最短路徑演算法的對照表：\n\n1. 邊權重全部非負（如距離、時間、費用）→ **Dijkstra**（搭配優先佇列 Priority Queue，複雜度 O((V+E) log V)）。\n2. 已知起點與終點座標（地圖／遊戲格網）→ **A***（大幅減少無用探索節點）。\n3. 圖中存在「負權重邊」（例如匯率套利或帶獎勵回饋的路徑）→ Dijkstra 會失靈，改用 Bellman-Ford。", "lv3": "Dijkstra 基於貪婪策略與鬆弛操作（Relaxation），其正確性仰賴邊權非負性質（確保已出隊節點之最短距離不再被更新）。\n\n• A* 評估函數 f(n) = g(n) + h(n)，只要啟發函數 h(n) 滿足「可採納性（Admissible，絕不高估到終點的真實最短成本，如歐幾里得／曼哈頓距離）」，即可保證求得全局最優路徑。"}, "myNotes": "A* 就是「已走成本 + 預估剩餘成本」，把盲目擴散變成有方向感的智慧尋路！", "relatedIds": ["algo-s2-1", "algo-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "algo-s2-3", "categoryId": "cat-algo", "stageId": "s2", "subtopic": "依賴排程", "title": "拓撲排序（Topological Sort）與任務依賴排程", "oneLiner": "當事情有先後順序規定（先穿襪子才能穿鞋），拓撲排序能自動排出一份絕不打架的執行清單，順便抓出死循環。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "大學選課時，必須先修「程式入門」才能修「資料結構」，修完才能修「演算法」；早上出門也得先穿襪子再穿鞋。\n\n拓撲排序的做法超直覺：每次都先找出「現在前面已經沒有任何前置條件擋著的任務」（入度為 0），把它做完劃掉，再看看哪些新任務因此解鎖了，一路排到全部做完。\n\n如果排到一半發現剩下任務互相卡死（A 等 B、B 又等 A），演算法立刻幫你抓出「循環依賴」大 Bug！", "lv2": "日常與工程中的拓撲排序場景：\n\n1. 軟體套件安裝（npm / pip）、Excel 公式重算順序、專案甘特圖排程，底層全都在跑拓撲排序。\n2. Kahn 演算法實作僅需三步：統計每個節點的「前置任務數（入度）」→ 把入度 0 放進 Queue → 依序取出並把下游節點入度減 1。\n3. 若最後排出的任務數小於總任務數，代表存在「循環依賴（Cycle）」。", "lv3": "拓撲排序僅存在於「有向無環圖（DAG, Directed Acyclic Graph）」，時間複雜度 O(V + E)，且合法排序結果未必唯一。\n\n• 搭配關鍵路徑法（CPM）對 DAG 進行最長路徑計算，即可同時求出大型專案或資料管線（如 Airflow DAG）的最短總工期與關鍵瓶頸任務。"}, "myNotes": "做複雜專案排程或畫學習路徑時，其實就在腦中做拓撲排序！", "relatedIds": ["algo-s2-1", "algo-s2-4"], "updatedAt": "2026-11-24"},
        {"id": "algo-s2-4", "categoryId": "cat-algo", "stageId": "s2", "subtopic": "網路建設", "title": "最小生成樹與連通性在網路建設中的應用", "oneLiner": "用最少總長度的電纜把所有城市通通連起來，不浪費一條多餘迴路——這就是最小生成樹的省錢魔法。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "假設政府要在 10 座偏鄉村莊之間鋪光纖網路，每兩座村莊間鋪設成本不同，目標是「每座村莊都能連上網，而且總花費越低越好」。\n\n聰明的做法（Kruskal 演算法）超像撿便宜：把所有可能的路線從最便宜排到最貴，一條一條挑來鋪，只要這條線「不會把已經連通的村莊重複繞成一個圈」，就鋪下去！鋪滿 9 條線時，10 座村莊就用全宇宙最省錢的方式全部連通了。", "lv2": "最小生成樹（MST）與並查集（Union-Find）的實戰價值：\n\n1. Kruskal 演算法（按邊從便宜挑起）搭配「並查集（Union-Find）」瞬間判斷兩點是否已在同一群組，適合稀疏圖。\n2. Prim 演算法（從單一起點往外擴張選最便宜鄰邊）適合稠密圖。\n3. 並查集（Union-Find）本身也是判斷「兩個帳號是不是同一個朋友圈／兩台主機有沒有連通」的神器。", "lv3": "對連通無向加權圖 G = (V, E)，最小生成樹包含恰好 |V| - 1 條邊且總權重最小。其正確性由「切割性質（Cut Property）」保證：跨越任一頂點二分切割的最輕邊必屬於某棵 MST。\n\n• 並查集結合「路徑壓縮（Path Compression）」與「按秩合併（Union by Rank）」，單次操作均攤複雜度趨近常數 O(α(n))（反阿克曼函數）。"}, "myNotes": "並查集（Union-Find）判斷「兩個人是不是同一個圈子」快到幾乎是 O(1)！", "relatedIds": ["algo-s2-3", "algo-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "algo-s3-1", "categoryId": "cat-algo", "stageId": "s3", "subtopic": "貪婪思維", "title": "貪婪演算法（Greedy）的適用條件與反例陷阱", "oneLiner": "每一步都選「當下看起來最划算的」既簡單又快，但只有特定問題能走到全局最優，否則會掉進短視陷阱。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "去超商買東西找零錢 65 元，店員會先拿一個 50 元、再拿一個 10 元、再拿一個 5 元——每一步都挑「能找的最大面額」，3 個硬幣搞定，這就是「貪婪演算法」！\n\n但小心反例！如果某個外星國家的硬幣只有 1 元、3 元、4 元，現在要找 6 元：\n• 貪婪法先拿 4 元，剩下 2 元只好拿兩個 1 元（共 3 個硬幣）。\n• 但其實拿兩個 3 元只要 2 個硬幣就搞定了！\n\n所以貪婪法超快，但出手前要先確認「眼前最好」會不會害死「長遠最好」。", "lv2": "實務中貪婪法的經典成功與失敗場景：\n\n1. 確定能用貪婪：會議室排程（每次優先選「結束時間最早」的會議，能塞進最多場）、哈夫曼資料壓縮編碼、Dijkstra 最短路徑。\n2. 不能用貪婪（改用動態規劃 DP）：0/1 背包問題、任意面額找零錢。\n3. 人生決策映射：貪婪對應「只顧眼前利益」，在沒有長遠結構依賴的小事上很高效；在重大複利選擇上常輸給看得更遠的 DP 全局規劃。", "lv3": "貪婪演算法成立須同時滿足「貪婪選擇性質（Greedy Choice Property，局部最優選擇必包含於某個全局最優解中）」與「最佳子結構」。\n\n• 嚴謹驗證通常採「交換論證法（Exchange Argument）」：證明任意全局最優解若與貪婪選擇不同，將其替換為貪婪選擇後結果不會變差。"}, "myNotes": "外星硬幣 {1, 3, 4} 找 6 元的反例，瞬間秒懂為什麼有時要從貪婪升級成 DP！", "relatedIds": ["algo-dp", "algo-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "algo-s3-3", "categoryId": "cat-algo", "stageId": "s3", "subtopic": "搜尋與剪枝", "title": "回溯法（Backtracking）與剪枝加速技巧", "oneLiner": "像玩數獨一樣大膽嘗試、發現違反規則就立刻退一步重選，並提前砍掉必敗分枝（剪枝）省下 99% 白工。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "玩數獨或走迷宮時，你走到岔路口先選左邊試試看，填了兩格發現跟同一排數字撞車了，你不會整張擦掉重玩，而是只把剛才填錯的那兩格擦掉，退回岔路口改試右邊——這就是「回溯法」！\n\n而「剪枝（Pruning）」就是提早認賠：走到一半發現這條路就算後面全對也不可能比目前紀錄更好，就直接把整條樹枝砍掉不再浪費時間。", "lv2": "回溯法三步萬用模板（選擇 → 遞迴探索 → 撤銷選擇）：\n\n1. 適用題型：排列組合、子集生成、數獨、八皇后、排班約束滿足問題。\n2. 加速關鍵在「越早剪枝越好」：先排序、把限制最嚴格的條件擺在最前面檢查，常能把跑不完的指數時間縮到毫秒級。\n3. 人生類比：低成本試錯 + 發現苗頭不對立刻回溯，不要一路錯到底。", "lv3": "回溯法本質是在「狀態空間樹（State-Space Tree）」上執行帶約束檢查的深度優先搜尋。\n\n• 搭配分支限界法（Branch and Bound）或博弈樹中的 Alpha-Beta 剪枝（棋類 AI 核心），能在不遺漏最優解的前提下大幅削減指數級搜尋空間。"}, "myNotes": "回溯法核心三步：做選擇 → 往下試 → 退回撤銷選擇，再配早剪枝加速！", "relatedIds": ["algo-s2-1", "algo-dp"], "updatedAt": "2026-11-24"},
        {"id": "algo-s3-4", "categoryId": "cat-algo", "stageId": "s3", "subtopic": "線性降維", "title": "滑動視窗與雙指標：把 O(n²) 降維成 O(n) 的利器", "oneLiner": "與其每次都從頭重算一整段連續資料，不如用左右兩根手指框出區間往前滑動，一邊加新資料一邊丟舊資料。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "你想算「過去一年裡，哪連續 7 天的步數總和最高」：\n\n• 笨方法：第 1–7 天加一次、第 2–8 天又重加 7 個數字……重複做 360 次。\n• 滑動視窗（Sliding Window）：算完第 1–7 天後，框框往右滑一格，只要「加上第 8 天、減掉第 1 天」就好，每次只算兩下！\n\n「雙指標」則像左右手同時從已排序陣列的兩頭往中間夾擊，一次掃描就能配對完成，速度暴增數百倍。", "lv2": "辨識這兩招的三大訊號：\n\n1. 題目問「連續子陣列／子字串的最大值、最短長度、無重複字元」→ 立刻想到 **滑動視窗**。\n2. 題目給「已排序陣列找兩數相加等於目標、原地去重、判斷迴文」→ 立刻想到 **左右雙指標或快慢指標**。\n3. 效能奇蹟：雖然程式碼裡看起來有外層迴圈加內層收縮，但左右指標各自最多只走完陣列一次，總複雜度穩穩 O(n)。", "lv3": "滑動視窗成立的數學前提為區間性質的「單調性」：右邊界擴張使條件趨於滿足（或違背），左邊界收縮則朝相反方向單調變化，因而每個元素至多進出視窗各一次，透過均攤分析保證嚴格線性時間 O(n) 與常數／字元集大小額外空間。"}, "myNotes": "看到「連續區間」想滑動視窗，看到「已排序配對」想左右雙指標！", "relatedIds": ["it-bigo", "algo-s1-1"], "updatedAt": "2026-11-24"},
        {"id": "algo-s4-1", "categoryId": "cat-algo", "stageId": "s4", "subtopic": "現實應用", "title": "推薦系統演算法：協同過濾與內容推薦原理", "oneLiner": "為什麼串流平台跟電商比你還懂你想看什麼？核心就是「找跟你口味像的人（協同）」加上「找這東西像什麼（內容）」。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "Netflix、YouTube 跟蝦皮猜你喜歡什麼，主要有兩招：\n\n1. 內容推薦（Content-Based）：看你剛看完三部「科幻＋燒腦」電影，就把資料庫裡其他標記「科幻＋燒腦」的片推給你。\n2. 協同過濾（Collaborative Filtering）：系統根本不管電影演什麼，它只發現「你跟小明過去看過並按讚的 20 部片幾乎一模一樣」，而小明昨天狂讚了一部新劇，系統就立刻把那部新劇推給你！", "lv2": "理解推薦演算法的雙向價值：\n\n1. 做產品／自媒體：新帳號面臨「冷啟動問題（Cold Start）」，初期要靠清楚的內容標籤（Content-Based）讓系統知道該推給誰，後續靠完播率與互動率吃協同過濾流量。\n2. 當聰明使用者：推薦演算法容易把人鎖在「資訊繭房」，刻意定期主動搜尋跨領域新主題，能幫自己打破同溫層。", "lv3": "工業界大規模推薦系統採「多階段漏斗架構」：召回（Candidate Generation，雙塔模型＋向量近鄰搜尋 ANN 從百萬級壓到千級）→ 粗排／精排（DeepFM / DIN 預估點擊率 CTR 與完播率）→ 重排（加入多樣性 MMR 與去重規則）。\n\n• 經典數學基礎為矩陣分解（Matrix Factorization / SVD），將稀疏的使用者—物品互動矩陣映射至低維潛在語意空間。"}, "myNotes": "懂了協同過濾與內容推薦，既能做產品也能主動跳出演算法繭房！", "relatedIds": ["it-attention", "algo-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "algo-s4-2", "categoryId": "cat-algo", "stageId": "s4", "subtopic": "現實應用", "title": "搜尋引擎排序邏輯（PageRank 與倒排索引）", "oneLiner": "Google 能在 0.3 秒內從幾百億網頁找到最靠譜答案，靠「書末關鍵字索引（倒排）」配「權威投票（PageRank）」。", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "如果搜尋引擎每次都把全世界網頁從頭翻一遍，你查一個字大概要等一百年。\n\nGoogle 靠兩大絕招秒殺這件事：\n1. 倒排索引（Inverted Index）：就像書本最後面的「名詞索引表」，提前整理好「夏普比率 → 出現在第 12, 85, 304 頁」，一查立刻拿名單。\n2. PageRank（網頁權重）：誰排第一頁？把「其他網頁連結到你」當成「投你一票」——而且被權威大站（如大學、官方機構）連結投的一票，份量遠大於一萬個垃圾網站！", "lv2": "把搜尋引擎底層原理用在 SEO 與知識管理：\n\n1. 做內容與部落格：單純塞關鍵字早就沒用了，讓高品質文章被其他權威網站主動引用連結，才是長期排名護城河。\n2. 建個人知識庫搜尋：替筆記加上結構化標題與標籤，本質上就是在幫自己建立微型倒排索引。", "lv3": "PageRank（Larry Page & Sergey Brin, 1998）將網際網路建模為有向圖上的馬可夫鏈隨機漫步（Random Surfer Model），以阻尼係數 d ≈ 0.85 迭代求解轉移矩陣的主特徵向量。\n\n• 現代搜尋已演進為「倒排索引（BM25 詞頻精準匹配）＋ 稠密向量語意檢索（Dense Retrieval）＋ 學習排序（Learning to Rank）」的混合架構。"}, "myNotes": "倒排索引解決「找得快」，PageRank 解決「誰最值得信賴」。", "relatedIds": ["algo-s4-1", "mkt-flywheel"], "updatedAt": "2026-11-24"},
        {"id": "algo-s4-3", "categoryId": "cat-algo", "stageId": "s4", "subtopic": "機率演算法", "title": "機率與近似演算法：布隆過濾器與蒙地卡羅模擬", "oneLiner": "當資料量龐大到算不完精確答案時，犧牲 1% 完美度就能換來快 100 倍的速度與省下 99% 記憶體。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "有時候追求「100% 絕對精確」代價太高，聰明的演算法會用「機率」抄近路：\n\n• 蒙地卡羅模擬（Monte Carlo）：想算一個不規則湖泊的面積，只要往包含湖泊的正方形隨機撒一萬顆飛鏢，數數有幾顆掉進湖裡，比例乘上正方形面積就超準！金融界常拿它模擬一萬種未來股市走勢。\n• 布隆過濾器（Bloom Filter）：像超省空間的「黑名單快篩」，它說「這網址不在黑名單裡」就 100% 絕對安全；說「可能在」才需要去翻厚重資料庫複查。", "lv2": "機率思維在工程與投資的實戰應用：\n\n1. 防快取穿透（Cache Penetration）：在高流量網站前面放一層布隆過濾器，幾 MB 記憶體就能擋掉上億筆不存在的惡意查詢。\n2. 退休與資產配置壓力測試：別只用「平均年化 7%」一條直線估算退休金，用蒙地卡羅跑 1,000 次隨機市場波動，看清楚最差 5% 情境下錢夠不夠用。", "lv3": "布隆過濾器由長度 m 的位元陣列與 k 個獨立雜湊函數構成，具有「零偽陰性（Zero False Negatives）、極低可控偽陽性（False Positive Rate ≈ (1 − e^(−kn/m))^k）」特性，且標準版不支援刪除操作。\n\n• 蒙地卡羅方法透過大數法則以隨機抽樣逼近高維積分或複雜隨機過程期望值，誤差收斂速度為 O(1/√N)，不受維度詛咒（Curse of Dimensionality）指數惡化影響。"}, "myNotes": "退休試算與風險評估一定要懂蒙地卡羅——別只信一條平均值直線！", "relatedIds": ["fin-portfolio", "cross-bayes"], "updatedAt": "2026-11-24"},
        {"id": "algo-s4-4", "categoryId": "cat-algo", "stageId": "s4", "subtopic": "生活演算法", "title": "演算法思維用於日常決策：37% 最佳停止法則", "oneLiner": "看房、招人或選對象時，到底該看幾個就出手？數學給出優雅答案：先純觀察前 37%，之後遇到第一個超越前面所有人的就果斷鎖定。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第一波擴充課綱", "levels": {"lv1": "假設你有一個月時間找租屋，打算看 10 間房，而且好房子不等你、看完沒簽可能隔天就被租走。看第 1 間就簽怕後面有更好的，拖到第 10 間又怕前面的好房全沒了，怎麼辦？\n\n數學家算出一個神奇的「37% 法則」：\n1. 前 37%（約前 3–4 間）：純粹「觀察建立標準」，就算超喜歡也先不簽，用來搞清楚這個預算大概能租到什麼等級。\n2. 過了 37% 之後：只要遇到「第一間比前面那 4 間都更好」的房子，立刻果斷下手簽約！\n\n這套策略幫你在「太早決定」跟「錯過好機會」之間取得數學上的最高勝率！", "lv2": "把最佳停止法則（與探索／利用權衡）用在生活：\n\n1. 先「探索（Explore）」再「利用（Exploit）」：年輕或剛進新領域時多嘗試不同機會建立基準；經驗累積到一定程度後，把時間集中押注在勝率最高的好選項上。\n2. 現實微調：現實世界有時可以回頭找之前的選項（房東還沒租出去），此時觀察門檻可放寬到約 50–60%。\n3. 避免「永遠在觀望」的完美主義癱瘓。", "lv3": "37% 法則源於機率論經典「秘書問題（Secretary Problem / Optimal Stopping Problem）」。當候選人數 n → ∞ 時，最佳觀察門檻收斂至 1/e ≈ 36.79%，且在此策略下選中全局第一名的機率亦恰好收斂至 1/e ≈ 36.79%。\n\n• 進階延伸：在允許重複體驗的情境（如挑餐廳、挑廣告素材），則對應「多臂吃角子老虎機問題（Multi-Armed Bandit）」，以 UCB 或 Thompson Sampling 動態平衡探索與利用。"}, "myNotes": "把演算法用在人生選擇：前 37% 收集基準，之後遇到超越基準的第一個就果斷鎖定！", "relatedIds": ["cross-bayes", "algo-s3-1"], "updatedAt": "2026-11-24"},
        {"id": "it-s1-2", "categoryId": "cat-it", "stageId": "s1", "subtopic": "電腦底層", "title": "二進位、字元編碼與記憶體運作原理", "oneLiner": "電腦裡所有的文字、圖片與影片，本質上全都是一長串「開關（0 與 1）」按照約定好的字典翻譯出來的。", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "電腦其實比你想像的單純，它只懂兩件事：「通電（1）」跟「斷電（0）」。\n\n那它怎麼顯示中文字跟照片？靠的是大家講好的「密碼本」：\n• 字元編碼（UTF-8）：規定「A = 65」，每個中文字也對應一組專屬編號。偶爾打開檔案看到亂碼，就是用錯密碼本（例如把 UTF-8 當成 Big5 讀）。\n• 記憶體（RAM）像書桌、硬碟（SSD）像書櫃：書櫃能放超多書但拿起來慢，書桌空間小但伸手一秒就拿到，所以電腦執行程式時會先把需要的資料搬上書桌。", "lv2": "日常開發與除錯必懂的三個編碼與記憶體常識：\n\n1. 檔案與資料庫一律統一用 **UTF-8**（MySQL 用 `utf8mb4` 才能存 Emoji），徹底終結中文亂碼與匯出 CSV 亂碼（Excel 開啟 UTF-8 CSV 記得加 BOM）。\n2. 浮點數誤差警訊：二進位無法精確表示 `0.1`，所以程式裡 `0.1 + 0.2 === 0.30000000000000004`；處理金額一律用整數（分）或 `Decimal` 型別。\n3. 效能瓶頸判斷：程式變卡先看是 CPU 滿載、RAM 爆掉（OOM），還是頻繁讀寫磁碟 I/O。", "lv3": "現代計算機採馮・諾伊曼架構與分層儲存體系（CPU Registers → L1/L2/L3 Cache → DRAM → NVMe SSD），存取延遲跨度達 6 個數量級（~0.5 ns 至 ~100 µs）。\n\n• IEEE 754 雙精度浮點數採 1 位符號 + 11 位指數 + 52 位尾數表示；UTF-8 為可變長度（1–4 bytes）且完全向後相容 ASCII 的 Unicode 編碼標準，避免了位元組序（Endianness）歧義。"}, "myNotes": "金額運算永遠別用 float，CSV 亂碼就是 UTF-8 沒帶 BOM！", "relatedIds": ["it-bigo", "it-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "it-s1-3", "categoryId": "cat-it", "stageId": "s1", "subtopic": "資料庫基礎", "title": "關聯式資料庫（SQL）與索引設計基礎", "oneLiner": "把資料拆成乾淨不重複的表格再用編號串連（JOIN），加上書本目錄般的索引（B-Tree），千萬筆資料也能毫秒查完。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "把關聯式資料庫想成一組超聰明的 Excel 分頁：一張表專門記「會員資料」、另一張專門記「訂單紀錄」，兩張表用「會員編號」連起來。\n\n為什麼不全部塞在同一張大表？因為如果小明改了手機號碼，分開存只要改 1 格；全塞在一起你可能得改 500 筆歷史訂單！\n\n而「索引（Index）」就像厚書最前面的目錄：沒目錄時查一個名字得從第 1 頁翻到第 10,000 頁；建了索引，三步就能精準翻到那一頁。", "lv2": "寫 SQL 與建資料庫的實戰四守則：\n\n1. 善用 `INNER JOIN`（只留兩邊都有的）與 `LEFT JOIN`（保留左表全部，沒配對補 NULL），小心一對多 JOIN 造成金額重複加總。\n2. 索引不是越多越好：常出現在 `WHERE`、`JOIN`、`ORDER BY` 的欄位建索引能大幅加速查詢，但索引過多會拖慢寫入速度與佔用空間。\n3. 交易（Transaction）保護：像轉帳「A 扣款 + B 入帳」必須包在同一個 Transaction，要嘛全成功、要嘛全回滾（Rollback）。", "lv3": "關聯式模型由 E. F. Codd（1970）提出，正規化（1NF–3NF）消除更新異常與資料冗餘；交易完整性遵循 ACID 原則（Atomicity, Consistency, Isolation, Durability）。\n\n• 索引底層多採 B+Tree（高度通常僅 3–4 層，大幅減少磁碟頁讀取 I/O）；符合「最左前綴原則（Leftmost Prefix）」的複合索引能實現覆蓋索引（Covering Index）免回表查詢。"}, "myNotes": "一對多 JOIN 最容易讓 SUM 金額莫名翻倍，寫報表前一定要先驗證筆數！", "relatedIds": ["it-bigo", "it-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "it-s1-4", "categoryId": "cat-it", "stageId": "s1", "subtopic": "開發協作", "title": "版本控制（Git）與軟體開發生命週期", "oneLiner": "幫你的程式碼與文件建立「無限次遊戲存檔點」，隨時能開平行宇宙實驗新功能，改壞了一秒讀檔重來。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "做期末報告時，你一定存過這種讓人崩潰的檔名：`報告_最終版.docx`、`報告_真的最終版_v2.docx`、`報告_老師改完版_FINAL.docx`。\n\nGit 就是專治這個痛點的「時光機存檔系統」：\n• Commit（提交）：每完成一小步就按一次「存檔」並寫一句備註，紀錄當時所有檔案的完整快照。\n• Branch（分支）：想試一個大膽改版又怕弄壞原本能跑的網站，就開一條「平行宇宙分支」盡情實驗，成功了再合併（Merge）回主線！", "lv2": "個人與團隊每天最常用的 Git 五個指令與習慣：\n\n1. `git status` / `git diff`：存檔前先看清楚到底改了哪些行。\n2. `git add .` → `git commit -m \"清楚動詞描述\"` → `git push`：日常三連招。\n3. 絕對不要把 `.env`、API Key 或密碼推上公開 GitHub（先寫進 `.gitignore`）。\n4. 小步頻繁提交：每完成一個小功能就存一個點，比一週後一次塞 50 個檔案好救得多。", "lv3": "Git 為分散式版本控制系統（DVCS），底層是一個內容定址檔案系統（Content-Addressable Filesystem），以 SHA-1/SHA-256 雜湊值儲存 Blob、Tree 與 Commit 物件構成有向無環圖（DAG）。\n\n• 結合 CI/CD（持續整合與持續部署，如 GitHub Actions），每次 push 或 Pull Request 可自動觸發測試與上線，構成現代 DevOps 軟體生命週期骨幹。"}, "myNotes": "小步 commit + 嚴守 .gitignore 不推密鑰，是最省心的開發保險。", "relatedIds": ["it-s2-4", "it-api"], "updatedAt": "2026-11-24"},
        {"id": "it-s2-2", "categoryId": "cat-it", "stageId": "s2", "subtopic": "網路基礎", "title": "網路協定全貌：DNS、HTTP/HTTPS 與 TCP/IP", "oneLiner": "在瀏覽器輸入網址按下 Enter 後不到半秒，資料經過「查電話簿（DNS）→ 建安全連線（TLS）→ 拆包送達（TCP）→ 拿網頁（HTTP）」四步接力。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "把上網寄資料想像成網購收包裹：\n\n1. DNS（網路電話簿）：你輸入 `google.com`，DNS 幫你查出它真正的門牌號碼（IP 位址）。\n2. TCP/IP（可靠快遞車）：把一整張網頁切成很多小包裹，編號送出，少一個就要求補寄，保證完整無缺。\n3. HTTPS（上鎖防偷看箱）：在信件外加一層只有你跟網站解得開的密碼鎖，就算在咖啡廳連免費 Wi-Fi 也不怕別人偷看密碼。\n4. HTTP（溝通語言）：瀏覽器跟伺服器約定好「我要這頁」「給你，200 成功！」的標準對話格式。", "lv2": "網頁除錯時看懂網路分層的實務技巧：\n\n1. 打開瀏覽器開發者工具（F12 → Network 分頁）：一秒看出網頁慢是因為 DNS 解析慢、後端算太久（TTFB 高），還是圖片檔案太大。\n2. 常見跨域錯誤（CORS）：瀏覽器基於安全預設擋住 A 網域網頁去偷抓 B 網域 API，需由 B 伺服器回傳 `Access-Control-Allow-Origin` 標頭放行。\n3. 公開網站一律掛 HTTPS（如 Cloudflare / Let's Encrypt 免費憑證）。", "lv3": "網際網路依 TCP/IP 四層（應用層、傳輸層、網路層、鏈結層）封裝運作。TCP 透過三次握手建立連線與滑動視窗控管壅塞；HTTPS 則在 TCP 之上疊加 TLS 握手（非對稱加密交換對稱會話金鑰）。\n\n• 協定演進：HTTP/2 引入多工複用（Multiplexing）解決應用層隊頭阻塞；HTTP/3 更進一步改跑基於 UDP 的 QUIC 協定，在行動網路切換時大幅降低延遲。"}, "myNotes": "網頁變慢先開 F12 Network 看瀑布圖，一秒抓出是前端圖太大還是後端慢！", "relatedIds": ["it-api", "it-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "it-s2-3", "categoryId": "cat-it", "stageId": "s2", "subtopic": "資訊安全", "title": "身分驗證與資訊安全（JWT、OAuth、加密雜湊）", "oneLiner": "分清「你是誰（驗證）」與「你能做什麼（授權）」，用不可逆雜湊存密碼、用數位通行證安全登入。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "三個每天都在用卻常搞混的資安概念：\n\n• 雜湊（Hash，像把水果打成果汁）：網站絕不直接存你的明文密碼，而是把密碼打成一串固定亂碼存起來；你下次登入時把輸入再打一次果汁，比對味道一模一樣就放行——就算駭客偷走資料庫，也無法把果汁還原成原本的水果！\n• JWT（遊樂園防偽手環）：登入成功後，伺服器發給你一條帶防偽簽名的手環，接下來玩設施只要秀手環就好，不必每關都重查身分證。\n• OAuth（飯店代客泊車鑰匙）：按「使用 Google 登入」時，你只授權對方看你的名字與信箱，而不用把 Google 密碼交出去。", "lv2": "日常防護與開發必守的資安紅線：\n\n1. 個人防護：重要帳號必開兩步驟驗證（2FA），不同網站絕不共用同一組密碼（用密碼管理器）。\n2. 開發存密碼：必須用加鹽慢雜湊（bcrypt / Argon2），絕對不能用 MD5 或 SHA-1 直接存密碼。\n3. 兩大經典漏洞防禦：SQL Injection（永遠用參數化查詢）、XSS（渲染用戶文字一律做 HTML 跳脫，不直接塞進 `innerHTML`）。", "lv3": "區分 Authentication（驗證，AuthN）與 Authorization（授權，AuthZ）。JWT（JSON Web Token）由 Header.Payload.Signature 組成，Payload 僅為 Base64URL 編碼而非加密，故絕不可放入機密資訊；其無狀態特性雖利於水平擴展，但撤銷（Revocation）須搭配短效 Access Token + Refresh Token 輪換機制。"}, "myNotes": "JWT Payload 只是 Base64 編碼不是加密，千萬別塞敏感資料進去！", "relatedIds": ["it-s2-2", "it-api"], "updatedAt": "2026-11-24"},
        {"id": "it-s2-4", "categoryId": "cat-it", "stageId": "s2", "subtopic": "部署運維", "title": "容器化（Docker）與雲端部署基礎概念", "oneLiner": "把程式連同它需要的作業系統環境一起裝進標準貨櫃（Container），徹底消滅「在我電腦明明能跑」的惡夢。", "tags": ["#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "以前把寫好的程式搬到新電腦或伺服器上，常常因為 Python 版本差一點、少裝某個套件就整個報錯崩潰。\n\nDocker 就像海運界的「標準貨櫃」：你寫一張清單（Dockerfile），把程式碼、Python 版本、所有相依套件全部打包成一個標準貨櫃映像檔（Image）。不管運到你家 Windows、朋友的 Mac 還是雲端主機，只要能跑 Docker，打開貨櫃就能 100% 一模一樣跑起來！", "lv2": "個人專案部署的實務選型階梯：\n\n1. 純靜態網頁（HTML/JS/CSS）→ 直接放 **GitHub Pages** 或 Cloudflare Pages（免費、零伺服器、全球加速）。\n2. 含後端 API（FastAPI / Node）→ 寫好 `Dockerfile` 部署到 Render、Railway 或 Fly.io，省去自己管 Linux 系統更新。\n3. 多服務本地開發（後端 + MySQL + Redis）→ 用 `docker-compose.yml` 一條指令全部啟動。", "lv3": "相較於傳統虛擬機（VM）需虛擬化完整 Guest OS 導致龐大開銷，Docker 容器直接共用主機 Linux Kernel，透過 Namespaces（行程／網路／檔案系統隔離）與 cgroups（CPU／記憶體資源配額限制）實現毫秒級啟動與極高部署密度。"}, "myNotes": "純前端走 GitHub Pages，需要後端就用 Dockerfile 上 Render，簡單又穩。", "relatedIds": ["it-s1-4", "it-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "it-s3-2", "categoryId": "cat-it", "stageId": "s3", "subtopic": "機器學習", "title": "機器學習三範式：監督、非監督與強化學習", "oneLiner": "AI 學習其實跟人類完全一樣：看標準答案寫題庫（監督）、自己整理分類找規律（非監督）、邊玩遊戲邊從獎懲試錯（強化）。", "tags": ["#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "把機器學習想成教小朋友認識世界的三種方式：\n\n1. 監督式學習（Supervised）：給一萬張標好「這是貓」「這是狗」的卡片讓 AI 練習，適合做預測（垃圾信分類、房價預估）。\n2. 非監督式學習（Unsupervised）：不給標準答案，直接丟一堆客戶消費紀錄叫 AI 自己分出「這群愛買生鮮、那群愛買 3C」（分群與異常偵測）。\n3. 強化學習（Reinforcement）：把 AI 丟進電玩或圍棋盤裡，贏加分、輸扣分，讓它自己試錯幾百萬局練出最強策略（AlphaGo 與現代 AI 推理訓練核心）。", "lv2": "判斷商業或研究問題該用哪種 AI 工具：\n\n1. 有大量歷史「輸入 → 結果」標記資料（例如歷史銷售額預測）→ 監督式學習（表格資料首選 XGBoost / LightGBM）。\n2. 沒有標籤、想探索未知客群或抓異常交易 → 非監督式分群（K-Means / DBSCAN）。\n3. 關鍵避坑——「過擬合（Overfitting）」：AI 把考古題死背到 100 分，換新考卷卻考 40 分；務必切分訓練集與測試集驗證泛化能力。", "lv3": "統計學習理論核心為「偏差—變異數權衡（Bias-Variance Tradeoff）」：模型過於簡單導致欠擬合（高偏差），過於複雜則擬合雜訊導致過擬合（高變異數），須以正則化（L1/L2）、交叉驗證與 Dropout 抑制。\n\n• 現代大型語言模型結合三者：先以自監督學習（預測下一個 Token）預訓練，再以監督微調（SFT）與人類回饋強化學習（RLHF / GRPO）對齊人類意圖與長鏈推理。"}, "myNotes": "表格資料預測別急著上深度學習，XGBoost 常又快又準！", "relatedIds": ["it-attention", "it-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "it-s3-3", "categoryId": "cat-it", "stageId": "s3", "subtopic": "AI 檢索架構", "title": "Token、Embedding 向量與 RAG 檢索增強生成", "oneLiner": "讓 AI 讀懂你專屬文件而不胡說八道的秘密：先把文字轉成「語意座標（Embedding）」，回答前先幫 AI 翻書找對段落（RAG）。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "三個讓現代 AI 能當你專屬顧問的核心齒輪：\n\n• Token（詞元）：AI 讀字的最小計費單位，大約 1 個中文字佔 1–2 個 Token。\n• Embedding（語意座標）：AI 把每句話換成空間裡的座標點——「小狗」跟「黃金獵犬」座標靠超近，跟「微波爐」離超遠，所以就算你沒打到一模一樣的字，它也找得到意思相近的段落！\n• RAG（開書考模式）：與其逼 AI 把你的公司手冊全部死背進腦袋，不如你發問時先用座標快速翻出最相關的 3 頁，把這 3 頁貼給 AI 照著回答，準確率瞬間暴增！", "lv2": "打造高品質個人或企業 RAG 系統的實務要點：\n\n1. 切塊策略（Chunking）比換模型更關鍵：文件切太碎會丟失上下文，切太大會混入雜訊；實務常採語意段落切分並保留前後重疊（Overlap）。\n2. 混合檢索（Hybrid Search）：同時結合「向量語意搜尋」＋「關鍵字精準匹配（BM25）」，才不會漏掉專有名詞或法條編號。\n3. 強制要求回答附上引用來源段落，方便人工一秒核對。", "lv3": "RAG（Retrieval-Augmented Generation, Lewis et al., 2020）將參數化記憶（模型權重）與非參數化記憶（外部向量資料庫，透過 HNSW 圖索引實現近似最近鄰搜尋 ANN）解耦，低成本解決知識過時與私有資料存取問題。\n\n• 進階優化包含查詢重寫（Query Rewriting）、重排序模型（Cross-Encoder Reranker）與上下文壓縮，顯著降低檢索雜訊對生成品質的干擾。"}, "myNotes": "RAG 就是把 AI 從「閉卷背書」升級成「精準開書考」！", "relatedIds": ["it-attention", "it-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "it-s3-4", "categoryId": "cat-it", "stageId": "s3", "subtopic": "AI 風險控管", "title": "模型幻覺、評測基準與上下文視窗管理", "oneLiner": "大語言模型本質上是「機率接龍高手」而非真理資料庫，懂它為何會一本正經胡說八道，才能用對方法把關。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "為什麼 AI 有時候會超有自信地編出不存在的論文書名或法條？\n\n因為 AI 底層做的是「根據前面字詞，猜下一個最像人類會講的字」。當遇到它沒背熟的冷門冷知識時，它為了把句子接得通順好聽，就會順手「腦補」一個聽起來很專業的假答案——這就是「幻覺（Hallucination）」。\n\n另外，對話視窗就像 AI 的短期記憶容量，同一串對話聊太長、混進太多無關舊話題時，它會開始分心忘記你一開始的規則，所以換新任務就開新對話最乾淨！", "lv2": "日常使用 AI 降幻覺的四個實戰習慣：\n\n1. 高風險事實（法規、醫療、財報數字、學術引用）必給原始資料或要求聯網查證，並人工點開原始連結確認。\n2. 明確允許 AI 說「不知道」：在提示詞加上「若提供的資料未提及，請直接回答無法確認，不可推測」。\n3. 善用開新對話：一個複雜任務結束後另開新串，避免舊上下文污染新任務。\n4. 關鍵決策可用「不同模型交叉審核」或請 AI 先列出假設與反例。", "lv3": "幻覺根源於最大似然估計（Next-Token Prediction）目標函數獎勵語言流暢性而非事實校準（Calibration），加上預訓練語料長尾稀疏與曝光偏差。\n\n• 評測系統除公開基準（MMLU、GPQA、SWE-bench）外，實務產品須建立領域專屬的黃金測試集（Golden Eval Set），從忠實度（Faithfulness）、相關性與延遲成本多維持續監控。"}, "myNotes": "換任務開新對話 + 允許 AI 說不知道 + 關鍵數字回查原檔，就能擋掉九成幻覺！", "relatedIds": ["it-s3-3", "it-ai-workflow"], "updatedAt": "2026-11-24"},
        {"id": "it-s4-2", "categoryId": "cat-it", "stageId": "s4", "subtopic": "AI 自動化", "title": "結構化提示工程與 AI Agent 工作流設計", "oneLiner": "把模糊的「隨口問一句」升級成「定規格、給範例、配工具、加審核」的自動化管線，讓 AI 真正替你完成多步驟任務。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "普通聊天式 AI 像「問答機」，你問一句它答一句；**AI Agent（代理人）**則像「能自己動手做事的助理」：給它一個目標（例如「整理這週最新趨勢並做成報告」），它會自己拆步驟、上網查資料、寫程式畫圖、檢查有沒有寫錯，最後把成品交給你。\n\n關鍵差別在於：你不再只靠一句神咒語，而是幫它把「標準作業流程（SOP）」和「檢查標準」設計清楚。", "lv2": "寫出穩定高水準提示詞與工作流的四個核心元件：\n\n1. 結構化框架：**角色定位 ＋ 背景脈絡 ＋ 明確任務 ＋ 輸出格式（如 JSON／表格）＋ 禁止事項**。\n2. 少樣本範例（Few-Shot）：與其寫 500 字形容你要什麼風格，不如直接貼 1–2 個滿分範例，效果立竿見影。\n3. 拆鏈（Prompt Chaining）：複雜任務拆成「先大綱 → 再撰寫 → 最後自我校對」，品質遠勝一口氣硬產。\n4. 人在迴路（Human-in-the-Loop）：發信、改檔、花錢等不可逆動作一定留人工確認關卡。", "lv3": "Agent 架構核心遵循 ReAct（Reasoning + Acting）迴圈：模型在「思維鏈推理 → 呼叫外部工具（Function Calling / MCP）→ 觀察工具回傳結果 → 動態修正計畫」間迭代，並結合短期工作記憶與長期向量記憶。\n\n• 工程實務上應依任務確定性權衡「確定性工作流（Workflows）」與「高自主代理人（Autonomous Agents）」，避免過度授權造成成本失控或錯誤放大。"}, "myNotes": "給 1 個好範例勝過寫 500 字抽象要求；複雜任務拆成多步驟管線最穩！", "relatedIds": ["it-ai-workflow", "it-s3-4"], "updatedAt": "2026-11-24"},
        {"id": "it-s4-3", "categoryId": "cat-it", "stageId": "s4", "subtopic": "商業智慧", "title": "資料視覺化與商業智慧（Star Schema／指標設計）", "oneLiner": "把「發生了什麼交易（事實表）」跟「誰買的、哪天買的（維度表）」拆乾淨，報表才不會越做越慢、數字越算越錯。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "用 Power BI 或 Excel 做儀表板時，新手最愛把所有欄位全部塞成一張 50 欄的超級大寬表，結果檔案肥到跑不動，篩選日期還會算錯。\n\n專業資料分析師用的是「星狀模型（Star Schema）」：想像一顆星星，正中間是「事實表」（只記核心數字與編號：賣出數量、金額、日期編號、商品編號），四周像光芒一樣連著「維度表」（日期表、商品表、客戶表，專門用來篩選與分組）。結構一拆乾淨，計算又快又準！", "lv2": "建立乾淨商業智慧（BI）報表的四條鐵律：\n\n1. 永遠建立獨立的「日期維度表（Date Table）」，做同期比較（YoY／MoM）才不會出錯。\n2. 維度表篩選事實表（單向一對多），避開雙向篩選造成模糊路徑與效能崩潰。\n3. 每個指標只定義一次（Single Source of Truth）：把毛利率、轉換率寫成統一量值（Measure），避免不同部門各算各的。\n4. 一張儀表板只回答一個核心決策問題，不堆滿十幾個沒人看的圓餅圖。", "lv3": "Ralph Kimball 提出之維度建模（Dimensional Modeling）以星狀結構（Star Schema）為 OLAP 分析黃金標準，相較高度正規化的雪花模型（Snowflake）減少了 JOIN 層數，極度契合欄位式儲存壓縮引擎（如 VertiPaq / Parquet）的向量化掃描優勢。"}, "myNotes": "做 Power BI 或任何數據儀表板，先把 Fact 與 Dimension 拆成星狀結構就成功一半！", "relatedIds": ["it-s1-3", "it-s4-4"], "updatedAt": "2026-11-24"},
        {"id": "it-s4-4", "categoryId": "cat-it", "stageId": "s4", "subtopic": "架構選型", "title": "低成本個人產品架構：靜態前端 vs 輕量後端選型", "oneLiner": "做個人工具或 Side Project 最怕一開始就堆企業級重架構；能用單檔解決就別架伺服器，等真的撞到天花板再升級。", "tags": ["#決策框架", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "如果你想每天騎車去巷口買早餐，你不會先買一台 30 噸砂石車來開，因為光找停車位跟繳稅就把你累垮了。\n\n做個人網站或小工具也是一樣：\n• 單人工具／個人筆記（像這座知識庫）：用純前端單檔 HTML + 瀏覽器儲存 + JSON 備份，0 元月費、免裝環境、換電腦帶一個檔案就能跑。\n• 需要多人帳號、資料庫搜尋或爬蟲排程：再升級成輕量後端（FastAPI + SQLite + Docker），依然清爽好維護！", "lv2": "個人開發者的架構升級三階梯：\n\n1. 第一階（0 維護）：純前端靜態頁 + LocalStorage / JSON 匯出入（部署 GitHub Pages）。\n2. 第二階（輕量全端）：Python FastAPI + SQLite（單一檔案資料庫，零額外資料庫伺服器維護成本）+ Docker 部署。\n3. 第三階（多人成長期）：等真的有穩定付費用戶與併發需求，再遷移到 PostgreSQL / MySQL 與雲端物件儲存。", "lv3": "遵循軟體工程 YAGNI（You Aren't Gonna Need It）與 KISS 原則：過早引入微服務、Kubernetes 或分散式快取會讓個人開發者的維護熵增遠超功能產出。透過「資料格式標準化（如 JSON/SQLite）」保持低遷移成本，才是演進式架構（Evolutionary Architecture）的最佳實踐。"}, "myNotes": "先讓輕量架構跑起來產生真實價值，資料格式統一好，隨時都能無痛升級！", "relatedIds": ["it-s2-4", "prod-mvp"], "updatedAt": "2026-11-24"},
        {"id": "fin-s1-2", "categoryId": "cat-finance", "stageId": "s1", "subtopic": "個人財務", "title": "個人三大財務報表：資產負債、現金流與儲蓄率", "oneLiner": "投資之前先幫自己做財務體檢：看清「淨資產有多少」「每個月錢流去哪」與「能撐幾個月沒收入」。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "很多人以為年薪高就是有錢人，但如果月賺十萬、月花十萬五，其實比月賺五萬存兩萬的人更脆弱！\n\n把自己當成一家「一人公司」來記兩張關鍵表：\n1. 資產負債表（拍照看身家）：你擁有的（存款、股票、房子）減去你欠人的（房貸、卡債）＝「真實淨資產」。\n2. 現金流量表（錄影看進出）：每月收入減掉支出＝「自由現金流」。\n\n理財起步期，「提高儲蓄率（把水龍頭開大、洞補起來）」的效果遠大於每天盯盤殺進殺出。", "lv2": "個人財務健檢的四個黃金數字：\n\n1. 緊急預備金：至少存滿 **6 個月基本生活費**放高流動定存或活儲，絕不拿去買波動股。\n2. 儲蓄投資率：先存後花（領薪日自動轉帳），目標拉到稅後收入的 20%–40%。\n3. 負債比檢核：區分「良性低利負債（如可負擔房貸）」與「毒藥高利負債（卡循、信貸）」；後者一律優先清償。\n4. 每季盤點一次個人淨資產表，觀察曲線是否穩定向上。", "lv3": "個人財務自由度本質取決於「被動現金流覆蓋率（被動收入 / 年度生活支出）」與「安全提領率（如 Trinity Study 4% 法則推導出目標資產約為年支出的 25 倍）」。前期資產累積速度主要由儲蓄率決定，後期才逐步由投資複利報酬主導。"}, "myNotes": "前期靠本業與儲蓄率累積本金，後期才靠複利起飛——順序別搞反！", "relatedIds": ["fin-compound", "fin-s2-2"], "updatedAt": "2026-11-24"},
        {"id": "fin-s1-3", "categoryId": "cat-finance", "stageId": "s1", "subtopic": "總經脈動", "title": "利率、央行政策與總體經濟景氣循環", "oneLiner": "央行利率就像整個經濟體的「地心引力」：利率升、借錢變貴、資產估值承壓；利率降、資金寬鬆、景氣與資產價格獲得推力。", "tags": ["#底層模型", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "把中央銀行（如美國聯準會 Fed）想像成經濟冷氣的遙控器：\n\n• 經濟太熱、物價飆漲（通膨太高）→ 央行「升息」（調高借錢利息），大家覺得存錢變划算、借錢買房投資變貴，消費降溫，物價就慢慢壓下來。\n• 經濟太冷、失業率升高（衰退風險）→ 央行「降息」（調低利息）甚至印鈔救市，鼓勵企業借錢擴廠、民眾消費，讓經濟重新暖起來。\n\n看懂這支遙控器，你就看懂一半的財經頭條了！", "lv2": "利率變動對個人資產的實務影響：\n\n1. 債券價格與利率呈「反向關係」：升息時既有債券價格會下跌（因為新債利息更高），降息時長天期公債價格反而上漲。\n2. 高成長科技股對利率特別敏感：因為它的獲利多在遙遠未來，升息會大幅壓低未來獲利的折現價值。\n3. 景氣循環四階段（復甦 → 擴張 → 趨緩 → 衰退）輪動時，沒有永遠只漲不跌的單一資產，這也是為何要做好股債配置。", "lv3": "央行透過政策利率（如聯邦基金利率）與公開市場操作／量化寬鬆（QE/QT）在「物價穩定」與「充分就業」雙重使命間走鋼索（泰勒法則提供基準利率參考）。\n\n• 殖利率曲線（Yield Curve）：當短天期公債殖利率高於長天期（「倒掛」），代表市場預期未來央行將被迫大幅降息因應經濟放緩，歷史上為高準確度的衰退領先訊號（但具 6–18 個月不等之時間延遲）。"}, "myNotes": "利率是所有資產估值的地心引力；債券價格跟利率永遠走反方向！", "relatedIds": ["fin-compound", "fin-s1-4"], "updatedAt": "2026-11-24"},
        {"id": "fin-s1-4", "categoryId": "cat-finance", "stageId": "s1", "subtopic": "金融工具", "title": "股票、債券、ETF 與現金工具的本質差異", "oneLiner": "買股票是當「股東」分享成長也扛虧損，買債券是當「債主」領固定利息，買 ETF 則是直接打包一整籃資產分散風險。", "tags": ["#底層模型", "#實作工具"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "假設你朋友開一家很紅的咖啡店要募資，你有兩種參與方式：\n\n• 買股票（當股東）：出錢佔 10% 股份，店賺翻你跟著分大錢、股價翻倍；但店倒了你的錢也跟著賠光。\n• 買債券（當債主）：借錢給他，講好每年固定收 5% 利息、五年後還本金。店大賺你不會多拿，但就算店小賠他還是得先還你錢，比股東安全。\n• 買 ETF（買水果禮盒）：怕單挑一顆蘋果買到爛的，乾脆花小錢一次買進「全台前 50 大公司」或「全美前 500 大公司」整籃打包！", "lv2": "四類基礎工具在個人配置中的分工：\n\n1. 現金／高利活儲／貨幣市場基金：緊急預備金與 1 年內要用的錢，求零波動。\n2. 投資級公債／債券 ETF：穩定配息、在股市大跌時提供避震緩衝。\n3. 市值型股票 ETF（如 0050 / VTI / VT）：長期對抗通膨、參與全球企業獲利成長的核心引擎。\n4. 個股：僅建議用「賠光也不影響生活」的小比例資金，且必須具備看懂財報的能力。", "lv3": "在企業資本結構清償順位（Capital Structure Seniority）上：有擔保債權 > 無擔保債權 > 特別股 > 普通股。股票承擔剩餘求償權（Residual Claim），因此歷史長期要求高於無風險利率的股權風險溢酬（Equity Risk Premium, 約 4%–6%）。ETF 則透過初級市場實物申贖套利機制使市價緊貼淨值（NAV），兼具低費率與高流動性。"}, "myNotes": "先分清自己是想當「股東（要成長）」還是「債主（要安穩）」，再選工具！", "relatedIds": ["fin-portfolio", "fin-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "fin-s2-2", "categoryId": "cat-finance", "stageId": "s2", "subtopic": "財報解讀", "title": "公司財報快讀：損益表、資產負債表與自由現金流", "oneLiner": "損益表看「賺不賺錢（面子）」，資產負債表看「家底厚不厚（底子）」，現金流量表看「錢真的進口袋了沒（裡子）」。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "看一家公司健不健康，千萬別只看新聞寫「營收創新高」，要三張表合起來看：\n\n1. 損益表（成績單）：今年賣了多少貨、扣掉成本費用後淨賺多少（EPS）。\n2. 資產負債表（體檢表）：手上有多少現金、欠銀行多少債、會不會週轉不靈。\n3. 現金流量表（銀行存摺）：很多地雷公司帳面上賣出十億（客戶全欠帳沒付錢），存摺裡卻沒半毛現金進來！唯有「營業現金流減掉資本支出＝自由現金流」長期為正，才是真金白銀賺錢的好公司。", "lv2": "五分鐘快篩好公司與避雷的四大指標：\n\n1. 毛利率趨勢：穩定或上升代表有定價權與護城河；連年滑落代表陷入殺價競爭。\n2. 營業現金流 vs 稅後淨利：長期比例應大於 80%–100%，若淨利一直創高但現金流長期為負，高度警戒作帳或應收帳款地雷。\n3. 負債與短期償債能力：流動比率 > 1.5、手頭現金足夠應付景氣寒冬。\n4. 自由現金流（FCF）：能穩健發股利、買回庫藏股或再投資擴張的底氣來源。", "lv3": "現代會計採權責發生制（Accrual Basis），使損益表易受認列時點、折舊年限與存貨評價影響；而現金流量表採收付實現制，極難長期造假。\n\n• 自由現金流（Free Cash Flow = Operating Cash Flow − CapEx）為現金流折現模型（DCF）之核心輸入，亦是區分「重資本消耗型企業」與「高資本回報複利型企業」的分水嶺。"}, "myNotes": "營收是面子、淨利是參考、自由現金流才是真金白銀的裡子！", "relatedIds": ["fin-s1-2", "fin-s2-3"], "updatedAt": "2026-11-24"},
        {"id": "fin-s2-3", "categoryId": "cat-finance", "stageId": "s2", "subtopic": "估值指標", "title": "核心估值指標：本益比（PE）、股價淨值比（PB）與 ROE", "oneLiner": "好公司不等於好買點——用本益比看回本年數、用 ROE 看公司替股東賺錢的效率，才不會在天價買進好企業。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "想盤下一家每年淨賺 100 萬的便當店，老闆開價 1,000 萬，代表照現在獲利要 10 年回本——這個「10 倍」就是 **本益比（PE）**！\n\n• PE 越低通常越便宜，但如果是一家快倒閉的店，PE 5 倍其實也是陷阱；反過來說，獲利每年翻倍的超級成長股，PE 30 倍反而可能算便宜。\n• **PB（股價淨值比）**：股價跟公司清算家底的比值，適合拿來看銀行、航運這類景氣循環股。\n• **ROE（股東權益報酬率）**：股東出 100 元，公司一年能幫你賺回幾元？巴菲特最愛長期維持 15% 以上的高 ROE 企業！", "lv2": "正確使用估值指標的三個避坑要領：\n\n1. 景氣循環股（如鋼鐵、航運）要「買在高 PE、賣在低 PE」：獲利高峰時 PE 看起來只有 3 倍，其實往往是景氣反轉最高點。\n2. 成長股改看 **PEG（本益比 ÷ 預期獲利成長率）**：PEG < 1 代表成長速度配得上甚至超越目前估值。\n3. 拆解高 ROE 來源（杜邦分析）：確認是靠「高淨利率／高周轉」賺來的，而不是靠「瘋狂借錢高槓桿」撐出來的。", "lv3": "杜邦分析（DuPont Analysis）將 ROE 拆解為三因子乘積：ROE = 淨利率（獲利能力）× 總資產周轉率（營運效率）× 權益乘數（財務槓桿）。\n\n• 估值上亦須留意會計盈餘失真（如一次性業外處分），進階分析常以企業價值倍數 EV/EBITDA 或自由現金流殖利率（FCF Yield）做跨資本結構之同業橫向比較。"}, "myNotes": "記住景氣循環股陷阱：賺最兇時本益比最低，往往反而是高點！", "relatedIds": ["fin-s2-2", "fin-mean-reversion"], "updatedAt": "2026-11-24"},
        {"id": "fin-s2-4", "categoryId": "cat-finance", "stageId": "s2", "subtopic": "下檔控管", "title": "最大回撤（Max Drawdown）與不對稱盈虧比", "oneLiner": "投資活得久比賺得快重要：先算最壞會從高點跌掉多少（最大回撤），並只參與「輸有限、贏空間大」的不對稱下注。", "tags": ["#決策框架", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "做一題簡單的數學題就會讓你背脊發涼：\n• 虧損 20% → 只要漲 **25%** 就回本。\n• 虧損 50% → 必須翻倍漲 **100%** 才回本！\n• 虧損 80% → 必須暴漲 **400%** 才回本！\n\n「最大回撤（MDD）」就是看這項資產歷史上最慘曾從最高點腰斬多少。買進前先看 MDD，問自己「如果明天帳面蒸發這麼多錢，我撐得住不亂賣嗎？」撐不住就代表倉位買太大了。", "lv2": "實務控管下檔與找尋不對稱機會的方法：\n\n1. 先定最大可承受虧損，再反推投入部位大小（Position Sizing），而不是憑感覺 All-in。\n2. 評估每筆交易的盈虧比（Risk-Reward Ratio）：盡量尋找下檔有明確支撐或停損點（最多賠 1 份）、上檔有 3 份以上潛力的機會。\n3. 搭配夏普比率與 Calmar Ratio（年化報酬 ÷ 最大回撤）全面評估策略品質。", "lv3": "最大回撤 MDD = max_t [ (Peak_t − Trough_t) / Peak_t ]，直接刻畫路徑依賴風險（Path-Dependent Risk）與投資人的真實心理承壓極限。\n\n• 結合納西姆・塔雷伯的凸性（Convexity）思維：透過鎖定下檔（如現股分散、預留現金、選擇權保護）保留開放式上檔，能在高度不確定市場中展現正期望值與反脆弱性。"}, "myNotes": "跌 50% 要漲 100% 才回本——控制大虧永遠是複利第一守則！", "relatedIds": ["fin-sharpe", "fin-s4-2"], "updatedAt": "2026-11-24"},
        {"id": "fin-s3-2", "categoryId": "cat-finance", "stageId": "s3", "subtopic": "投資策略", "title": "被動指數化投資（ETF）與主動選股的勝負邊界", "oneLiner": "對 90% 上班族而言，買進低費率全市場指數 ETF 穩拿市場平均報酬，長期反而輕鬆打敗多數高收費主動基金。", "tags": ["#決策框架", "#經典案例"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "投資界有個讓華爾街超尷尬的真實統計（SPIVA 報告）：長期 15 年下來，超過 **85%** 拿高薪的專業基金經理人，績效居然打不贏「完全不選股、只照大盤買進」的便宜指數 ETF！\n\n為什麼？不是經理人不夠聰明，而是因為：\n1. 主動基金每年收 1.5%–2% 管理費，指數 ETF 只收 0.03%–0.1%，費用複利十年吃掉一大塊獲利。\n2. 市場裡高手互打，扣掉手續費與稅金後，主動選股整體註定落後大盤。", "lv2": "普通人最實用的「核心—衛星（Core-Satellite）」配置法：\n\n1. **80%–90% 核心部位**：放低內扣費用、高度分散的大盤指數 ETF（如全球 VT 或美股 VTI + 台股 0050），幾乎不用盯盤。\n2. **10%–20% 衛星部位**：留給自己有深度研究興趣的產業或個股，既滿足研究樂趣，就算看錯也不傷筋動骨。\n3. 挑選 ETF 必看三件事：內扣總費用率（Expense Ratio）、追蹤誤差與成交流動性。", "lv3": "John Bogle 創立 Vanguard 並提出「算術鐵律（Cost Matters Hypothesis）」：市場總報酬為所有參與者之加權平均，故主動投資者整體在扣除較高交易成本與管理費後，必然落後低成本被動指數。\n\n• 結合效率市場假說（EMH）：在大型流動性極高市場（如 S&P 500）超額報酬（Alpha）極難持續；主動研究的相對優勢多存在於資訊覆蓋較低的中小型股或特殊事件套利領域。"}, "myNotes": "核心 85% 穩抱低費率大盤指數，剩下 15% 再拿來研究有興趣的主題，心態最穩！", "relatedIds": ["fin-portfolio", "fin-s3-3"], "updatedAt": "2026-11-24"},
        {"id": "fin-s3-3", "categoryId": "cat-finance", "stageId": "s3", "subtopic": "多元配置", "title": "股債相關性、黃金與跨區域配置實務", "oneLiner": "不要把全部身家壓在單一國家或單一貨幣上，學會善用公債、跨國股市與少量避險資產撐起多層安全網。", "tags": ["#實作工具", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "很多台灣投資人覺得自己很分散：「我買了台積電、聯發科、鴻海跟 0050！」但其實這全部都押在「單一國家（台灣）＋單一產業（科技硬體）＋單一貨幣（台幣）」上——這叫「本土偏誤（Home Bias）」。\n\n真正的分散是「跨地區（全球股市）＋跨資產（股票配中短期公債，必要時配 5% 黃金防極端通膨與地緣風險）」，就像幫房子同時裝避雷針、防震墊跟備用電源。", "lv2": "建立跨資產與跨區域配置的實務建議：\n\n1. 股市部位別只買單一國家：可透過全球型 ETF（如 VT／VWRA）或「美股 + 全球非美 + 適度台股」分散地緣與產業集中風險。\n2. 債券部位首選高信用評等「政府公債或投資級綜合債」：不要為了高配息買一堆高收益垃圾債（它會在股市崩盤時跟著一起暴跌，失去避震功能）。\n3. 黃金本身不生息，定位是「極端通膨與法幣信心危機的保險」，配置比例通常控制在 5%–10% 以內。", "lv3": "股債相關係數具「體制依賴性（Regime-Dependent）」：在「成長衝擊（衰退型空頭）」中，股債呈顯著負相關，長債具極佳對沖效果；但在「高通膨衝擊（如 1970s 與 2022）」中，股債相關性會轉正同跌，此時短債／抗通膨債（TIPS）、大宗商品與黃金方能發揮風險平價（Risk Parity）防禦價值。"}, "myNotes": "債券是買來「股市大跌時救命」的，千萬別為了高息去買會跟著崩的垃圾債！", "relatedIds": ["fin-portfolio", "fin-s1-3"], "updatedAt": "2026-11-24"},
        {"id": "fin-s3-4", "categoryId": "cat-finance", "stageId": "s3", "subtopic": "進出場紀律", "title": "資金管理與分批進出場（定期定額 vs 價值平均法）", "oneLiner": "預測明天漲跌幾乎不可能，但透過「固定節奏分批投入」把買進成本拉平，就能在市場下跌時笑著撿便宜。", "tags": ["#實作工具", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "假設你想買蘋果，這個月一顆 100 元、下個月大特價變 50 元。\n\n如果你每個月固定拿出 1,000 元買（**定期定額 DCA**）：貴的時候自動少買（10 顆），便宜的時候自動多買（20 顆），平均每顆成本只要 66.7 元，比直接算平均價 75 元還划算！\n\n定期定額最大的魔力不是數學必勝，而是「幫你戒掉猜高低點的猶豫病」，強迫自己在市場恐慌大特價時依然持續扣款。", "lv2": "三種常見投入策略的實戰對照：\n\n1. **上班族每月薪資** → 無腦設自動「定期定額」，領薪日隔天就扣款，把人性干擾降到零。\n2. **突然有一大筆閒錢（獎金／遺產）**：歷史統計「單筆全投入（Lump Sum）」約 68% 機率勝過分批（因為股市長期往上），但若怕買完立刻大跌睡不著，可拆成 **6–12 個月分批進場**換取心理安穩。\n3. **進階價值平均法（Value Averaging）**：設定每月目標資產成長額，跌的時候多補一點、漲的時候少投一點，但須預留備用現金池。", "lv3": "Vanguard 跨市場歷史實證指出，因風險資產具正預期報酬，Lump Sum 期望報酬高於 DCA，但 DCA 顯著降低了進場時點風險（Sequence-of-Returns Risk）與行為後悔厭惡（Regret Aversion）。\n\n• 注意「微笑曲線鈍化效應」：當累積資產已遠大於單月扣款額時，單靠定期定額攤平效果遞減，此時應改由「資產配置再平衡」接棒控管風險。"}, "myNotes": "資產滾大後，單靠定期定額攤平效果會變弱，要靠「年度再平衡」接棒！", "relatedIds": ["fin-portfolio", "fin-s3-2"], "updatedAt": "2026-11-24"},
        {"id": "fin-s4-2", "categoryId": "cat-finance", "stageId": "s4", "subtopic": "槓桿風險", "title": "槓桿、融資與衍生性商品（選擇權／期貨）風險結構", "oneLiner": "槓桿會同時把賺錢跟賠錢都乘上倍數，最可怕的是「你最後明明看對方向，卻在黎明前的短暫暴跌就被強制斷頭出場」。", "tags": ["#底層模型", "#決策框架"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "想像你看好一間好公司，拿自己 100 萬買現股：就算中間遇到股災腰斬剩 50 萬，只要公司沒倒、你沒借錢，抱著撐過兩年還是可能漲回 150 萬。\n\n但如果你借錢開 3 倍槓桿買 300 萬：只要股價短暫下跌 33%，你的 100 萬本金瞬間歸零，券商直接強制把你股票賣光（斷頭）！就算隔天股市奇蹟暴漲創歷史新高，也已經完全跟你無關了。\n\n期貨跟選擇權本質上原本是農夫跟企業用來「買保險避險」的工具，新手拿來高倍投機就像開沒有煞車的跑車。", "lv2": "面對槓桿與衍生品必須守住的四條保命底線：\n\n1. 新手前三年絕不碰融資、期貨當沖與裸賣選擇權（賣方風險無限、獲利有限，俗稱「在壓路機前撿硬幣」）。\n2. 槓桿型 ETF（如正二／反一）具「每日重設波動耗損」，在盤整震盪市會慢慢失血，不可誤當一般存股長抱。\n3. 借錢投資前先做壓力測試：「若明天股市腰斬 50% 且我同時失業半年，會不會被迫賣股？」只要答案是會，槓桿就太高。", "lv3": "衍生性商品定價基石為 Black-Scholes-Merton 模型（1973），選擇權風險由希臘字母刻畫：Delta（標的價格敏感度）、Gamma（凸性加速）、Theta（時間價值衰減）與 Vega（隱含波動率敏感度）。\n\n• 槓桿會引發非對稱的「強制去槓桿螺旋（Margin Call Spiral）」並大幅放大波動拖累（g ≈ kμ − k²σ²/2），依凱利準則過度槓桿終將導致長期幾何報酬轉負。"}, "myNotes": "現股可以陪好公司熬過冬天，高槓桿卻會讓你倒在黎明前五分鐘！", "relatedIds": ["fin-s2-4", "fin-s4-3"], "updatedAt": "2026-11-24"},
        {"id": "fin-s4-3", "categoryId": "cat-finance", "stageId": "s4", "subtopic": "金融史鏡鑑", "title": "歷史金融泡沫與危機解剖（從鬱金香到次貸風暴）", "oneLiner": "四百年來科技不斷進步，但人性的貪婪與恐懼從未改變——每次泡沫破裂前，市場都在高喊同一句話：「這次不一樣！」", "tags": ["#經典案例", "#底層模型"], "status": "not_started", "sourceType": "ai_generated", "sourceRef": "第二階段擴充課綱", "levels": {"lv1": "1637 年荷蘭人曾用一棟豪宅的錢去買一顆「鬱金香球莖」；2000 年只要公司名字加上 `.com` 股價就翻十倍；2008 年連沒收入的人都能零頭款貸款買豪宅……\n\n幾乎所有金融泡沫都照著同一套劇本演五幕：\n1. 真有新技術或好故事出現 → 2. 聰明錢進場賺大錢 → 3. 媒體狂報、路人借錢跟風衝進場（怕錯過 FOMO）→ 4. 最後一隻老鼠接棒沒人再追高 → 5. 價格反轉引發恐慌踩踏崩盤。", "lv2": "辨識市場進入泡沫警戒區的五個現實訊號：\n\n1. 平常完全不看財經的親友與計程車司機，開始熱烈報你明牌。\n2. 市場開始發明奇怪的新估值指標，只為了替荒謬高價找藉口（例如「不用看獲利，看眼球數就好」）。\n3. 大家瘋狂借錢加槓桿，並嘲笑保守分散的人「太膽小落伍」。\n4. 出現「只漲不跌、這次不一樣」的集體共識。\n5. 應對之道：不必猜最高點，靠「資產配置再平衡」在狂熱時自然分批落袋為安。", "lv3": "經濟學家 Hyman Minsky 提出「金融不穩定假說（Financial Instability Hypothesis）」，指出長期繁榮本身就會滋生脆弱性：融資結構從「避險型（現金流足付本息）」逐步惡化為「投機型（僅能付息）」與「龐氏型（全靠資產繼續上漲借新還舊）」，一旦流動性收緊即觸發「明斯基時刻（Minsky Moment）」引發系統性資產拋售。"}, "myNotes": "聽到全市場都在喊「這次不一樣」的時候，通常就是該收斂風險的時候！", "relatedIds": ["fin-mean-reversion", "fin-s4-4"], "updatedAt": "2026-11-24"},
